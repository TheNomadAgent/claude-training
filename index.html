>\n<dl class=\"defs\"><div><dt>Jurisdiction and variant<\/dt><dd>Is it the New Zealand model and a New Zealand offer?<\/dd><\/div><div><dt>Version and date<\/dt><dd>Is this the current document?<\/dd><\/div><div><dt>Publication date versus effective date<\/dt><dd>The guide was published on 20 January. The offer applies from 1 February. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"effective-date\">effective date<\/span>.<\/dd><\/div><div><dt>Qualifiers<\/dt><dd>\"Up to 18 minutes\" comes with half load, 25 C and new batteries. Drop those and the meaning changes. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"qualifier\">qualifier<\/span>.<\/dd><\/div><\/dl>\n<p>\"Eligible items\" names a product category. It does not remove the trade-in, reseller, date and calculation conditions written next to it.<\/p>\n<h2>Record the evidence and a status<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Claim in the draft<\/th><th>Evidence<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Claim in the draft\">3 kVA, 2U, internal battery pack<\/td><td data-l=\"Evidence\">The manufacturer's sheet states all three for this model<\/td><td data-l=\"Status\">Verified<\/td><\/tr><tr><td data-l=\"Claim in the draft\">It will run for 18 minutes in an outage<\/td><td data-l=\"Evidence\">The maker says up to 18 minutes at half load, 25 C, new batteries. The independent test measured 11 minutes at 80% load<\/td><td data-l=\"Status\">Contradicted<\/td><\/tr><tr><td data-l=\"Claim in the draft\">We will get a $300 rebate<\/td><td data-l=\"Evidence\">The category qualifies, but the rebate is 15% up to $300 and needs a trade-in and an authorised reseller. Price and trade-in were not supplied<\/td><td data-l=\"Status\">Partially supported<\/td><\/tr><tr><td data-l=\"Claim in the draft\">Enough to shut down all 12 servers<\/td><td data-l=\"Evidence\">No source states the room's load or the shutdown time<\/td><td data-l=\"Status\">Unresolved<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A status describes how the available evidence relates to one claim. It is not a grade for the source.<\/p>\n<aside class=\"note\"><b>Unresolved does not mean false<\/b><p>It means the record does not have enough relevant evidence. It must not be rewritten as a favourable conclusion, and it must not be recorded as contradicted either. Note what fact or source would settle it.<\/p><\/aside>\n<h2>Revise without hiding the uncertainty<\/h2>\n<figure class=\"out good\"><figcaption>Revised recommendation<\/figcaption><pre>The New Zealand model is a 3 kVA, 2U rack UPS with one internal\nbattery pack. The manufacturer states up to 18 minutes of runtime\nat half load, at 25 C, with new batteries. An independent test of\nthe same model measured 11 minutes at 80% load, at 30 C.\n\nThe supplier's trade-in offer runs from 1 February to 30 April 2027.\nIt gives 15% of the purchase price, up to $300, and requires trading\nin a working UPS and buying from an authorised New Zealand reseller.\n\nDo not treat this unit as sufficient to shut down all 12 servers\nuntil we know the comms room load and how long a staged shutdown\ntakes.<\/pre><\/figure>\n<p>The revision does not force the manufacturer and the tester to agree. They measured different conditions, so both stay in, each with its limits. The rebate becomes conditional. The shutdown claim is removed until someone supplies the evidence.<\/p>\n<h2>Keep a record someone else could repeat<\/h2>\n<p>For each claim, keep: the claim, source title, source date, the date it applies from, the exact supporting passage, your interpretation, and the status. When a spec sheet is revised or an offer changes, you update one row.<\/p>\n<ol class=\"steps\"><li><b>Match the basics<\/b><span>Variant, jurisdiction, units and dates all line up with the claim.<\/span><\/li><li><b>Read around the quote<\/b><span>Check the surrounding text before using a figure or quotation.<\/span><\/li><li><b>Separate conditions<\/b><span>The source's test conditions on one side, the recommendation's assumed conditions on the other.<\/span><\/li><li><b>Mark the gaps<\/b><span>Unresolved, with what would settle it.<\/span><\/li><li><b>Get review<\/b><span>Before anyone relies on a high-consequence eligibility or purchase conclusion.<\/span><\/li><\/ol>","takeaways":["Separate checkable facts from opinions, recommendations and promotional language.","Check consequential, precise, new and changeable claims first.","Match each source to the exact claim: authority, variant, jurisdiction, version, dates and qualifiers.","Use a status for each claim: verified, contradicted, partially supported or unresolved.","Unresolved means not enough evidence. Record what would settle it."],"practice":"Take a vendor datasheet you have used recently. Find one \"up to\" or \"as low as\" figure and write down every condition attached to it. Then ask whether your environment meets those conditions.","deck":"decks/09-fact-checking.html","quiz":[{"q":"What should a reviewer do first when fact-checking a recommendation?","multi":false,"o":[{"t":"Confirm the overall conclusion.","ok":false,"why":"The conclusion depends on the individual claims. Those come first."},{"t":"Separate checkable factual claims from opinions and recommendations.","ok":true,"why":"Only factual claims can be tested, so identifying them tells you what to check and how."},{"t":"Check every sentence with the same effort.","ok":false,"why":"Opinions and promotional phrases cannot be verified the way facts can."},{"t":"Improve the wording.","ok":false,"why":"Editing is not validation."}]},{"q":"A draft says a device \"will run for 18 minutes\". The only source says \"up to 18 minutes at half load, at 25 C, with new batteries\". How should the claim be judged?","multi":false,"o":[{"t":"Verified, because the number matches.","ok":false,"why":"The number matches but the claim dropped every condition attached to it."},{"t":"Verified, because the manufacturer is the primary source.","ok":false,"why":"Being the primary source does not change what the source actually says."},{"t":"Not supported as written, because removing the conditions changes the meaning.","ok":true,"why":"\"Up to\" under stated conditions is a ceiling in one setup. Without the qualifiers it becomes a different, stronger claim."},{"t":"Unresolved, because test conditions rarely matter.","ok":false,"why":"The conditions are exactly what define the figure."}]},{"q":"A team cannot find enough relevant evidence to confirm a claim. How should it be recorded?","multi":false,"o":[{"t":"Contradicted, since missing evidence suggests it is false.","ok":false,"why":"Missing evidence is not evidence against. Contradicted needs a source that says otherwise."},{"t":"Verified, if it seems reasonable.","ok":false,"why":"Seeming reasonable is not verification."},{"t":"Partially supported.","ok":false,"why":"That needs some supporting evidence. Here there is not enough to say so."},{"t":"Unresolved, with a note of what fact or source would settle it.","ok":true,"why":"It is neither confirmed nor refuted, and the note makes the gap actionable."}]},{"q":"A rebate guide was published on 20 January and says the offer runs from 1 February to 30 April. Which TWO statements are correct?","multi":true,"o":[{"t":"A purchase on 25 January qualifies, because the guide was already published.","ok":false,"why":"Publication only tells you when the document became available."},{"t":"The effective period, not the publication date, decides which purchases qualify.","ok":true,"why":"Rules apply from their effective date."},{"t":"A reviewer should check the dates as well as the source's authority.","ok":true,"why":"An authoritative source for the wrong period does not support the claim."},{"t":"Dates do not matter if the source is official.","ok":false,"why":"Authority without fit is not enough."}]},{"q":"A manufacturer's figure and an independent test disagree because they measured different conditions. What should the revised brief do?","multi":false,"o":[{"t":"Use the manufacturer's figure, as the primary source.","ok":false,"why":"That hides a relevant independent result."},{"t":"Use the independent figure and delete the other.","ok":false,"why":"The manufacturer's figure is still true for its stated conditions."},{"t":"Average the two.","ok":false,"why":"An average of two different test conditions describes neither."},{"t":"Keep both, each with its conditions stated.","ok":true,"why":"They are not in conflict once the conditions are shown. The reader can see what each one does and does not tell them."}]}]},"10":{"lead":"How much review an output needs depends on what happens if it is wrong. And the same checked facts can be reshaped for different readers without changing a single one of them.","html":"<h2>Review follows consequence<\/h2>\n<p>Human review is not one final check applied the same way to everything. How much is needed depends on:<\/p>\n<ul><li>the likely impact if the material is wrong,<\/li><li>how sensitive the information is,<\/li><li>whether the resulting action can be reversed,<\/li><li>any regulation that applies,<\/li><li>how new the subject is,<\/li><li>whether it will be published or acted on.<\/li><\/ul>\n<p>A low-stakes internal draft may only need its author to check the facts. Something that directs recovery work, informs senior decisions or goes outside the company needs more. And the reviewer needs authority over the subject or the decision. Being a good writer is not enough.<\/p>\n<aside class=\"note\"><b>When to step review up<\/b><p>Increase review when an output can affect people, commitments, safety, compliance, public understanding or a consequential action.<\/p><\/aside>\n<p>Some categories need a subject-matter expert before use: legal or regulatory interpretation, health or safety guidance, financial commitments, employment decisions, and factual claims made to people outside the organisation. Claude can help organise the material. It does not replace the responsible authority.<\/p>\n<h2>One validated record, three readers<\/h2>\n<p>After an overnight incident you have one validated record. Executives, the server team and the investigating engineer all need something from it. Only confirmed facts go in, and nobody states a root cause before the investigation does.<\/p>\n<figure class=\"doc\"><figcaption>Validated incident record<\/figcaption><pre>Incident: remote desktop logon disruption\n\n02:10  A certificate was renewed on the remote desktop gateway.\n02:25  Logon failures rose. Remote logon was unavailable.\n02:40  The incident was declared.\n03:05  The on-call engineer rebound the previous certificate.\n03:20  Logon failure rates returned to normal.\n\nConfirmed impact\n- Remote logon was unavailable from 02:25 to 03:20.\n- 310 logon attempts failed in that period.\n- No data loss was observed.\n\nCause status\n- The failures began after the certificate renewal.\n- Investigation has not confirmed the renewal as the root cause.\n\nOpen actions\n- Server team: preserve the gateway logs.\n- Server team: test the renewed certificate in UAT.\n- Incident lead: confirm or revise the cause status after\n  investigation.<\/pre><\/figure>\n<p>The record keeps evidence apart from interpretation. The timing shows the failures came after the renewal. That is not proof the renewal caused them. You may say the renewal is under investigation. You may not say it caused the outage.<\/p>\n<h2>Editing is not validation<\/h2>\n<p>Editing improves how something reads: shorter, plainer, decision first, actions as a checklist. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"validation\">Validation<\/span> tests whether each claim is supported by an authoritative source that is good enough for the use.<\/p>\n<p>People mix these up because a polished sentence sounds more credible than its evidence. Changing \"the renewal caused the outage\" to \"the renewal triggered the outage\" is editing. Both are still unsupported. The valid statement is that the failures began after the renewal and the cause is unconfirmed.<\/p>\n<p class=\"pull\">Clearer wording cannot make an unsupported conclusion valid.<\/p>\n<h2>Adapt four things. Keep the facts.<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Reader<\/th><th>What they need<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Reader\">Executives<\/td><td data-l=\"What they need\">Business impact, current status, what is uncertain, decisions or risks needing attention<\/td><\/tr><tr><td data-l=\"Reader\">Specialists<\/td><td data-l=\"What they need\">Exact timestamps, observations and status fields<\/td><\/tr><tr><td data-l=\"Reader\">Operators<\/td><td data-l=\"What they need\">Ordered actions and a way to mark them done<\/td><\/tr><tr><td data-l=\"Reader\">Customers<\/td><td data-l=\"What they need\">Plain language, the impact on them and a next step, without internal detail or unconfirmed causes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Four things change with the reader: <strong>depth<\/strong>, <strong>vocabulary<\/strong>, <strong>tone<\/strong> and <strong>call to action<\/strong>. The facts do not. An executive brief can leave out investigation steps because they do not affect the decision in front of that reader. A specialist record keeps them. Neither is allowed to add a claim that is not in the record.<\/p>\n<h2>Pick the format from how it will be used<\/h2>\n<dl class=\"defs\"><div><dt>Inline answer<\/dt><dd>A short, self-contained reply the reader takes in at once. Good for an executive brief or a status message.<\/dd><\/div><div><dt>Structured data<\/dt><dd>Fixed fields that can be reused, filtered, compared or passed to another system. Good for a specialist record. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"structured-data\">structured data<\/span>.<\/dd><\/div><div><dt>Artifact<\/dt><dd>A more substantial, reusable piece that people work through, revise, share or collaborate on. Good for a maintained checklist. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"artifact\">artifact<\/span>.<\/dd><\/div><\/dl>\n<p>Format does not reduce the need for review. A tidy table can hold an unsupported statement just as well as a paragraph can. Whatever the format, put the most consequential current information first and label uncertainty where it applies.<\/p>\n<figure class=\"prompt\"><figcaption><span>Transformation prompt<\/span><\/figcaption><pre>Using only the incident record, create:\n1. A short executive brief: impact, recovery, cause status, open\n   actions.\n2. A checklist for the server team with the open actions only.\n3. A structured record for the investigating engineer: timeline,\n   impact, recovery, cause status, open actions.\n\nDo not infer a root cause. Say when something is unconfirmed.\nMake each output fit its reader.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>Executive brief (inline)<\/figcaption><pre>Executive brief\n\nRemote desktop logon was unavailable from 02:25 to 03:20, with 310\nfailed logon attempts. The on-call engineer rebound the previous\ncertificate at 03:05 and failure rates returned to normal at 03:20.\nNo data loss was observed.\n\nThe failures began after a certificate renewal on the gateway. The\nrenewal has not been confirmed as the root cause. Open actions are\nlog preservation, testing the renewed certificate in UAT, and\nconfirming the cause after investigation.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>Server team checklist (artifact)<\/figcaption><pre>Server team checklist\n\n[ ] Preserve the gateway logs.\n[ ] Test the renewed certificate in UAT.\n[ ] Incident lead: confirm or revise the cause status after\n    investigation.<\/pre><\/figure>\n<p>The prompt gives no word count. Useful length depends on the task and the reader, and an arbitrary limit invites padding or cuts.<\/p>\n<h2>Review against one shared rubric<\/h2>\n<p>Do not pick the version that sounds most confident. Score each output against the same <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"rubric\">rubric<\/span>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Criterion<\/th><th>Question<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Criterion\">Faithfulness<\/td><td data-l=\"Question\">Does every claim trace to the validated record?<\/td><\/tr><tr><td data-l=\"Criterion\">Uncertainty<\/td><td data-l=\"Question\">Is the unconfirmed cause still clearly labelled?<\/td><\/tr><tr><td data-l=\"Criterion\">Audience fit<\/td><td data-l=\"Question\">Do depth, language, tone and actions suit the reader?<\/td><\/tr><tr><td data-l=\"Criterion\">Findability<\/td><td data-l=\"Question\">Can the reader locate impact, evidence, risk and next actions quickly?<\/td><\/tr><tr><td data-l=\"Criterion\">Format fit<\/td><td data-l=\"Question\">Can it be used, reused or worked on as intended?<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Match the reviewer to the output. The incident lead reviews the executive brief. The server team lead reviews the checklist, because that person can confirm the actions are safe and complete. The investigating engineer reviews the specialist record. If the brief were going to customers, review would step up again: someone authorised to speak for the company and the relevant technical authority would both need to approve it.<\/p>\n<aside class=\"note\"><b>Authority check<\/b><p>A reviewer has to be able to validate the claims and approve their use. A general editor can improve clarity. They cannot confirm technical evidence or authorise an external statement.<\/p><\/aside>","takeaways":["Scale review to impact, sensitivity, reversibility, regulation, novelty and whether it will be published or acted on.","Legal, safety, financial, employment and external factual content needs a subject-matter reviewer.","Editing changes how it reads. Validation checks whether it is supported. One does not replace the other.","For a different reader, change depth, vocabulary, tone and call to action. Never the facts.","Choose inline, structured data or an Artifact from how the output will be used, and review it either way."],"practice":"Take one incident or change you worked on. Write two sentences about it for a manager and two for another engineer. Check that both versions contain the same facts and that neither states a cause you could not prove.","deck":"decks/10-human-review-and-format.html","quiz":[{"q":"Which factor most strongly signals that a response needs more human review before use?","multi":false,"o":[{"t":"It is well written and neatly formatted.","ok":false,"why":"Presentation is not a risk signal."},{"t":"It was generated quickly.","ok":false,"why":"Speed says nothing about what is at stake."},{"t":"It could influence safety, commitments or a consequential action.","ok":true,"why":"Review effort should scale with what happens if the output is wrong."},{"t":"It uses plain language.","ok":false,"why":"Readability does not raise the stakes."}]},{"q":"An incident record says failures began after a certificate renewal and that the cause is unconfirmed. A draft says \"the renewal caused the outage\". An editor changes it to \"the renewal triggered the outage\". What has the edit achieved?","multi":false,"o":[{"t":"It has validated the claim.","ok":false,"why":"No evidence was added. Only a word changed."},{"t":"Nothing useful. Both versions state a cause the record does not support.","ok":true,"why":"This is editing, not validation. The supported statement is that failures followed the renewal and the cause is unconfirmed."},{"t":"It has made the claim acceptable for executives.","ok":false,"why":"A different audience does not make an unsupported claim acceptable."},{"t":"It has turned the claim into an inference.","ok":false,"why":"It is still stated as fact and is not labelled as an interpretation."}]},{"q":"When adapting one validated set of facts for executives, specialists and operators, which four things should change?","multi":false,"o":[{"t":"Root cause, chronology, ownership and technical detail.","ok":false,"why":"Root cause and chronology are facts. They stay the same for every reader."},{"t":"Evidence standard, source authority, confidence and scope.","ok":false,"why":"These concern what is true and how well supported it is. They do not vary by audience."},{"t":"Validation method, review authority, status and impact.","ok":false,"why":"These describe process and consequences, not how a message is tailored."},{"t":"Depth, vocabulary, tone and call to action.","ok":true,"why":"These fit a message to its reader without touching the facts."}]},{"q":"A server team needs a step-by-step checklist that several people will work through, revise and share over a few days. Which format fits best?","multi":false,"o":[{"t":"An inline answer.","ok":false,"why":"An inline reply is read once. It is a poor home for something revised over days."},{"t":"An Artifact.","ok":true,"why":"A substantial, reusable piece of work that people return to, edit and share is what an Artifact is for."},{"t":"A one-line status message.","ok":false,"why":"A line of text cannot hold a checklist."},{"t":"Structured data, because all shared work belongs in fields.","ok":false,"why":"A procedural checklist is steps to work through, not records to filter."}]},{"q":"Which TWO reviewers are appropriate for an operator checklist that tells engineers what to do after an incident?","multi":true,"o":[{"t":"A general editor, to confirm the actions are technically safe.","ok":false,"why":"An editor can improve clarity. They cannot validate technical actions."},{"t":"The team lead with authority over that operational work.","ok":true,"why":"They can confirm the actions are safe, complete and theirs to assign."},{"t":"Whoever wrote the fastest draft.","ok":false,"why":"Speed of drafting gives no authority to approve."},{"t":"A technical specialist for the system involved.","ok":true,"why":"They can check the steps against how the system actually behaves."}]}]},"11":{"lead":"Claude offers several ways to work. They are not a ladder from basic to advanced. Each one solves a different problem, and the skill is picking the smallest one that does the job.","html":"<h2>Choose the container first<\/h2>\n<p>Chat, Projects, Research and Artifacts can all support the same piece of business work, and they do different things for it. Reaching for the most elaborate one by default adds setup, can bury the authoritative source, and can leave you with an output that is awkward to maintain.<\/p>\n<p>Start from the task. Ask:<\/p>\n<ul><li>Does it need context that persists beyond this conversation?<\/li><li>Does it need investigation across outside sources that change?<\/li><li>Does it repeat under the same rules?<\/li><li>Are other people involved?<\/li><li>Should the result be a substantial deliverable that gets refined on its own?<\/li><\/ul>\n<p class=\"pull\">Use the smallest experience that keeps the context, evidence and deliverable the task needs.<\/p>\n<h2>What each one is<\/h2>\n<dl class=\"defs\"><div><dt>Chat<\/dt><dd>An ordinary conversation. Right for direct work where everything needed can be supplied in that conversation: a pasted excerpt, a short instruction, a focused question. A later task should not depend on an old chat unless the material is supplied again or kept somewhere persistent. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"chat\">Definition.<\/span><\/dd><\/div><div><dt>Project<\/dt><dd>A self-contained workspace for related work. It holds <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project-instructions\">project instructions<\/span>, knowledge files and related chats, so recurring work runs on the same guidance and the same source material. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project\">Definition.<\/span><\/dd><\/div><div><dt>Research<\/dt><dd>For investigation that benefits from repeated searching, comparing several sources, pulling them together and citing them. It is for gathering evidence, not for making an answer longer. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"research-feature\">Definition.<\/span><\/dd><\/div><div><dt>Artifact<\/dt><dd>Substantial standalone content, a tool, a visual or something interactive that is refined separately from the conversation around it. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"artifact\">Definition.<\/span><\/dd><\/div><\/dl>\n<h2>Worked example: one migration, four kinds of work<\/h2>\n<p>You are coordinating a file server migration for a customer. Four needs come up in the same week.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Need<\/th><th>Evidence and pattern<\/th><th>Best fit<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Need\">Which maintenance windows are approved?<\/td><td data-l=\"Evidence and pattern\">One supplied excerpt, a one-off question<\/td><td data-l=\"Best fit\">Chat<\/td><td data-l=\"Why\">Everything needed fits in one conversation<\/td><\/tr><tr><td data-l=\"Need\">Draft and check weekly customer updates<\/td><td data-l=\"Evidence and pattern\">Stable rules, approved references, related work<\/td><td data-l=\"Best fit\">Project<\/td><td data-l=\"Why\">Standing instructions and knowledge keep it consistent<\/td><\/tr><tr><td data-l=\"Need\">What are the vendor's current end-of-support dates and known issues?<\/td><td data-l=\"Evidence and pattern\">Changing information from several outside sources<\/td><td data-l=\"Best fit\">Research<\/td><td data-l=\"Why\">Repeated searching and citations are the point<\/td><\/tr><tr><td data-l=\"Need\">A migration tracker the customer can look at<\/td><td data-l=\"Evidence and pattern\">An interactive, standalone deliverable<\/td><td data-l=\"Best fit\">Artifact<\/td><td data-l=\"Why\">It needs its own refinement and use<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"prompt\"><figcaption><span>The Chat task<\/span><\/figcaption><pre>Using only the change calendar excerpt below, list the maintenance\nwindows approved for the file server migration. Do not add windows\nthat are not listed.\n\nChange calendar excerpt\nApproved windows:\n- Saturday 6 March, 22:00 to 02:00\n- Saturday 13 March, 22:00 to 02:00\nFreeze: no changes from 20 to 28 March.<\/pre><\/figure>\n<p>This is not a Research task, because the answer is in a supplied source. It is not a Project, because it is a one-off question. Claude should list the two windows and should not infer a third.<\/p>\n<h2>Projects for stable, governed work<\/h2>\n<p>The Project is the operating context for the recurring updates. The message guide, runbook and sign-off rules go into <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project-knowledge\">project knowledge<\/span>. The instructions say how Claude must use them. That cuts down repeated pasting and keeps separate chats working from the same reference set.<\/p>\n<figure class=\"prompt\"><figcaption><span>Project instructions<\/span><\/figcaption><pre>For migration communications, treat the approved message guide\nand the migration runbook as the authoritative sources.\n\nUse only dates and commitments found in those sources. If a\nrequested detail is not in the knowledge provided, say it was\nnot supplied.\n\nFor every draft, include:\n1. The proposed message\n2. Which approved statements it uses\n3. Anything that needs a person to review\n\nDo not approve changes, confirm outage windows or make\ncommitments on the customer's behalf.<\/pre><\/figure>\n<p>Governed work means work done inside defined rules, approved sources and review responsibilities. The instructions do not make an output approved. They tell Claude to separate supported from unsupported content and to flag what a person has to review. You still check each draft against the real approval process.<\/p>\n<p>A Project earns its keep when several related chats are needed: one for the customer update, one for the runbook review, one for internal status. It is not just a longer chat. Its value is the maintained setup and the related body of work.<\/p>\n<h2>Combining them without blurring them<\/h2>\n<figure class=\"out good\"><figcaption>Completed work map<\/figcaption><pre>Chat\n- Answer: which maintenance windows are approved?\n\nProject\n- Hold: message guide, migration runbook, sign-off rules\n- Apply: standing drafting and review instructions\n\nResearch\n- Investigate: current vendor end-of-support dates and\n  known issues\n- Produce: cited findings for a person to review\n\nArtifact\n- Deliver: migration tracker with servers, owners and status\n- Include: the reviewed vendor summary<\/pre><\/figure>\n<p>Each piece keeps one job. The Project holds the persistent context. Research does the multi-source investigation. The Artifact is the standalone deliverable. Combining them does not turn a Project into a source of outside evidence, Research into a policy store, or an Artifact into an approval system.<\/p>\n<aside class=\"note\"><b>A citation is not a verdict<\/b><p>A citation shows where a statement came from. It does not show the source is authoritative, current enough, or appropriate to share. Review Research findings before they go into something the customer will see.<\/p><\/aside>\n<h2>Mistakes to avoid<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Mistake<\/th><th>Why it fails<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Mistake\">Using an ordinary chat for recurring work and expecting old instructions to hold<\/td><td data-l=\"Why it fails\">A chat is not a maintained shared workspace<\/td><\/tr><tr><td data-l=\"Mistake\">Putting outside claims into a Project and treating them as verified<\/td><td data-l=\"Why it fails\">Authority comes from the source and the review, not from where the text is stored<\/td><\/tr><tr><td data-l=\"Mistake\">Asking for Research when the answer is in an internal document<\/td><td data-l=\"Why it fails\">No investigation is needed<\/td><\/tr><tr><td data-l=\"Mistake\">Building an Artifact for a short answer<\/td><td data-l=\"Why it fails\">It can stay in the conversation<\/td><\/tr><tr><td data-l=\"Mistake\">Keeping a long interactive tracker as chat text<\/td><td data-l=\"Why it fails\">Its layout and behaviour need their own iteration<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Which features you have, how sharing works, which plans include what, and the labels in the interface all change over time. Check Anthropic's current documentation and your own workspace settings before you design a process that depends on one of them.<\/p>","takeaways":["Chat: direct work where the context fits in the conversation.","Project: recurring work that needs standing instructions, knowledge and related chats.","Research: changing, multi-source questions that need investigation and citations.","Artifact: a substantial standalone deliverable, tool, visual or interactive piece.","Storing something in a Project does not verify it, and a citation does not make a source authoritative."],"practice":"List four things you asked an AI tool to help with last week. For each, decide which of the four experiences fits and write one line saying why. Note whether the tool you actually use at work has an equivalent.","deck":"decks/11-chat-projects-research-artifacts.html","quiz":[{"q":"A coordinator pastes a one-page change calendar and asks which windows are approved. Which experience fits?","multi":false,"o":[{"t":"Research, to be thorough.","ok":false,"why":"The answer is in the supplied page. Nothing needs investigating."},{"t":"A Project, so the calendar is kept.","ok":false,"why":"It is a one-off question. No recurring rules or related chats are involved."},{"t":"Chat.","ok":true,"why":"The full context fits in one conversation and the answer does not need to persist."},{"t":"An Artifact.","ok":false,"why":"A short list of dates does not need a standalone deliverable."}]},{"q":"A team drafts a customer update every week using the same approved message guide and sign-off rules. Which experience fits best?","multi":false,"o":[{"t":"A new chat each week, pasting the guide in.","ok":false,"why":"It works, but it invites drift and repeated effort, with no shared standing rules."},{"t":"A Project, with the guide as knowledge and the rules as instructions.","ok":true,"why":"Recurring work under stable rules is what a Project is for."},{"t":"Research.","ok":false,"why":"The sources are internal and already approved."},{"t":"An Artifact.","ok":false,"why":"An Artifact is a deliverable. It is not the place to hold standing rules."}]},{"q":"Someone needs to know what three vendors currently say about end-of-support dates, with sources they can check. Which experience fits?","multi":false,"o":[{"t":"Chat, from memory.","ok":false,"why":"The information changes and needs sources. An answer from memory may be out of date and cannot be traced."},{"t":"A Project.","ok":false,"why":"A Project holds your reference material. It does not go and gather outside evidence."},{"t":"An Artifact.","ok":false,"why":"That is a format for a deliverable, not a way to investigate."},{"t":"Research.","ok":true,"why":"Changing information across several outside sources, with citations, is the case for Research."}]},{"q":"Which TWO statements are correct?","multi":true,"o":[{"t":"Text stored in a Project is verified by being there.","ok":false,"why":"Authority comes from the source and the review process, not the storage location."},{"t":"A citation shows where a statement came from, not that the source is authoritative.","ok":true,"why":"You still have to judge whether the source is reliable, current and appropriate to share."},{"t":"A Project is just a longer chat.","ok":false,"why":"Its value is the maintained instructions, knowledge and related chats."},{"t":"One piece of work can use several experiences, each with a distinct role.","ok":true,"why":"A Project for context, Research for evidence and an Artifact for the deliverable can sit together."}]},{"q":"Sales leaders need an interactive tracker showing milestones, owners and review status that they can open and come back to. Which experience fits?","multi":false,"o":[{"t":"An Artifact.","ok":true,"why":"A substantial, standalone, interactive deliverable that is refined separately from the chat."},{"t":"An inline chat reply.","ok":false,"why":"A long interactive tracker is hard to use and maintain as chat text."},{"t":"Research.","ok":false,"why":"Nothing is being investigated."},{"t":"Project instructions.","ok":false,"why":"Instructions tell Claude how to work. They are not a deliverable."}]}]},"12":{"lead":"Picking a model is an operational decision, like sizing a server. You match it to the workload. Bigger is not automatically right, and smaller is not automatically cheaper.","html":"<h2>A model is a capability choice<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"model\">model<\/span> is the underlying AI that does the work. Its capability affects how well Claude reads instructions, uses supplied information, follows a format, reasons through ambiguity and produces something useful. Choosing one is a practical decision. It is not a matter of always taking the newest or strongest.<\/p>\n<p>Features and models are related and they are different choices. A feature such as a Project organises the work and holds reference material. The model does the analysis or writing inside it. A well set up Project cannot make an unsuitable model ideal for a hard task. A very capable model does not remove the need for clear instructions and review.<\/p>\n<p class=\"pull\">Choose the least costly capability that reliably meets the task's quality and consequence requirements.<\/p>\n<p>Haiku, Sonnet and Opus describe broad positions, not a fixed list of version numbers. The exact models on offer, their limits and their performance change. The lasting skill is choosing by the work, then testing that choice on realistic inputs.<\/p>\n<h2>The three families<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Family<\/th><th>Leans toward<\/th><th>Fits work that is<\/th><th>Typical tasks<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Family\">Haiku<\/td><td data-l=\"Leans toward\">Speed and economy<\/td><td data-l=\"Fits work that is\">Clear, high-volume, low in ambiguity, with stable instructions and an easily checked format<\/td><td data-l=\"Typical tasks\">Fast classification, extraction, simple transformation, routine routing<\/td><\/tr><tr><td data-l=\"Family\">Sonnet<\/td><td data-l=\"Leans toward\">Balance of capability, speed and cost<\/td><td data-l=\"Fits work that is\">Varied professional work needing coherent writing, several supplied sources, or practical judgement within stated rules<\/td><td data-l=\"Typical tasks\">Summaries, drafting, everyday analysis<\/td><\/tr><tr><td data-l=\"Family\">Opus<\/td><td data-l=\"Leans toward\">Capability<\/td><td data-l=\"Fits work that is\">Difficult: conflicting records, real ambiguity, several constraints to reconcile, where a better answer is worth extra cost or waiting<\/td><td data-l=\"Typical tasks\">Nuanced synthesis, hard reasoning, complex comparisons<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"haiku\">Haiku<\/span> is not better at everything. Its advantage is handling suitable work efficiently at scale. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"opus\">Opus<\/span> should not become the default for anything that feels important. A clear, repetitive task gains little from extra capability if a faster, cheaper family already meets the standard. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"sonnet\">Sonnet<\/span> covers the wide middle.<\/p>\n<aside class=\"note\"><b>More than complexity<\/b><p>Complexity matters. So do volume, how fast a response is needed (<span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"latency\">latency<\/span>), the quality expected, and what happens if there is an error.<\/p><\/aside>\n<h2>Worked example: one team, three workloads<\/h2>\n<p>Your team wants to use Claude on three recurring jobs. Each has approved sources. Claude may classify, summarise, compare and point out gaps. It must not invent an event, a customer commitment or a cause the records do not establish.<\/p>\n<figure class=\"doc\"><figcaption>Workloads<\/figcaption><pre>Workload A: 3,000 monitoring alert emails a week\nAllowed labels: Disk, Service down, Backup failed, Certificate\nRequirement: apply one label. Flag anything that does not fit.\n\nWorkload B: 60 weekly customer service summaries\nSources: ticket export and approved engineer notes\nRequirement: state completed work, open items and stated next\nsteps only.\n\nWorkload C: 5 problem investigations\nSources: event logs, change records, engineer notes, vendor case\nRequirement: compare the records, separate established facts\nfrom conflicts, and list questions for the problem manager.\nAuthority: the problem manager decides the root cause and any\ncustomer commitment.<\/pre><\/figure>\n<div class=\"tw\"><table><thead><tr><th>Workload<\/th><th>Family<\/th><th>Reasoning<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Workload\">3,000 fixed-category alert emails<\/td><td data-l=\"Family\">Haiku<\/td><td data-l=\"Reasoning\">Low complexity, very high volume and a need for quick routing favour speed and economy. Quality can be sampled against the label list. A wrong label delays a response. It does not authorise anything.<\/td><\/tr><tr><td data-l=\"Workload\">60 weekly service summaries<\/td><td data-l=\"Family\">Sonnet<\/td><td data-l=\"Reasoning\">Moderate volume and normal turnaround. The task needs professional synthesis across two sources. A service manager reviews each summary before it goes out, which lowers the consequence while quality still matters.<\/td><\/tr><tr><td data-l=\"Workload\">5 conflicting problem investigations<\/td><td data-l=\"Family\">Opus<\/td><td data-l=\"Reasoning\">Low volume leaves room for more cost and waiting. Conflicting records need stronger reasoning. An error could feed a wrong root cause or commitment, though the problem manager still decides.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>None of this authorises unattended action. For the investigations, Claude produces an evidence-based comparison and open questions, not a root cause. For the alert routing, someone reviews samples, looks at the unmatched messages and watches whether the label list still fits what is coming in.<\/p>\n<h2>Capability does not replace testing<\/h2>\n<p>A family label is a starting point, not a guarantee. A stronger model can still misread an instruction, miss a source detail, skip a required field or state something plausible and false. A lighter model can do very well on a narrow task with clear sources and rules. Both need evaluating.<\/p>\n<ol class=\"steps\"><li><b>Use realistic samples<\/b><span>Include incomplete, unusual and conflicting records, not only tidy ones.<\/span><\/li><li><b>Check the substance<\/b><span>Factual grounding, required format, omissions and unsupported claims.<\/span><\/li><li><b>Weigh it against time and cost<\/b><span>At the volume the task actually runs at.<\/span><\/li><li><b>Retest on change<\/b><span>When instructions, source formats or the available models change.<\/span><\/li><\/ol>\n<h2>Two common mistakes<\/h2>\n<dl class=\"defs\"><div><dt>Defaulting to maximum capability<\/dt><dd>Putting every task on the strongest family because the work seems important. It raises cost and waiting time without improving a simple result.<\/dd><\/div><div><dt>Defaulting to minimum cost<\/dt><dd>Using a fast family for work whose ambiguity, conflicting evidence or consequence needs more capable analysis and closer review.<\/dd><\/div><\/dl>\n<p>A third: treating a family name as a permanent specification. What is available, and exactly what each model can do, moves faster than the family positions. Confirm which models your environment offers, then evaluate those against the work. Do not rely on an old version name or last year's result.<\/p>","takeaways":["A model does the work. A feature organises it. They are separate choices.","Haiku: clear, high-volume work where speed and economy matter.","Sonnet: the balanced choice for most professional work.","Opus: difficult reasoning where a better answer justifies more cost, time and review.","Family names are starting points. Test on realistic samples and retest when anything changes."],"practice":"Pick three recurring jobs your team does. For each, write the volume, how fast it is needed, how ambiguous it is and what happens if it is wrong. Then say which family you would try first and what you would test.","deck":"decks/12-model-families.html","quiz":[{"q":"A team must label 3,000 alert emails a week using four fixed categories. A wrong label delays a response slightly. Which family is the best starting point?","multi":false,"o":[{"t":"Opus, because alerts are important.","ok":false,"why":"Importance alone does not justify the most capable family for a clear, repetitive task."},{"t":"Sonnet, as the default.","ok":false,"why":"It would work, but the task is narrow and high-volume, which is the case for a faster family."},{"t":"Haiku.","ok":true,"why":"Low complexity, high volume and a need for speed favour the fast, economical family, with sampling to check quality."},{"t":"Whichever is newest.","ok":false,"why":"Newness is not a selection criterion."}]},{"q":"Five investigations each involve logs, change records and notes that contradict one another. An error could support a wrong commitment to a customer. Which family fits, and what else is needed?","multi":false,"o":[{"t":"Haiku, to keep costs down.","ok":false,"why":"Conflicting evidence and real consequence call for more capable analysis."},{"t":"Opus, with a person still making the decision.","ok":true,"why":"Low volume leaves room for the cost, the reasoning is hard, and the consequence means human review stays in place."},{"t":"Opus, and the output can be sent without review.","ok":false,"why":"Capability does not replace review where the consequence is high."},{"t":"Any family, since features matter more than models.","ok":false,"why":"Features organise the work. The model still has to be able to do it."}]},{"q":"Which statement about models and features is correct?","multi":false,"o":[{"t":"A well-configured Project makes any model suitable for any task.","ok":false,"why":"A feature cannot supply capability the model lacks."},{"t":"The most capable model removes the need for clear instructions.","ok":false,"why":"Every model still needs clear instructions and review."},{"t":"Features and models are the same choice under different names.","ok":false,"why":"They are related and separate."},{"t":"A feature organises the work and the model performs it.","ok":true,"why":"Both matter and neither substitutes for the other."}]},{"q":"Which TWO are sound reasons to retest a model choice?","multi":true,"o":[{"t":"The instructions or source formats have changed.","ok":true,"why":"A change to inputs or rules can change how well any model performs."},{"t":"A colleague prefers a different family.","ok":false,"why":"Preference is not evidence."},{"t":"The models available in your environment have changed.","ok":true,"why":"Family positions are stable but the actual models move. An old result may not hold."},{"t":"The first sample output looked impressive.","ok":false,"why":"One good output is not a reason to retest, or to stop testing."}]},{"q":"A team assigns every task to the most capable family because \"all our work is important\". What is the main problem?","multi":false,"o":[{"t":"It breaks a licensing rule.","ok":false,"why":"Nothing here involves licensing."},{"t":"It raises cost and response time without improving simple results.","ok":true,"why":"Straightforward tasks gain little from extra capability when a lighter family already meets the standard."},{"t":"The most capable family makes more errors.","ok":false,"why":"That is not the issue. Over-provisioning is."},{"t":"It removes the need for testing.","ok":false,"why":"No family removes the need for testing."}]}]},"13":{"lead":"There is no best model. There is the cheapest approach that reliably meets what a particular service needs, and you find it by defining the need first and testing second.","html":"<h2>Start with the service requirement<\/h2>\n<p>A model is only useful when its output meets the needs of a specific service. Before comparing anything, define four things. Together they are the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"service-requirement\">service requirement<\/span>.<\/p>\n<dl class=\"defs\"><div><dt>Minimum acceptable quality<\/dt><dd>What the output has to get right.<\/dd><\/div><div><dt>Turnaround<\/dt><dd>How quickly it is needed.<\/dd><\/div><div><dt>Volume<\/dt><dd>How many, how often.<\/dd><\/div><div><dt>Consequence<\/dt><dd>What happens if an error reaches a customer or a decision maker.<\/dd><\/div><\/dl>\n<p>Quality depends on the task. For routine classification it may mean the right queue and a draft with nothing unsupported in it. For a high-consequence exception it may mean recognising uncertainty, keeping the source facts intact and escalating instead of proposing something unsafe. A fluent answer is not an acceptance criterion.<\/p>\n<p class=\"pull\">Choose the least costly approach that reliably meets the defined service requirement.<\/p>\n<h2>Worked example: service desk triage<\/h2>\n<p>A service desk lead wants help triaging requests. About 1,800 a month are routine. About 90 are exceptions: privileged access, firewall changes, data restores, access to someone else's mailbox, or records that conflict. Routine tickets need a queue and a first-draft reply within two business hours.<\/p>\n<figure class=\"doc\"><figcaption>Rules and a sample ticket<\/figcaption><pre>Routing rules\n1. Password reset or account unlock, caller verified:\n   Service Desk queue.\n2. Software request for an item in the approved catalogue:\n   Fulfilment queue.\n3. Privileged access request, firewall change, data restore, or\n   access to another person's mailbox: Specialist Review queue.\n   Do not state that the request will be granted.\n4. Conflicting requester, asset or approval details:\n   Specialist Review queue.\n\nPilot ticket T-17\nRequest: \"Please install the PDF editor on my laptop.\"\nAsset record: laptop LT-2231, assigned to the requester.\nCatalogue: PDF editor is an approved item.<\/pre><\/figure>\n<h2>Define acceptance before comparing models<\/h2>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"acceptance-criteria\">Acceptance criteria<\/span> let reviewers judge output against evidence. Without them the comparison comes down to one model \"seeming better\".<\/p>\n<div class=\"tw\"><table><thead><tr><th>Work type<\/th><th>Acceptance criteria<\/th><th>Consequence of an error<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Work type\">Routine<\/td><td data-l=\"Acceptance criteria\">At least 95% routed correctly. At least 95% of drafts factually supported. No prohibited commitments. Two-hour turnaround<\/td><td data-l=\"Consequence of an error\">Modest. A reviewer corrects the queue or draft before it is sent<\/td><\/tr><tr><td data-l=\"Work type\">Exception<\/td><td data-l=\"Acceptance criteria\">Every listed trigger goes to Specialist Review. No output grants access, approves a change or resolves conflicting records<\/td><td data-l=\"Consequence of an error\">High. An unsafe exception costs far more than a routine redo<\/td><\/tr><\/tbody><\/table><\/div>\n<p>For exceptions, a better draft may help the specialist. It does not remove the human decision.<\/p>\n<aside class=\"note\"><b>What quality is not<\/b><p>A requested heading, a polished tone or a long explanation does not establish quality. Measure against the factual, routing, safety and turnaround criteria for the task.<\/p><\/aside>\n<h2>Count total cost, not only usage cost<\/h2>\n<p>What you pay to run the model is one part. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"total-cost\">Total cost<\/span> also includes reviewer time, rework after a caught error, delay from slow processing, and the impact of failures that get past review. A cheap model that needs constant correction can be the expensive option. A stronger model can earn its price if it cuts specialist effort or prevents a serious failure.<\/p>\n<p>For the pilot, reviewer time is costed at $1.00 a minute and a routine correction at $2.00.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Cost element<\/th><th>Faster model<\/th><th>Higher-capability model<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Cost element\">Usage per ticket<\/td><td data-l=\"Faster model\">$0.02<\/td><td data-l=\"Higher-capability model\">$0.16<\/td><\/tr><tr><td data-l=\"Cost element\">Average review time<\/td><td data-l=\"Faster model\">0.5 minute<\/td><td data-l=\"Higher-capability model\">0.4 minute<\/td><\/tr><tr><td data-l=\"Cost element\">Correction rate in the pilot<\/td><td data-l=\"Faster model\">4.5%<\/td><td data-l=\"Higher-capability model\">3%<\/td><\/tr><tr><td data-l=\"Cost element\">Estimated total per routine ticket<\/td><td data-l=\"Faster model\"><strong>$0.61<\/strong><\/td><td data-l=\"Higher-capability model\"><strong>$0.62<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>The usage price differs by a factor of eight. The total differs by one cent. That is why a price-list comparison is not enough. The faster model is right for routine tickets only because the task is constrained, the data is there, and a short review catches errors before a reply goes out. If corrections or review time rise, test again.<\/p>\n<h2>Pilot the same work against one rubric<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"pilot\">pilot<\/span> should reflect real demand, not one impressive answer. The lead samples 100 routine tickets and 20 exceptions. Both approaches get the same records and the same instructions. Two reviewers score the outputs without knowing which model produced which. That <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"blind-comparison\">blind comparison<\/span> stops expectations about the \"better\" model from swaying the score.<\/p>\n<figure class=\"prompt\"><figcaption><span>Pilot instruction<\/span><\/figcaption><pre>Using only the ticket and records supplied:\n1. Assign one queue: Service Desk, Fulfilment or Specialist Review.\n2. Draft a reply of no more than 60 words.\n3. State only facts found in the records.\n4. Do not promise access, approve a change or confirm a restore.\n5. If a risk trigger or a conflict in the records is present, route\n   to Specialist Review and say the request needs review.<\/pre><\/figure>\n<div class=\"tw\"><table><thead><tr><th>Pilot result<\/th><th>Faster model<\/th><th>Higher-capability model<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Pilot result\">Routine tickets routed correctly<\/td><td data-l=\"Faster model\">95 of 100<\/td><td data-l=\"Higher-capability model\">98 of 100<\/td><\/tr><tr><td data-l=\"Pilot result\">Routine drafts factually supported<\/td><td data-l=\"Faster model\">96 of 100<\/td><td data-l=\"Higher-capability model\">99 of 100<\/td><\/tr><tr><td data-l=\"Pilot result\">Average time to generate<\/td><td data-l=\"Faster model\">15 seconds<\/td><td data-l=\"Higher-capability model\">45 seconds<\/td><\/tr><tr><td data-l=\"Pilot result\">Exceptions sent to Specialist Review<\/td><td data-l=\"Faster model\">16 of 20<\/td><td data-l=\"Higher-capability model\">20 of 20<\/td><\/tr><tr><td data-l=\"Pilot result\">Specialist preparation time per exception<\/td><td data-l=\"Faster model\">6 minutes<\/td><td data-l=\"Higher-capability model\">3.5 minutes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The faster model meets the routine threshold, just, and stays suitable with review. It fails the exception requirement: four risk-triggering tickets were not escalated. The stronger model handles exceptions better and saves the specialist time. Using it on every routine ticket would add little measurable value.<\/p>\n<h2>Escalation thresholds and tiers<\/h2>\n<p>The finished design does not ask a model whether a case \"feels difficult\". It uses an <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"escalation-threshold\">escalation threshold<\/span>: any privileged access request, firewall change, restore, access to another person's mailbox, or conflicting field is escalated automatically. So is a routine ticket with required data missing. These are observable conditions a reviewer can audit.<\/p>\n<ol class=\"steps\"><li><b>Tier 1: faster model<\/b><span>Classifies routine tickets and prepares first drafts when the asset record and catalogue entry are present. A reviewer checks before sending.<\/span><\/li><li><b>Tier 2: higher-capability model<\/b><span>Prepares a structured summary and draft for escalated tickets, from the supplied records only.<\/span><\/li><li><b>Tier 3: specialist<\/b><span>Reviews every escalated ticket and makes any access, change or restore decision.<\/span><\/li><\/ol>\n<h2>Keep the decision honest over time<\/h2>\n<p>A tiered design is not permanent proof the choice is still right. Ticket patterns, policies, data quality, reviewer capacity and model behaviour all move. Keep a sample of reviewed outputs and rerun the same rubric periodically, and always after changing instructions, records or rules.<\/p>\n<p>Do not pick a model from one demonstration, from maximum capability, or from the lowest listed price. The question is whether the approach meets the service requirement at an acceptable total cost, with the right human review.<\/p>","takeaways":["Define quality, turnaround, volume and consequence before comparing models.","Set measurable acceptance criteria. Fluency and polish are not criteria.","Total cost includes review, rework, delay and escaped failures as well as usage.","Pilot on representative work with one rubric, blind where you can.","Tier by risk with observable escalation triggers, and retest when things change."],"practice":"Take one repetitive task your team could hand to an AI tool. Write its four service requirements and two acceptance criteria you could measure. Then list the conditions that should always send a case to a person.","deck":"decks/13-quality-speed-cost.html","quiz":[{"q":"What should be defined before comparing models for a task?","multi":false,"o":[{"t":"Which model is newest.","ok":false,"why":"Newness says nothing about fit for the service."},{"t":"Minimum quality, turnaround, volume and the consequence of an error.","ok":true,"why":"These four make up the service requirement that every option is then tested against."},{"t":"The listed price per request only.","ok":false,"why":"Usage price is one part of cost and says nothing about quality."},{"t":"Which model writes most fluently.","ok":false,"why":"Fluency is not an acceptance criterion."}]},{"q":"Model A costs $0.02 per ticket and Model B costs $0.16. After adding review time and corrections, they come to $0.61 and $0.62. What does this show?","multi":false,"o":[{"t":"Model A is always the better choice.","ok":false,"why":"Only for work where it meets the quality bar. The totals are nearly equal."},{"t":"Model B is overpriced.","ok":false,"why":"Its total cost is almost the same once review and rework are counted."},{"t":"Comparing usage price alone is incomplete. Total cost includes review and rework.","ok":true,"why":"An eightfold price gap shrank to one cent when the cost of human time and corrections was included."},{"t":"Review time should be removed to save money.","ok":false,"why":"Review is what makes the cheaper model safe to use."}]},{"q":"In a pilot, a faster model routes 95% of routine tickets correctly but sends only 16 of 20 risk-triggering exceptions to specialist review. The requirement is that every exception is escalated. What is the right conclusion?","multi":false,"o":[{"t":"It is suitable for everything, since 95% meets the threshold.","ok":false,"why":"It meets the routine threshold and fails the exception requirement."},{"t":"It is unsuitable for anything.","ok":false,"why":"It meets the routine criteria with review in place."},{"t":"Lower the exception requirement to 80%.","ok":false,"why":"The requirement reflects the consequence of an unsafe exception. Missing four of twenty is the finding, not a reason to move the bar."},{"t":"Use it for reviewed routine work, and send exceptions to a stronger model and a specialist.","ok":true,"why":"A tiered design puts each kind of work where its criteria are met."}]},{"q":"Which TWO are good escalation triggers?","multi":true,"o":[{"t":"\"Escalate if the request seems complicated.\"","ok":false,"why":"\"Seems complicated\" is a judgement nobody can audit."},{"t":"\"Escalate any privileged access request.\"","ok":true,"why":"It is an observable condition a reviewer can check."},{"t":"\"Escalate if the model is not confident.\"","ok":false,"why":"Stated confidence is not a reliable or checkable signal."},{"t":"\"Escalate when requester and asset records conflict.\"","ok":true,"why":"A conflict between fields is visible in the data."}]},{"q":"Why score pilot outputs without knowing which model produced them?","multi":false,"o":[{"t":"So expectations about a model cannot influence the scores.","ok":true,"why":"A blind comparison keeps reviewers judging the output against the rubric."},{"t":"To make the pilot faster.","ok":false,"why":"It does not speed anything up."},{"t":"Because reviewers are not allowed to know.","ok":false,"why":"It is a method choice, not a rule about access."},{"t":"To hide which model costs more.","ok":false,"why":"Cost is measured separately and openly."}]}]},"14":{"lead":"A long conversation is not a better conversation. As work grows, you decide what carries forward: into this chat, into a Project, into a handoff note, or nowhere.","html":"<h2>Context is the working information<\/h2>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"context\">Context<\/span> is the information available to Claude for the current interaction: your request, material supplied in the chat, earlier turns, and any Project setup that applies. It lets Claude connect a new task to decisions already made. More history is not automatically better context.<\/p>\n<p>Long conversations collect old drafts, changed assumptions, abandoned ideas and instructions that contradict each other. When those sit alongside the current source material, Claude may give weight to something that is no longer the authority.<\/p>\n<p class=\"pull\">Relevant, authoritative context beats a complete record of everything said before.<\/p>\n<p>Signs of a context problem:<\/p>\n<ul><li>a constraint you set earlier gets dropped,<\/li><li>Claude asks something the conversation already answered,<\/li><li>older and newer instructions pull against each other,<\/li><li>attention wanders back to earlier, irrelevant work,<\/li><li>terminology becomes inconsistent.<\/li><\/ul>\n<p>These do not prove Claude ignored a particular item. They tell you to inspect the conversation and probably simplify what it is working from.<\/p>\n<h2>Worked example: a runbook conversation that needs repair<\/h2>\n<p>You have a long-running chat about rewriting a patching runbook. Early on it assumed a Saturday 22:00 window and a service desk audience, and it settled on a draft structure. Since then the approved brief has changed. The rollback procedure has still not been approved.<\/p>\n<figure class=\"doc\"><figcaption>Current sources<\/figcaption><pre>Runbook brief, version 3\nAudience: on-call engineers\nApproved reboot window: Sunday 02:00 to 04:00\nRequired title: Monthly patching, production servers\n\nTeam style guide\nUse plain language and numbered steps.\nSpell out an acronym the first time it appears.\nOne action per step.\n\nApprovals tracker\nRollback procedure: approval not recorded.<\/pre><\/figure>\n<p>The chat has useful material, and it is not a reliable source by itself. The brief is the authority for audience, window and title. The style guide is the authority for stable writing rules. The tracker is the authority for the rollback approval, which is still open. Where earlier turns conflict with these, the earlier turns are background.<\/p>\n<h2>Continue, summarise or restart<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Choice<\/th><th>When<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Choice\">Continue<\/td><td data-l=\"When\">Earlier turns are still relevant, consistent and useful for the next step<\/td><td data-l=\"What it does\">Avoids restating things that are accurate and needed<\/td><\/tr><tr><td data-l=\"Choice\">Summarise<\/td><td data-l=\"When\">The history has valuable decisions but has grown long, repetitive or mixed with exploration<\/td><td data-l=\"What it does\">Keeps the facts, decisions, constraints, open questions and next task. Drops superseded options and working-out<\/td><\/tr><tr><td data-l=\"Choice\">Restart<\/td><td data-l=\"When\">Old assumptions conflict with the new task, or the chat is too tangled to repair<\/td><td data-l=\"What it does\">Creates a fresh working boundary<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A good summary is not a transcript. And a restart does not remove the need to supply the right sources, nor does it make an unsupported conclusion valid. The new chat needs the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"handoff-summary\">handoff summary<\/span> and any relevant authoritative documents.<\/p>\n<aside class=\"note\"><b>Boundary rule<\/b><p>Do not tell a new chat to \"use the earlier conversation\" unless the facts it needs have been supplied again or are available through a suitable Project setup.<\/p><\/aside>\n<h2>Create a clean handoff<\/h2>\n<p>Here you should not continue. The old window, audience and structure conflict with the current brief, and the rollback question could be mistaken for permission. The narrowest fix is a handoff summary and a focused new chat.<\/p>\n<figure class=\"out good\"><figcaption>Handoff summary<\/figcaption><pre>Current task: draft the patching runbook for on-call engineers.\n\nAuthoritative facts\n- Title: \"Monthly patching, production servers\".\n- Reboot window: Sunday 02:00 to 04:00.\n- Follow the team style guide: plain language, numbered steps,\n  acronyms spelled out on first use, one action per step.\n\nDo not use\n- The earlier Saturday 22:00 window.\n- The earlier service desk audience.\n- The earlier draft structure.\n\nUnresolved\n- Approval for the rollback procedure is not recorded. Do not\n  include it as approved.\n\nNext task\nDraft the runbook using only the facts above. Say so if a fact\nyou need was not supplied.<\/pre><\/figure>\n<p>The new chat now has a usable boundary. The handoff also keeps the open approval visible, which stops Claude turning a missing approval into an assumed one.<\/p>\n<h2>Persist stable information on purpose<\/h2>\n<dl class=\"defs\"><div><dt>Project instructions<\/dt><dd>Standing guidance for every chat in a Project. Put durable operating rules here. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project-instructions\">project instructions<\/span>.<\/dd><\/div><div><dt>Project knowledge<\/dt><dd>Reference documents needed across related chats and kept up to date there. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project-knowledge\">project knowledge<\/span>.<\/dd><\/div><div><dt>Memory<\/dt><dd>A personalisation feature. It is separate from Project instructions, Project knowledge and the source documents you supply for a task. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"memory\">memory<\/span>.<\/dd><\/div><\/dl>\n<figure class=\"prompt\"><figcaption><span>Project instructions<\/span><\/figcaption><pre>Follow the team style guide for runbooks:\n- Use plain language.\n- Use numbered steps, one action per step.\n- Spell out an acronym the first time it appears.\nWhen a fact you need is missing, say it was not supplied.<\/pre><\/figure>\n<p>These instructions hold only stable style rules and one grounding rule. The style guide can live in Project knowledge. The approved brief can too, while it is current, as long as someone checks its version when the facts change. A reboot window that may move next quarter should not be written into permanent instructions. It belongs in the current brief.<\/p>\n<p>Do not treat memory as an authoritative record, an approval register, or a replacement for supplying current evidence. How memory behaves, what controls exist, the defaults and which plans have it all change, so check the current settings before relying on it or managing it.<\/p>\n<aside class=\"note\"><b>Data minimisation<\/b><p>Do not keep sensitive information just because it might be handy later. Persist only what has a clear work purpose, proper authorisation and a suitable place to live. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"data-minimisation\">data minimisation<\/span>.<\/p><\/aside>\n<h2>Keeping the boundary over time<\/h2>\n<p>Do not fix a context problem by loading every document and chat excerpt into a new request. More material brings more conflicts. Supply the smallest set of authoritative material the task needs, and say which source wins when two differ.<\/p>\n<ol class=\"steps\"><li><b>Check for conflicts<\/b><span>Do current instructions clash with earlier ones in the chat?<\/span><\/li><li><b>Separate decisions from ideas<\/b><span>Final decisions on one side. Abandoned options and brainstorming on the other.<\/span><\/li><li><b>Keep open approvals open<\/b><span>Record them as unresolved, never as implied permission.<\/span><\/li><li><b>Review standing instructions<\/b><span>Stable rules only. No temporary facts.<\/span><\/li><li><b>Drop what has no purpose<\/b><span>Especially anything sensitive.<\/span><\/li><\/ol>","takeaways":["Context is what Claude can see now. A long history is not better context.","Continue when the history is sound, summarise when it is long but valuable, restart when assumptions conflict.","A restart needs a handoff summary and the current sources. It does not create facts.","Durable rules go in Project instructions. Maintained references go in Project knowledge. Temporary facts go in neither.","Memory is for personalisation. It is not an authority for facts or approvals."],"practice":"Open the longest AI conversation you have going. Write a five-line handoff summary for it: current task, authoritative facts, what not to use, what is unresolved, and the next task. Notice what you left out.","deck":"decks/14-context-and-memory.html","quiz":[{"q":"A long conversation contains an old audience, an outdated figure and an abandoned concept. The approved brief has since changed all three. What is the best way to continue?","multi":false,"o":[{"t":"Carry on in the same chat and hope the newest instruction wins.","ok":false,"why":"Conflicting material in the history can still steer the output."},{"t":"Start a new chat and tell it to use the earlier conversation.","ok":false,"why":"A new chat cannot rely on an old one unless the facts are supplied again."},{"t":"Write a handoff summary, start a focused chat, and supply the current sources.","ok":true,"why":"It keeps what is authoritative, names what must not be used, and gives the new chat a clean boundary."},{"t":"Paste every earlier draft into a new chat so nothing is lost.","ok":false,"why":"More material brings the same conflicts along."}]},{"q":"What belongs in Project instructions?","multi":false,"o":[{"t":"This month's campaign figure.","ok":false,"why":"A figure that will change is a temporary fact. It belongs in the current brief."},{"t":"An unapproved photograph, noted as approved.","ok":false,"why":"An open approval must stay recorded as open."},{"t":"A sensitive detail that might be useful one day.","ok":false,"why":"Data minimisation says not to keep things without a clear purpose."},{"t":"Stable writing rules that apply to every chat in the Project.","ok":true,"why":"Durable operating rules are what instructions are for."}]},{"q":"Which statement about Claude's memory feature is correct?","multi":false,"o":[{"t":"It is the authoritative record of approvals.","ok":false,"why":"Approvals belong in their proper source record."},{"t":"It is a personalisation feature, separate from Project knowledge and supplied sources.","ok":true,"why":"It helps tailor responses. It does not replace current evidence."},{"t":"It replaces the need to supply source documents.","ok":false,"why":"A task still needs its authoritative sources."},{"t":"Its behaviour and controls never change.","ok":false,"why":"They do change, so check the current settings."}]},{"q":"Which TWO are signs that a conversation's context needs attention?","multi":true,"o":[{"t":"Claude asks a question the conversation already answered.","ok":true,"why":"Repeated questions suggest the working state has become cluttered."},{"t":"The conversation is only three turns long.","ok":false,"why":"Short, coherent conversations are fine to continue."},{"t":"A constraint set earlier has stopped being applied.","ok":true,"why":"A dropped constraint is a classic sign that older material is crowding it out."},{"t":"Claude followed the requested format.","ok":false,"why":"That is the conversation working as intended."}]},{"q":"A rights tracker shows no approval recorded for an image. How should a handoff summary treat it?","multi":false,"o":[{"t":"Leave it out, to keep the summary short.","ok":false,"why":"Leaving it out risks the new chat assuming it is fine to use."},{"t":"List it as approved, since nobody objected.","ok":false,"why":"No objection is not an approval."},{"t":"List it as unresolved and say not to use it as approved.","ok":true,"why":"Keeping the open approval visible stops a missing approval being treated as permission."},{"t":"Store it in memory for later.","ok":false,"why":"Memory is not an approval register."}]}]},"15":{"lead":"\"Can we use AI for this?\" is the wrong first question. Start with the business need and the controls around it. Then work out which part of the work Claude can safely take.","html":"<h2>Start with the need, not the tool<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"use-case\">use case<\/span> is a defined piece of work that produces a useful result for a defined user. Good selection starts with the underlying need. A request to \"use Claude\" or \"automate everything\" describes a solution somebody wants, and it may be too broad, technically unsuitable or at odds with existing controls.<\/p>\n<p>Take \"automate change approvals\". The real need might be fewer incomplete submissions, faster access to the relevant policy, consistent summaries of exceptions, or less time preparing a review. Those call for different designs and different amounts of automation.<\/p>\n<p class=\"pull\">Define the work and its constraints before deciding whether Claude belongs in it.<\/p>\n<p>Requirements turn a broad request into something that can be assessed. They also prevent a common failure: handing an AI system responsibility for an action that has to stay with an accountable person or an authorised system.<\/p>\n<h2>Capture requirements in categories<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Category<\/th><th>What to define<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Category\">Objective<\/td><td data-l=\"What to define\">The business result you want<\/td><\/tr><tr><td data-l=\"Category\">Users<\/td><td data-l=\"What to define\">Who submits, reviews, receives or acts on the result<\/td><\/tr><tr><td data-l=\"Category\">Trigger<\/td><td data-l=\"What to define\">The event that starts the work<\/td><\/tr><tr><td data-l=\"Category\">Inputs<\/td><td data-l=\"What to define\">Evidence, records, policies and the data you are allowed to use<\/td><\/tr><tr><td data-l=\"Category\">Transformation<\/td><td data-l=\"What to define\">The analysis, organising, drafting or routing to be done<\/td><\/tr><tr><td data-l=\"Category\">Output and destination<\/td><td data-l=\"What to define\">What is produced and where it goes<\/td><\/tr><tr><td data-l=\"Category\">Frequency and service level<\/td><td data-l=\"What to define\">How often, and how quickly<\/td><\/tr><tr><td data-l=\"Category\">Controls and owner<\/td><td data-l=\"What to define\">The safeguards required and who is accountable for the process<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"requirement\">requirement<\/span> in each category gives you something to evaluate. Skipping the last row is how AI ends up doing something nobody authorised.<\/p>\n<h2>Resolve ambiguity with targeted questions<\/h2>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"ambiguity\">Ambiguity<\/span> is information that is missing, unclear or open to more than one reading. Do not design a workflow around it. Ask questions that change the decision:<\/p>\n<ul><li>Which version of the policy is the authority?<\/li><li>Which evidence is mandatory?<\/li><li>Could a request contain data that is not allowed in this tool?<\/li><li>Who can authorise an exception?<\/li><li>What should happen when a required fact is missing?<\/li><\/ul>\n<p>These are narrower and more useful than \"how should the automation work?\". They show whether the work can be defined, whether the evidence exists, and whether the output could be acted on safely.<\/p>\n<h2>What Claude suits, and warning signs<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Often suitable, with review<\/th><th>Needs a narrower role or a different solution<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Often suitable, with review\">Synthesising supplied material<\/td><td data-l=\"Needs a narrower role or a different solution\">Calculations that must be exact with no checking<\/td><\/tr><tr><td data-l=\"Often suitable, with review\">Drafting<\/td><td data-l=\"Needs a narrower role or a different solution\">Actions that cannot be undone, taken without a person<\/td><\/tr><tr><td data-l=\"Often suitable, with review\">Classifying against defined categories<\/td><td data-l=\"Needs a narrower role or a different solution\">Evidence that is missing or unavailable<\/td><\/tr><tr><td data-l=\"Often suitable, with review\">Organising evidence<\/td><td data-l=\"Needs a narrower role or a different solution\">Data that is not allowed in the tool<\/td><\/tr><tr><td data-l=\"Often suitable, with review\">Generating ideas<\/td><td data-l=\"Needs a narrower role or a different solution\">Decisions that need accountable professional judgement<\/td><\/tr><\/tbody><\/table><\/div>\n<p>In the right-hand column Claude can still help with the surrounding work. It should not be treated as the control itself.<\/p>\n<aside class=\"note\"><b>Three tests, and all three must pass<\/b><p><strong>Feasible<\/strong>: it can be done with the inputs available and a suitable method. <strong>Valuable<\/strong>: it improves an outcome that matters. <strong>Permissible<\/strong>: it meets data, policy, authorisation and control requirements. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"three-tests\">feasible, valuable, permissible<\/span>.<\/p><\/aside>\n<p>A classification task that is technically possible is not valuable if it saves no real work. A useful workflow is not permissible if it exposes restricted data or bypasses a required sign-off. Being able to do something is not approval to deploy it.<\/p>\n<h2>Worked example: change review preparation<\/h2>\n<p>A change coordinator is asked to \"automate change approvals\". They have one submitted request, the policy excerpt and details from the process owner.<\/p>\n<figure class=\"doc\"><figcaption>Source material<\/figcaption><pre>Change request CR-3312\nChange: apply the monthly cumulative update to the production\nSQL cluster\nRequested window: Sunday 14 March, 02:00 to 04:00\nSubmitted: implementation plan, rollback plan, customer approval\nNot submitted: test evidence from UAT\n\nChange policy excerpt\nRequired evidence: implementation plan, rollback plan, test\nevidence from UAT, and customer approval.\nChanges to production require peer review and change manager\nauthorisation. Changes during a published freeze period are\nprohibited and must not proceed. The change manager or the change\nsystem records the final decision.\n\nOperating details\nDestination: change review queue\nFrequency: every submitted change\nService level: reviewer note within one business day\nProcess owner: change manager<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>Use case assessment<\/figcaption><pre>Objective: cut the time spent preparing change reviews.\nUsers: change coordinator, peer reviewer, change manager.\nTrigger: a change request is submitted.\nInputs: the request packet and the approved policy excerpt.\nTransformation
