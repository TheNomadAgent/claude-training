<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Foundations training</title>
<meta name="description" content="A 32-session study guide and practice questions for the Claude Certified Associate, Foundations exam.">
<meta name="theme-color" content="#0A162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foundations">
<meta property="og:title" content="Claude Foundations training">
<meta property="og:description" content="32 short sessions with practice questions for the CCAO-F exam.">
<meta property="og:image" content="https://thenomadagent.github.io/claude-training/assets/icon-512.png">
<link rel="preload" href="assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage";src:url(assets/fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url(assets/fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"JBMono";src:url(assets/fonts/jetbrains.woff2) format("woff2");font-weight:100 800;font-display:swap}
:root{
  --ink:#0A162B;--ink2:#0E1D38;--ink3:#15284A;--line:#223A63;--line2:#2E4A7C;
  --text:#E9EFF9;--mute:#9AACCB;--dim:#6F84A8;
  --ember:#FF6A3D;--sun:#FFC55A;--volt:#4466FF;--sky:#9FD4FB;
  --ok:#57D39B;--bad:#FF8177;
  --route:linear-gradient(180deg,var(--ember) 0%,var(--sun) 30%,var(--volt) 68%,var(--sky) 100%);
  --routeh:linear-gradient(90deg,var(--ember) 0%,var(--sun) 30%,var(--volt) 68%,var(--sky) 100%);
  --disp:"Bricolage","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JBMono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --bar:56px;--rail:320px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar) + 16px)}
body{margin:0;background:var(--ink);color:var(--text);font:400 17px/1.62 var(--body);overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--sky)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:6px}
::selection{background:rgba(68,102,255,.45)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;height:calc(var(--bar) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;
  display:flex;align-items:center;gap:10px;background:rgba(10,22,43,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);z-index:40}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 8px 6px 2px;cursor:pointer;border-radius:10px;text-decoration:none;color:var(--text)}
.brand img{width:30px;height:30px;display:block}
.brand b{font:600 17px/1 var(--disp);letter-spacing:-.01em}
.bar .sp{flex:1}
.ib{height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;text-decoration:none;color:var(--text)}
.ib:hover{border-color:var(--line2);background:var(--ink3)}
.ib svg{width:18px;height:18px;flex:none}
#menuBtn{display:none}
.barprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--routeh);width:0;transition:width .5s ease}

/* layout */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);padding-top:calc(var(--bar) + env(safe-area-inset-top));min-height:100vh}
.rail{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top));height:calc(100vh - var(--bar) - env(safe-area-inset-top));
  overflow-y:auto;border-right:1px solid var(--line);padding:18px 14px 40px 18px;background:var(--ink)}
main{min-width:0;padding:34px clamp(18px,4.5vw,64px) 96px}
.wrap{max-width:760px;margin:0 auto}
.wide{max-width:980px;margin:0 auto}

/* the route: one line through every session */
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--route);opacity:.9}
.route .dom{position:relative;padding:16px 0 6px 34px;font:600 13.5px/1.3 var(--body);color:var(--mute)}
.route .dom:first-child{padding-top:0}
.route .dom span{color:var(--dim);font-weight:500;white-space:nowrap}
.route a{position:relative;display:flex;gap:10px;align-items:baseline;padding:7px 10px 7px 34px;border-radius:9px;color:var(--text);text-decoration:none;line-height:1.35;font-size:15px}
.route a::before{content:"";position:absolute;left:3px;top:.72em;width:15px;height:15px;border-radius:50%;background:var(--ink);border:3px solid var(--line2);box-sizing:border-box}
.route a:hover{background:var(--ink2)}
.route a .n{font:500 12.5px/1 var(--mono);color:var(--dim);min-width:1.6em}
.route a .sc{margin-left:auto;font:600 12px/1 var(--mono);color:var(--ok);white-space:nowrap;padding-left:8px}
.route a.done::before{background:var(--ok);border-color:var(--ok)}
.route a.cur{background:var(--ink3)}
.route a.cur::before{border-color:var(--sun);background:var(--sun);box-shadow:0 0 0 4px rgba(255,197,90,.18)}
.route a.soon{color:var(--dim);cursor:default}
.route a.soon:hover{background:none}
.route a.soon::before{border-color:var(--line);border-style:solid;opacity:.9}
.rail .xl{display:block;margin:18px 0 0 34px;font-size:14.5px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin:6px 0 34px}
.hero h1{font:700 clamp(38px,6.4vw,72px)/.98 var(--disp);letter-spacing:-.035em;margin:0 0 18px;text-wrap:balance}
.hero p{margin:0 0 22px;color:var(--mute);font-size:19px;max-width:34em}
.hero .mark{width:clamp(96px,15vw,170px);height:auto;display:block;filter:drop-shadow(0 14px 40px rgba(68,102,255,.28))}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line2);
  background:var(--ink2);font-weight:650;font-size:16px;cursor:pointer;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--ink3)}
.btn.pri{border:0;color:#0A162B;background:linear-gradient(100deg,var(--ember),var(--sun))}
.btn.pri:hover{filter:brightness(1.08)}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 30px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute);font-size:15px}
.stat b{color:var(--text);font:600 20px/1 var(--disp);margin-right:6px}
.find{position:relative;margin:0 0 22px}
.find input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);color:var(--text);font:inherit;padding:0 16px 0 44px}
.find input::placeholder{color:var(--dim)}
.find svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--dim)}
.home .route a{font-size:17px;padding-top:10px;padding-bottom:10px}
.home .route a::before{top:.85em}
.home .route .dom{font-size:15px;padding-top:24px}
.hits{margin:0 0 20px;padding:0;list-style:none;display:grid;gap:8px}
.hits li{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hits b{display:block}
.hits span{color:var(--mute);font-size:15px}
.tip{margin-top:30px;padding:16px 18px;border-radius:14px;background:var(--ink2);border:1px solid var(--line);color:var(--mute);font-size:15.5px}
.tip b{color:var(--text)}
footer.ft{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim);font-size:14px;display:grid;gap:8px}
footer.ft button{background:none;border:0;padding:0;color:var(--sky);text-decoration:underline;cursor:pointer;font-size:14px;text-align:left}

/* section */
.crumb{color:var(--mute);font-size:15px;margin:0 0 12px}
.crumb b{color:var(--sun);font:600 14px/1 var(--mono);margin-right:8px}
h1.t{font:700 clamp(31px,4.8vw,50px)/1.04 var(--disp);letter-spacing:-.03em;margin:0 0 16px;text-wrap:balance}
.lead{font-size:20.5px;line-height:1.5;color:#CBD7EC;margin:0 0 22px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 34px}
.body h2{font:650 clamp(23px,3vw,29px)/1.15 var(--disp);letter-spacing:-.02em;margin:46px 0 12px;text-wrap:balance}
.body p{margin:0 0 16px}
.body strong{font-weight:700;color:#fff}
.body code{font:500 .9em var(--mono);background:var(--ink3);padding:.1em .35em;border-radius:5px}
.pull{margin:26px 0;padding:4px 0 4px 20px;border-left:4px solid;border-image:var(--route) 1;font:600 clamp(21px,2.6vw,26px)/1.28 var(--disp);letter-spacing:-.015em;text-wrap:balance}
.note{margin:22px 0;padding:16px 18px;border-radius:14px;background:rgba(255,197,90,.08);border:1px solid rgba(255,197,90,.35)}
.note b{display:block;color:var(--sun);margin-bottom:4px}
.note p{margin:0}
figure{margin:22px 0;border-radius:14px;border:1px solid var(--line);background:var(--ink2);overflow:hidden}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px 9px 16px;font-weight:650;font-size:14.5px;color:var(--mute);border-bottom:1px solid var(--line)}
figure pre{margin:0;padding:16px;font:450 14.2px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#DCE6F7;tab-size:2}
figure.prompt{border-color:rgba(68,102,255,.55)}
figure.prompt figcaption{color:var(--sky)}
figure.out.bad{border-color:rgba(255,129,119,.5)}
figure.out.bad figcaption{color:var(--bad)}
figure.out.good{border-color:rgba(87,211,155,.5)}
figure.out.good figcaption{color:var(--ok)}
figure.doc pre{color:#C5D2EA}
mark{background:rgba(255,129,119,.22);color:#FFD9D5;border-bottom:2px solid var(--bad);padding:0 2px;border-radius:3px}
.mk{padding:0 16px 14px;color:var(--bad);font-size:14.5px}
.copy{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--ink3);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--text)}
.copy:hover{background:var(--line)}
dl.defs{margin:18px 0;display:grid;gap:10px}
dl.defs div{padding:14px 16px;border-radius:12px;background:var(--ink2);border:1px solid var(--line)}
dl.defs dt{font:650 18px/1.2 var(--disp);margin-bottom:4px}
dl.defs dd{margin:0;color:#CBD7EC}
ol.steps{list-style:none;counter-reset:s;margin:20px 0;padding:0;position:relative}
ol.steps::before{content:"";position:absolute;left:15px;top:16px;bottom:16px;width:3px;background:var(--route);border-radius:3px}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 16px 50px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:33px;height:33px;border-radius:50%;background:var(--ink);border:3px solid var(--line2);
  display:grid;place-items:center;font:700 14px/1 var(--mono);box-sizing:border-box}
ol.steps b{display:block;font:650 18px/1.3 var(--disp)}
ol.steps span{color:#CBD7EC}
.body ul{margin:0 0 16px;padding-left:22px}
.body li{margin:4px 0}
.tw{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:520px}
th,td{text-align:left;padding:11px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--ink2);font-weight:650;color:var(--mute);font-size:14.5px}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:650}
.take{margin:44px 0 0;padding:22px 22px 14px;border-radius:16px;background:var(--ink2);border:1px solid var(--line)}
.take h2{margin:0 0 10px}
.take ul{padding-left:20px;margin:0 0 8px}
.prac{margin:16px 0 0;padding:18px 22px;border-radius:16px;border:1px dashed var(--line2)}
.prac h2{margin:0 0 6px;font-size:21px}
.prac p{margin:0;color:#CBD7EC}

/* glossary term */
.g{border-bottom:2px dotted var(--sky);color:#D9EEFF;cursor:help;border-radius:2px}
.g:hover,.g[aria-expanded=true]{background:rgba(159,212,251,.14)}
.pop{position:absolute;z-index:60;width:min(340px,calc(100vw - 24px));padding:14px 16px;border-radius:14px;background:#17305A;border:1px solid var(--line2);
  box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:15.5px;line-height:1.5}
.pop b{display:block;font:650 17px/1.2 var(--disp);margin-bottom:5px;color:var(--sun)}
.pop[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(4,10,22,.6);z-index:55}
.scrim[hidden]{display:none}

/* quiz */
.quiz{margin:52px 0 0}
.quiz>h2{font:700 clamp(26px,3.6vw,34px)/1.1 var(--disp);letter-spacing:-.025em;margin:0 0 6px}
.quiz>p{color:var(--mute);margin:0 0 20px}
.q{margin:0 0 18px;padding:20px;border-radius:16px;background:var(--ink2);border:1px solid var(--line)}
.q .qn{font:600 13.5px/1 var(--mono);color:var(--sun);margin-bottom:10px}
.q h3{font:600 19px/1.4 var(--body);margin:0 0 14px}
.q .hint{color:var(--sky);font-size:14.5px;font-weight:600;margin:-6px 0 12px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;width:100%;text-align:left;padding:13px 14px;margin:0 0 9px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--ink);cursor:pointer;line-height:1.45;font-size:16.5px}
.opt:hover:not([disabled]){border-color:var(--line2);background:#0C1A33}
.opt .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);margin-top:1px;display:grid;place-items:center;font:700 13px/1 var(--mono)}
.q.multi .opt .box{border-radius:6px}
.opt.sel .box{border-color:var(--sun);background:var(--sun);color:var(--ink)}
.opt[disabled],div.opt{cursor:default;opacity:1;color:var(--text)}
.opt .why{grid-column:2;color:#C4D1E8;font-size:15.5px;margin-top:6px;display:none}
.opt .tag{display:inline-block;font:700 12px/1 var(--body);padding:4px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.q.done .opt .why{display:block}
.q.done .opt.right{border-color:var(--ok);background:rgba(87,211,155,.09)}
.q.done .opt.right .box{border-color:var(--ok);background:var(--ok);color:var(--ink)}
.q.done .opt.right .tag{background:var(--ok);color:var(--ink)}
.q.done .opt.wrong{border-color:var(--bad);background:rgba(255,129,119,.08)}
.q.done .opt.wrong .box{border-color:var(--bad);background:var(--bad);color:var(--ink)}
.q.done .opt.wrong .tag{background:var(--bad);color:var(--ink)}
.q.done .opt.missed .tag{background:var(--ok);color:var(--ink)}
.verdict{font-weight:700;margin:6px 0 0}
.verdict.y{color:var(--ok)}.verdict.n{color:var(--bad)}
.check{margin-top:4px}
.score{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:20px;border-radius:16px;border:1px solid var(--line2);background:var(--ink3)}
.score b{font:700 30px/1 var(--disp)}
.score span{color:var(--mute);display:block;font-size:15px;margin-top:4px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px}
.pn a{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--ink2);text-decoration:none;color:var(--text);line-height:1.3}
.pn a small{display:block;color:var(--mute);margin-bottom:3px}
.pn a.nx{text-align:right}
.pn a:hover{border-color:var(--line2)}
.gl{display:grid;gap:10px;margin-top:20px}
.gl div{padding:14px 16px;border-radius:12px;background:var(--ink2);border:1px solid var(--line)}
.gl dt{font:650 18px/1.2 var(--disp);margin-bottom:4px}
.gl dd{margin:0;color:#CBD7EC}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.ex-top .crumb{margin:0}
.timer{font:600 15px/1 var(--mono);padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--ink2)}
.timer.low{border-color:var(--bad);color:var(--bad)}
.strip{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;padding:0;list-style:none}
.strip button{position:relative;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--ink);cursor:pointer;font:600 13px/1 var(--mono);color:var(--mute);padding:0}
.strip button.ans{background:var(--ink3);color:var(--text);border-color:var(--volt)}
.strip button.cur{border-color:var(--sun);color:var(--ink);background:var(--sun)}
.strip button.flag::after{content:"";position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;background:var(--ember);border:2px solid var(--ink)}
.exq h2{font:600 clamp(19px,2.4vw,23px)/1.42 var(--body);margin:0 0 18px}
.exq .qn,.wrap>.q .qn{font:600 13.5px/1 var(--mono);color:var(--sun);margin-bottom:12px}
.opt .box.let{border-radius:50%;font-size:12.5px;color:var(--mute)}
.opt.sel .box.let,.q.done .opt.right .box.let,.q.done .opt.wrong .box.let{color:var(--ink)}
.exnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.exnav .sp{flex:1}
.btn.on{border-color:var(--ember);color:var(--ember)}
.btn[disabled]{opacity:.4;cursor:default}
.warn{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--sun);background:rgba(255,197,90,.08);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 24px}
.facts div{padding:14px 16px;border-radius:12px;background:var(--ink2);border:1px solid var(--line);color:var(--mute);font-size:15px}
.facts b{display:block;font:650 24px/1.1 var(--disp);color:var(--text);margin-bottom:4px}
.big{font:750 clamp(54px,11vw,96px)/1 var(--disp);letter-spacing:-.04em;margin:0}
.big small{font:500 .28em/1 var(--body);color:var(--mute);letter-spacing:0;margin-left:.5em}
.bars{display:grid;gap:12px;margin:18px 0 8px}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline}
.bars .row span{font-size:15.5px}
.bars .row b{font:600 14px/1 var(--mono)}
.bars .track{grid-column:1/-1;height:8px;border-radius:8px;background:var(--ink3);overflow:hidden}
.bars .fill{height:100%;border-radius:8px;background:var(--routeh)}
.rev{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.rev li{padding:12px 14px;border-radius:12px;background:var(--ink2);border:1px solid var(--line)}
.rev a{font-weight:650}
.h2{font:650 clamp(22px,3vw,27px)/1.15 var(--disp);letter-spacing:-.02em;margin:38px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17305A;border:1px solid var(--line2);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast[hidden]{display:none}

@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-flex}
  .rail{position:fixed;inset:calc(var(--bar) + env(safe-area-inset-top)) auto 0 0;width:min(88vw,360px);height:auto;z-index:58;transform:translateX(-102%);
    transition:transform .28s ease;border-right:1px solid var(--line2);box-shadow:20px 0 60px rgba(0,0,0,.5)}
  body.open .rail{transform:none}
}
@media (max-width:640px){
  body{font-size:16.5px}
  main{padding-top:24px}
  .hero{grid-template-columns:1fr}
  .hero .mark{order:-1;width:84px}
  .brand b{font-size:16px}
  .ib span{display:none}
  .ib{padding:0 10px}
  .q{padding:16px 14px}
  figure pre{font-size:13px;padding:14px}

<script id="data" type="application/json">{"domains":[{"name":"Prompting and task execution","w":14},{"name":"Output evaluation and validation","w":21},{"name":"Product and model selection","w":12},{"name":"Workflow integration and solution design","w":16},{"name":"Configuration and knowledge management","w":12},{"name":"Governance, risk and responsible use","w":15},{"name":"Troubleshooting and optimisation","w":10},{"name":"Exam preparation","w":0}],"sections":[{"id":1,"d":0,"title":"Building effective prompts for business and technical tasks"},{"id":2,"d":0,"title":"Decomposing complex tasks into manageable steps"},{"id":3,"d":0,"title":"Iterating prompts to improve output quality"},{"id":4,"d":0,"title":"Adapting prompts for analysis, research, drafting and brainstorming"},{"id":5,"d":1,"title":"Evaluating outputs for accuracy and completeness"},{"id":6,"d":1,"title":"Detecting hallucinations and unsupported claims"},{"id":7,"d":1,"title":"Finding inconsistencies, ambiguity and reasoning gaps"},{"id":8,"d":1,"title":"Recognising bias and evaluating representation"},{"id":9,"d":1,"title":"Fact-checking and source validation"},{"id":10,"d":1,"title":"Human review, audience adaptation and output format"},{"id":11,"d":2,"title":"Choosing between chat, Projects, Research and Artifacts"},{"id":12,"d":2,"title":"Understanding the Haiku, Sonnet and Opus model families"},{"id":13,"d":2,"title":"Balancing quality, speed and cost"},{"id":14,"d":2,"title":"Managing context, memory and conversation boundaries"},{"id":15,"d":3,"title":"Analysing requirements and selecting suitable use cases"},{"id":16,"d":3,"title":"Using Claude for research and planning"},{"id":17,"d":3,"title":"Finding and prioritising process improvements"},{"id":18,"d":3,"title":"Designing and iterating a Claude-supported solution"},{"id":19,"d":3,"title":"Integrating Claude and communicating value to stakeholders"},{"id":20,"d":4,"title":"Configuring a Claude Project for recurring work"},{"id":21,"d":4,"title":"Writing effective project instructions"},{"id":22,"d":4,"title":"Selecting and managing uploaded knowledge"},{"id":23,"d":4,"title":"Using connectors and respecting source permissions"},{"id":24,"d":4,"title":"Maintaining configurations, knowledge and instructions"},{"id":25,"d":5,"title":"Identifying appropriate and inappropriate uses"},{"id":26,"d":5,"title":"Data sensitivity, privacy and regulatory considerations"},{"id":27,"d":5,"title":"Applying organisational AI policies and governance"},{"id":28,"d":5,"title":"Ethical judgement, fairness, transparency and human accountability"},{"id":29,"d":6,"title":"Diagnosing underperforming prompts and poor outputs"},{"id":30,"d":6,"title":"Improving solutions through feedback and controlled testing"},{"id":31,"d":6,"title":"Optimising workflows for efficiency and effectiveness"},{"id":32,"d":7,"title":"Preparing for the exam"}],"glossary":{"prompt":["Prompt","The instruction you give Claude. It can include the task, background, source material and how you want the answer laid out."],"hallucination":["Hallucination","When an AI model states something that sounds right but has no basis in the material it was given or in fact. Fluent wording is not evidence."],"objective":["Objective","The piece of work you want done, stated as a deliverable. 'Draft a status update' is an objective. 'Patching' is only a topic."],"context":["Context","Background that gives the task meaning: the project, the environment, what happened before. Also used for everything Claude can see in the current conversation."],"authoritative":["Authoritative input","The material you tell Claude to treat as the source of truth for this task. It is authoritative because your prompt says so."],"audience":["Audience","The people who will read the result. Their knowledge and needs decide the vocabulary, level of detail and tone."],"constraint":["Constraint","A boundary on the answer: what to leave out, what must not be claimed, which terms to use, how to treat missing information."],"format":["Output format","The shape of the answer: headings, a table, bullet points, a length limit. It says how to lay facts out. It does not supply the facts."],"evidence-boundary":["Evidence boundary","The line between what the supplied material supports and everything else. A good prompt tells Claude to stay inside it and say so when it reaches the edge."],"observable":["Observable requirement","A requirement a reviewer can check by looking: 'three headed paragraphs, under 150 words'. The opposite is a vague quality word like 'polished'."],"root-cause":["Root cause","The underlying reason a fault happened. It should only be stated once evidence supports it. Until then it is a hypothesis."],"hypothesis":["Hypothesis","A possible explanation that has not been proven yet. Keep it labelled as one until a check confirms or rules it out."],"diagnostic-loop":["Diagnostic loop","A troubleshooting routine: describe the fault, have Claude write one script that collects evidence, feed the output back, and only then reason about the cause. Repeat until the evidence proves it."],"decomposition":["Decomposition","Splitting a large job into smaller stages, each with its own input and its own checkable result."],"one-shot":["One-shot prompt","A single prompt that asks for the whole finished result in one go."],"intermediate":["Intermediate deliverable","A result produced part-way through a job, such as an extracted list of facts, that can be checked before later stages rely on it."],"inventory":["Input inventory","A list of everything the job should cover and every source it should draw on, written before any analysis starts."],"completeness-check":["Completeness check","Comparing what was actually extracted against the inventory, to catch anything that was skipped."],"human-gate":["Human gate","A stopping point where a person checks the work so far and decides whether Claude should carry on. Also called a checkpoint."],"dependency":["Dependency","Something that has to be finished and correct before the next thing can be trusted. Facts before analysis, analysis before recommendations."],"iteration":["Iteration","Improving a result through repeated rounds: get a draft, inspect it, name the main defect, revise the instruction, compare."],"defect":["Defect","The specific thing wrong with a draft. Naming its type (missing content, wrong tone, unsupported claim and so on) tells you which fix to use."],"knowledge-gap":["Knowledge gap","The answer is not in the material Claude was given. No amount of rewording the prompt fixes this. Someone has to supply the fact."],"rubric":["Rubric","A short list of criteria a draft must meet, written so each one can be ticked or crossed."],"follow-up":["Follow-up prompt","A new instruction in the same conversation that builds on what is already there, instead of starting again."],"context-drift":["Context drift","When a long conversation fills up with old drafts and replaced instructions, and Claude starts mixing outdated material back into new answers."],"analysis":["Analysis","Using evidence you already have to reach a decision: comparing options against stated criteria."],"research":["Research","Finding evidence and showing where each piece came from, including what could not be found."],"drafting":["Drafting","Turning agreed facts and a chosen direction into a piece of writing for a particular reader."],"brainstorming":["Brainstorming","Producing a wide spread of possible approaches before anyone judges them."],"chaining":["Prompt chaining","Running several prompts in order, where each one uses the checked result of the one before."],"recency":["Recency","How recent a source has to be to count. A research prompt should say so, for example 'published in the last 12 months'."],"citation":["Citation","A pointer from a statement to the source that supports it, so a reviewer can trace it."],"assumption":["Assumption","Something treated as true for the sake of the work without being proven. Good analysis lists assumptions separately from findings."],"change-board":["Change board","The group that approves changes to live systems before they are made. Often called CAB, the change advisory board."],"ccao-f":["CCAO-F","Claude Certified Associate, Foundations. Anthropic's entry-level certification exam on using Claude well for everyday work."],"unsupported-claim":["Unsupported claim","A statement presented as fact that the authoritative source does not back, at the strength or level of detail used."],"inference":["Inference","A reasoned interpretation drawn from the evidence. It is acceptable when it is clearly labelled as an inference and not passed off as a source fact."],"unresolved":["Unresolved question","Something the source does not answer. Recording it as open is more accurate than filling it with an assumption."],"internal-consistency":["Internal consistency","Whether a response agrees with itself and with its own source from start to finish: numbers, units, labels, definitions and conclusions."],"external-error":["External factual error","A statement that conflicts with a reliable source outside the response, such as a wrong published date or price."],"ambiguous-reference":["Ambiguous reference","A word such as 'it' or 'this option', or an undefined label such as 'better coverage', where the reader cannot tell what is meant."],"terminology-shift":["Terminology shift","A key term that changes meaning part-way through a response while the wording stays similar."],"bias":["Bias","A systematic distortion that produces unfair, incomplete or poorly supported outcomes. It can sit behind perfectly neutral wording."],"proxy":["Proxy variable","An indirect attribute used in place of a real job-relevant criterion, such as employer prestige standing in for ability."],"framing-bias":["Framing bias","When the way a question is asked steers the answer toward a narrow idea of what counts, such as asking for 'executive polish' in place of evidence of the role's duties."],"stereotyping":["Stereotyping","Assuming abilities, values or behaviour based on a person's group or background."],"factual-imbalance":["Factual imbalance","A measurable gap in the record itself, such as feedback that came from managers and from none of the people affected."],"unrepresentative":["Unrepresentative sample","A set of sources that cannot reasonably support conclusions about the wider group affected."],"consequential":["Consequential decision","A decision that can significantly affect a person's job, pay, opportunity or advancement, or carries real safety, legal or financial weight."],"primary-source":["Primary source","The original authority for a fact, such as the manufacturer's specification or the policy owner's document."],"qualifier":["Qualifier","A condition attached to a claim, such as 'up to', 'under test conditions' or 'for eligible customers'. Dropping it changes the meaning."],"effective-date":["Effective date","When a rule actually applies. It can differ from the date the document was published."],"evidence-log":["Evidence log","A compact record of each claim, its source, the source date, the supporting passage, your interpretation and a status."],"validation":["Validation","Testing whether each claim is supported by an authoritative source that is good enough for the intended use. Editing only changes how it reads."],"structured-data":["Structured data","Output laid out in fixed fields, such as a table or record, so it can be filtered, compared, reused or passed to another system."],"artifact":["Artifact","A standalone piece of work Claude builds beside the conversation, such as a document, tracker or small tool, that you can come back to, edit and share."],"chat":["Chat","An ordinary conversation with Claude. Suited to direct work where everything needed can be supplied in that conversation."],"project":["Project","A self-contained workspace in Claude with its own chats, instructions and knowledge files, for related or recurring work."],"project-instructions":["Project instructions","Standing rules for how Claude should work in every chat inside one Project."],"project-knowledge":["Project knowledge","Reference files added to a Project so every chat in it can draw on the same material."],"research-feature":["Research","A Claude capability that searches across many sources over several steps, pulls the findings together and cites where each came from."],"model":["Model","The underlying AI that does the work. Different models trade capability against speed and cost."],"haiku":["Haiku","Claude's fastest, most economical model family. Suited to clear, high-volume work."],"sonnet":["Sonnet","Claude's balanced model family: capable, reasonably fast and cost-efficient for most professional work."],"opus":["Opus","Claude's most capable of the three families covered by the exam. Suited to difficult reasoning where a better answer is worth extra cost and time."],"latency":["Latency","How long you wait for a response."],"service-requirement":["Service requirement","What a piece of work must achieve to be acceptable: minimum quality, turnaround time, volume, and what happens if an error gets through."],"acceptance-criteria":["Acceptance criteria","Measurable conditions an output must meet, set before any models are compared."],"total-cost":["Total cost","Model usage cost plus reviewer time, rework, delay and the impact of errors that get past review."],"pilot":["Pilot","A small, controlled trial on realistic work, used to gather evidence before a wider rollout."],"blind-comparison":["Blind comparison","Scoring outputs without knowing which model or method produced them, so expectations cannot sway the result."],"escalation-threshold":["Escalation threshold","A clear, observable condition that sends a case to a stronger model or a person. 'Any privileged access request' is a threshold. 'If it seems hard' is not."],"handoff-summary":["Handoff summary","A short note carrying only what a new conversation needs: current task, authoritative facts, what not to use, and open questions."],"memory":["Memory","A Claude feature that remembers things about you across conversations to personalise responses. It is not an authoritative record of facts or approvals."],"data-minimisation":["Data minimisation","Keeping only the information that has a clear purpose, the right authorisation and a suitable place to live."],"use-case":["Use case","A defined piece of work that produces a useful result for a defined user."],"requirement":["Requirement","A condition, capability or constraint the work needs."],"ambiguity":["Ambiguity","Information that is missing, unclear or open to more than one reading."],"three-tests":["Feasible, valuable, permissible","The three tests a use case must pass. It can be done with the inputs available, it improves something that matters, and it is allowed under data, policy and authorisation rules."],"research-design":["Research design","The plan made before researching: the questions, the boundaries, which sources can support each claim, and how options will be compared."],"interested-party":["Interested-party claim","A claim from someone who benefits from the outcome, such as a vendor's quote. Useful for follow-up, but not proof."],"evidence-ledger":["Evidence ledger","A table that keeps each claim with its evidence, source, uncertainty and what it means for the plan."],"scenario-planning":["Scenario planning","Working through what happens to the plan if a key assumption changes."],"decision-gate":["Decision gate","A point where an authorised person approves, defers or rejects before money or commitments follow."],"process":["Process","The repeatable sequence of people, information, decisions and tools that produces an outcome."],"current-state":["Current-state map","A record of how the process really runs today: trigger, steps, handoffs, systems, waiting, exceptions and outcome."],"friction":["Friction","Effort, delay, confusion or failure that makes a process harder to complete."],"rework":["Rework","Work done again because the first version was incomplete, inconsistent or unsuitable for its next use."],"baseline":["Baseline","A measurement taken before a change, so the result afterwards can be compared like with like."],"augmentation":["Augmentation","Using a tool to help a person do judgement-based work. The person still does the work and owns the result."],"automation":["Automation","Having a system carry out a repeatable action with little human involvement."],"solution-boundary":["Solution boundary","A statement of what a workflow owns and what stays outside it: the input, the output, the reviewer and the decisions it must not make."],"schema":["Schema","The required structure for each result, such as a fixed set of fields. It makes output easy to check, route and compare."],"fallback":["Fallback","What happens when the normal route fails, such as a manual template the person uses instead."],"prompt-injection":["Prompt injection","Text inside the material being processed that tries to give Claude new instructions, such as 'ignore the categories'. It should be treated as data."],"controlled-revision":["Controlled revision","Changing one component, keeping everything else the same, and rerunning the same test so you can see what the change did."],"redesign":["Redesign","Changing the process itself because Claude makes a different approach practical, such as self-service for routine questions."],"residual-risk":["Residual risk","What can still go wrong after the controls are in place."],"value-case":["Value case","The argument for a change: baseline, expected improvement, implementation cost, residual risk and when results will be reviewed."],"project-boundary":["Project boundary","What a Project is for and what it is not: its purpose, users, accepted inputs, expected outputs and exclusions."],"fresh-chat":["Fresh-chat test","Running a known test in a new chat inside the Project. With no conversation history to lean on, it shows whether the saved instructions and knowledge are enough."],"source-authority":["Source authority rule","An instruction that says which document controls when sources disagree, such as 'follow the approved standard, treat drafts as non-authoritative'."],"escalation":["Escalation","Sending a matter to the person authorised to decide it. Not a vague 'someone should review this'."],"curation":["Curation","Deciding what belongs in a knowledge collection, what does not, and who maintains it."],"source-inventory":["Source inventory","A list of the available documents with the decision made about each: retain, label, replace, exclude or assign for review."],"canonical":["Canonical file","The single copy kept as the reference version. Duplicates are removed so they cannot drift or compete."],"retrieval":["Retrieval","Claude pulling the relevant parts of a larger knowledge set into its answer. It finds material. It does not decide which document is the authority."],"connector":["Connector","A link between Claude and an outside service you have authorised, such as a document store or mailbox, so Claude can work with current records there."],"snapshot":["Snapshot","A fixed copy of a file as it was when uploaded. It does not change when the original does."],"effective-permissions":["Effective permissions","What Claude can actually reach: the narrowest limit set by the source system, the connector's authorisation, your organisation's controls and what the product supports."],"least-privilege":["Least privilege","Granting only the access a legitimate task needs. A connector that reads documents does not need permission to edit them."],"config-register":["Configuration register","A maintained record of what a Project depends on, who owns each item, its version and when it is next reviewed."],"change-trigger":["Change trigger","An event that should prompt a review: a scheduled date, a policy revision, a product release, a recurring error, a replaced source, a team change or a permission change."],"regression":["Regression test","A saved input with its expected behaviour, rerun after every change to check that something which used to work still does."],"safeguard":["Safeguard","An operational control that limits what Claude receives, what it can produce and what happens next."],"classification":["Data classification","An organisation's label for a piece of information that sets who may see it, where it may be stored and whether it may be used with an AI tool."],"quasi-identifier":["Quasi-identifier","A detail that does not identify a person alone but can in combination, such as site, job title and start month."],"re-identification":["Re-identification","Working out who a record is about by combining the fields that remain with other information."],"redaction":["Redaction","Removing or masking specific content, such as an email address. Other identifying combinations can remain."],"anonymisation":["Anonymisation","Changing data so that identifying a person is no longer reasonably possible. Deleting names is rarely enough."],"aggregation":["Aggregation","Combining individual records into group totals, such as tickets per month by category."],"synthetic-data":["Synthetic data","Artificially generated data that resembles real data. Useful for testing and demos. It may not reproduce real results."],"governance":["AI governance","The organisation's framework for who may use AI, with what data, for which purposes and under which controls."],"exception-approval":["Exception approval","A formal, written decision by the authorised approver to depart from a control, made before the activity happens."],"automation-bias":["Automation bias","The tendency to accept a system's output because it looks systematic, polished or numerical."],"transparency":["Transparency","Telling people when AI materially affected what they received, how they were assessed or how they can respond."],"contestability":["Contestability","A practical route for a person to point out an error or challenge the process: what can be corrected, how to raise it, who reviews it and what they can change."],"symptom":["Symptom","The observable thing that is wrong with an output, stated before any cause is assumed."],"context-overload":["Context overload","Too much unrelated or duplicated material in front of Claude, crowding out the evidence that matters."],"effectiveness":["Effectiveness","Whether a workflow reliably produces output that serves its purpose, is supported by evidence and gets the review it needs."],"efficiency":["Efficiency","Reaching that result with less unnecessary time, cost, duplication and human effort."],"correction-rate":["Correction rate","The share of outputs that need a substantive fix."],"review-burden":["Review burden","The time reviewers spend checking routine work, as opposed to handling real exceptions."],"batching":["Batching","Processing several similar, low-risk inputs together under the same rules."],"input-template":["Input template","A fixed set of fields that people fill in before material reaches Claude. It makes gaps visible and inputs consistent."]},"content":{"1":{"lead":"A prompt is a work order. Claude does the job described, using the facts supplied. Whatever you leave out, it fills with something that sounds reasonable.","html":"<h2>Why a short request goes wrong<\/h2>\n<p>Most requests start as one line: \"Write a stakeholder update.\" That names an activity. It does not say what happened, who will read it, which facts are the approved ones, or what to do when a detail is missing.<\/p>\n<p>Claude does not know your environment. Given a gap, it will usually write something plausible to fill it, and the result reads just as smoothly as the parts that are true. That is how a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"hallucination\">hallucination<\/span> ends up in a customer email.<\/p>\n<p class=\"pull\">A polished sentence does not make an unsupported claim reliable.<\/p>\n<p>An effective <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"prompt\">prompt<\/span> is not a test of whether Claude can guess your business facts. It is a set of directions that turns a general request into a bounded task, with enough information to do the job and nothing extra.<\/p>\n<h2>The six parts of a prompt<\/h2>\n<dl class=\"defs\"><div><dt>Objective<\/dt><dd>The piece of work to produce. \"Draft a status update on the November patch cycle.\" <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"objective\">What counts as an objective?<\/span><\/dd><\/div><div><dt>Relevant context<\/dt><dd>The project and setting that give the work meaning. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"context\">More on context.<\/span><\/dd><\/div><div><dt>Authoritative inputs<\/dt><dd>The facts Claude may use as evidence. They are <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"authoritative\">authoritative input<\/span> because your prompt says they are.<\/dd><\/div><div><dt>Audience<\/dt><dd>Who will read it. The <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"audience\">audience<\/span> decides vocabulary, detail and tone.<\/dd><\/div><div><dt>Constraints<\/dt><dd>The boundaries: what must not be claimed, what to do with a gap, which terms to use. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"constraint\">See constraint.<\/span><\/dd><\/div><div><dt>Output format<\/dt><dd>The layout you want back: headings, a table, a length. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"format\">See output format.<\/span><\/dd><\/div><\/dl>\n<p>These do different jobs, and the exam likes to check that you can tell them apart. An audience is not a format. Asking for a heading called \"Training\" does not give Claude any facts to put under it.<\/p>\n<h2>Worked example: the patching update<\/h2>\n<p>You run the monthly patch cycle for a customer and need to send a routine update. The change manager has approved this status record.<\/p>\n<figure class=\"doc\"><figcaption>Approved status record<\/figcaption><pre>Patch cycle status record: November\nApproved by the change manager\n\nCompleted\n- 42 of 46 Windows servers patched and rebooted.\n- Post-patch service checks passed on all 42.\n\nChanged\n- The remaining 4 servers moved to Sunday 02:00 to 04:00.\n- The original window for all 46 was Saturday 22:00 to 02:00.\n\nUnchanged\n- The patch compliance report is still due to the customer on Wednesday.\n\nAsked about, nothing recorded\n- No reason for moving the 4 servers is recorded.\n- No owner for the Sunday window is recorded.<\/pre><\/figure>\n<p>Here is the one-line version of the request, and what comes back.<\/p>\n<figure class=\"prompt\"><figcaption><span>First attempt<\/span><\/figcaption><pre>Write a stakeholder update about this month's patching.<\/pre><\/figure>\n<figure class=\"out bad\"><figcaption>What Claude returned<\/figcaption><pre>Patching update\n\nPatching is progressing well. Four servers were deferred <mark>due to application compatibility issues<\/mark> and <mark>will be completed by the application team<\/mark> on Sunday. <mark>No customer impact is expected.<\/mark><\/pre><div class=\"mk\">Highlighted text is not in the source.<\/div><\/figure>\n<p>It reads fine. Three things in it are not in the record: a cause for the deferral, a team that will do the work, and a statement about customer impact. The record says plainly that no reason and no owner were recorded. Claude was never told to respect that.<\/p>\n<p>Now the same request with all six parts.<\/p>\n<figure class=\"prompt\"><figcaption><span>Rebuilt prompt<\/span><\/figcaption><pre>Objective\nDraft a stakeholder update on the November patch cycle.\n\nAudience\nThe customer's service owner and their department leads. Not technical.\n\nSource facts\nUse only the status record below as the factual basis.\n\n[paste the approved status record here]\n\nRequirements\n- Use these headings: Completed, Changed, Unchanged, Not yet known.\n- State that 42 of 46 servers are patched and passed service checks.\n- State that the remaining 4 moved from the Saturday window to\n  Sunday 02:00 to 04:00.\n- State that the compliance report is still due on Wednesday.\n- Under Not yet known, say that no reason for the move and no owner\n  for the Sunday window were recorded.\n- Do not add causes, owners, impact statements, dates or next steps\n  that are not in the record.\n- Plain, factual tone for a routine email. No acronyms.\n- Keep it in proportion to the record. Do not pad it.<\/pre><\/figure>\n<p>Each line fixes one weakness. The objective names the deliverable. The audience line stops a technical write-up. \"Use only the status record\" sets the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"evidence-boundary\">evidence boundary<\/span>. The headings make coverage visible at a glance. The \"do not add\" line blocks the usual inventions, and the \"Not yet known\" instruction gives Claude an acceptable thing to do with the gap.<\/p>\n<h2>Three habits that carry over to every prompt<\/h2>\n<ol class=\"steps\"><li><b>Label the evidence<\/b><span>Put source facts in a clearly marked block or attachment and write your instructions outside it. Claude can then tell evidence from directions, and a reviewer can trace each statement back.<\/span><\/li><li><b>Say what to do with a gap<\/b><span>Tell Claude how to handle missing information: name it as not supplied and do not speculate. Asking about a topic does not authorise Claude to make up facts about it.<\/span><\/li><li><b>Make success checkable<\/b><span>Swap words like \"high quality\" or \"executive-ready\" for an <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"observable\">observable requirement<\/span>: which sections, what tone, how long. \"Short enough for a routine email\" is useful. An exact word count can cause padding or cuts.<\/span><\/li><\/ol>\n<h2>Using examples without boxing Claude in<\/h2>\n<p>An example helps when a structure or style is hard to describe. A short sample of the heading pattern is quicker than a paragraph explaining it. The risk is a long, detailed example: Claude may copy its wording, order and length instead of adapting to your facts. Use an example to show the form. Do not use it to sneak in content that is missing from the source.<\/p>\n<h2>Mistakes the exam expects you to spot<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Mistake<\/th><th>What it looks like<\/th><th>Fix<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Mistake\">Hidden assumptions<\/td><td data-l=\"What it looks like\">Expecting Claude to know a fact you did not state<\/td><td data-l=\"Fix\">State every fact that affects the task<\/td><\/tr><tr><td data-l=\"Mistake\">Conflicting directions<\/td><td data-l=\"What it looks like\">\"Keep it brief\" and \"include every detail\"<\/td><td data-l=\"Fix\">Say which one wins, or ask for two outputs<\/td><\/tr><tr><td data-l=\"Mistake\">Undefined acronyms<\/td><td data-l=\"What it looks like\">OTIF, CAB, RTO with a mixed audience<\/td><td data-l=\"Fix\">Spell it out on first use<\/td><\/tr><tr><td data-l=\"Mistake\">Vague quality words<\/td><td data-l=\"What it looks like\">\"Make it executive-ready\"<\/td><td data-l=\"Fix\">Replace with checkable tone, scope and structure<\/td><\/tr><tr><td data-l=\"Mistake\">Completing an incomplete record<\/td><td data-l=\"What it looks like\">Asking for a section the source has no facts for<\/td><td data-l=\"Fix\">Tell Claude to label the unknown<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Technical prompts: same rules, tighter boundary<\/h2>\n<p>For troubleshooting, the evidence boundary needs more care, because a guess that gets written down as fact sends everyone in the wrong direction. Give Claude the affected service, what was observed, what changed recently, which logs exist and how a fix would be verified. Then keep three things apart: what was seen, what might explain it, and how to check.<\/p>\n<figure class=\"prompt\"><figcaption><span>Troubleshooting prompt<\/span><\/figcaption><pre>Using only the information below, write a troubleshooting note.\n\nObservations\nAfter Tuesday's patch reboot, the print spooler service on one print\nserver stops within two minutes of starting. No event logs supplied yet.\n\nHypotheses\nA printer driver updated by the patch is crashing the spooler.\nA stuck job in the spool folder is crashing the spooler.\n\nVerification steps\nCheck the System and Application event logs for spooler crash entries.\nCheck the spool folder for old jobs.\n\nKeep observations, hypotheses and verification steps under separate\nheadings. Do not state a root cause.<\/pre><\/figure>\n<p>This stops a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"hypothesis\">hypothesis<\/span> being promoted to a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"root-cause\">root cause<\/span> before anything supports it. It is the same discipline as the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"diagnostic-loop\">diagnostic loop<\/span>: collect evidence first, reason second.<\/p>","takeaways":["State the objective, context, authoritative inputs, audience, constraints and output format.","Keep source facts in a labelled block, separate from your instructions.","Tell Claude what to do when information is missing. Never leave it to fill the gap.","Write requirements a reviewer can check, in place of words like \"good\" or \"polished\"."],"practice":"Find a real request you sent to an AI tool this week. Mark which of the six parts it had. Rewrite it with all six and run both versions. Compare what each one made up.","deck":"decks/01-building-effective-prompts.html","quiz":[{"q":"A service desk lead prompts Claude: \"Summarise the outage for the customer.\" The summary states a root cause that appears nowhere in the incident notes. Which change most directly prevents this?","multi":false,"o":[{"t":"Add \"be accurate and professional\" to the prompt.","ok":false,"why":"These are vague quality words. They give Claude nothing to check against and do not set a limit on what it may claim."},{"t":"Paste the incident notes as a labelled source, tell Claude to use only those notes, and tell it to say when a detail was not supplied.","ok":true,"why":"This sets the evidence boundary and gives Claude an acceptable way to handle the gap, so it has no reason to invent a cause."},{"t":"Ask for a longer, more detailed summary.","ok":false,"why":"More length does not add evidence. It usually gives Claude more room to fill with plausible material."},{"t":"Ask Claude to draw on what usually causes outages like this.","ok":false,"why":"This invites exactly the problem. A typical cause is not this incident's cause."}]},{"q":"Which option correctly separates audience from output format?","multi":false,"o":[{"t":"Audience: three short headed paragraphs. Format: professional.","ok":false,"why":"Headed paragraphs describe layout, which is format. \"Professional\" is tone."},{"t":"Audience: department leads with no technical background. Format: three short headed paragraphs.","ok":true,"why":"Audience is who reads it. Format is the shape of what they receive. Each is in the right place here."},{"t":"Audience: the November patch cycle. Format: an update.","ok":false,"why":"The patch cycle is the subject, and \"an update\" is the objective. Neither names a reader or a layout."},{"t":"Audience: use only the status record. Format: no acronyms.","ok":false,"why":"\"Use only the status record\" sets the authoritative input, and \"no acronyms\" is a constraint."}]},{"q":"A prompt says \"Keep it brief\" and also \"Include every detail from the log\". Which TWO changes properly resolve the conflict?","multi":true,"o":[{"t":"State the priority: \"Keep it brief. If something has to go, keep changes and risks.\"","ok":true,"why":"Telling Claude which instruction wins removes the conflict and makes the trade-off yours, not its guess."},{"t":"Leave both in and trust Claude to find a balance.","ok":false,"why":"Claude will pick a balance, but you will not know which details it dropped or why."},{"t":"Ask for two outputs: a short summary, plus the full detail as an appendix.","ok":true,"why":"Splitting the deliverable lets both needs be met without either instruction undercutting the other."},{"t":"Add \"use your best judgement\".","ok":false,"why":"This restates the problem. The conflict is still there and the priority is still unstated."}]},{"q":"Stakeholders asked for a Training section in a project update. The approved source record contains no training schedule, owner or dates. What is the best instruction to give Claude?","multi":false,"o":[{"t":"\"Estimate likely training dates based on the pilot date.\"","ok":false,"why":"An estimate presented in a status update reads as a commitment. Nothing in the record supports it."},{"t":"\"Leave the Training section out.\"","ok":false,"why":"Stakeholders asked about it. Dropping it silently hides the gap instead of reporting it."},{"t":"\"Under Training, state that no schedule, owner or dates were supplied.\"","ok":true,"why":"The update stays useful and honest. It reports the gap without presenting a guess as a project fact."},{"t":"\"Write a short paragraph on why training matters.\"","ok":false,"why":"Filler makes the section look complete while saying nothing about the actual status."}]},{"q":"An engineer tells Claude that a web service returns HTTP 502 after a configuration change. No logs are available yet. Which prompt design is strongest?","multi":false,"o":[{"t":"Ask for the single most likely root cause, stated confidently so the team can act.","ok":false,"why":"With no logs there is no evidence for a root cause. Confidence in the wording does not make it one."},{"t":"Paste a root cause analysis from a different incident as a template to follow.","ok":false,"why":"A detailed example from another incident tends to bring its content along, not only its layout."},{"t":"Ask Claude to review the logs and report what it finds.","ok":false,"why":"No logs were supplied. Claude cannot inspect what it was not given, and may describe log entries that do not exist."},{"t":"Have Claude keep observations, hypotheses and verification steps under separate headings, and tell it not to state a root cause.","ok":true,"why":"This keeps what was seen apart from what might explain it, and gives the team checks to run before anyone commits to a cause."}]}]},"2":{"lead":"Some jobs are one prompt. Others are a pipeline. The skill is knowing which one you are holding, and where a person needs to look before the next stage runs.","html":"<h2>One step, or several?<\/h2>\n<p>A one-step task has a clear input, one transformation and a limited output: rewrite this paragraph, pull the action items out of this transcript, summarise this one approved report. Claude can do these in a single request because there is little to depend on and you can check the result directly.<\/p>\n<p>A complex task combines several sources, decisions, audiences or deliverables. Asking for the finished thing in one large <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"one-shot\">one-shot prompt<\/span> causes three problems. Missing inputs stay hidden. The output is long and hard to inspect. And an early mistake gets built on, so the final document sounds complete while resting on something nobody checked.<\/p>\n<p class=\"pull\">Later work should build on checked results, not on guesses.<\/p>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"decomposition\">Decomposition<\/span> splits the job into stages, each with a defined result. It makes every <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"dependency\">dependency<\/span> visible: facts are extracted before they are analysed, analysis is checked before it supports a recommendation, and a draft is approved before it is formatted and sent.<\/p>\n<h2>Worked example: the monthly service report<\/h2>\n<p>You need a monthly report for a customer covering three environments: Production, UAT and DR. You have a compliance export, an incident list and engineer notes. The export is the authority for numbers. The incident list is the authority for what was logged. The notes are context, and only as written. None of them lets Claude infer a cause, an owner or a commitment that is not on the page.<\/p>\n<figure class=\"doc\"><figcaption>Source material<\/figcaption><pre>Patch compliance export (validated by the reporting team)\nProduction: 118 servers, 112 compliant (94.9%), 3 reboots pending\nUAT:         34 servers,  34 compliant (100%),  0 reboots pending\nDR:          22 servers,  17 compliant (77.3%), 5 reboots pending\n\nIncident list\nProduction: Backup job overran into business hours on 12 November.\nDR:         Replication paused for 9 hours on 19 November.\n\nEngineer notes\nProduction: Backup window extended by one hour from 14 November.\nUAT:        Refresh from production completed on schedule.\nDR:         Replication resumed the same day.<\/pre><\/figure>\n<h2>What the one-shot version does<\/h2>\n<figure class=\"prompt\"><figcaption><span>One-shot prompt<\/span><\/figcaption><pre>Using the compliance export, incident list and engineer notes, write a\nshort monthly service report for Production, UAT and DR. Cover patching,\nincidents and anything the customer should know.<\/pre><\/figure>\n<figure class=\"out bad\"><figcaption>What Claude returned<\/figcaption><pre>Monthly service report\n\nProduction is 94.9% patch compliant with 3 reboots pending. A backup job\noverran on 12 November and the backup window has since been extended.\n\nUAT is 100% compliant. The refresh from production completed on schedule.\n\nOverall the estate is in good health.<\/pre><\/figure>\n<p>DR is missing. It was the weakest environment, at 77.3% compliance with a nine-hour replication pause. Nothing in the report is false, so a quick read passes it. The closing line, \"in good health\", rests on two environments out of three.<\/p>\n<p>The prompt named DR. That was not enough, because the prompt gave Claude no separate moment to show that every environment and every source had been covered.<\/p>\n<h2>A pattern that works<\/h2>\n<ol class=\"steps\"><li><b>Clarify the objective<\/b><span>Who reads it, what it must cover, how long, what decision it supports.<\/span><\/li><li><b>Inventory the inputs<\/b><span>List every environment, source type and missing item. This is the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"inventory\">input inventory<\/span>.<\/span><\/li><li><b>Extract the facts<\/b><span>A structured record of figures and events. No interpretation yet.<\/span><\/li><li><b>Check completeness<\/b><span>Compare the record with the inventory before any analysis. The <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"completeness-check\">completeness check<\/span>.<\/span><\/li><li><b>Analyse<\/b><span>Find the gaps and oddities, working from the approved record.<\/span><\/li><li><b>Draft and validate<\/b><span>Write the narrative, then get its wording and emphasis approved.<\/span><\/li><li><b>Format<\/b><span>Apply the final layout only once the content is approved.<\/span><\/li><\/ol>\n<p>The stages can vary. What matters is that each one answers a single question and produces an <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"intermediate\">intermediate deliverable<\/span> somebody can check. The next stage receives that checked result. It does not go back and re-read the raw material mixed with earlier guesses.<\/p>\n<h2>The check that catches the omission<\/h2>\n<p>The fix for the missing environment is not a longer drafting prompt. It is a separate first step: have Claude build the inventory and check against it, and review that before anything else runs.<\/p>\n<figure class=\"out good\"><figcaption>Inventory and completeness check<\/figcaption><pre>Required environments: Production, UAT, DR\nRequired sources: compliance export, incident list, engineer notes\n\nProduction: export present, incident present, note present\nUAT:        export present, no incident entry supplied, note present\nDR:         export present, incident present, note present\n\nResult: all three environments and all three sources are represented.\nThe missing UAT incident entry must not be reported as \"no incidents\nin UAT\". It means none was supplied.<\/pre><\/figure>\n<p>DR is now flagged as required before a word of the report is written. The check also handles a quieter trap. No UAT incident was supplied, but that does not prove UAT had no incidents. \"None supplied\" and \"none occurred\" are different claims, and only the first is supported.<\/p>\n<aside class=\"note\"><b>Watch for this one<\/b><p>The exam likes the difference between missing evidence and evidence of nothing. If a source has no entry for something, the safe statement is that no entry was supplied.<\/p><\/aside>\n<h2>Human gates<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"human-gate\">human gate<\/span> is not just another prompt. It is a point where a person decides whether Claude should carry on. Put one where:<\/p>\n<ul><li>validated figures are about to feed the next stage,<\/li><li>a business decision changes what the message should say,<\/li><li>approval decides whether the content may go out at all.<\/li><\/ul>\n<p>Claude can organise and compare what you give it. It cannot grant your organisation's approval. And when Claude proposes a plan, that plan is a proposal. It is worth asking for when the route is unclear, but check that it covers every environment, every source, a completeness check and an approval stop before you let it run.<\/p>\n<figure class=\"prompt\"><figcaption><span>Staged workflow<\/span><\/figcaption><pre>1. List the required environments and source types.\n2. Extract only the supplied figures, incidents and notes, by environment.\n3. Check the extraction against the list. Stop for my review.\n4. After I approve, identify compliance gaps and anything unusual.\n5. Draft the report narrative using only the approved extraction\n   and analysis.\n6. Stop for the service manager's approval of the narrative.\n7. After approval, format the final report with a section for each\n   environment.<\/pre><\/figure>\n<p>The first gate comes after extraction and the completeness check. The reporting team validated the export, but you still confirm the extracted values match it before they drive the analysis. The second gate comes after drafting, when the service manager decides whether the emphasis is right for the customer.<\/p>\n<p>Once both gates are passed, formatting is low risk. Claude can put the approved text into headings or a template. Formatting is not a chance to add new analysis, commitments or explanations.<\/p>","takeaways":["Use one prompt for a clear, limited transformation you can check directly.","For anything with several sources or sign-offs, start with an inventory and a completeness check.","Analysis and drafting should run on approved intermediate results.","Stop for a person wherever validation, a business decision or approval changes what happens next."],"practice":"Pick a report or handover you produce regularly. Write its inventory: every item it must cover and every source it draws on. Then mark where a person has to approve something before the next step.","deck":"decks/02-decomposing-complex-tasks.html","quiz":[{"q":"Which task is the best fit for a single prompt?","multi":false,"o":[{"t":"A quarterly report drawn from five sources that needs finance sign-off.","ok":false,"why":"Several sources and an approval step mean dependencies and a gate. That calls for stages."},{"t":"Rewriting one supplied paragraph in plain language.","ok":true,"why":"One input, one transformation, a short output you can check directly."},{"t":"A migration recommendation comparing three options for two audiences.","ok":false,"why":"Multiple options and audiences mean separate analysis and drafting work, each worth checking."},{"t":"A root cause report built from logs, a timeline and three engineers' notes.","ok":false,"why":"The facts need extracting and checking before anyone reasons about cause."}]},{"q":"An analyst sends every source in one prompt and gets a well-written report covering two of three regions. Nothing in it is false. What would have exposed the problem earliest?","multi":false,"o":[{"t":"Asking for a more polished draft.","ok":false,"why":"Polish improves wording. It does not show whether everything was covered."},{"t":"Raising the word limit.","ok":false,"why":"A longer report can leave out the same region."},{"t":"An input inventory and completeness check before any analysis.","ok":true,"why":"Listing the required regions and sources first, then checking against that list, flags the missing region before a narrative exists to hide it."},{"t":"Proofreading the report for tone.","ok":false,"why":"Tone review looks at how it reads, not at what is absent."}]},{"q":"The incident list has no entry for the UAT environment. Which statement can the report safely make?","multi":false,"o":[{"t":"\"UAT had no incidents this month.\"","ok":false,"why":"The source does not say that. A missing entry is not proof that nothing happened."},{"t":"\"UAT incidents were minor and resolved.\"","ok":false,"why":"This invents incidents and an outcome. Neither is in the material."},{"t":"\"No incident entry was supplied for UAT.\"","ok":true,"why":"It reports exactly what the evidence shows and leaves the open question visible."},{"t":"\"UAT is the most stable environment.\"","ok":false,"why":"That is a conclusion drawn from an absence of data, not from data."}]},{"q":"In a staged reporting workflow, which TWO points most need a human gate?","multi":true,"o":[{"t":"After extraction and the completeness check, before the figures feed the analysis.","ok":true,"why":"Everything after this depends on those figures. An error here is carried into every later stage."},{"t":"After the narrative is drafted, before it is formatted and sent.","ok":true,"why":"Wording and emphasis for a customer are a business decision. Someone accountable has to approve them."},{"t":"Only at the very end, once the report is formatted.","ok":false,"why":"By then any early mistake is built into the whole document and expensive to unpick."},{"t":"None. Claude proposed the plan, so it can run through.","ok":false,"why":"A plan is a proposal for work. It is not evidence the work was done correctly, and Claude cannot grant approval."}]},{"q":"You ask Claude how to approach a large task and it returns a tidy seven-step plan. What should you do next?","multi":false,"o":[{"t":"Run it. A detailed plan shows the result will be correct.","ok":false,"why":"A plan describes intended work. It says nothing yet about whether the work is right."},{"t":"Check the plan covers every required item and source, includes a completeness check and stops for approval, then authorise it.","ok":true,"why":"Reviewing stages, inputs and gates before execution is how you catch a gap while it is still cheap to fix."},{"t":"Remove the review stops so it finishes faster.","ok":false,"why":"The stops are where errors get caught. Removing them brings back the one-shot failure."},{"t":"Ask for a longer plan with more steps.","ok":false,"why":"More steps do not make a plan more complete. Coverage and gates do."}]}]},"3":{"lead":"The first response is a draft to inspect. Work out what is actually wrong with it before you change a word of the prompt.","html":"<h2>Prompting is a feedback loop<\/h2>\n<p>A useful piece of work with Claude often takes more than one request. The first response gives you something concrete to assess. It is not a reason to bin the task and start again.<\/p>\n<ol class=\"steps\"><li><b>Request<\/b><span>Ask for a draft.<\/span><\/li><li><b>Inspect<\/b><span>Read it against the task and the source.<\/span><\/li><li><b>Diagnose<\/b><span>Name the main weakness.<\/span><\/li><li><b>Revise<\/b><span>Change the instruction to address that weakness.<\/span><\/li><li><b>Compare<\/b><span>Check the new version against the old one and your criteria.<\/span><\/li><\/ol>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"iteration\">Iteration<\/span> does not mean piling on instructions until the answer looks longer or shinier. Each revision should address a gap you observed. That protects the parts that already work, makes changes easy to review, and lowers the chance that a sweeping new request brings in unsupported content or drops a requirement.<\/p>\n<p class=\"pull\">Diagnose the output before you decide how to revise the prompt.<\/p>\n<p>It also leaves a trail. You can say why each change was asked for and whether it worked. That matters most when the result is going to a customer.<\/p>\n<h2>Worked example: the access notice<\/h2>\n<p>You need to turn an approved internal procedure into a short notice for a customer's application teams. The notice must not change approved facts, must not suggest an exception is automatic, and must not present a discretionary review as a guaranteed service.<\/p>\n<figure class=\"doc\"><figcaption>Approved procedure<\/figcaption><pre>Approved procedure: requesting privileged server access\n\n1. Requests for privileged access must be raised through the access portal.\n2. Requests sent by email or chat will not be actioned.\n3. If the portal is unavailable, an engineer may request emergency\n   access by phoning the service desk.\n4. The duty manager may review the stated reason when considering an\n   emergency request. Approval is discretionary.<\/pre><\/figure>\n<p>A request for plain language is fine. Plain language still has to keep four different things apart: a mandatory rule, a consequence, a route that is available, and a decision somebody may or may not make in your favour.<\/p>\n<figure class=\"prompt\"><figcaption><span>First prompt<\/span><\/figcaption><pre>Write a short, plain-language notice for application teams, based only\non the approved procedure. Professional, helpful tone.<\/pre><\/figure>\n<figure class=\"out \"><figcaption>First draft<\/figcaption><pre>Raise privileged access requests through the access portal. Requests\nsent by email or chat will not be actioned.<\/pre><\/figure>\n<h2>Diagnose the actual defect<\/h2>\n<p>The draft is short, professional and fully supported by the procedure. Its <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"defect\">defect<\/span> is completeness. It leaves out the emergency route, so an engineer facing a portal outage gets no hint that there is another way.<\/p>\n<p>Before editing, classify the problem. The type tells you the fix.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Defect type<\/th><th>How you recognise it<\/th><th>What fixes it<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Defect type\">Missing context<\/td><td data-l=\"How you recognise it\">Claude lacked background it needed<\/td><td data-l=\"What fixes it\">Supply the background<\/td><\/tr><tr><td data-l=\"Defect type\">Unclear success criteria<\/td><td data-l=\"How you recognise it\">The draft is reasonable but not what you wanted<\/td><td data-l=\"What fixes it\">State checkable requirements<\/td><\/tr><tr><td data-l=\"Defect type\">Wrong format<\/td><td data-l=\"How you recognise it\">Right content, wrong shape<\/td><td data-l=\"What fixes it\">Specify the layout<\/td><\/tr><tr><td data-l=\"Defect type\">Wrong tone<\/td><td data-l=\"How you recognise it\">Right content, wrong voice for the reader<\/td><td data-l=\"What fixes it\">Name the audience and tone<\/td><\/tr><tr><td data-l=\"Defect type\">Unsupported claims<\/td><td data-l=\"How you recognise it\">Statements with no basis in the source<\/td><td data-l=\"What fixes it\">Restate the evidence boundary<\/td><\/tr><tr><td data-l=\"Defect type\">Knowledge gap<\/td><td data-l=\"How you recognise it\">The source does not contain the answer<\/td><td data-l=\"What fixes it\">Get the fact from whoever owns it<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"knowledge-gap\">knowledge gap<\/span> is the one people misdiagnose. If the material you supplied does not contain the answer, asking Claude to be more detailed or more creative cannot produce it. It can only produce a guess.<\/p>\n<p>Here the source does contain the missing fact. So this is not a knowledge gap, and it is not tone or format either. The first prompt simply never required every material point to be covered.<\/p>\n<aside class=\"note\"><b>Diagnosis first<\/b><p>Do not fix a completeness problem by adding unrelated requests about style, length or creativity.<\/p><\/aside>\n<p>Good feedback names the weak area and the change you want: \"Separate the mandatory rule from the discretionary review.\" Feedback like \"Make it better\" gives no standard. Claude may change wording, length or tone and leave the real problem untouched.<\/p>\n<h2>Revise one thing at a time<\/h2>\n<p>The conversation already holds the procedure and a sound first draft, so a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"follow-up\">follow-up prompt<\/span> is the efficient move. Say what to keep, then state the one change.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revision 1: fix completeness<\/span><\/figcaption><pre>Keep the tone and the two accurate statements. Add that if the portal\nis unavailable, an engineer may request emergency access by phoning the\nservice desk. Do not imply that a request will be approved.<\/pre><\/figure>\n<figure class=\"out \"><figcaption>Second draft<\/figcaption><pre>Raise privileged access requests through the access portal. Requests\nsent by email or chat will not be actioned. If the portal is unavailable,\nyou may request emergency access by phoning the service desk.<\/pre><\/figure>\n<p>The exception is in, and the rule and consequence are unchanged. The next weakness is clarity for the audience: \"actioned\" is service-desk language.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revision 2: fix clarity<\/span><\/figcaption><pre>Keep every fact in the current draft. Make it clearer for readers\noutside IT: use short sentences and say \"will not be processed\" in\nplace of \"will not be actioned\". Do not add any new facts.<\/pre><\/figure>\n<p>One problem remains. The procedure says the duty manager <em>may<\/em> review the reason and that approval is discretionary. The notice must not turn that into a promise.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revision 3: separate the rule from the discretion<\/span><\/figcaption><pre>Keep the current wording and all approved facts. Use two headings to\nseparate the standard rule from emergency requests. State that the duty\nmanager may review the stated reason and that approval is discretionary.\nDo not add eligibility criteria.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>Final draft<\/figcaption><pre>How to request privileged access\n\nRaise your request through the access portal. Requests sent by email\nor chat will not be processed.\n\nIf the portal is unavailable\n\nYou may request emergency access by phoning the service desk. The duty\nmanager may review the reason you give. Approval is discretionary.
