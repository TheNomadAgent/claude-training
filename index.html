first for a duplicate or old file you missed. Make the narrowest correction and rerun the same test. Do not add more documents.<\/p>\n<p>Supported file types, knowledge capacity, how retrieval behaves and plan limits all change. Check Anthropic's current documentation for your plan before designing a large collection or depending on a file format. Those details affect how you implement this. They do not change the need for source authority and upkeep.<\/p>","takeaways":["Curate, do not accumulate. Relevant, authoritative, current sources beat a large unreviewed pile.","Check each source for purpose, authority, currency, completeness, sensitivity, ownership and update frequency.","Remove obsolete versions, drafts, informal notes and duplicates that should not guide answers.","Give each retained source a clear name, an owner and a review date.","Test with a fact that differs between versions and confirm the approved source wins."],"practice":"Open a shared folder your team treats as reference material. List six files and give each one of the five actions: retain, label, replace, exclude or assign for review. Note any with no clear owner.","deck":"decks/22-managing-uploaded-knowledge.html","quiz":[{"q":"A Project's knowledge contains an approved standard, an obsolete version and an unsigned draft, each giving a different deadline. What should the knowledge owner do before anyone uses it?","multi":false,"o":[{"t":"Leave all three so Claude has more to work with.","ok":false,"why":"More conflicting material makes a simple question harder to answer reliably."},{"t":"Resolve the conflict: keep the approved standard and exclude the others.","ok":true,"why":"Sources that should not guide answers are removed before Claude is asked to use them."},{"t":"Tell Claude to use the newest file.","ok":false,"why":"Newest is not approved. The newest here is an unsigned draft."},{"t":"Add a fourth document explaining the differences.","ok":false,"why":"That adds to the pile without removing the conflict."}]},{"q":"Two files in a Project contain identical content in different formats. What is the best action?","multi":false,"o":[{"t":"Keep both, as two sources are stronger than one.","ok":false,"why":"Identical copies are not independent evidence."},{"t":"Keep both and label one as a backup.","ok":false,"why":"The spare copy still competes in retrieval and doubles the upkeep."},{"t":"Keep one canonical file and exclude the other.","ok":true,"why":"One reference copy avoids competing targets and drift."},{"t":"Delete both and rely on memory.","ok":false,"why":"The Project still needs its authoritative source."}]},{"q":"Which file name is most useful to a future maintainer?","multi":false,"o":[{"t":"policy-final-new.pdf","ok":false,"why":"It says nothing about status, version or date."},{"t":"Patching (2).docx","ok":false,"why":"It gives no version, status or date."},{"t":"READ THIS ONE.pdf","ok":false,"why":"It asserts importance and explains nothing."},{"t":"Server Patching Standard_v4.1_Approved_2026-02-01.pdf","ok":true,"why":"It states the purpose, version, status and date."}]},{"q":"A document is current and authoritative, and it contains restricted personal information. Which criterion needs its own decision before uploading?","multi":false,"o":[{"t":"Sensitivity.","ok":true,"why":"Being useful and authoritative does not settle whether it is appropriate to make available in the Project."},{"t":"Currency.","ok":false,"why":"It is already current."},{"t":"Purpose.","ok":false,"why":"It may well serve the purpose. That is not the open question."},{"t":"File format.","ok":false,"why":"Format is an implementation detail."}]},{"q":"After curating a knowledge set, which TWO steps make a good grounding test?","multi":true,"o":[{"t":"Ask a question whose answer differs between the versions.","ok":true,"why":"It will expose whether the wrong version is still influencing answers."},{"t":"Ask an easy question every version agrees on.","ok":false,"why":"Agreement tells you nothing about which source controlled."},{"t":"Ask Claude to state the version and date of the source it used.","ok":true,"why":"Seeing the source makes unsupported certainty easy to spot."},{"t":"Upload more documents first, to be safe.","ok":false,"why":"That reintroduces the risk curation removed."}]}]},"23":{"lead":"A connector lets Claude work with live records in another system. It does not hand over a master key. What Claude can reach is whatever every layer of permission allows, and no more.","html":"<h2>Current information has a boundary<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"connector\">connector<\/span> links Claude to an outside service that you or your organisation have authorised. Depending on the connector, the permissions available, organisational controls and what the product currently supports, Claude may be able to retrieve information, search records or carry out supported actions there. It is not general permission to read every record or change every item.<\/p>\n<p>An upload is different. It gives Claude a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"snapshot\">snapshot<\/span>: the file as it was when you supplied it.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>Upload<\/th><th>Connector<\/th><\/tr><\/thead><tbody><tr><td data-l=\"\">What Claude gets<\/td><td data-l=\"Upload\">A fixed copy<\/td><td data-l=\"Connector\">The current record in its home system<\/td><\/tr><tr><td data-l=\"\">Best when<\/td><td data-l=\"Upload\">An approved reference set must stay unchanged for the task<\/td><td data-l=\"Connector\">Information changes often, or the live record is the authority<\/td><\/tr><tr><td data-l=\"\">Main risk<\/td><td data-l=\"Upload\">The original changes and the copy does not<\/td><td data-l=\"Connector\">Pulling in more than the task needs, or the wrong record<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"pull\">Use the source that matches the decision: a fixed approved snapshot, or the current governed record.<\/p>\n<h2>Worked example: a migration brief from mixed sources<\/h2>\n<p>You are preparing an internal brief on a data centre migration. You have connectors to the document service and the mail service, and one uploaded PDF of governance rules. The brief must use the current approved plan and two named mail threads only. No action in any connected system is wanted.<\/p>\n<figure class=\"doc\"><figcaption>What is available<\/figcaption><pre>Uploaded file (fixed)\nChange Governance Rules v2.0, dated 10 February 2027\n- Only a Programme Office plan marked Approved sets the\n  migration schedule.\n- The commercial options record is not part of the migration\n  coordinator's approved reference set.\n\nDocument service (connector)\n- \"Data Centre Migration Plan\": updated 18 February, owned by the\n  Programme Office, status Approved. Cutover begins 7 March.\n  The service desk stays on the old site until 18 March.\n- \"Data Centre Migration Plan - Approved\": updated 9 January,\n  status Superseded. Cutover begins 1 March.\n- \"Commercial Options\": cannot be accessed.\n\nMail service (connector)\n- \"Migration: service desk cover\", 17 February: confirms service\n  desk cover on the old site until 18 March.\n- \"Migration: asset list\", 18 February: the asset list is due\n  before the 7 March cutover.\n- \"Team lunch Friday\": available and unrelated.<\/pre><\/figure>\n<h2>Choose deliberately<\/h2>\n<p>The governance PDF should stay an upload. It is a defined, approved reference whose job is to settle which source is the authority. It is not there to supply changing operational detail.<\/p>\n<p>The plan and the mail threads should come through connectors, because their current versions matter. If you uploaded a copy of the plan, a later update in the document service would not reach your analysis.<\/p>\n<p>That does not make every connected record relevant. Limit retrieval to the named document, the two named threads and the fields the brief needs. That is <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"data-minimisation\">data minimisation<\/span> applied to connectors.<\/p>\n<aside class=\"note\"><b>Identity before content<\/b><p>Check a record's title, update date, status, owner and scope before using what it says. A similar name does not make a record current. Here the document with \"Approved\" in its title is the superseded one.<\/p><\/aside>\n<h2>Permissions limit what Claude can do<\/h2>\n<p>What a connector can actually reach is the narrowest limit set by four things. These are the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"effective-permissions\">effective permissions<\/span>.<\/p>\n<ol class=\"steps\"><li><b>Source system permissions<\/b><span>What your account is allowed to see and do there.<\/span><\/li><li><b>Connector authorisation<\/b><span>What you granted when you connected it.<\/span><\/li><li><b>Organisational controls<\/b><span>What your administrators allow.<\/span><\/li><li><b>Product capability<\/b><span>What this connector supports right now.<\/span><\/li><\/ol>\n<p>If any one of those blocks access, Claude should not retrieve the material or look for a way round.<\/p>\n<p>So the inaccessible \"Commercial Options\" record is a known gap. It is not evidence about its contents. A sound brief says it could not be accessed and is outside the approved reference set. It does not guess at likely options, borrow from an obsolete file, or ask Claude to get past access controls.<\/p>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"least-privilege\">Least privilege<\/span> means granting only the access a legitimate task needs. A connector used to read plans does not need permission to edit them.<\/p>\n<aside class=\"note\"><b>Reading and acting are different<\/b><p>Before a consequential action in another system, such as sending an email, updating a record or sharing a document, a person should review the proposed action and confirm it explicitly: the exact recipient, record, change and scope. A connector supporting the action does not remove that step.<\/p><\/aside>\n<h2>A bounded request<\/h2>\n<figure class=\"prompt\"><figcaption><span>Brief request<\/span><\/figcaption><pre>Prepare a short data centre migration brief.\n\nUse the uploaded Change Governance Rules v2.0 only to decide which\nsource is the authority. Retrieve the current document titled\n\"Data Centre Migration Plan\" and use it only if it is owned by the\nProgramme Office and marked Approved. Reject any superseded\nversion.\n\nSummarise only these mail threads:\n1. Migration: service desk cover\n2. Migration: asset list\n\nDo not use unrelated messages. State that \"Commercial Options\"\ncould not be accessed and do not infer what it contains. Do not\nsend, edit, share or take any other action in a connected system.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>What Claude returned<\/figcaption><pre>Data centre migration brief\n\nAuthoritative source: Data Centre Migration Plan, updated\n18 February, Programme Office, status Approved.\n\n- Cutover begins 7 March.\n- The service desk stays on the old site until 18 March.\n- The asset list is due before the 7 March cutover.\n\nMail reviewed\n- \"Migration: service desk cover\" confirms cover on the old site\n  until 18 March.\n- \"Migration: asset list\" says the list is due before cutover.\n\nNot used\n- \"Data Centre Migration Plan - Approved\" is marked Superseded.\n- \"Team lunch Friday\" is unrelated.\n- \"Commercial Options\" could not be accessed and is outside the\n  approved reference set. No conclusion is drawn about it.<\/pre><\/figure>\n<p>The brief keeps source facts apart from the access limitation. It also does not let a confirmation in an email stand in for the approved plan's authority over the schedule. The mail threads add operational detail. The approved plan sets the dates.<\/p>\n<h2>Diagnose connector problems narrowly<\/h2>\n<p>Connector problems are usually about the source or the authorisation, not about reasoning.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Symptom<\/th><th>Likely cause<\/th><th>Response<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Symptom\">Nothing can be retrieved<\/td><td data-l=\"Likely cause\">The account is disconnected<\/td><td data-l=\"Response\">Reconnect it<\/td><\/tr><tr><td data-l=\"Symptom\">A specific record is refused<\/td><td data-l=\"Likely cause\">Insufficient permission<\/td><td data-l=\"Response\">Ask the source owner or administrator, if the access is justified<\/td><\/tr><tr><td data-l=\"Symptom\">Several similar results<\/td><td data-l=\"Likely cause\">The search is too loose<\/td><td data-l=\"Response\">Tighten by title, date, owner, status or location<\/td><\/tr><tr><td data-l=\"Symptom\">The content looks out of date<\/td><td data-l=\"Likely cause\">The source data is stale<\/td><td data-l=\"Response\">Verify with the record owner. Do not assume the newest visible date is right<\/td><\/tr><tr><td data-l=\"Symptom\">An action will not run<\/td><td data-l=\"Likely cause\">The connector does not support it as configured<\/td><td data-l=\"Response\">Do not improvise a workaround or claim it was done<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Connector capabilities, consent prompts and administrator controls change. Check the current state before relying on read or action access.<\/p>","takeaways":["Uploads are fixed snapshots. Connectors reach current records in their home system.","Check a record's identity, date, status and owner before using its content.","Effective access is the narrowest of source permissions, connector authorisation, organisational controls and product capability.","Record inaccessible material as unavailable. Do not infer its contents or work around the restriction.","Apply least privilege, and get explicit human confirmation before any consequential action."],"practice":"Think of a report you build from live systems. For each input, decide whether it should be a fixed upload or a live connection, and write one line on why. Then list the minimum access each would need.","deck":"decks/23-connectors-and-permissions.html","quiz":[{"q":"A fixed, approved rules document must stay unchanged for the length of a task. A status record is updated daily in its home system. How should each reach Claude?","multi":false,"o":[{"t":"Upload both, so nothing changes.","ok":false,"why":"An uploaded copy of the status record would miss later updates."},{"t":"Connect to both, so both are live.","ok":false,"why":"The rules document is meant to be a fixed reference."},{"t":"Upload the rules document and use a connector for the status record.","ok":true,"why":"A snapshot suits the fixed reference. Live access suits the record that changes."},{"t":"Paste both from memory.","ok":false,"why":"Neither would be reliable or traceable."}]},{"q":"A connector returns two documents with nearly the same title. One is marked Approved and updated last week. The other has \"Approved\" in its title and is marked Superseded. What should happen?","multi":false,"o":[{"t":"Use the one with Approved in the title.","ok":false,"why":"A title is not status. That record is marked Superseded."},{"t":"Use both and merge them.","ok":false,"why":"Merging pulls superseded content into the result."},{"t":"Check status, date and owner, then use the current approved one and reject the other.","ok":true,"why":"Record identity comes before content. Similar names do not establish which is current."},{"t":"Use whichever appears first.","ok":false,"why":"Result order means nothing about authority."}]},{"q":"A connector reports that one record cannot be accessed. How should the brief handle it?","multi":false,"o":[{"t":"Estimate what it probably contains.","ok":false,"why":"Being unable to read something is not evidence about what it says."},{"t":"Say it could not be accessed and draw no conclusion about its contents.","ok":true,"why":"It is a known gap. Reporting it plainly keeps the brief accurate."},{"t":"Ask Claude to find another way in.","ok":false,"why":"An access limit is not something to work around."},{"t":"Leave it out with no mention.","ok":false,"why":"Readers should know a named source was unavailable."}]},{"q":"Which TWO of these limit what Claude can reach through a connector?","multi":true,"o":[{"t":"Your permissions in the source system.","ok":true,"why":"The connector cannot see more than the account behind it."},{"t":"How confidently the request is worded.","ok":false,"why":"Wording does not change permissions."},{"t":"Your organisation's administrator controls.","ok":true,"why":"Administrators can restrict what connectors may do."},{"t":"How long the conversation has been running.","ok":false,"why":"Conversation length is unrelated to access."}]},{"q":"A connector supports sending email. Claude has drafted a message to a customer. What should happen before it is sent?","multi":false,"o":[{"t":"Nothing. The connector supports it, so it can go.","ok":false,"why":"Support for an action does not remove the need for review."},{"t":"Claude should send it and report afterwards.","ok":false,"why":"A consequential action should be confirmed before it happens."},{"t":"Grant the connector broader permissions first.","ok":false,"why":"That goes against least privilege and does not address the review."},{"t":"A person reviews it and explicitly confirms the recipient, content and scope.","ok":true,"why":"Retrieval and external action are treated differently. Consequential actions need explicit human confirmation."}]}]},"24":{"lead":"A Project that worked in January can be confidently wrong by July. Nobody broke it. The standards moved and the Project did not.","html":"<h2>Configuration quality changes over time<\/h2>\n<p>A configured Claude workflow is its instructions, its knowledge sources, any connected systems, its access permissions and its test results. It can work well on the day it is built and become unreliable when standards, policies, teams, terminology or source systems change. Stale configuration produces confident output based on information that used to be correct.<\/p>\n<p>Maintenance is not editing a prompt when an answer looks off. It is a controlled process:<\/p>\n<ol class=\"steps\"><li><b>Identify the authoritative change<\/b><span>What changed, and which source says so.<\/span><\/li><li><b>Assess what depends on it<\/b><span>Instructions, knowledge, permissions, tests.<\/span><\/li><li><b>Update those elements<\/b><span>Replace, do not stack.<\/span><\/li><li><b>Document the reason<\/b><span>So the next reviewer knows why a rule exists.<\/span><\/li><li><b>Test the changed configuration<\/b><span>Before colleagues go back to using it.<\/span><\/li><\/ol>\n<p class=\"pull\">Configuration should reflect current authoritative sources, not a pile of historical exceptions.<\/p>\n<h2>Worked example: an inherited build-request Project<\/h2>\n<p>You inherit a Project the team uses to prepare internal build request summaries. It still carries the old build names, sizing, request validity and approval thresholds. Current documents have replaced all three sources. You need to update it, record each change and its owner, remove the obsolete rules and run <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"regression\">regression tests<\/span> before anyone uses it again.<\/p>\n<figure class=\"doc\"><figcaption>Source material<\/figcaption><pre>Superseded configuration, effective 15 January\nServer Build Catalogue v1: Standard build, 2 vCPU and 8 GB.\nPremium build, 4 vCPU and 16 GB.\nBuild Request Guide v2: an approved build request stays valid\nfor 30 days.\nBuild Approval Policy v1: team leads may approve sizing changes\nup to 8 vCPU. Platform manager approval is required for 9 to\n16 vCPU.\n\nCurrent authoritative sources, effective 1 July\nServer Build Catalogue v2.1: General Purpose build, 4 vCPU and\n16 GB. Database build, 8 vCPU and 64 GB.\nBuild Request Guide v4: an approved build request stays valid\nfor 14 days.\nBuild Approval Policy v3: every non-catalogue build requires\nArchitecture Review. Any build above 16 vCPU also requires\nCapacity approval before it is scheduled.<\/pre><\/figure>\n<p>Old facts are not kept just because they were in the previous instructions or uploads.<\/p>\n<h2>Assign owners and define change triggers<\/h2>\n<p>One role should own the overall configuration and coordinate its upkeep. That does not mean writing every source document. It means knowing which sources are authoritative, keeping the register, requesting access changes, and deciding when the Project is ready for release.<\/p>\n<dl class=\"defs\"><div><dt>Source owner<\/dt><dd>Confirms the factual content of a knowledge source.<\/dd><\/div><div><dt>Permission owner<\/dt><dd>Confirms who may access a connected system or the Project's material.<\/dd><\/div><div><dt>Evaluation owner<\/dt><dd>Confirms the test set is still useful after the workflow changes.<\/dd><\/div><\/dl>\n<p>Define your <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"change-trigger\">change triggers<\/span> before an error shows up. Useful ones: a scheduled review, a policy revision, a product release, a recurring error, a source being replaced, a team change, and a connector permission change. Scheduled reviews catch quiet decay. Event triggers respond when a known dependency moves.<\/p>\n<aside class=\"note\"><b>Maintenance principle<\/b><p>A new version of a source is a review trigger, even if nobody has reported a wrong answer yet.<\/p><\/aside>\n<h2>Use a configuration register<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"config-register\">configuration register<\/span> is a maintained record of what the Project relies on and who is accountable for each part. It makes dependencies visible, which matters most when one policy feeds several workflows. Keep it with the workflow documentation, not in somebody's chat history.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Owner<\/th><th>Version and date<\/th><th>Next review<\/th><th>Used for<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Item\">Project instructions<\/td><td data-l=\"Owner\">Wintel technical lead<\/td><td data-l=\"Version and date\">Configuration v2, 1 July<\/td><td data-l=\"Next review\">1 October<\/td><td data-l=\"Used for\">Build request summaries<\/td><\/tr><tr><td data-l=\"Item\">Build catalogue knowledge<\/td><td data-l=\"Owner\">Platform engineering<\/td><td data-l=\"Version and date\">v2.1, 1 July<\/td><td data-l=\"Next review\">1 October<\/td><td data-l=\"Used for\">Build names and sizing<\/td><\/tr><tr><td data-l=\"Item\">Guide and approval knowledge<\/td><td data-l=\"Owner\">Platform policy owner<\/td><td data-l=\"Version and date\">Guide v4, Policy v3, 1 July<\/td><td data-l=\"Next review\">1 October<\/td><td data-l=\"Used for\">Validity and approval guidance<\/td><\/tr><tr><td data-l=\"Item\">Connector permissions and test set<\/td><td data-l=\"Owner\">Access administrator and technical lead<\/td><td data-l=\"Version and date\">Permissions v2, Test set v1, 1 July<\/td><td data-l=\"Next review\">1 October<\/td><td data-l=\"Used for\">Source access and release checks<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Repair, simplify and test before release<\/h2>\n<p>First replace the three old knowledge documents with the current catalogue, guide and policy. Then revise the instructions. The right repair is <strong>not<\/strong> to add a note such as \"ignore the previous approval rule\". Both rules would still be there, and that is ambiguity waiting to happen. Obsolete names, facts and approval guidance are removed.<\/p>\n<p>The change record says the catalogue, guide and policy were replaced on 1 July. You own the instruction update. The source owners stay responsible for the accuracy of their documents. That keeps accountability for the configuration separate from authority over the facts.<\/p>\n<figure class=\"prompt\"><figcaption><span>Updated Project instructions<\/span><\/figcaption><pre>Prepare internal build request summaries using only the current\nProject knowledge. Use the terms General Purpose build and\nDatabase build. State catalogue sizing and the 14-day request\nvalidity when asked.\n\nFor any non-catalogue build, state that Architecture Review is\nrequired. If the build is above 16 vCPU, also state that Capacity\napproval is required before it is scheduled.\n\nDo not use superseded build names, sizing, validity periods or\napproval thresholds. If a requested fact is absent from current\nProject knowledge, state that it was not supplied.<\/pre><\/figure>\n<p>A small regression set checks the behaviour most likely to break. It does not prove every request will be right. It does give you a repeatable release gate, and you rerun the same prompts after every material change.<\/p>\n<figure class=\"doc\"><figcaption>Regression set<\/figcaption><pre>1. Ask for the sizing of both catalogue builds.\n   Expected: 4 vCPU and 16 GB, 8 vCPU and 64 GB.\n\n2. Ask how long an approved request stays valid.\n   Expected: 14 days.\n\n3. Ask for guidance on a 24 vCPU build with 96 GB.\n   Expected: Architecture Review, and Capacity approval before\n   scheduling.\n\n4. Ask for a summary of a Premium build.\n   Expected: the superseded term is not used and no replacement\n   details are invented.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>Response to test 3<\/figcaption><pre>A 24 vCPU build with 96 GB is not a catalogue build, so\nArchitecture Review is required. Because it is above 16 vCPU,\nCapacity approval is also required before the build is scheduled.<\/pre><\/figure>\n<h2>Maintenance, troubleshooting or outage?<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Situation<\/th><th>What it is<\/th><th>Narrow response<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Situation\">The authoritative facts or governing wording changed<\/td><td data-l=\"What it is\">Content maintenance<\/td><td data-l=\"Narrow response\">Update the dependent configuration and rerun the regression set<\/td><\/tr><tr><td data-l=\"Situation\">Sources are current, and the request's wording, structure or constraints give a poor result<\/td><td data-l=\"What it is\">Prompt troubleshooting<\/td><td data-l=\"Narrow response\">Fix the prompt or instruction and rerun the same test. Leave current knowledge alone<\/td><\/tr><tr><td data-l=\"Situation\">Claude or a connected source is unavailable, or access fails<\/td><td data-l=\"What it is\">Product or service outage<\/td><td data-l=\"Narrow response\">Follow the support and continuity process and record the symptom. Do not rewrite policy instructions<\/td><\/tr><\/tbody><\/table><\/div>\n<p>An availability problem is not evidence that your content is stale.<\/p>","takeaways":["Instructions, knowledge, permissions and tests can all go stale.","Give the configuration an owner, and give each source, permission and test set its own.","Define change triggers up front. A new source version is one, with or without complaints.","Replace obsolete content. Do not stack \"ignore the previous rule\" on top of it.","Run a small regression set before colleagues use the changed Project."],"practice":"Pick a runbook, template or Project your team reuses. Write a four-row register for it: item, owner, version and date, next review. Then list three events that should trigger a review.","deck":"decks/24-maintaining-configurations.html","quiz":[{"q":"A Project's approval rule has been replaced by a new policy. What is the correct repair?","multi":false,"o":[{"t":"Add \"ignore the previous approval rule\" to the instructions.","ok":false,"why":"Both rules stay in place, which creates ambiguity."},{"t":"Leave it until someone reports a wrong answer.","ok":false,"why":"A new source version is already a review trigger."},{"t":"Add the new policy alongside the old one in knowledge.","ok":false,"why":"Conflicting sources would sit side by side."},{"t":"Remove the old rule and its source, add the current ones, and rerun the regression set.","ok":true,"why":"Obsolete content is replaced, and the change is tested before release."}]},{"q":"What is a configuration register for?","multi":false,"o":[{"t":"Storing every chat held in the Project.","ok":false,"why":"It records dependencies and ownership, not conversations."},{"t":"Recording what the Project relies on, who owns each part, versions and review dates.","ok":true,"why":"It makes dependencies and accountability visible to the next maintainer."},{"t":"Replacing the need to test.","ok":false,"why":"The register documents. Testing is still required."},{"t":"Listing users' favourite prompts.","ok":false,"why":"That is not what it tracks."}]},{"q":"Claude cannot reach an approved connected source and reports an access failure. What kind of problem is this?","multi":false,"o":[{"t":"Content maintenance. Rewrite the policy instructions.","ok":false,"why":"Changing instructions will not fix an availability problem."},{"t":"Prompt troubleshooting. Reword the request.","ok":false,"why":"The wording is not the cause."},{"t":"An outage or access problem. Follow the support and continuity process.","ok":true,"why":"Record the symptom and do not treat it as evidence that content is stale."},{"t":"Proof the knowledge is out of date.","ok":false,"why":"Availability says nothing about whether content is current."}]},{"q":"Which TWO are sensible change triggers for reviewing a Project's configuration?","multi":true,"o":[{"t":"A source document is replaced by a new version.","ok":true,"why":"A known dependency has changed."},{"t":"Someone on the team prefers a different font.","ok":false,"why":"That has no bearing on the configuration's accuracy."},{"t":"A scheduled quarterly review falls due.","ok":true,"why":"Scheduled reviews catch quiet decay."},{"t":"The Project was used ten times this week.","ok":false,"why":"Usage alone is not a change in a dependency."}]},{"q":"After a material change, what does a small regression set give you?","multi":false,"o":[{"t":"Proof that every possible request will be answered correctly.","ok":false,"why":"It samples critical behaviour. It is not proof of everything."},{"t":"A repeatable release gate for the behaviour most likely to break.","ok":true,"why":"The same prompts, rerun after each material change, show whether critical behaviour held."},{"t":"A replacement for source owners.","ok":false,"why":"Owners still confirm the facts."},{"t":"A way to avoid documenting the change.","ok":false,"why":"The reason for the change is still recorded."}]}]},"25":{"lead":"Whether Claude can do a task quickly is the wrong question. The right one is what role Claude should have in it, and who is still accountable afterwards.","html":"<h2>Decide the role before using Claude<\/h2>\n<p>An appropriate use depends on more than speed. A sound decision weighs seven things:<\/p>\n<ul><li>the task's purpose,<\/li><li>the people affected,<\/li><li>the data involved,<\/li><li>the consequence of an error,<\/li><li>whether the result can be reversed,<\/li><li>the expertise required,<\/li><li>the oversight available.<\/li><\/ul>\n<p>Those decide whether Claude can assist, whether extra controls are needed, or whether the use should not go ahead.<\/p>\n<p>Low-risk assistance supports work a person can review easily and correct without real harm: drafting from approved facts, summarising non-sensitive material, brainstorming options, organising information, preparing a decision for human review. Claude contributes wording, structure or retrieval. It does not become the accountable decision maker.<\/p>\n<p>Risk goes up when an output affects somebody's access to a service, their employment, money, legal position or safety, or a commitment made to a customer. Regulated advice, employment decisions, customer commitments, safety instructions and actions with financial or legal consequences all need particular care. A fluent answer is not evidence that its conclusions are correct, permitted or right for the case.<\/p>\n<p class=\"pull\">Use Claude to support accountable work, not to transfer accountability.<\/p>\n<h2>Worked example: a privileged access review<\/h2>\n<p>Your team runs the quarterly review of privileged accounts for a regulated customer. Access records hold sensitive information about named staff, and removing access can stop someone doing their job. Several uses of Claude have been proposed, from drafting a note to letting Claude decide and send the removal notice itself. You need to classify each one, and redesign the autonomous proposal without losing the useful parts.<\/p>\n<figure class=\"doc\"><figcaption>The governing standard<\/figcaption><pre>Privileged Access Review Standard\n- An authorised reviewer decides whether privileged access is\n  kept or removed, and approves the final notice.\n- Decisions may rely only on the access record and the approved\n  policy library.\n- Exceptions must be escalated to an authorised reviewer.\n- Communications to account holders need reviewer approval before\n  they are sent.<\/pre><\/figure>\n<p>The standard sets the authority boundary. It does not let a tool infer missing evidence, replace a reviewer or communicate a final decision. It also names the authoritative sources. Asking for an answer, a heading or a recommendation does not create evidence that those sources do not contain.<\/p>\n<h2>Classify the purpose and the consequence<\/h2>\n<p>Start with the actual role proposed for Claude, not a broad label like \"review support\". The same tool can be appropriate in one step and inappropriate in the next. This is <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"classification\">data classification<\/span> of the use.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Proposed role for Claude<\/th><th>Classification<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Proposed role for Claude\">Draft an internal review note from facts the reviewer approved<\/td><td data-l=\"Classification\">Appropriate with review<\/td><td data-l=\"Reason\">The reviewer controls the facts and checks the draft before use<\/td><\/tr><tr><td data-l=\"Proposed role for Claude\">Summarise non-sensitive public vendor guidance for the team<\/td><td data-l=\"Classification\">Appropriate<\/td><td data-l=\"Reason\">The material is not sensitive and the summary is not a case decision<\/td><\/tr><tr><td data-l=\"Proposed role for Claude\">Organise access-record facts and relevant policy passages for a reviewer<\/td><td data-l=\"Classification\">Higher risk, support role only<\/td><td data-l=\"Reason\">Sensitive data and real consequences need validation and human judgement<\/td><\/tr><tr><td data-l=\"Proposed role for Claude\">Decide who loses access and send the notice without reviewer approval<\/td><td data-l=\"Classification\">Inappropriate<\/td><td data-l=\"Reason\">It hands over regulated judgement, communication authority and accountability<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Higher risk does not automatically mean prohibited. It means a narrower scope and stronger <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"safeguard\">safeguards<\/span>. Ask whether Claude is preparing information for an authorised person, or making the consequential decision itself. If the output can cause harm before a qualified person checks it, the design is too autonomous.<\/p>\n<aside class=\"note\"><b>When is human review meaningful?<\/b><p>Only when the reviewer has the authority, the source material, the time and the expertise to challenge or reject the output.<\/p><\/aside>\n<h2>Uses that must not proceed<\/h2>\n<ul><li><strong>It conflicts with policy.<\/strong> Claude cannot make the final access decision because the standard gives that to an authorised reviewer.<\/li><li><strong>It exceeds the evidence.<\/strong> Claude cannot fill gaps in the record by assuming facts, searching unapproved sources or presenting an inference as verified.<\/li><li><strong>It disguises AI output as professional judgement.<\/strong> A reviewer must not paste an unvalidated recommendation into a decision record as their own analysis. They examine the evidence, apply the policy and make the call themselves.<\/li><li><strong>The data is not approved for the purpose.<\/strong> Sensitive records go only through an organisation-approved Claude environment under the internal data rules. If that route is not available, the records do not go into an unapproved tool because the task looks useful.<\/li><\/ul>\n<h2>Redesign the autonomous proposal<\/h2>\n<p>The choice is not between unrestricted automation and dropping Claude. Separate preparing the evidence from making the judgement. In the redesign, Claude checks whether the required record fields appear to be present, pulls the relevant passages from the approved policy library, and writes a neutral summary for the reviewer. It does not decide, treat an exception as approved, send a notice or commit to anything.<\/p>\n<figure class=\"prompt\"><figcaption><span>Bounded prompt<\/span><\/figcaption><pre>Using only the supplied access record and approved policy\nexcerpts:\n\n1. List the record fields that are present and name any required\n   field that was not supplied.\n2. Quote the policy passages relevant to the stated review\n   criteria.\n3. Write a neutral reviewer summary that keeps access-record facts\n   separate from policy text.\n4. Do not decide whether access is kept or removed, recommend an\n   outcome, infer missing facts or draft a final notice.\n5. Flag any apparent exception or missing information for the\n   authorised reviewer.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>What Claude returned<\/figcaption><pre>Required record fields\n- Current group memberships: present\n- Manager attestation: not supplied\n\nRelevant approved policy\n- \"Decisions may rely only on the access record and the approved\n  policy library.\"\n- \"Exceptions must be escalated to an authorised reviewer.\"\n\nNeutral reviewer summary\nThe access record lists the account's current group memberships.\nA manager attestation was not supplied. The policy requires an\nauthorised reviewer's judgement and escalation of exceptions. No\naccess decision is given.<\/pre><\/figure>\n<p>The reviewer gets a preparation document, not an unreviewed conclusion. Where a required fact is missing, the output says it was not supplied. It does not invent a likely answer.<\/p>\n<h2>Apply safeguards<\/h2>\n<p>Safeguards are operational controls on what Claude receives, what it can produce and what happens next. They should match the consequence of the task.<\/p>\n<dl class=\"defs\"><div><dt>Approved data<\/dt><dd>Only information permitted in the approved environment, and approved policy excerpts.<\/dd><\/div><div><dt>Bounded scope<\/dt><dd>Completeness checks, retrieval, organisation and neutral summary. Nothing more.<\/dd><\/div><div><dt>Validation<\/dt><dd>Compare every quoted passage and record fact with the source.<\/dd><\/div><div><dt>Human approval<\/dt><dd>An authorised reviewer makes the decision and approves any communication.<\/dd><\/div><div><dt>Logging<\/dt><dd>Keep the sources used, the summary, the reviewer's corrections and the final decision record.<\/dd><\/div><div><dt>Escalation<\/dt><dd>Missing evidence, possible exceptions and uncertain policy go to an authorised reviewer.<\/dd><\/div><\/dl>\n<p>Logging makes the work reviewable. It does not make an unsupported output correct. Validation is still needed, because Claude can leave things out, misread context, or sound more certain than the sources justify.<\/p>\n<aside class=\"note\"><b>Oversight limit<\/b><p>A later audit is not a substitute for approval before a consequential action is taken.<\/p><\/aside>","takeaways":["Weigh purpose, people, data, consequence, reversibility, expertise and oversight.","Classify the specific role proposed for Claude, not a broad label.","Claude can organise approved evidence. Authorised people make consequential decisions.","A request cannot override policy, supply missing evidence or move accountability.","Redesign risky uses with approved data, bounded scope, validation, approval, logging and escalation."],"practice":"List four ways your team could use an AI assistant on one process, such as change approval. Classify each as appropriate, appropriate with review, higher risk in a support role, or inappropriate, and give the reason in one line.","deck":"decks/25-appropriate-and-inappropriate-uses.html","quiz":[{"q":"Which proposed use of Claude is inappropriate?","multi":false,"o":[{"t":"Drafting an internal note from facts the reviewer has approved.","ok":false,"why":"The reviewer controls the facts and checks the draft."},{"t":"Summarising non-sensitive public guidance for the team.","ok":false,"why":"Non-sensitive material, and not a decision."},{"t":"Organising record facts and policy passages for a reviewer to assess.","ok":false,"why":"Higher risk, but acceptable as a bounded support role with safeguards."},{"t":"Deciding who loses privileged access and sending the notice without reviewer approval.","ok":true,"why":"It hands regulated judgement, communication authority and accountability to a tool."}]},{"q":"A task is classified as higher risk. What does that mean in practice?","multi":false,"o":[{"t":"Claude must not be used for any part of it.","ok":false,"why":"Higher risk does not automatically mean prohibited."},{"t":"It needs a narrower scope and stronger safeguards.","ok":true,"why":"Claude can prepare information for an authorised person while the judgement stays with them."},{"t":"It needs a more capable model and nothing else.","ok":false,"why":"Model choice does not replace safeguards or authority."},{"t":"It only needs a disclaimer on the output.","ok":false,"why":"A disclaimer controls nothing."}]},{"q":"When is a human review step meaningful?","multi":false,"o":[{"t":"Whenever someone glances at the output before it goes out.","ok":false,"why":"A glance cannot challenge anything."},{"t":"When an audit happens later.","ok":false,"why":"A later audit does not replace approval before a consequential action."},{"t":"When the reviewer has the authority, source material, time and expertise to challenge or reject the output.","ok":true,"why":"Without those, the review is a formality."},{"t":"When the output looks confident and well written.","ok":false,"why":"Fluency is not evidence."}]},{"q":"A required document is missing from a case record. What should a bounded preparation prompt make Claude do?","multi":false,"o":[{"t":"State that the field was not supplied and flag it for the reviewer.","ok":true,"why":"A request cannot create evidence the sources do not contain."},{"t":"Infer the most likely content.","ok":false,"why":"That presents an inference as evidence."},{"t":"Search other sources until something turns up.","ok":false,"why":"Decisions may rely only on the approved sources."},{"t":"Recommend an outcome anyway.","ok":false,"why":"Recommending is outside the bounded role."}]},{"q":"Which TWO are safeguards for the redesigned process?","multi":true,"o":[{"t":"Limiting Claude to completeness checks, retrieval and neutral summary.","ok":true,"why":"Bounded scope keeps Claude in a preparation role."},{"t":"Letting Claude send the notice so nothing is delayed.","ok":false,"why":"That removes the human approval the standard requires."},{"t":"Comparing each quoted passage and fact with the source.","ok":true,"why":"Validation catches omissions, misreadings and overstated certainty."},{"t":"Skipping logging to save time.","ok":false,"why":"Logging is what makes the work reviewable."}]}]},"26":{"lead":"An export is not one harmless object because most of its columns look routine. Go through it field by field before any of it gets near a chat.","html":"<h2>Classify before sharing<\/h2>\n<p>Data handling starts before anything is uploaded, pasted, connected or saved in a Project. First identify the category of information, its <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"classification\">data classification<\/span> under your organisation's policy, and the purpose it is permitted for. Being asked for an analysis does not authorise access or disclosure.<\/p>\n<p>Common sensitive categories:<\/p>\n<ul><li>personal information,<\/li><li>financial and account data,<\/li><li>health information,<\/li><li>credentials,<\/li><li>confidential business material,<\/li><li>legally privileged material,<\/li><li>records covered by a specific industry or government rule.<\/li><\/ul>\n<p>Personal information can be a direct identifier such as an email address. It can also be a combination of details that identifies someone in context.<\/p>\n<p>A data classification is an organisational label that sets handling expectations: who may access the material, where it may be stored, and whether it may be used with an AI tool. Classifications and rules differ between organisations and countries. When a policy, contract, regulation or customer commitment is unclear, do not read permission into convenience.<\/p>\n<p class=\"pull\">Use the least data necessary, in a workspace approved for that data and that purpose.<\/p>\n<h2>Worked example: a ticket trend request<\/h2>\n<p>You are asked to show how ticket volumes changed month to month by category and contact channel. The data handling standard allows Service Internal data in the approved analytics workspace. Restricted data needs approval. Credentials, payment details, health details and legal case material are prohibited there. You have a raw export from the service desk tool.<\/p>\n<p>Build a field inventory first. It separates what each field is worth to this job from the risk it carries.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Field<\/th><th>Category<\/th><th>Needed?<\/th><th>Decision<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Field\">Requester name and email address<\/td><td data-l=\"Category\">Direct identifiers, personal information<\/td><td data-l=\"Needed?\">No<\/td><td data-l=\"Decision\">Remove<\/td><\/tr><tr><td data-l=\"Field\">Office location, job title, start month<\/td><td data-l=\"Category\">Quasi-identifiers<\/td><td data-l=\"Needed?\">No<\/td><td data-l=\"Decision\">Remove<\/td><\/tr><tr><td data-l=\"Field\">Month opened, ticket category, contact channel<\/td><td data-l=\"Category\">Activity fields<\/td><td data-l=\"Needed?\">Yes<\/td><td data-l=\"Decision\">Keep, for aggregation only<\/td><\/tr><tr><td data-l=\"Field\">Charge-back account and amount<\/td><td data-l=\"Category\">Financial and account data<\/td><td data-l=\"Needed?\">No<\/td><td data-l=\"Decision\">Remove<\/td><\/tr><tr><td data-l=\"Field\">Accessibility accommodation note<\/td><td data-l=\"Category\">Health information<\/td><td data-l=\"Needed?\">No<\/td><td data-l=\"Decision\">Remove<\/td><\/tr><tr><td data-l=\"Field\">Temporary password in the work notes<\/td><td data-l=\"Category\">Credential<\/td><td data-l=\"Needed?\">No<\/td><td data-l=\"Decision\">Remove immediately<\/td><\/tr><tr><td data-l=\"Field\">HR investigation notes<\/td><td data-l=\"Category\">Confidential, possibly privileged<\/td><td data-l=\"Needed?\">No<\/td><td data-l=\"Decision\">Remove. Seek review if it ever has to be handled<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Minimise, and think about combinations<\/h2>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"data-minimisation\">Data minimisation<\/span> means supplying only the fields and records the stated purpose needs. The purpose here is not to contact users, investigate an account or diagnose one person's experience. It is to describe overall changes in category and channel. Identifiers, financial fields, health details, credentials and investigation notes contribute nothing to that.<\/p>\n<p>Removing direct identifiers is necessary and may not be enough. Office location, job title and start month are <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"quasi-identifier\">quasi-identifiers<\/span>. Each looks broad alone. Together they can narrow a record down to one person, especially when matched with information available elsewhere. That is <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"re-identification\">re-identification<\/span> risk.<\/p>\n<p>A dataset with no names can still be personal information under policy or law if people can be re-identified. You do not need those three fields for a category and channel trend, so removing them is safer than arguing for keeping them.<\/p>\n<aside class=\"note\"><b>Practical distinction<\/b><p>A field that would be useful for some other question later is not necessary for this one.<\/p><\/aside>\n<h2>Choose the right control<\/h2>\n<p>Several controls reduce exposure. They do not give the same protection.<\/p>\n<dl class=\"defs\"><div><dt>Redaction<\/dt><dd>Removes or masks specific content such as an email address. It can leave other identifying combinations in place. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"redaction\">redaction<\/span>.<\/dd><\/div><div><dt>Anonymisation<\/dt><dd>Aims to make identification no longer reasonably possible. Deleting a name is not reliable <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"anonymisation\">anonymisation<\/span> when quasi-identifiers or outside data can reconnect records to people.<\/dd><\/div><div><dt>Aggregation<\/dt><dd>Combines individual records into group values, such as ticket count by month, category and channel. Very small groups can still disclose something, so follow any rule for suppressing or combining them. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"aggregation\">aggregation<\/span>.<\/dd><\/div><div><dt>Synthetic data<\/dt><dd>Artificially generated data that resembles the patterns in the source. Useful for testing and demos. It may not preserve the real results, and it must be assessed for privacy and usefulness first. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"synthetic-data\">synthetic data<\/span>.<\/dd><\/div><\/dl>\n<p>For this request, aggregation is the right control, because the output is about group trends and not individuals. Synthetic data would not answer the real question reliably. Redaction alone would leave ticket-level rows nobody needs, and the linkage risk that comes with them.<\/p>\n<h2>Prepare the approved input<\/h2>\n<p>Before using Claude, confirm the purpose (monthly ticket trend analysis) and that the workspace is authorised for Service Internal aggregate data. Also confirm who has access to the workspace, the retention period that applies, and whether source material or generated analysis may be kept there. Those checks cover purpose limitation, authorisation, retention, data residency, and who can see it later.<\/p>\n<figure class=\"doc\"><figcaption>Aggregated input<\/figcaption><pre>Month | Ticket category | Contact channel | Tickets\nApril | Password reset  | Phone           | 1,240\nApril | Password reset  | Portal          |   860\nApril | VPN access      | Portal          |   980\nMay   | Password reset  | Phone           | 1,410\nMay   | Password reset  | Portal          |   830\nMay   | VPN access      | Portal          | 1,020<\/pre><\/figure>\n<figure class=\"prompt\"><figcaption><span>Request<\/span><\/figcaption><pre>Using only the aggregated data provided, summarise the\nmonth-to-month changes by ticket category and contact channel.\nState the changes you can see. Do not infer user motives, who the\nusers are, or causes that are not in the data.<\/pre><\/figure>\n<p>The prepared input has no ticket-level rows, no direct identifiers and no quasi-identifiers. The prompt keeps Claude to the evidence supplied.<\/p>\n<aside class=\"note\"><b>A prompt is not a data control<\/b><p>\"Do not retain this information\" is an instruction to Claude. It does not override organisational policy, workspace configuration, contractual obligations or the product's data controls. Retention and privacy are decided through approved settings and governance, not prompt wording.<\/p><\/aside>\n<h2>Know when to escalate<\/h2>\n<p>Some requests cannot be safely settled by one engineer. Escalate when the classification is uncertain, the permitted purpose is unclear, a regulated record may be involved, or the data would have to be used somewhere not explicitly approved for it.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Ask<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Ask\">Privacy<\/td><td data-l=\"When\">Personal information, re-identification risk, consent, purpose limitation or residency are uncertain<\/td><\/tr><tr><td data-l=\"Ask\">Legal<\/td><td data-l=\"When\">Contracts, legal holds, privilege, regulated disclosures or country-specific obligations may apply<\/td><\/tr><tr><td data-l=\"Ask\">Security<\/td><td data-l=\"When\">Credentials, account data, access controls, a new connection or a new workspace is involved<\/td><\/tr><tr><td data-l=\"Ask\">Compliance<\/td><td data-l=\"When\">An industry, customer or internal control sets handling or record-keeping requirements<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Product privacy, retention, plan and enterprise-control details change. Before relying on a particular Claude workspace or configuration for sensitive material, check the current official documentation and your organisation's approved-use guidance. If the two do not clearly support what you intend, use a more minimised dataset or pause for review.<\/p>","takeaways":["Classify first: category, classification and permitted purpose, before anything is shared.","Inventory an export field by field. Keep only what this purpose needs.","Removing names is not anonymisation. Combinations of quasi-identifiers can re-identify people.","Redaction, anonymisation, aggregation and synthetic data address different risks. Match the control to the output.","A prompt is not a retention control. Escalate uncertainty to privacy, legal, security or compliance."],"practice":"Take the column headings from a report or export you handle (headings only, no data). Mark each as direct identifier, quasi-identifier, sensitive, or needed for the purpose. Count how many you would actually keep.","deck":"decks/26-data-sensitivity-and-privacy.html","quiz":[{"q":"An export has had names and email addresses removed. It still has office location, job title and start month on every row. What risk remains?","multi":false,"o":[{"t":"None. Without names it is anonymous.","ok":false,"why":"A dataset without names can still identify people."},{"t":"Re-identification, because the combination can narrow a record to one person.","ok":true,"why":"Quasi-identifiers look broad alone and can single someone out together."},{"t":"Only a formatting risk.","ok":false,"why":"The risk is to privacy, not layout."},{"t":"A risk that Claude will reject the file.","ok":false,"why":"Whether a tool accepts data says nothing about whether it should be shared."}]},{"q":"The goal is a month-to-month trend in ticket volume by category and channel. Which control fits best?","multi":false,"o":[{"t":"Redaction of email addresses only.","ok":false,"why":"It leaves ticket-level rows and linkage risk that the task does not need."},{"t":"Synthetic data.","ok":false,"why":"It may not preserve the real results, so it cannot answer the real question reliably."},{"t":"No control. Upload the full export.","ok":false,"why":"That exposes identifiers, credentials and sensitive notes for no benefit."},{"t":"Aggregation into counts by month, category and channel.","ok":true,"why":"The output is about groups, so group-level values are all that is needed."}]},{"q":"A prompt ends with \"do not retain this information\". What does that achieve?","multi":false,"o":[{"t":"It guarantees nothing is stored.","ok":false,"why":"Prompt wording does not control retention."},{"t":"It overrides the workspace's configuration.","ok":false,"why":"Settings and governance decide that, not the prompt."},{"t":"It is an instruction to Claude and does not override policy, configuration, contracts or product data controls.","ok":true,"why":"Retention and privacy are decided through approved settings and governance."},{"t":"It makes any data safe to paste.","ok":false,"why":"The data decision comes before the prompt."}]},{"q":"Which TWO fields should be kept for the ticket trend analysis?","multi":true,"o":[{"t":"Month the ticket was opened.","ok":true,"why":"It is needed to show change over time."},{"t":"Requester email address.","ok":false,"why":"A direct identifier the trend does not need."},{"t":"Ticket category.","ok":true,"why":"It is one of the two dimensions being analysed."},{"t":"Temporary password in the work notes.","ok":false,"why":"A credential. Remove it immediately."}]},{"q":"You are not sure whether a dataset's classification allows it to be used in a particular workspace. What should you do?","multi":false,"o":[{"t":"Go ahead, because the analysis is useful.","ok":false,"why":"Convenience is not permission."},{"t":"Pause and escalate to the right function, or use a more minimised dataset.","ok":true,"why":"Uncertain classification or permitted purpose is a reason to escalate."},{"t":"Ask Claude whether it is allowed.","ok":false,"why":"Claude does not know your organisation's policy or contracts."},{"t":"Rename the file so it looks less sensitive.","ok":false,"why":"That changes nothing about the content."}]}]},"27":{"lead":"That a tool will accept the document tells you nothing about whether you are allowed to give it one. Policy is what turns general caution into things you can check.","html":"<h2>Governance sets the operating boundary<\/h2>\n<p>AI <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"governance\">ai governance<\/span> is the organisational framework that defines who may use AI capabilities, what data they may use, which purposes are allowed and which controls apply. A policy is one practical expression of it. It gives staff a boundary that allows useful work while protecting customers, the organisation and the people accountable for decisions.<\/p>\n<p>Governance is not about whether a tool can do a task. A product may technically accept a document, draft public text or analyse customer information. That creates no organisational permission. Permission depends on the approved tool and account, the data classification, the stated purpose, and the review or approval required.<\/p>\n<p>Typical AI policies cover:<\/p>\n<ul><li>approved tools and accounts,<\/li><li>prohibited data categories,<\/li><li>permitted uses,<\/li><li>required human review,<\/li><li>record keeping,<\/li><li>procurement of new tools, so unapproved services do not become business systems without assessment,<\/li><li>incident reporting, so there is a defined response when prohibited data is entered or a control may have failed,<\/li><li>exception approval, so a restriction is changed deliberately and not bypassed informally.<\/li><\/ul>\n<p class=\"pull\">Seniority does not override a control. Only the policy's authorised exception process does.<\/p>\n<h2>Worked example: a conflicting request<\/h2>\n<p>You are writing a customer-facing knowledge article about a recurring RDP certificate warning. You have access to the approved AI workspace. A more senior colleague sends you this:<\/p>\n<figure class=\"doc\"><figcaption>Request from a senior colleague<\/figcaption><pre>Use your personal AI account so we can get this out quickly.\nPaste in the whole ticket thread, server names and all, and have\nit write the knowledge article. Publish it to the customer\nportal today. Do not bother sending it for review.<\/pre><\/figure>\n<figure class=\"doc\"><figcaption>AI policy excerpts<\/figcaption><pre>1. Approved workspace: staff may use AI for approved service\n   work only through the organisation-approved AI workspace and\n   their organisation account.\n\n2. Protected data: do not enter customer names, email addresses,\n   hostnames, IP addresses, credentials, or full ticket threads\n   containing them, into an AI system.\n\n3. External content: customer-facing knowledge articles need\n   documented approval from a subject-matter reviewer before\n   release.\n\n4. Exceptions: any departure from these controls needs written\n   approval from the designated AI governance approver before\n   the activity takes place.\n\n5. Record keeping: keep the source reference, the AI workspace\n   or tool used, the prompt version, the validation result, the\n   reviewer's approval and any approved exception, following the\n   team's record-keeping process.<\/pre><\/figure>\n<p>Drafting a knowledge article may well be an allowed use. The method is a separate question. Check each step against policy. A senior colleague asking for it does not approve the method.<\/p>\n<h2>Turn policy into a checklist<\/h2>\n<p>Broad policy wording only becomes reliable once it is converted into checks that follow the order of the work: before material goes in, while the prompt is prepared, and before output is shared.<\/p>\n<ol class=\"steps\"><li><b>Purpose<\/b><span>Confirm the purpose is allowed and the AI capability suits the task.<\/span><\/li><li><b>Workspace<\/b><span>Use only the approved workspace and organisation account.<\/span><\/li><li><b>Data<\/b><span>Identify the source material and remove prohibited or unnecessary data before it goes in.<\/span><\/li><li><b>Review<\/b><span>Is the output internal or external? Assign the required human review.<\/span><\/li><li><b>Record<\/b><span>Sources, prompt version, validation findings, approvals and exceptions, in proportion to the risk.<\/span><\/li><li><b>Escalate<\/b><span>Stop when a request conflicts with a control, or the policy does not clearly authorise the activity.<\/span><\/li><\/ol>\n<p>For the article, a general description of the certificate warning is enough. A customer's identity, hostnames, IP addresses and the full thread add nothing a public article needs. That is <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"data-minimisation\">data minimisation<\/span> again.<\/p>\n<p>Record keeping should match the consequence. A low-impact internal formatting draft needs a light record. Public customer content needs clear evidence of its source, validation, reviewer approval and release decision. Documentation does not make an unsafe activity acceptable. It makes authorised decisions traceable.<\/p>\n<h2>Assign accountability before use<\/h2>\n<p>Several roles can contribute to one AI-assisted activity. Assigning them avoids two common failures: assuming the user owns every decision, and assuming somebody else will review it when nobody was asked to.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Role<\/th><th>Responsibility<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Role\">Business owner<\/td><td data-l=\"Responsibility\">Defines the purpose, the expected benefit and acceptable operational use<\/td><\/tr><tr><td data-l=\"Role\">User<\/td><td data-l=\"Responsibility\">Uses the approved workspace, follows controls, validates output, reports conflicts and incidents<\/td><\/tr><tr><td data-l=\"Role\">Data owner<\/td><td data-l=\"Responsibility\">Decides whether source information may be used and under what conditions<\/td><\/tr><tr><td data-l=\"Role\">Subject-matter reviewer<\/td><td data-l=\"Responsibility\">Checks external content for accuracy, completeness and operational suitability<\/td><\/tr><tr><td data-l=\"Role\">Privacy, security or legal support<\/td><td data-l=\"Responsibility\">Advises on data handling, security exposure, legal requirements and high-risk exceptions<\/td><\/tr><tr><td data-l=\"Role\">Approver<\/td><td data-l=\"Responsibility\">Authorises an exception where policy gives them that authority, and records the decision<\/td><\/tr><\/tbody><\/table><\/div>\n<p>You stay responsible for pausing when a request conflicts with policy. And the subject-matter reviewer is not there to check grammar. They confirm that the public guidance accurately describes the support process.<\/p>\n<h2>Identify the violations and escalate<\/h2>\n<p>The request breaks three stated controls. A personal account breaks clause 1. Pasting the full thread breaks clause 2. Publishing without review breaks clause 3.<\/p>\n<p>The narrowest useful response is to pause before anything goes into the personal account. Do not quietly use a personal account anyway, strip one sensitive field and carry on, or release unreviewed content. Each of those leaves at least one conflict in place.<\/p>\n<figure class=\"out good\"><figcaption>Exception record and compliant alternative<\/figcaption><pre>Activity: draft a customer-facing knowledge article about a\nrecurring RDP certificate warning.\n\nPolicy conflicts\n- Personal AI account: conflicts with clause 1, Approved workspace.\n- Full ticket thread: conflicts with clause 2, Protected data.\n- Release without review: conflicts with clause 3, External\n  content.\n\nAction: pause the requested workflow. Send this record to the\ndesignated AI governance approver and tell the business owner.\n\nProposed compliant workflow\n1. Use the approved AI workspace and organisation account.\n2. Write a minimised summary of the issue with no customer names,\n   email addresses, hostnames, IP addresses, credentials or\n   ticket text.\n3. Ask Claude to draft a general article from that summary.\n4. Validate the draft against the approved support procedure.\n5. Get and record subject-matter reviewer approval before\n   publishing.\n6. Keep the source reference, prompt version, validation result\n   and approval record.<\/pre><\/figure>\n<p>The record cites the policy. It does not argue from urgency or seniority. It also gives the approver something workable: approve the compliant alternative, ask for more review, or formally decide whether an exception is justified. Until written approval exists, the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"exception-approval\">exception<\/span> is not authorised.<\/p>\n<aside class=\"note\"><b>Escalation boundary<\/b><p>An informal instruction, a verbal assurance or a request to move quickly is not an approved exception.<\/p><\/aside>\n<h2>Keep the controls on during the work<\/h2>\n<p>Governance continues after the first decision. Check that the minimised summary really contains no prohibited data, use the designated workspace, and compare the draft with the approved procedure. If the draft contains an unsupported statement, remove it or go back to the authoritative source.<\/p>\n<p>Changes create new decision points. Swapping the summary for a ticket thread, changing the destination from internal draft to public article, or adding a new AI service all change the risk and may need reassessment.<\/p>\n<ul><li>Keep the final approval attached to the version that was released, not an earlier draft.<\/li><li>Record material changes to the source summary, prompt or audience.<\/li><li>Report a possible policy incident promptly through the defined process.<\/li><li>Review recurring exceptions. They may mean the standard workflow or the policy needs adjusting.<\/li><\/ul>","takeaways":["Capability is not permission. Permission comes from the approved tool, the data classification, the purpose and the required review.","Turn policy into a checklist: purpose, workspace, data, review, record, escalate.","Users, owners, reviewers, support functions and approvers each have a distinct responsibility.","Seniority, urgency and verbal assurance do not authorise an exception. Written approval through the defined process does.","When a request conflicts with policy, pause, document the conflict and offer a minimised compliant alternative."],"practice":"Find your organisation's AI or acceptable-use policy. Turn it into a six-line checklist you could run before using an AI tool on customer work. Note anything the policy does not clearly answer.","deck":"decks/27-ai-policies-and-governance.html","quiz":[{"q":"A tool will technically accept a full customer ticket thread. Does that mean you may paste one in?","multi":false,"o":[{"t":"Yes. If the tool accepts it, it is allowed.","ok":false,"why":"Technical capability creates no organisational permission."},{"t":"Yes, if you delete the conversation afterwards.","ok":false,"why":"Deleting afterwards does not undo entering prohibited data."},{"t":"No. Permission depends on the approved tool and account, the data classification, the purpose and the required review.","ok":true,"why":"Governance decides permission. The product's features do not."},{"t":"Only if the customer is a small one.","ok":false,"why":"Customer size is not a policy test."}]},{"q":"A senior colleague tells you to use a personal AI account and skip the review, to save time. What authorises a departure from policy?","multi":false,"o":[{"t":"The colleague's seniority.","ok":false,"why":"Seniority does not override a control."},{"t":"The urgency of the deadline.","ok":false,"why":"Urgency is not an approval."},{"t":"A verbal assurance that it will be fine.","ok":false,"why":"An informal assurance is not an approved exception."},{"t":"Written approval from the designated approver, before the activity takes place.","ok":true,"why":"Only the policy's authorised exception process changes a control."}]},{"q":"Faced with that request, what is the right first action?","multi":false,"o":[{"t":"Do it, and note your concerns afterwards.","ok":false,"why":"The prohibited data would already have been entered."},{"t":"Remove the IP addresses and carry on in the personal account.","ok":false,"why":"That still breaks the workspace and review clauses, and leaves other protected data."},{"t":"Pause, document the policy conflicts, escalate to the approver and propose a compliant alternative.","ok":true,"why":"It stops the breach, cites the policy basis and gives the approver a workable path."},{"t":"Refuse and say nothing more.","ok":false,"why":"The work may be legitimate. A compliant alternative keeps it moving."}]},{"q":"What is the subject-matter reviewer's job for a customer-facing article?","multi":false,"o":[{"t":"Checking grammar and spelling.","ok":false,"why":"That is proofreading, not subject-matter review."},{"t":"Confirming the guidance is accurate, complete and operationally suitable.","ok":true,"why":"The reviewer confirms the public content correctly represents the process."},{"t":"Deciding whether the data may be used.","ok":false,"why":"That is the data owner's role."},{"t":"Approving policy exceptions.","ok":false,"why":"That belongs to the designated approver."}]},{"q":"Which TWO changes during the work should prompt a reassessment?","multi":true,"o":[{"t":"The destination changes from an internal draft to a public article.","ok":true,"why":"External release changes the consequence and the review required."},{"t":"The draft's heading is reworded.","ok":false,"why":"A cosmetic edit does not change the risk."},{"t":"The minimised summary is swapped for a full ticket thread.","ok":true,"why":"The data going in has changed category."},{"t":"The article is saved under a new file name.","ok":false,"why":"Renaming does not change data, purpose or audience."}]}]},"28":{"lead":"A score out of five looks objective. Whether it is depends entirely on what went into it, and Claude will happily score things nobody should be scored on.","html":"<h2>Ethics goes beyond compliance<\/h2>\n<p>Complying with law, policy and approval rules is necessary. It is not the whole ethical test. A process can follow every stated rule and still hand out benefits unfairly, shut out people who cannot use its format, or make a consequential decision impossible to question. Ethical judgement asks whether the process treats the people it affects with care and respect.<\/p>\n<p>Claude produces text, summaries, classifications and suggested structures from what it is given. It does not hold responsibility for a decision and does not live with the consequences. The people who design, approve and use an AI-assisted process stay accountable for its criteria, its inputs, its decisions and its effects.<\/p>\n<p class=\"pull\">AI can support judgement. Accountable people make consequential decisions and stand behind them.<\/p>\n<p>Fairness does not mean treating everyone identically. It means relevant criteria, applied consistently, with attention to unequal barriers, in a process that can notice when neutral-looking rules produce unequal effects. Think also about the people who are not in the room: unsuccessful applicants, the customers a team supports, and the staff who have to explain the outcome.<\/p>\n<h2>Worked example: allocating certification funding<\/h2>\n<p>A panel has to allocate a limited certification budget across 46 applications from engineers. The panel has asked Claude to organise the submitted evidence before members review each one.<\/p>\n<figure class=\"doc\"><figcaption>What the panel has<\/figcaption><pre>Approved criteria\n1. Role relevance\n2. Feasibility\n3. Expected team benefit\n4. Budget fit\n\nApplication fields\n- Certification requested and cost\n- Current role and accounts supported\n- Why it is needed\n- Study plan\n- Supporting documents\n\nNot supplied\n- Previous funding history\n- The applicant's reputation\n- Performance ratings\n- Whether anyone helped write the application\n- Reasons for missing detail<\/pre><\/figure>\n<p>Some applications are short, written in a non-standard style or thin on context. Those applicants may have been on call that week, be writing in a second language, or never have filled in a form like this before. The application is the record of what was claimed. It establishes nothing hidden about the applicant's quality or likely success. A polished application may reflect help or practice. A short one may reflect time, language or circumstance, and not a weaker case.<\/p>\n<h2>Proxy criteria create hidden risk<\/h2>\n<p>A proxy is a stand-in measure used to infer something that was not measured directly. Proxies look objective because they are countable or easy to compare. They can end up measuring access to resources, cultural norms or past advantage in place of the approved criterion. Polished writing is not feasibility. Being loud in the team channel is not expected team benefit.<\/p>\n<figure class=\"prompt\"><figcaption><span>The panel's first idea<\/span><\/figcaption><pre>For each application, give a readiness score from 1 to 5.\nUse writing quality, number of attachments, number of\ncertifications already held, how visible the person is in team\nchannels, and how sophisticated the study plan looks.\nRank all applications from strongest to weakest and recommend\nfunding for the top ones.<\/pre><\/figure>\n<p>This brings in criteria the panel never approved and asks Claude to infer qualities the record does not support. The proxies can disadvantage people with less time, less familiarity with formal writing or a quieter communication style. Missing context makes the inference less reliable, and ranking makes it more likely that an early presentation choice shapes who gets the money.<\/p>\n<aside class=\"note\"><b>Automation bias<\/b><p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"automation-bias\">Automation bias<\/span> is the tendency to accept a system's recommendation because it looks systematic, polished or numerical. A score and a ranking create confidence that the inputs may not deserve.<\/p><\/aside>\n<h2>Test the process for fairness<\/h2>\n<p>Evaluate the workflow, not only individual outputs.<\/p>\n<ol class=\"steps\"><li><b>Compare each AI task with the approved criteria<\/b><span>Claude may extract a cost or find a statement about accounts supported. It should not turn missing information, writing style or visibility into a judgement about readiness.<\/span><\/li><li><b>Look at who gains and who carries the burden<\/b><span>A ranking can steer scarce funding to people already able to produce extensive paperwork.<\/span><\/li><li><b>Check accessibility<\/b><span>Forms, outcome notices and correction routes should not assume everyone can work through a complex process or write in one preferred style.<\/span><\/li><\/ol>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"transparency\">Transparency<\/span> matters when AI involvement materially affects what people receive, how they are assessed or how they can respond. How much to disclose depends on what the audience expects, what the rules require and what is at stake. Here applicants should be told that Claude organised the submitted information, that panel members applied the approved criteria, and that no automated ranking decided the awards.<\/p>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"contestability\">Contestability<\/span> means a person has a practical way to identify and challenge an error or a process problem. \"Decisions are final\" does not provide one. A real route says what can be corrected, how to raise a concern, who reviews it, and whether that reviewer can change the record or reconsider the decision.<\/p>\n<h2>Use Claude for bounded evidence organisation<\/h2>\n<p>The narrowest useful change is to take out automated scoring, ranking, recommendation and proxy-based inference. Claude can still save the panel real effort by producing a consistent evidence sheet per application. A blank field or \"Not supplied\" is more accurate than a plausible guess.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revised prompt<\/span><\/figcaption><pre>Using only the application materials provided, create one\nevidence sheet per application. For each approved criterion, list\nthe relevant submitted evidence and name the field it came from.\nDo not score, rank, recommend, or infer the applicant's quality.\nDo not use writing style, attachment count, certifications\nalready held or visibility as criteria. Where relevant\ninformation is absent, write \"Not supplied\". Use neutral\nlanguage.<\/pre><\/figure>\n<p>The panel then applies the approved criteria itself. Meaningful <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"human-gate\">human oversight<\/span> is more than somebody clicking approve. Reviewers need the authority to reject Claude's organisation of the material, access to the original application, enough time to compare the two, and permission to ask for clarification where the process allows it.<\/p>\n<figure class=\"doc\"><figcaption>Revised review workflow<\/figcaption><pre>1. Claude creates a neutral evidence sheet from each application.\n2. A panel member compares each sheet with the original.\n3. The panel discusses and applies the four approved criteria.\n4. The panel records each decision and the criterion-based reason.\n5. Applicants get an outcome notice that explains how AI was used.\n6. Applicants can ask for a factual error to be corrected or\n   raise a concern about the process. Someone who was not on the\n   panel checks the record and documents the response.<\/pre><\/figure>\n<p>The independent check in step 6 supports accountability, because the person looking at a challenge can examine the evidence and the process. They are not just restating the original result.<\/p>\n<h
