<\/pre><\/figure>\n<p>Three rounds, three named defects, and nothing that was correct got disturbed along the way. Whether the notice is fit to send is still your decision, not Claude's.<\/p>\n<h2>Use a rubric to compare<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"rubric\">rubric<\/span> turns \"is this good?\" into a list of visible checks. Ask Claude to compare the draft against it and quote the text it relied on. Then look yourself. Claude can point out apparent omissions and unclear wording. It does not replace the judgement needed to approve a customer communication.<\/p>\n<figure class=\"prompt\"><figcaption><span>Rubric check<\/span><\/figcaption><pre>Compare the current draft against this rubric:\n- States the portal requirement\n- States what happens to email and chat requests\n- Includes the emergency route when the portal is unavailable\n- Does not promise approval\n- Separates the standard rule from the discretionary review\nList any criterion that is not met and quote the relevant draft text.<\/pre><\/figure>\n<h2>Follow up, or start again?<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Follow up when<\/th><th>Start a new conversation when<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Follow up when\">The conversation holds reliable source material<\/td><td data-l=\"Start a new conversation when\">Old drafts keep leaking into new answers<\/td><\/tr><tr><td data-l=\"Follow up when\">Your instructions have stayed consistent<\/td><td data-l=\"Start a new conversation when\">Replaced or conflicting instructions are piling up<\/td><\/tr><tr><td data-l=\"Follow up when\">You are changing one thing in a sound draft<\/td><td data-l=\"Start a new conversation when\">Corrections stop sticking<\/td><\/tr><\/tbody><\/table><\/div>\n<p>That second column describes <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"context-drift\">context drift<\/span>. When you restart, give the new conversation the authoritative source, the current draft if it is worth keeping, and the exact goal. A restart clears clutter. It does not supply facts the source never had.<\/p>","takeaways":["Inspect and classify the problem before you revise. The defect type tells you the fix.","Change one thing per round, and say explicitly what to keep.","A knowledge gap is fixed by supplying the fact, never by asking for more detail.","Use a rubric to compare drafts, then check it yourself. Approval stays with a person.","Follow up while the context is sound. Start fresh when it has drifted."],"practice":"Take a draft an AI tool gave you that was not quite right. Write down the single main defect and its type from the table. Then write a follow-up that names what to keep and the one change to make.","deck":"decks/03-iterating-prompts.html","quiz":[{"q":"A draft notice is accurate and concise, but it leaves out an exception that is clearly stated in the source you supplied. What kind of defect is this?","multi":false,"o":[{"t":"A knowledge gap.","ok":false,"why":"A knowledge gap means the source does not contain the answer. Here it does."},{"t":"A completeness defect: the prompt did not require every material point to be covered.","ok":true,"why":"The fact was available and simply was not asked for. A targeted follow-up fixes it."},{"t":"A tone defect.","ok":false,"why":"The tone was described as professional and suitable. Nothing about voice is wrong."},{"t":"An unsupported claim.","ok":false,"why":"Everything in the draft is supported. The problem is what is absent, not what is asserted."}]},{"q":"Which follow-up is most likely to fix that draft without damaging the parts that work?","multi":false,"o":[{"t":"\"Make it better.\"","ok":false,"why":"This names no defect and no standard. Claude may change tone or length and still omit the exception."},{"t":"\"Rewrite it from scratch with more detail.\"","ok":false,"why":"A full rewrite puts the correct sentences at risk and invites extra content the source does not support."},{"t":"\"Keep the tone and the two accurate statements. Add the emergency route. Do not imply approval.\"","ok":true,"why":"It preserves what is sound, names the one change and guards against the obvious overclaim."},{"t":"\"Be more creative.\"","ok":false,"why":"Creativity is not what a policy notice is missing, and it encourages invention."}]},{"q":"The notice needs to state how quickly emergency requests are answered. The approved procedure does not say. What should you do?","multi":false,"o":[{"t":"Ask Claude for a more detailed draft.","ok":false,"why":"Detail cannot come from nowhere. Claude would have to make a figure up."},{"t":"Start a new conversation and try again.","ok":false,"why":"A restart clears clutter. It does not add a fact the source never contained."},{"t":"Ask Claude what response time is typical for this kind of request.","ok":false,"why":"A typical figure is not your organisation's commitment, and publishing it would create one."},{"t":"Get the figure from whoever owns the procedure, or have the notice say it is not specified.","ok":true,"why":"This is a knowledge gap. The only real fix is to supply the fact or report its absence."}]},{"q":"Which TWO situations are good reasons to start a new conversation instead of sending another follow-up?","multi":true,"o":[{"t":"Several instructions have been replaced and now conflict with each other.","ok":true,"why":"Conflicting directions in the history make focused revision unreliable. A clean start with the current instructions fixes that."},{"t":"One sentence is missing from an otherwise sound draft.","ok":false,"why":"That is exactly what a narrow follow-up is for. The context is fine."},{"t":"Claude keeps bringing back wording from old drafts after being corrected.","ok":true,"why":"That is context drift. The accumulated drafts are steering the output."},{"t":"The source document lacks a fact you need.","ok":false,"why":"A new conversation will have the same gap. The fact has to be supplied."}]},{"q":"You ask Claude to compare a draft against a five-point rubric. It reports that all five criteria are met. What is the right next step?","multi":false,"o":[{"t":"Send the draft. It passed.","ok":false,"why":"Claude's assessment is an aid. Approval of a customer communication stays with a person."},{"t":"Check the text Claude quoted against each criterion yourself, then decide.","ok":true,"why":"The rubric makes the checks visible so that you can verify them. The judgement is still yours."},{"t":"Drop the rubric next time, since Claude handles it.","ok":false,"why":"The rubric is what makes the comparison reviewable. Removing it removes your standard."},{"t":"Ask Claude to assess it again until it finds a problem.","ok":false,"why":"Repeating the request without a reason invites invented faults. Verify the evidence instead."}]}]},"4":{"lead":"The same facts can feed four different jobs. Each job needs different instructions, and each is judged by a different standard.","html":"<h2>Say what kind of work it is<\/h2>\n<p>A prompt should describe the kind of work Claude has to do, not only the topic. There are four kinds the exam cares about.<\/p>\n<dl class=\"defs\"><div><dt>Analysis<\/dt><dd>Narrows evidence you already have into a decision. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"analysis\">Definition.<\/span><\/dd><\/div><div><dt>Research<\/dt><dd>Finds evidence and shows where each piece came from. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"research\">Definition.<\/span><\/dd><\/div><div><dt>Drafting<\/dt><dd>Turns approved facts into communication for a defined reader. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"drafting\">Definition.<\/span><\/dd><\/div><div><dt>Brainstorming<\/dt><dd>Produces a wide spread of options before anyone chooses. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"brainstorming\">Definition.<\/span><\/dd><\/div><\/dl>\n<p>They can all use the same source material and still pull in different directions. \"State only conclusions the evidence supports\" protects an analysis from overclaiming. The same instruction strangles a brainstorm, where the whole point is variety and an untested idea may be worth a look later.<\/p>\n<p class=\"pull\">Name the work product first. Then set instructions and a standard that fit it.<\/p>\n<h2>One fact pack, four prompts<\/h2>\n<p>Your team keeps getting called out after hours for low disk space alerts. You have to recommend an approach to the service manager.<\/p>\n<figure class=\"doc\"><figcaption>Fact pack<\/figcaption><pre>Callout fact pack: low disk space alerts\n\nScope\n- 61 Windows servers under after-hours monitoring\n- An alert fires at 10% free space on any volume\n\nLast quarter (1 August to 31 October)\n- 41 after-hours callouts came from disk alerts:\n  log file growth: 23; temp and cache files: 11; real data growth: 7\n- No automated cleanup was in place.\n\nConstraints\n- No new tooling spend above $500.\n- Alert thresholds cannot change without change board approval.\n- Recommendation due to the service manager by 5 December.<\/pre><\/figure>\n<p>The fact pack supports statements about scope, last quarter's counts and the constraints. It does not say why logs grew, what any fix costs, or what next quarter will look like. Those are open questions or jobs for later research.<\/p>\n<h2>Analysis: start from the decision<\/h2>\n<p>An analysis prompt names the decision, the things being compared, the dimensions to compare them on, the limits of the source, and how to lay out the reasoning. You are not asking Claude to discover facts. You are asking it to make the supplied facts useful for a bounded choice.<\/p>\n<figure class=\"prompt\"><figcaption><span>Analysis prompt<\/span><\/figcaption><pre>Using only the fact pack, analyse which callout cause to tackle first:\nlog file growth, temp and cache files, or real data growth.\n\nCompare them by callout count, what evidence is missing, fit with the\n$500 cap, and whether a fix would need a threshold change. Do not infer\nwhy any of them happens. List assumptions separately. End with a ranked\nrecommendation and a short reason.<\/pre><\/figure>\n<figure class=\"out \"><figcaption>What Claude returned<\/figcaption><pre>1. Log file growth: 23 of 41 callouts. Largest share. No cost stated.\n2. Temp and cache files: 11 of 41. Second. No cost stated.\n3. Real data growth: 7 of 41. Smallest. Cleanup would not address it.\n\nAssumptions: last quarter is a reasonable guide for planning. It is\nnot a forecast.\nRecommendation: start with log file growth. Hold any spend until\nresearch shows what a fix costs.<\/pre><\/figure>\n<h2>Research: make evidence traceable<\/h2>\n<p>A research prompt defines a question and a boundary for gathering evidence: the scope, how recent a source has to be (<span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"recency\">recency<\/span>), which sources count, how to cite them (<span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"citation\">citation<\/span>), and how to report what could not be found.<\/p>\n<figure class=\"prompt\"><figcaption><span>Research prompt<\/span><\/figcaption><pre>Research what the fact pack can establish about disk alert callouts\nfor the December recommendation.\n\nUse only the fact pack, and treat last quarter as the most recent\nevidence available. Cite each finding by fact pack heading. List\nunresolved questions separately from findings. Do not use outside\nsources and do not estimate future callouts.<\/pre><\/figure>\n<figure class=\"out \"><figcaption>What Claude returned<\/figcaption><pre>Findings\n- 41 after-hours callouts came from disk alerts. [Last quarter]\n- Log growth caused 23, temp and cache 11, data growth 7. [Last quarter]\n- No automated cleanup was in place. [Last quarter]\n\nUnresolved\n- No source says which servers the callouts came from.\n- No source says why logs grew or which applications wrote them.\n- No source gives the cost of any fix beyond the $500 cap.<\/pre><\/figure>\n<p>The \"Unresolved\" list is a result in its own right. It tells you what evidence you would need before making a stronger claim.<\/p>\n<h2>Brainstorming: go wide, judge later<\/h2>\n<p>A brainstorming prompt asks for possibilities, not one justified conclusion. Categories stop the list clustering around the obvious tactic. Hard constraints keep the ideas usable. Holding back evaluation stops early criticism from shrinking the set.<\/p>\n<figure class=\"prompt\"><figcaption><span>Brainstorming prompt<\/span><\/figcaption><pre>Brainstorm 12 ways to reduce after-hours disk alert callouts, using\nthe fact pack.\n\nSpread them across cleanup automation, alert handling, capacity, and\nprocess. Respect the $500 cap and the threshold rule. Aim for clearly\ndifferent approaches, including some that need research first. Do not\nrank, reject or recommend anything yet.<\/pre><\/figure>\n<figure class=\"out \"><figcaption>What Claude returned<\/figcaption><pre>- Scheduled log cleanup on the affected servers\n- Log rotation settings reviewed per application\n- Scheduled temp and cache cleanup\n- Alert routed to a morning queue when free space is stable\n- A business-hours weekly free-space review\n- Runbook step so the first responder can clear logs safely\n- Capacity request for volumes with real data growth\n- Trend report to spot volumes that will alert next month\n- Propose a threshold change to the change board\n- Compress old logs before deleting them\n- Move application logs to a separate volume\n- Monthly check that cleanup jobs are still running<\/pre><\/figure>\n<p>Note that \"propose a threshold change to the change board\" is on the list. The constraint says thresholds cannot change <em>without<\/em> approval, so asking for approval is a legitimate option. A brainstorm respects constraints. It does not have to avoid everything near them.<\/p>\n<h2>Drafting: write for the reader<\/h2>\n<p>Drafting comes after the facts and the direction are agreed. The prompt defines the reader, the purpose, the voice, what may and may not be claimed, the format, and what to revise for.<\/p>\n<figure class=\"prompt\"><figcaption><span>Drafting prompt<\/span><\/figcaption><pre>Draft an email to the service manager recommending a first step on\ndisk alert callouts.\n\nPurpose: get agreement to pilot scheduled log cleanup. State the 41\ncallouts last quarter and the three-way split. Do not promise a\nreduction figure and do not propose a threshold change. Format: subject\nline, then a body under 150 words in plain language, ending with one\nclear request.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>What Claude returned<\/figcaption><pre>Subject: Proposal to pilot scheduled log cleanup\n\nLast quarter we had 41 after-hours callouts from low disk space alerts.\nLog file growth accounted for 23, temp and cache files for 11, and real\ndata growth for 7. No automated cleanup was in place.\n\nI recommend we pilot scheduled log cleanup first, as it addresses the\nlargest group. This needs no change to alert thresholds. I do not yet\nhave evidence for how many callouts it would remove, so the pilot would\nmeasure that.\n\nCould you approve a pilot so we can report results in the new year?<\/pre><\/figure>\n<h2>Judge each one by the right standard<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Kind of work<\/th><th>The prompt defines<\/th><th>It is good when<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Kind of work\">Analysis<\/td><td data-l=\"The prompt defines\">Decision, options, comparison dimensions, assumptions, reasoning structure<\/td><td data-l=\"It is good when\">The comparison fits the decision, the reasoning is visible, and conclusions stay inside the evidence<\/td><\/tr><tr><td data-l=\"Kind of work\">Research<\/td><td data-l=\"The prompt defines\">Question, scope, recency, acceptable sources, citations, how to report unknowns<\/td><td data-l=\"It is good when\">Every finding traces to an acceptable source and the unknowns are listed<\/td><\/tr><tr><td data-l=\"Kind of work\">Drafting<\/td><td data-l=\"The prompt defines\">Reader, purpose, voice, factual limits, format, revision criteria<\/td><td data-l=\"It is good when\">It fits the audience, purpose, voice, facts and format<\/td><\/tr><tr><td data-l=\"Kind of work\">Brainstorming<\/td><td data-l=\"The prompt defines\">Quantity, categories, hard constraints, no ranking yet<\/td><td data-l=\"It is good when\">The ideas are varied, respect the constraints and have not been filtered early<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Do not mark all four as if they were final recommendations. The analysis ranks, because ranking was asked for. The research refuses to turn last quarter into a forecast. The email gives numbers and one request without adding anything the fact pack cannot support. The brainstorm is a good brainstorm because it is varied, not because each idea is proven.<\/p>\n<aside class=\"note\"><b>Common mismatch<\/b><p>\"Give only verified conclusions\" belongs in research and analysis. In a brainstorm, apply it to the hard constraints only, never as a filter on untested ideas.<\/p><\/aside>\n<h2>Chain them in a sensible order<\/h2>\n<ol class=\"steps\"><li><b>Brainstorm<\/b><span>Get a broad set of options while enforcing the constraints that cannot move.<\/span><\/li><li><b>Research<\/b><span>Look into the promising ones, with stated source and recency rules.<\/span><\/li><li><b>Analyse<\/b><span>Compare the evidence against the real decision criteria.<\/span><\/li><li><b>Draft<\/b><span>Write for the reader, using approved facts and the chosen direction.<\/span><\/li><\/ol>\n<p>This is <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"chaining\">prompt chaining<\/span>, and a person reviews at each handover. Someone decides which ideas are worth researching, whether the sources are good enough, whether each <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"assumption\">assumption<\/span> is acceptable, and whether the draft can go out.<\/p>","takeaways":["Analysis makes a decision: define the options, the comparison and the assumptions.","Research makes evidence traceable: set scope, sources, recency, citations and how to report unknowns.","Drafting serves a reader: set purpose, voice, factual limits and format.","Brainstorming widens the options: ask for variety first, evaluate later.","Chain them brainstorm, research, analyse, draft, with a person checking each handover."],"practice":"Take one problem your team is working on. Write four one-line prompts for it: one each for brainstorming, research, analysis and drafting. Check that each asks for a different kind of result.","deck":"decks/04-adapting-prompts.html","quiz":[{"q":"Which instruction belongs in a brainstorming prompt?","multi":false,"o":[{"t":"\"State only conclusions supported by the supplied evidence.\"","ok":false,"why":"That protects analysis from overclaiming. In a brainstorm it removes the untested ideas you are looking for."},{"t":"\"Cite each finding by source heading.\"","ok":false,"why":"Citations make research traceable. Brainstormed ideas are not findings."},{"t":"\"Give 12 clearly different approaches across four categories. Do not rank or reject any yet.\"","ok":true,"why":"Quantity, spread across categories and delayed evaluation are what keep a brainstorm wide."},{"t":"\"Keep the body under 150 words with a subject line.\"","ok":false,"why":"That is a format requirement for a draft, not for generating options."}]},{"q":"A research output is good when:","multi":false,"o":[{"t":"it ends with a single confident recommendation.","ok":false,"why":"Recommending is the job of analysis. Research supplies and traces the evidence."},{"t":"each finding can be traced to an acceptable source, and what remains unknown is listed.","ok":true,"why":"Traceability and an honest list of gaps are the standard for research."},{"t":"it contains as many ideas as possible.","ok":false,"why":"Breadth of ideas is the standard for brainstorming."},{"t":"it reads well for a non-technical audience.","ok":false,"why":"Fit to a reader is the standard for drafting."}]},{"q":"You ask for an analysis using only the fact pack. Claude writes: \"Log growth is caused by verbose debug logging left on after a release.\" What is the problem?","multi":false,"o":[{"t":"The analysis is too short.","ok":false,"why":"Length is not the issue. One sentence can overstep the evidence."},{"t":"It should have included more ideas.","ok":false,"why":"Generating ideas is brainstorming. The request was for analysis."},{"t":"It states a cause the fact pack does not support.","ok":true,"why":"The fact pack gives counts, not causes. This is a conclusion outside the evidence boundary, which is the main failure for analysis."},{"t":"It should have been written as an email.","ok":false,"why":"Format belongs to drafting and is unrelated to the unsupported claim."}]},{"q":"A team needs options, evidence, a decision and then a message to the customer. What order should the four kinds of prompt run in?","multi":false,"o":[{"t":"Draft, analyse, research, brainstorm.","ok":false,"why":"Drafting first means writing a message before any decision or evidence exists."},{"t":"Research, brainstorm, draft, analyse.","ok":false,"why":"Research needs options to investigate, and a draft should follow the decision."},{"t":"Analyse, brainstorm, research, draft.","ok":false,"why":"There is nothing to analyse until options exist and evidence has been gathered."},{"t":"Brainstorm, research, analyse, draft.","ok":true,"why":"Widen the options, gather evidence on the promising ones, decide, then communicate."}]},{"q":"Which TWO items belong in a drafting prompt?","multi":true,"o":[{"t":"The intended reader and the purpose of the message.","ok":true,"why":"A draft is judged by whether it helps a particular reader understand and act."},{"t":"How recent a source must be to count.","ok":false,"why":"Recency rules belong in a research prompt."},{"t":"The required format and length.","ok":true,"why":"Layout and length are part of what makes a draft fit for its use."},{"t":"An instruction not to rank the ideas.","ok":false,"why":"Holding back evaluation is a brainstorming instruction."}]}]},"5":{"lead":"A memo can be well written, confident and correct in every number it quotes, and still recommend the wrong vendor. What it leaves out matters as much as what it says.","html":"<h2>Fluency is not evidence<\/h2>\n<p>A clear memo looks reliable because it uses professional language, logical headings and confident conclusions. Those describe the presentation. They say nothing about whether a claim is true, whether required information is missing, or whether the memo does the job it was asked to do. So review starts with the source material and the requested result, not with an impression of the writing.<\/p>\n<p>Check an output on six separate dimensions:<\/p>\n<dl class=\"defs\"><div><dt>Factual accuracy<\/dt><dd>Does each claim match the supplied evidence or an authoritative outside source?<\/dd><\/div><div><dt>Completeness<\/dt><dd>Are all the required facts, criteria and requested parts there?<\/dd><\/div><div><dt>Relevance<\/dt><dd>Does the content help answer the stated task?<\/dd><\/div><div><dt>Internal consistency<\/dt><dd>Do the claims, numbers and conclusions agree with each other?<\/dd><\/div><div><dt>Instruction compliance<\/dt><dd>Did it follow the constraints: format, scope, recommendation rules, evidence boundary?<\/dd><\/div><div><dt>Audience fitness<\/dt><dd>Does the reader get enough context, the right terminology and a level of detail they can act on?<\/dd><\/div><\/dl>\n<p>An output can be accurate and incomplete, complete and badly targeted, or pleasant in tone and non-compliant with its instructions.<\/p>\n<p class=\"pull\">Accept an output only after checking what it says, what it leaves out, and whether it serves the decision it was requested for.<\/p>\n<h2>Worked example: three patching tool vendors<\/h2>\n<p>You have to write a short memo for the service delivery manager comparing three patch management tools. A vendor is eligible only if it meets every mandatory criterion. The memo must identify the eligible vendors and recommend one of them, using only the supplied information.<\/p>\n<figure class=\"doc\"><figcaption>Requirement set<\/figcaption><pre>Task: prepare a short comparison memo for the service delivery\nmanager.\nRequired: identify the eligible vendors and recommend one\neligible vendor.\nEvidence boundary: use only this table.\n\nMandatory eligibility criteria\n1. Annual subscription cost must be $120,000 or less.\n2. The vendor must hold ISO 27001 certification.\n3. Standard deployment must take 30 calendar days or fewer.\n\nVendor     Annual cost  ISO 27001  Deployment  Uptime\nKestrel    $108,000     No         21 days     99.95%\nRidgeway   $116,000     Yes        28 days     99.90%\nTarn       $122,000     Yes        20 days     99.99%<\/pre><\/figure>\n<p>This record is the authority for the review. It holds both the vendor facts and the instructions Claude has to follow. No capability, deployment risk or business preference may be inferred if it is not in the record.<\/p>\n<p>The table supports one precise conclusion. Kestrel meets the cost and deployment limits and lacks the required certification. Tarn has the certification and the fastest deployment and is over the cost limit. <strong>Ridgeway is the only vendor that meets all three.<\/strong> That follows from the facts supplied, not from writing quality or general assumptions about vendors.<\/p>\n<h2>Build the review rubric first<\/h2>\n<p>Before accepting an output, or comparing several, turn the task into a review <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"rubric\">rubric<\/span>: a short, task-specific set of checks used to make acceptance decisions consistently. It stops a reviewer praising a well-written answer while missing the requirement that decides whether it can be used.<\/p>\n<ul><li>Every cost, certification, deployment and uptime claim matches the source table.<\/li><li>Each vendor is assessed against all three mandatory criteria.<\/li><li>The memo says explicitly which vendors are eligible.<\/li><li>The recommendation names an eligible vendor and gives reasons the source supports.<\/li><li>The memo is concise and understandable for the service delivery manager.<\/li><\/ul>\n<p>Every recommendation needs traceable support. If a task uses outside information, trace important claims to a named authoritative source such as an approved policy, a signed contract or current vendor documentation. If the task is limited to supplied material, general knowledge does not count as evidence.<\/p>\n<aside class=\"note\"><b>Defect or preference?<\/b><p>Writing \"annual cost\" for \"annual subscription cost\" keeps the meaning, because the source has only one annual cost. Leaving out the certification requirement changes the eligibility decision. Defects affect meaning, compliance or usefulness. Harmless preferences do not.<\/p><\/aside>\n<h2>Test the memo against the record<\/h2>\n<figure class=\"out bad\"><figcaption>What Claude returned<\/figcaption><pre>To: Service Delivery Manager\nSubject: Patch management tool comparison\n\nKestrel offers the lowest annual subscription cost at $108,000\nand a 21-day deployment. Ridgeway costs $116,000 with a 28-day\ndeployment. Tarn has the highest uptime at 99.99%, but costs\n$122,000 a year.\n\nKestrel is the strongest option because it has the lowest cost\nand a faster deployment than Ridgeway. I recommend selecting\nKestrel.<\/pre><\/figure>\n<p>None of the numbers contradicts the source. Kestrel is the cheapest and deploys in 21 days. Ridgeway costs $116,000 and takes 28 days. Tarn has the highest uptime and costs $122,000. That makes the omission easy to miss on a quick read.<\/p>\n<p>So do not start by asking whether any sentence looks wrong. Map each source requirement and important source fact to a place in the output.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Source requirement or fact<\/th><th>Present?<\/th><th>Finding<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Source requirement or fact\">Kestrel cost: $108,000<\/td><td data-l=\"Present?\">Yes<\/td><td data-l=\"Finding\">Accurate<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Kestrel deployment: 21 days<\/td><td data-l=\"Present?\">Yes<\/td><td data-l=\"Finding\">Accurate<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Ridgeway cost: $116,000<\/td><td data-l=\"Present?\">Yes<\/td><td data-l=\"Finding\">Accurate<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Ridgeway deployment: 28 days<\/td><td data-l=\"Present?\">Yes<\/td><td data-l=\"Finding\">Accurate<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Tarn cost: $122,000<\/td><td data-l=\"Present?\">Yes<\/td><td data-l=\"Finding\">Accurate<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Tarn uptime: 99.99%<\/td><td data-l=\"Present?\">Yes<\/td><td data-l=\"Finding\">Accurate<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">ISO 27001 status for all vendors<\/td><td data-l=\"Present?\">No<\/td><td data-l=\"Finding\">Mandatory criterion omitted<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Eligibility against all three criteria<\/td><td data-l=\"Present?\">No<\/td><td data-l=\"Finding\">Required assessment omitted<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Identify eligible vendors<\/td><td data-l=\"Present?\">No<\/td><td data-l=\"Finding\">Instruction not followed<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Recommend an eligible vendor<\/td><td data-l=\"Present?\">No<\/td><td data-l=\"Finding\">Kestrel is not eligible<\/td><\/tr><tr><td data-l=\"Source requirement or fact\">Ready for the audience<\/td><td data-l=\"Present?\">Partly<\/td><td data-l=\"Finding\">Concise, but the decision is unusable<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The matrix separates \"nothing is obviously wrong\" from \"everything required is present\". The included claims are accurate. The certification criterion and the eligibility assessment are missing, and that makes the recommendation non-compliant. Kestrel cannot be recommended, because the source says outright that it does not hold ISO 27001.<\/p>\n<aside class=\"note\"><b>Review finding<\/b><p>An omission can produce a materially wrong business decision even when every statement that was included is correct.<\/p><\/aside>\n<h2>Correct the result without changing the evidence<\/h2>\n<p>The narrow correction is to put back the omitted criteria and revise only the conclusion the full record does not support. Do not add claims about security risk, product quality or vendor suitability beyond the mandatory screen. None of that was supplied.<\/p>\n<figure class=\"out good\"><figcaption>Corrected memo<\/figcaption><pre>To: Service Delivery Manager\nSubject: Patch management tool comparison\n\nThe mandatory criteria are an annual cost of $120,000 or less,\nISO 27001 certification, and deployment within 30 calendar days.\n\nKestrel costs $108,000 and deploys in 21 days, but does not hold\nISO 27001 certification. Tarn holds ISO 27001 certification and\ndeploys in 20 days, but its annual cost is $122,000. Neither\nvendor is eligible.\n\nRidgeway costs $116,000, holds ISO 27001 certification and\ndeploys in 28 days. Ridgeway is the only eligible vendor and is\nrecommended.<\/pre><\/figure>\n<p>This version is more useful because it answers the decision that was asked for, not because it is longer. It traces eligibility to every mandatory criterion, rules vendors out without inventing reasons, and recommends the one vendor the source supports. A person is still responsible for deciding whether the requirement set itself is adequate before any purchase goes ahead.<\/p>\n<h2>A repeatable acceptance process<\/h2>\n<p>The same method works for summaries, policy drafts, analyses and comparisons.<\/p>\n<ol class=\"steps\"><li><b>Identify the frame<\/b><span>Purpose, audience, instructions and evidence boundary. Keep source facts apart from prompt instructions.<\/span><\/li><li><b>List what is required<\/b><span>The required facts and the required parts of the output.<\/span><\/li><li><b>Check the claims<\/b><span>Mark each required fact and criterion as present, absent, accurate or unsupported.<\/span><\/li><li><b>Look for what is missing<\/b><span>Investigate omissions even when the prose is polished.<\/span><\/li><li><b>Correct from evidence<\/b><span>Only with what the source, or an authorised outside record, supports.<\/span><\/li><li><b>Accept against the rubric<\/b><span>Only when it meets the task-specific checks.<\/span><\/li><\/ol>\n<p>Spend review effort in proportion to consequence. A typo in a low-stakes internal draft is a presentation issue. A missing mandatory criterion in a vendor recommendation can change what gets bought. When an output influences an approval, compliance, a financial commitment or an operational action, use a documented rubric and require human review before it is used.<\/p>","takeaways":["Professional wording does not prove accuracy or complete coverage.","Check accuracy, completeness, relevance, consistency, instruction compliance and audience fitness separately.","Write the rubric from the task before you read the output.","Map every requirement to the output. A matrix exposes what a quick read misses.","Correct from the evidence supplied, and do not invent the missing context."],"practice":"Take a recent AI-drafted summary or recommendation and the request behind it. List every requirement in the request, then mark each as present, absent, accurate or unsupported in the output. Note anything you only spotted because you made the list.","deck":"decks/05-accuracy-and-completeness.html","quiz":[{"q":"A memo quotes six figures and all six match the source. What has that established?","multi":false,"o":[{"t":"The memo is ready to send.","ok":false,"why":"Accurate included claims say nothing about what was left out."},{"t":"The recommendation is sound.","ok":false,"why":"A recommendation can rest on accurate figures and still ignore a mandatory criterion."},{"t":"Partial accuracy. Completeness and instruction compliance still have to be checked.","ok":true,"why":"The dimensions are separate. Accuracy of what is present does not cover what is absent."},{"t":"The memo is complete.","ok":false,"why":"Completeness is about required items being present, which has not been checked."}]},{"q":"A vendor must meet three mandatory criteria. The memo recommends the cheapest vendor and never mentions certification, which that vendor lacks. What is the defect?","multi":false,"o":[{"t":"A stylistic preference.","ok":false,"why":"It changes the decision, so it is a defect and not a preference."},{"t":"An omission that makes the recommendation non-compliant.","ok":true,"why":"A mandatory criterion was left out, so an ineligible vendor was recommended."},{"t":"A factual error in the cost figures.","ok":false,"why":"The figures quoted are correct."},{"t":"A formatting problem.","ok":false,"why":"The layout is not the issue."}]},{"q":"When should the review rubric be written?","multi":false,"o":[{"t":"After reading the output, so it fits what was produced.","ok":false,"why":"That lets the output set the standard it is judged by."},{"t":"Only if the output looks wrong.","ok":false,"why":"The dangerous outputs are the ones that look right."},{"t":"It is not needed for short memos.","ok":false,"why":"Length does not decide consequence."},{"t":"Before accepting or comparing outputs, from the task and its requirements.","ok":true,"why":"A rubric built from the task keeps acceptance decisions consistent and catches missing requirements."}]},{"q":"Which change to an output is a harmless preference and not a defect?","multi":false,"o":[{"t":"Writing \"annual cost\" where the source says \"annual subscription cost\", when there is only one annual cost.","ok":true,"why":"The meaning is preserved, so nothing about the decision changes."},{"t":"Dropping one of the mandatory criteria.","ok":false,"why":"That changes the eligibility decision."},{"t":"Recommending a vendor that fails a criterion.","ok":false,"why":"That breaks the instruction to recommend an eligible vendor."},{"t":"Adding a claim about product quality that the source does not contain.","ok":false,"why":"That is an unsupported claim outside the evidence boundary."}]},{"q":"The memo wrongly recommends an ineligible vendor. Which TWO belong in a narrow correction?","multi":true,"o":[{"t":"Put back the omitted criterion and assess every vendor against all three.","ok":true,"why":"It restores what the record requires."},{"t":"Add a paragraph on each vendor's general security reputation.","ok":false,"why":"Nothing about reputation was supplied."},{"t":"Change the recommendation to the vendor the full record supports.","ok":true,"why":"Only the unsupported conclusion is revised."},{"t":"Rewrite the whole memo in a more formal tone.","ok":false,"why":"Tone was not the defect."}]}]},"6":{"lead":"Most of a generated summary can be right while one invented deadline rides along with it. The job is to check each claim against the source, not to judge how the whole thing sounds.","html":"<h2>What makes a claim unsupported<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"hallucination\">hallucination<\/span> is generated content presented as fact without adequate support. Whether it sounds reasonable is irrelevant. Whether it is written formally is irrelevant. Whether it might be true somewhere else is irrelevant. The only test is whether the authoritative material you have supports the statement, at the strength and level of detail used.<\/p>\n<p>In business work these slip into summaries, reports and policy explanations. A summary can state the main rule correctly and add a deadline, a clause number, a penalty or a reason that nobody supplied. That is what makes it risky: nearly all of it checks out.<\/p>\n<p class=\"pull\">Specificity requires specific evidence.<\/p>\n<p>Some kinds of claim deserve a closer look because their precision makes them feel authoritative:<\/p>\n<ul><li>exact citations and clause numbers<\/li><li>quotations<\/li><li>statistics and dates<\/li><li>names<\/li><li>product capabilities<\/li><li>legal or policy provisions<\/li><li>causes and reasons<\/li><\/ul>\n<p>Saying a rule exists is one claim. Saying it sits in subsection (b), carries a set penalty and exists for a stated reason is four claims, and each needs its own support.<\/p>\n<h2>Worked example: the restore testing summary<\/h2>\n<p>You have been asked to check a Claude-written summary before it goes to team leads. This excerpt is the only source you were given, so it is the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"evidence-boundary\">evidence boundary<\/span>. Common practice and sensible guesses do not count.<\/p>\n<figure class=\"doc\"><figcaption>Source excerpt<\/figcaption><pre>Server Backup Standard, 5.2 Restore testing\n\nEach team that operates production servers must complete a\nquarterly restore test.\n\nThe test record must identify each server by hostname, name the\nbackup job used, and state whether the restore succeeded. The team\nlead must keep the record for 24 months.\n\nWhen a restore fails, the team lead must notify the backup service\nowner using the internal incident form.<\/pre><\/figure>\n<h2>Classify each claim<\/h2>\n<p>Do not form a general impression. Sort every statement into one of four groups.<\/p>\n<dl class=\"defs\"><div><dt>Supported<\/dt><dd>Stated in the source, or an accurate restatement of it.<\/dd><\/div><div><dt>Unsupported<\/dt><dd>Adds a fact, condition or level of certainty the source does not establish. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"unsupported-claim\">unsupported claim<\/span>.<\/dd><\/div><div><dt>Inference<\/dt><dd>A reasoned interpretation. Acceptable when it is labelled as one. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"inference\">inference<\/span>.<\/dd><\/div><div><dt>Unresolved question<\/dt><dd>Something the source does not answer. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"unresolved\">unresolved question<\/span>.<\/dd><\/div><\/dl>\n<p>Warning signs: a detail you cannot find in the source, wording that differs from the source's own terms, a citation that does not lead to the text it claims, and certainty where the evidence is incomplete.<\/p>\n<figure class=\"out bad\"><figcaption>Summary to review<\/figcaption><pre>Under Server Backup Standard <mark>5.2(b)<\/mark>, teams operating production\nservers must complete a quarterly restore test. Records must list\nhostnames, backup job names and restore results, and must be kept\nfor 24 months.\n\nFailed restores must be reported to the backup service owner\n<mark>within 5 business days<\/mark> through the internal incident form.\n<mark>Failure to comply may result in an audit finding and monthly\ntesting, because untested backups have historically caused data\nloss.<\/mark>\n\nInference: The requirement likely applies only to servers that hold\ncustomer data.\n\nUnresolved question: Does \"quarterly\" mean a calendar quarter or\nevery 90 days?<\/pre><div class=\"mk\">Highlighted text is not in the source.<\/div><\/figure>\n<div class=\"tw\"><table><thead><tr><th>Claim<\/th><th>Verdict<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Claim\">Quarterly restore test for teams with production servers<\/td><td data-l=\"Verdict\">Supported<\/td><td data-l=\"Why\">Stated in the excerpt<\/td><\/tr><tr><td data-l=\"Claim\">Record fields and 24-month retention<\/td><td data-l=\"Verdict\">Supported<\/td><td data-l=\"Why\">Stated in the excerpt<\/td><\/tr><tr><td data-l=\"Claim\">Section 5.2(b)<\/td><td data-l=\"Verdict\">Unsupported<\/td><td data-l=\"Why\">The source shows 5.2 and no subsection (b)<\/td><\/tr><tr><td data-l=\"Claim\">Report within 5 business days<\/td><td data-l=\"Verdict\">Unsupported<\/td><td data-l=\"Why\">No deadline appears anywhere<\/td><\/tr><tr><td data-l=\"Claim\">Audit finding and monthly testing<\/td><td data-l=\"Verdict\">Unsupported<\/td><td data-l=\"Why\">No consequence is stated<\/td><\/tr><tr><td data-l=\"Claim\">Untested backups have caused data loss<\/td><td data-l=\"Verdict\">Unsupported<\/td><td data-l=\"Why\">A cause presented as history, with nothing behind it<\/td><\/tr><tr><td data-l=\"Claim\">Applies only to servers with customer data<\/td><td data-l=\"Verdict\">Inference<\/td><td data-l=\"Why\">Not in the source, and correctly labelled<\/td><\/tr><tr><td data-l=\"Claim\">Calendar quarter or every 90 days?<\/td><td data-l=\"Verdict\">Unresolved question<\/td><td data-l=\"Why\">The source uses the word without defining it<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The causal claim is the most dangerous of the four. It reads like background everyone knows, and it gives the rule a reason the policy owner never gave.<\/p>\n<h2>Confidence is not verification<\/h2>\n<p>Asking Claude whether it is confident checks nothing. Confidence wording is more generated text. It is not a source, a citation check or a policy review. A response can sound certain while resting on an invented detail, and a hedged response can be a perfectly accurate restatement.<\/p>\n<ol class=\"steps\"><li><b>Find the source wording<\/b><span>For each factual statement, locate the exact text that supports it.<\/span><\/li><li><b>Check the detail<\/b><span>Does the source support the scope, timing, consequence and cause as claimed?<\/span><\/li><li><b>Follow citations<\/b><span>Confirm a clause number points to the text it is attached to.<\/span><\/li><li><b>Remove what has no basis<\/b><span>Take out invented deadlines, penalties and reasons.<\/span><\/li><li><b>Label the rest<\/b><span>Mark interpretations as inferences. Keep open questions open.<\/span><\/li><li><b>Escalate meaning<\/b><span>Send unresolved questions about what the policy means to whoever owns it.<\/span><\/li><\/ol>\n<h2>Fix it without filling the gaps<\/h2>\n<p>The corrected version keeps everything supported, removes the invented specifics and leaves the uncertainty where a reader can see it. It does not swap one guess for another.<\/p>\n<figure class=\"out good\"><figcaption>Revised summary<\/figcaption><pre>Teams that operate production servers must complete a quarterly\nrestore test. The test record must identify each server by hostname,\nname the backup job used, and state whether the restore succeeded.\nThe team lead must keep the record for 24 months.\n\nWhen a restore fails, the team lead must notify the backup service\nowner using the internal incident form.\n\nInference, not a policy statement: Teams may need a way to collect\nbackup job names before the test so the record can be completed.\n\nUnresolved question: Does \"quarterly\" mean a calendar quarter or\nevery 90 days? The excerpt does not define the term.<\/pre><\/figure>\n<aside class=\"note\"><b>Removing beats softening<\/b><p>\"May be subject to a penalty\" is still an unsupported claim. If nothing supports a detail, take it out. Hedged wording does not make it true.<\/p><\/aside>\n<p>Those details may well exist in another document. If so, get that document before treating its contents as established.<\/p>","takeaways":["Check each claim against the authoritative source. Do not rate the response as a whole.","Citations, dates, numbers, names, penalties and causes need direct support.","Sort statements into supported, unsupported, inference and unresolved question.","Confidence wording is not evidence. Verify against the source.","Remove unsupported detail. Do not soften it or replace it with a different guess."],"practice":"Take a summary an AI tool wrote for you from a document. Pick the three most specific details in it (a number, a date, a clause or a reason) and find the exact source wording for each. Note any you cannot find.","deck":"decks/06-detecting-hallucinations.html","quiz":[{"q":"A Claude-written policy summary cites \"section 7.4(c)\". The policy excerpt you supplied shows section 7.4 with no subsections. How should the citation be classified?","multi":false,"o":[{"t":"Supported, because section 7.4 exists.","ok":false,"why":"The section exists. The subsection does not, and the citation claims it does."},{"t":"An inference, because subsections are common in policies.","ok":false,"why":"What policies commonly contain is not evidence about this one, and the citation was not labelled as an inference."},{"t":"Unsupported, because the source does not contain that subsection.","ok":true,"why":"A citation has to resolve to the text it points to. This one adds detail the source does not have."},{"t":"An unresolved question.","ok":false,"why":"An unresolved question is something the summary leaves open. Here it asserts a specific reference as fact."}]},{"q":"Which statement in a generated summary is acceptable even though the source does not state it?","multi":false,"o":[{"t":"\"Late reports attract a $500 penalty.\"","ok":false,"why":"A specific penalty stated as fact with no source basis is an unsupported claim."},{"t":"\"Inference, not policy: teams will probably need a shared template for the record.\"","ok":true,"why":"It is clearly labelled as an interpretation, so a reader will not mistake it for the policy text."},{"t":"\"The rule was introduced after several failed audits.\"","ok":false,"why":"This asserts a history and a cause the source does not give."},{"t":"\"Reports are due within 10 business days.\"","ok":false,"why":"A precise deadline needs precise support. None was supplied."}]},{"q":"You ask Claude how confident it is in a summary, and it replies that it is highly confident. What does that tell you?","multi":false,"o":[{"t":"The summary has been verified.","ok":false,"why":"Nothing has been compared with the source."},{"t":"Only the uncertain parts need checking.","ok":false,"why":"The response did not identify any, and unsupported details are often stated most confidently."},{"t":"The summary is probably accurate enough for internal use.","ok":false,"why":"Confidence wording does not measure accuracy at any level of use."},{"t":"Nothing about accuracy. Confidence wording is generated text, not evidence.","ok":true,"why":"Verification means checking each claim against the authoritative source."}]},{"q":"Which TWO kinds of detail most need direct evidence, because their precision makes them sound authoritative?","multi":true,"o":[{"t":"A stated cause for why a rule exists.","ok":true,"why":"Causal explanations read as settled background and are a common place for invention."},{"t":"A sentence that restates the main rule in plain words.","ok":false,"why":"A faithful restatement is supported by the source."},{"t":"An exact deadline or clause number.","ok":true,"why":"Specific figures and references look checked. They need to actually be checked."},{"t":"A heading that organises the summary.","ok":false,"why":"A heading is layout, not a factual claim."}]},{"q":"A summary contains a penalty amount that does not appear in the source. What is the best correction?","multi":false,"o":[{"t":"Remove it. The detail may exist elsewhere, but this source does not establish it.","ok":true,"why":"Taking it out is more accurate than keeping it in any form without evidence."},{"t":"Change it to \"may be subject to a penalty\".","ok":false,"why":"Softer wording still asserts a penalty the source never mentions."},{"t":"Replace it with a more typical amount.","ok":false,"why":"That swaps one invention for another."},{"t":"Leave it and add a note that Claude is confident.","ok":false,"why":"A confidence note adds no support."}]}]},"7":{"lead":"Every sentence can look reasonable on its own while the response as a whole is wrong. This session is about checking how the pieces relate.","html":"<h2>Check relationships, not only facts<\/h2>\n<p>An <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"external-error\">external factual error<\/span> is a statement that conflicts with a reliable source outside the response, such as a wrong published price. An internal inconsistency is when parts of the same response, or the response and its own source, disagree with each other. A response can have no external errors at all and still be unreliable.<\/p>\n<p>A recommendation might quote the right monthly cost in one sentence and work out the wrong unit cost in the next. It might attach one option's figure to the other option's name. These matter because readers act on the final line. They rarely re-check the middle.<\/p>\n<p class=\"pull\">Every conclusion has to keep the figures, definitions and labels the evidence supplied.<\/p>\n<p>Checking <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"internal-consistency\">internal consistency<\/span> means tracing the response from top to bottom. Numbers, units, totals, dates, names, terms and the recommendation all get checked together.<\/p>\n<h2>Worked example: two licensing options<\/h2>\n<p>A customer has to choose between two monitoring licence options. You did the sums and they are on the sheet below. You ask Claude to review a draft recommendation for consistency. The customer's decision owner makes the choice. You and Claude do not.<\/p>\n<figure class=\"doc\"><figcaption>Source sheet<\/figcaption><pre>Monitoring licence comparison sheet\n\nOption A\nMonthly cost: $4,500\nLicences bought: 150\nCovered servers: 150\nCost per covered server: $4,500 / 150 = $30\n\nOption B\nMonthly cost: $3,600\nLicences bought: 80\nCovered servers: 120\nCost per covered server: $3,600 / 120 = $30\n\nDefinition: a covered server is a server the monitoring agent\nis licensed to run on, whether through its own licence or its\nhost's licence. It is not the number of licences bought.<\/pre><\/figure>\n<p>The sheet separates licences bought from covered servers, and that difference matters. Under Option B a host licence covers every virtual server on that host, so 80 licences cover 120 servers.<\/p>\n<p>What the sheet supports is limited. Option A covers more servers. Option B costs less per month. Both cost the same per covered server. It does not say which of those the decision owner cares about, so on its own it cannot support a final pick.<\/p>\n<h2>Three defects to look for<\/h2>\n<dl class=\"defs\"><div><dt>Ambiguous reference<\/dt><dd>The reader cannot tell what a word points to. \"It\" after two options is the usual culprit. So is an undefined label like \"better coverage\". <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"ambiguous-reference\">More.<\/span><\/dd><\/div><div><dt>Terminology shift<\/dt><dd>A key term changes meaning part-way through. Treating covered servers as licences bought still sounds coherent, and it answers a different question. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"terminology-shift\">More.<\/span><\/dd><\/div><div><dt>Unsupported conclusion<\/dt><dd>The stated facts do not justify the conclusion. A lower monthly cost does not prove more coverage, or that an option is the right one.<\/dd><\/div><\/dl>\n<h2>Test the draft against the sheet<\/h2>\n<figure class=\"out bad\"><figcaption>Draft recommendation<\/figcaption><pre>Choose Option B because it <mark>covers 150 servers<\/mark> for $3,600, or\n<mark>$24 per covered server<\/mark>. Option A buys a licence for every server,\nwhile Option B costs less. <mark>It gives better coverage<\/mark> because <mark>a\ncovered server counts each licence bought<\/mark>. <mark>This makes it the right\nchoice.<\/mark><\/pre><div class=\"mk\">Highlighted text is not in the source.<\/div><\/figure>\n<div class=\"tw\"><table><thead><tr><th>Defect<\/th><th>What the draft says<\/th><th>What the sheet says<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Defect\">Wrong label<\/td><td data-l=\"What the draft says\">Option B covers 150 servers<\/td><td data-l=\"What the sheet says\">150 belongs to Option A. Option B covers 120<\/td><\/tr><tr><td data-l=\"Defect\">Wrong calculation<\/td><td data-l=\"What the draft says\">$24 per covered server<\/td><td data-l=\"What the sheet says\">$3,600 / 120 = $30<\/td><\/tr><tr><td data-l=\"Defect\">Terminology shift<\/td><td data-l=\"What the draft says\">A covered server counts each licence bought<\/td><td data-l=\"What the sheet says\">A covered server is one the agent is licensed to run on<\/td><\/tr><tr><td data-l=\"Defect\">Ambiguous reference<\/td><td data-l=\"What the draft says\">\"It gives better coverage\"<\/td><td data-l=\"What the sheet says\">\"It\" could be either option, and \"better\" has no measure<\/td><\/tr><tr><td data-l=\"Defect\">Unsupported conclusion<\/td><td data-l=\"What the draft says\">\"This makes it the right choice\"<\/td><td data-l=\"What the sheet says\">No selection criterion is stated<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"note\"><b>A correct sum can still be wrong<\/b><p>$3,600 divided by 150 really is $24. The arithmetic is fine. It is attached to the wrong option, so the result is still false.<\/p><\/aside>\n<h2>Use Claude for a focused check<\/h2>\n<p>A short verification prompt points Claude at specific kinds of defect and keeps it out of the decision. Treat what comes back as leads. You still confirm each one against the sheet yourself.<\/p>\n<figure class=\"prompt\"><figcaption><span>Verification prompt<\/span><\/figcaption><pre>Compare the draft recommendation with the licence comparison sheet.\nList only:\n1. contradictions in numbers or calculations,\n2. figures attached to the wrong option,\n3. changes to the definition of \"covered server\",\n4. ambiguous references,\n5. conclusions the sheet does not support.\nDo not recommend an option.<\/pre><\/figure>\n<p>The repair states the verified comparison and names the open question. It does not invent a service requirement or pick a side.<\/p>\n<figure class=\"out good\"><figcaption>Corrected result<\/figcaption><pre>Option A costs $4,500 a month for 150 licences and covers 150\nservers. Option B costs $3,600 a month for 80 licences and covers\n120 servers. Each works out at $30 per covered server.\n\nA covered server is one the agent is licensed to run on, through\nits own licence or its host's.\n\nThe decision owner needs to decide whether covering 30 more servers\nunder Option A is worth $900 more a month.<\/pre><\/figure>\n<h2>A review routine for anything with options or figures<\/h2>\n<ol class=\"steps\"><li><b>Match<\/b><span>Tie every number to its source value, unit, time period and option label.<\/span><\/li><li><b>Recalculate<\/b><span>Redo rates, totals, differences and percentages from the inputs shown.<\/span><\/li><li><b>Trace terms<\/b><span>Follow dates, names, headings and defined terms through the whole response.<\/span><\/li><li><b>Pin down references<\/b><span>Replace vague pronouns and undefined comparison words with specific ones.<\/span><\/li><li><b>Test the conclusion<\/b><span>Does the evidence support it, or does it need a criterion nobody stated?<\/span><\/li><li><b>Confirm by hand<\/b><span>Check reported defects against the source before changing a decision record.<\/span><\/li><\/ol>","takeaways":["A response can be free of outside errors and still contradict itself or its own source.","Match every figure to its option, unit and period, then recalculate.","Watch for a key term changing meaning while the wording stays similar.","Replace unclear pronouns and undefined comparison words.","If a conclusion needs a criterion the evidence does not state, say so and leave the decision to its owner."],"practice":"Find a comparison or options paper, yours or one an AI tool drafted. Pick one defined term and trace every use of it. Then recalculate one unit cost or percentage from the inputs shown.","deck":"decks/07-finding-inconsistencies.html","quiz":[{"q":"A draft defines \"availability\" as scheduled uptime at the start, then later uses the same word to mean uptime including planned outages. What defect is this?","multi":false,"o":[{"t":"An external factual error.","ok":false,"why":"Nothing is being compared with an outside source. The problem is inside the draft."},{"t":"A terminology shift.","ok":true,"why":"The same term carries two meanings, so the later reasoning no longer rests on the measure that was defined."},{"t":"An ambiguous reference.","ok":false,"why":"It is clear what the word refers to each time. What changed is its meaning."},{"t":"A formatting problem.","ok":false,"why":"Layout is not the issue. The definition is."}]},{"q":"A draft says \"Option B costs $24 per server\". The source shows $3,600 a month and 120 servers for Option B, and 150 servers for Option A. What has gone wrong?","multi":false,"o":[{"t":"Nothing. $3,600 / 150 = $24.","ok":false,"why":"The division is right. The 150 belongs to the other option."},{"t":"The source must be out of date.","ok":false,"why":"There is no reason to doubt the source. The draft disagrees with it."},{"t":"A correct calculation has been attached to the wrong option's figure.","ok":true,"why":"The sum uses Option A's server count with Option B's cost, so the result does not describe either option."},{"t":"The draft has used the wrong currency.","ok":false,"why":"Nothing suggests a currency issue."}]},{"q":"After describing two options, a draft says: \"It provides stronger coverage.\" Which TWO problems does this sentence have?","multi":true,"o":[{"t":"\"It\" could refer to either option.","ok":true,"why":"With two options just mentioned, the pronoun does not identify one."},{"t":"The sentence is too short.","ok":false,"why":"Length is not a defect."},{"t":"\"Stronger coverage\" has no stated measure.","ok":true,"why":"Stronger by what: more servers, more hours, a different standard? Without a measure the claim cannot be checked."},{"t":"It uses the passive voice.","ok":false,"why":"It does not, and voice would not be the problem if it did."}]},{"q":"A source compares two plans on price and coverage and says nothing about which matters more. A draft concludes: \"Plan X is cheapest and is therefore the right choice.\" What is the main reasoning problem?","multi":false,"o":[{"t":"The conclusion assumes a selection criterion the evidence does not establish.","ok":true,"why":"Cheapest only means right if cost is the deciding factor, and the source never says it is."},{"t":"Price should never be used to compare plans.","ok":false,"why":"Price is a legitimate factor. It is just not shown to be the deciding one."},{"t":"The draft contains an external factual error.","ok":false,"why":"The price itself may be perfectly correct."},{"t":"The draft is internally inconsistent.","ok":false,"why":"It does not contradict itself. It overreaches."}]},{"q":"Which prompt is best for a verification pass on a draft comparison?","multi":false,"o":[{"t":"\"Rewrite this so the recommendation is more decisive.\"","ok":false,"why":"That changes the wording and checks nothing."},{"t":"\"Choose the strongest option based on the narrative.\"","ok":false,"why":"That asks for a decision, and from the narrative instead of the source."},{"t":"\"Summarise the source and add the priorities needed to justify a choice.\"","ok":false,"why":"Adding priorities invents the criteria the decision should rest on."},{"t":"\"Compare the draft with the source. List number contradictions, label mismatches, definition changes, ambiguous references and unsupported conclusions. Do not recommend an option.\"","ok":true,"why":"It names the defect types, ties the check to the source and keeps Claude out of the decision."}]}]},"8":{"lead":"An output can be polite, balanced in tone and still rest on narrow assumptions about who is qualified. Reviewing for bias means looking at the evidence, the request and whose voice is missing.","html":"<h2>Bias review looks past neutral language<\/h2>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"bias\">Bias<\/span> is a systematic distortion that produces unfair, incomplete or poorly supported outcomes. A response can read as professional and even-handed while quietly assuming who is qualified, whose experience counts or what success looks like.<\/p>\n<p>It can get in at several points:<\/p>\n<ul><li><strong>The request<\/strong> defines success using preferences that have nothing to do with the job.<\/li><li><strong>The source material<\/strong> leaves out affected groups, or reflects past patterns that are not today's requirements.<\/li><li><strong>Training patterns<\/strong> make familiar associations feel plausible.<\/li><li><strong>The evaluation<\/strong> rewards a polished answer over a supported one.<\/li><li><strong>The output<\/strong> adds unsupported claims or stand-ins for real criteria.<\/li><\/ul>\n<p class=\"pull\">A professional tone does not make the reasoning fair, relevant or sufficient.<\/p>\n<p>For workplace decisions about people, Claude should support structured review, drafting and analysis of supplied material. It should not make a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"consequential\">consequential decision<\/span> such as who to hire. That needs the right policy, relevant evidence and an accountable person.<\/p>\n<h2>Worked example: outreach criteria for a team lead<\/h2>\n<p>You are helping prepare outreach criteria for a team lead role. You have the approved role brief and the feedback notes. You need criteria for outreach, a record of who was not consulted, and a human-reviewed process. You do not need a hiring recommendation.<\/p>\n<figure class=\"doc\"><figcaption>Role brief and feedback record<\/figcaption><pre>Approved role brief: Infrastructure Team Lead\n\nPurpose: lead server support for three customer accounts.\nCore responsibilities:\n- Coach six engineers.\n- Use incident reports to find and fix repeat incidents.\n- Coordinate monthly patching across the three accounts.\n\nRequired evidence:\n- Led a team supporting more than one customer or site.\n- Used incident or service data to fix a recurring problem.\n- Coached engineers through a platform or process change.\n\nPreferred evidence:\n- Experience in a regulated environment, or similar.\n\nNot stated as requirements:\n- Degree type or institution\n- Previous employer's size or reputation\n- Social, club or family background\n- Appearance or presentation style\n\nFeedback record:\n- Three service delivery managers and two HR partners gave notes.\n- No engineers who would report to this role gave notes.\n- No candidate outcome data or validated predictor study supplied.<\/pre><\/figure>\n<p>The role brief is the authority for job-related criteria. The five people who gave feedback can clarify what the role needs, but their notes do not stand in for the engineers who will work under it. And with no outcome data, no claim about which background predicts success is supported.<\/p>\n<h2>Name the type of concern<\/h2>\n<p>Calling everything \"bias\" is not useful. The exam expects you to tell these apart.<\/p>\n<dl class=\"defs\"><div><dt>Factual imbalance<\/dt><dd>A measurable gap in the record. Managers and HR gave notes and the engineers did not. That is a fact about the input, not an explanation of why. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"factual-imbalance\">More.<\/span><\/dd><\/div><div><dt>Unrepresentative sample<\/dt><dd>A set of sources too narrow to support conclusions about everyone affected. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"unrepresentative\">More.<\/span><\/dd><\/div><div><dt>Framing bias<\/dt><dd>The question itself steers toward a narrow idea of merit, such as asking for \"signs of executive polish\". <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"framing-bias\">More.<\/span><\/dd><\/div><div><dt>Stereotyping<\/dt><dd>Assuming ability or behaviour from someone's group or background. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"stereotyping\">More.<\/span><\/dd><\/div><div><dt>Proxy variable<\/dt><dd>An indirect attribute used in place of a real criterion. A well-known employer, a prestigious degree or a conference profile tracks access and resources. None of them shows that a person can coach engineers or fix repeat incidents. <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"proxy\">More.<\/span><\/dd><\/div><\/dl>\n<aside class=\"note\"><b>Polite proxies are still proxies<\/b><p>A stand-in can be worded respectfully and still be unsuitable, because it replaces evidence of doing the job.<\/p><\/aside>\n<h2>Critique the weak output<\/h2>\n<figure class=\"out bad\"><figcaption>Draft criteria<\/figcaption><pre>Prioritise candidates <mark>from top-tier consultancies<\/mark>, <mark>with degrees\nfrom leading universities<\/mark>, who <mark>speak regularly at industry\nconferences<\/mark> and <mark>project strong executive presence<\/mark>. <mark>These signals\nsuggest they are more likely to succeed<\/mark> as Infrastructure Team Lead.<\/pre><div class=\"mk\">Highlighted text is not in the source.<\/div><\/figure>\n<p>Top-tier consultancies, leading universities and conference speaking are proxies for access, networks and resources. \"Strong executive presence\" is undefined and invites subjective calls about accent, appearance and style. The claim that these predict success has nothing behind it, because there is no outcome data.<\/p>\n<p>The draft also says nothing about the missing perspective. The right conclusion is not that the role cannot be filled. It is that the criteria should come from the approved brief, and the gap should be recorded for the people making the decision.<\/p>\n<h2>Ask for evidence, limits and qualified conclusions<\/h2>\n<figure class=\"prompt\"><figcaption><span>Improved request<\/span><\/figcaption><pre>Using only the approved role brief and feedback record, draft\noutreach criteria for the Infrastructure Team Lead role.\n\nUse job-related evidence only: leading a team across more than one\ncustomer or site, using incident or service data to fix a recurring\nproblem, coaching engineers through a change, and regulated-\nenvironment experience where relevant.\n\nDo not use employer reputation, university, conference profile,\nappearance, style or other background and access proxies.\n\nState that no candidate outcome data or validated predictor study\nwas supplied. Record that the engineers who would report to this\nrole are missing from the feedback record, and say what that limits.\n\nDo not rank candidates or recommend a hiring decision.<\/pre><\/figure>\n<figure class=\"out good\"><figcaption>What Claude returned<\/figcaption><pre>Outreach criteria\n- Evidence of leading a team that supports more than one customer\n  or site.\n- An example of using incident or service data to fix a recurring\n  problem.\n- Experience coaching engineers through a platform or process change.\n- Where relevant, experience in a regulated environment or similar.\n\nData limits\nNo candidate outcome data or validated predictor study was supplied.\nThe record does not support a claim that any background predicts\nsuccess in this role.\n\nRepresentation gap\nNotes came from three service delivery managers and two HR partners.\nNo engineers who would report to the role gave input. Reviewers\nshould consider getting or recording that perspective before the\noutreach approach is finalised.<\/pre><\/figure>\n<p>Each criterion now traces to the role brief. Nothing claims that the evidence guarantees success. The incomplete feedback record is reported as incomplete. A person can review it, decide whether more input is needed under company policy, and stay responsible for any employment decision.<\/p>\n<h2>Why \"remove all bias\" does not work<\/h2>\n<p>\"Remove all bias\" cannot be acted on or checked. It names no decision, no affected group, no evidence standard and no method. It also implies a guarantee that nobody can give from one output. Use concrete checks:<\/p>\n<ol class=\"steps\"><li><b>Who supplied the evidence?<\/b><span>And who is absent from it?<\/span><\/li><li><b>Trace each criterion<\/b><span>To a stated responsibility or required evidence.<\/span><\/li><li><b>Flag proxies<\/b><span>Anything that swaps background, access or style for demonstrated capability.<\/span><\/li><li><b>Separate fact from prediction<\/b><span>Observed facts on one side. Predictions the record cannot support on the other.<\/span><\/li><li><b>Keep a person responsible<\/b><span>A qualified human owns any consequential decision about people.<\/span><\/li><\/ol>","takeaways":["Bias can enter through the request, the sources, the evaluation or the output, behind neutral wording.","Replace background and access proxies with evidence tied to the documented role.","Record who is missing from the input. A missing affected group is a limitation reviewers need to see.","\"Remove all bias\" is not checkable. Use concrete, traceable review steps.","Claude assists with analysis and drafting. People make consequential decisions about people."],"practice":"Look at a set of selection criteria: a role advert, a vendor shortlist or a nomination form. For each criterion ask what it is evidence of. Mark any that measure background or access instead of the thing you need.","deck":"decks/08-recognising-bias.html","quiz":[{"q":"A draft recommends applicants who worked at well-known firms and have a polished presentation style. The role is about coaching engineers and reducing repeat incidents. What is the strongest objection?","multi":false,"o":[{"t":"The wording is too informal.","ok":false,"why":"Register is not the issue. The criteria are."},{"t":"It weights preferred criteria over required ones.","ok":false,"why":"These traits are not listed as criteria at all."},{"t":"It relies on proxy variables in place of job-relevant evidence.","ok":true,"why":"Employer reputation and polish track access and style. They are not evidence of coaching or of fixing incidents."},{"t":"The traits are hard to measure.","ok":false,"why":"The problem is relevance, not measurability."}]},{"q":"Feedback on a new role came from managers and HR. None came from the staff who will report to it. Which concern does this most directly show?","multi":false,"o":[{"t":"Stereotyping.","ok":false,"why":"Nobody is assuming anything about a group's behaviour."},{"t":"Factual imbalance.","ok":true,"why":"It is a measurable gap in who supplied input, visible in the record itself."},{"t":"Framing bias.","ok":false,"why":"Framing is about how a question is posed. This is about who answered."},{"t":"A validated prediction.","ok":false,"why":"Nothing has been validated, and the most affected group is missing."}]},{"q":"Which review instruction can actually be carried out and checked?","multi":false,"o":[{"t":"\"Make sure the output is free from all bias.\"","ok":false,"why":"No reviewer can verify that from one output, and it names no method."},{"t":"\"Prefer traits commonly linked to leadership success.\"","ok":false,"why":"\"Commonly linked\" invites stereotypes and proxies."},{"t":"\"Polish the wording, then judge whether it seems fair.\"","ok":false,"why":"\"Seems fair\" is an impression, and polish comes before substance here."},{"t":"\"Trace each criterion to documented role evidence, list missing affected perspectives, and state uncertainty where support is absent.\"","ok":true,"why":"Each part is a concrete check with a visible result."}]},{"q":"What is an appropriate role for Claude in a hiring process?","multi":false,"o":[{"t":"Supporting structured review, drafting and analysis of supplied material, with a person responsible for the decision.","ok":true,"why":"Claude helps with the work around the decision. The decision stays with an accountable human."},{"t":"Making the final choice when its reasoning is written neutrally.","ok":false,"why":"Neutral wording does not make a consequential decision suitable to delegate."},{"t":"Ranking candidates as long as protected characteristics are not mentioned.","ok":false,"why":"Bias can work through proxies without any explicit mention."},{"t":"Replacing human review when there is a lot of source material.","ok":false,"why":"More material increases the need for judgement."}]},{"q":"An output claims certain backgrounds \"predict success\" in a role. The record contains no candidate outcome data. Which TWO responses are correct?","multi":true,"o":[{"t":"Treat the prediction as unsupported.","ok":true,"why":"With no outcome data or validated study, nothing backs a claim about what predicts success."},{"t":"Accept it if the tone is cautious.","ok":false,"why":"Caution in the wording does not supply evidence."},{"t":"Have the output state that no outcome data or predictor study was supplied.","ok":true,"why":"Making the data limit explicit stops readers treating a guess as a finding."},{"t":"Keep it, because experienced managers usually agree with such signals.","ok":false,"why":"Agreement among managers is opinion, and it may reflect the same proxies."}]}]},"9":{"lead":"You check claims, not documents. A source only helps when it supports the exact claim being made, including the conditions attached to it.","html":"<h2>Pull out the claims that can be checked<\/h2>\n<p>Fact-checking starts by separating what can be tested from everything else in a draft.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Kind of statement<\/th><th>Example<\/th><th>How to treat it<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Kind of statement\">Factual claim<\/td><td data-l=\"Example\">\"The unit is 3 kVA\"<\/td><td data-l=\"How to treat it\">Test it against evidence<\/td><\/tr><tr><td data-l=\"Kind of statement\">Opinion<\/td><td data-l=\"Example\">\"This is a sensible choice\"<\/td><td data-l=\"How to treat it\">Not directly checkable. It may rest on facts that are<\/td><\/tr><tr><td data-l=\"Kind of statement\">Recommendation<\/td><td data-l=\"Example\">\"Buy this model\"<\/td><td data-l=\"How to treat it\">Ask what it assumes<\/td><\/tr><tr><td data-l=\"Kind of statement\">Promotional language<\/td><td data-l=\"Example\">\"Excellent value\"<\/td><td data-l=\"How to treat it\">Needs stated criteria and evidence, or it goes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Claude can pull candidate claims out of a draft, group them and lay out an <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"evidence-log\">evidence log<\/span>. A person still has to open the sources that decide the matter and judge what they actually establish.<\/p>\n<p class=\"pull\">A source is useful only when it supports the exact claim being made.<\/p>\n<h2>Check the risky claims first<\/h2>\n<p>Not every claim deserves the same effort. Start with the ones that are:<\/p>\n<ul><li><strong>high consequence<\/strong> if wrong,<\/li><li><strong>new<\/strong> to the audience,<\/li><li><strong>precise<\/strong>, with exact numbers or conditions,<\/li><li><strong>likely to change<\/strong>, such as prices, eligibility rules and specifications.<\/li><\/ul>\n<p>A loose descriptive phrase can wait until the claims carrying the decision are settled.<\/p>\n<h2>Worked example: a UPS recommendation<\/h2>\n<p>A colleague has drafted a recommendation to buy a UPS for a customer's comms room. You have three documents. Nothing has been supplied about the room's actual load or how long the servers take to shut down.<\/p>\n<figure class=\"out \"><figcaption>Draft recommendation<\/figcaption><pre>We should buy this UPS for the comms room. It is a 3 kVA, 2U unit\nwith an internal battery pack. It will run for 18 minutes in an\noutage, which is enough to shut down all 12 servers cleanly. We\nwill also get a $300 rebate, so it is excellent value.<\/pre><\/figure>\n<figure class=\"doc\"><figcaption>Available sources<\/figcaption><pre>Manufacturer specification sheet, New Zealand model\nPublished 3 March 2026\nProduct: 3 kVA rack UPS, 2U, with one internal battery pack.\nRuntime: \"Up to 18 minutes at half load, at 25 C, with new\nbatteries.\"\nTime to shut down connected equipment: not stated.\n\nSupplier trade-in guide, New Zealand\nPublished 20 January 2027\nOffer period: 1 February to 30 April 2027.\nEligible items: new rack UPS units, 1 kVA and above.\nRebate: 15% of the purchase price, maximum $300.\nConditions: trade in a working UPS and buy from an authorised\nNew Zealand reseller.\n\nIndependent test report\nPublished 12 August 2026\nTested product: the same 3 kVA New Zealand model, new batteries.\nResult: 11 minutes at 80% load, at 30 C.\nThe report did not test half load or a staged shutdown.<\/pre><\/figure>\n<h2>Choose sources by authority and fit<\/h2>\n<p>A hierarchy helps. The manufacturer's sheet is the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"primary-source\">primary source<\/span> for the product's stated specification and test conditions. The supplier's guide is the authority for the trade-in offer. The independent report is a credible secondary source for what was observed in its own test, and for nothing wider.<\/p>\n<p>Authority is not enough. Check fit as well:<\/p
