2>Maintain accountability over time<\/h2>\n<p>Ethical controls need upkeep. A sound prompt can be changed, reviewers can drift into trusting tidy outputs, and recurring complaints can reveal a barrier nobody anticipated. Keep the approved criteria, prompt, evidence sheets, decision reasons, notices and correction records available for review. Look at correction requests and outcomes for patterns from time to time, and adjust the instructions, the accessibility support or the review practice when the evidence shows the process is not working as intended.<\/p>\n<p>Accountability cannot be transferred to a prompt, a score or a workflow diagram.<\/p>","takeaways":["Compliance is necessary and not sufficient. Also assess fairness, access and the effect on people.","Proxies such as writing polish or visibility measure advantage, not the approved criterion.","Scores and rankings invite automation bias. Remove them when the inputs do not justify them.","Reviewers need the original material, the authority and the time to reject what Claude organised.","Disclose material AI involvement and give people a practical route to correct errors or challenge the process."],"practice":"Think of a decision your team makes about people or priorities, such as who goes on a course or which request is done first. List the approved criteria. Then list two proxies that could creep in if an AI tool were asked to \"rank\" the options.","deck":"decks/28-ethics-fairness-and-accountability.html","quiz":[{"q":"What is a proxy criterion?","multi":false,"o":[{"t":"A criterion the panel formally approved.","ok":false,"why":"A proxy stands in for an approved criterion. It is not one."},{"t":"A stand-in measure used to infer something that was not measured directly.","ok":true,"why":"For example, treating polished writing as if it measured feasibility."},{"t":"A backup reviewer.","ok":false,"why":"That is not what the term means here."},{"t":"A network device.","ok":false,"why":"Wrong kind of proxy."}]},{"q":"A panel wants Claude to score applications from 1 to 5 using writing quality and number of attachments, then rank them. What is the main problem?","multi":false,"o":[{"t":"Claude cannot produce numbers.","ok":false,"why":"It can. That is exactly the danger."},{"t":"Five points is too few for a scale.","ok":false,"why":"The scale is not the issue."},{"t":"It uses criteria nobody approved, which can disadvantage people with less time or writing experience, and a ranking invites automation bias.","ok":true,"why":"The proxies measure resources and style, and the score makes them look objective."},{"t":"It would take too long.","ok":false,"why":"Speed is not the concern."}]},{"q":"Which statement best describes meaningful contestability?","multi":false,"o":[{"t":"\"All decisions are final.\"","ok":false,"why":"That closes off any challenge."},{"t":"\"Contact us if you have questions.\"","ok":false,"why":"It names no route, reviewer or possible outcome."},{"t":"The process says what can be corrected, how to raise it, who reviews it and whether they can change the outcome.","ok":true,"why":"A practical route is specific about each of those."},{"t":"Applicants can read the prompt that was used.","ok":false,"why":"That may help transparency. It is not a way to challenge an error."}]},{"q":"Which TWO are required for human oversight to be meaningful?","multi":true,"o":[{"t":"Access to the original application, not only Claude's sheet.","ok":true,"why":"The reviewer must be able to compare the summary with the source."},{"t":"A reviewer who signs off quickly so the process is not delayed.","ok":false,"why":"Speed without scrutiny is a rubber stamp."},{"t":"Authority to reject what Claude produced.","ok":true,"why":"Without the power to reject, the review changes nothing."},{"t":"A numerical score to make the decision easier.","ok":false,"why":"A score invites automation bias."}]},{"q":"A process follows every stated policy rule. Is it therefore ethical?","multi":false,"o":[{"t":"Yes. Compliance is the complete test.","ok":false,"why":"Compliance is necessary and not sufficient."},{"t":"Yes, provided AI was involved.","ok":false,"why":"AI involvement does not make a process fair."},{"t":"Only if everyone was treated identically.","ok":false,"why":"Fairness needs relevant criteria and attention to unequal barriers, not identical treatment."},{"t":"Not necessarily. It can still distribute benefits unfairly, exclude people or be impossible to question.","ok":true,"why":"Ethical judgement looks at the effect on people, beyond whether the rules were followed."}]}]},"29":{"lead":"When Claude gives a bad answer, the instinct is to rewrite the whole prompt. Treat it like any other fault: reproduce it, isolate the cause, change one thing, test again.","html":"<h2>Start with the symptom and the standard<\/h2>\n<p>An underperforming prompt is not always a badly written prompt. A result can fail because the task is unclear, context is missing, the sources conflict, a source is weak, or the request is beyond what Claude should decide or do. Changing everything at once hides the real cause and makes any improvement impossible to verify.<\/p>\n<p>Begin by describing the observable <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"symptom\">symptom<\/span>: different answers to the same question, required fields missing, unsupported claims in a summary, the wrong format. Then define <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"acceptance-criteria\">acceptance criteria<\/span>, the conditions a usable result has to meet. For a factual workplace answer that might be the correct value, a named authoritative source, an explanation of uncertainty where sources disagree, and no invented policy.<\/p>\n<p class=\"pull\">Diagnose against a defined standard before you change the prompt, the sources or the tool.<\/p>\n<p>This also stops a wrong default assumption. A poor result does not show that the product has a fault. Most problems can be investigated first through the task, the prompt, the material available and the workflow. Technical escalation is appropriate only after controlled testing shows that configuration and sources do not explain it.<\/p>\n<h2>Worked example: three answers to one question<\/h2>\n<p>Your team's Project answers internal questions about backups. It holds one current standard, one obsolete procedure and one informal note that disagrees with both. No instruction says which source wins. Asked the same question in separate chats, it gives different answers.<\/p>\n<figure class=\"doc\"><figcaption>What is in the Project<\/figcaption><pre>Backup Operations Standard, effective 1 April 2026\nSection 4.2: daily backups of production servers must be retained\nfor 35 days. This standard replaces earlier retention procedures.\n\nBackup Procedure, revised 15 June 2024\nSection 3.1: daily backups of production servers are retained\nfor 30 days.\n\nBackup team note, 8 April 2026\nWe have been keeping dailies for 42 days on the new storage\nlately.\n\nOriginal prompt\nHow long are daily backups of production servers retained?<\/pre><\/figure>\n<p>One chat says 35 days. Another says 30, or describes 42 as the retention period. The outputs conflict, but the conflict was already in the material. The prompt does not say which document governs, whether dates matter, or that an informal practice is different from a required standard.<\/p>\n<h2>Classify the plausible cause<\/h2>\n<p>Classifying a failure limits unnecessary changes. More than one category can apply. Test the smallest plausible explanation first.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Category<\/th><th>What to inspect<\/th><th>Typical correction<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Category\">Unclear task<\/td><td data-l=\"What to inspect\">Missing outcome, audience, scope or acceptance criteria<\/td><td data-l=\"Typical correction\">State the deliverable and the decision boundary<\/td><\/tr><tr><td data-l=\"Category\">Missing or conflicting context<\/td><td data-l=\"What to inspect\">Absent facts, inconsistent documents, competing instructions<\/td><td data-l=\"Typical correction\">Supply the facts and define source priority<\/td><\/tr><tr><td data-l=\"Category\">Unsuitable format<\/td><td data-l=\"What to inspect\">Prose where a table, checklist or extraction was needed<\/td><td data-l=\"Typical correction\">Specify the output structure<\/td><\/tr><tr><td data-l=\"Category\">Poor source quality<\/td><td data-l=\"What to inspect\">Outdated, informal, incomplete or unapproved material<\/td><td data-l=\"Typical correction\">Replace, remove or clearly label the source<\/td><\/tr><tr><td data-l=\"Category\">Context overload<\/td><td data-l=\"What to inspect\">Too much unrelated or duplicated material<\/td><td data-l=\"Typical correction\">Cut the input back to relevant authoritative evidence<\/td><\/tr><tr><td data-l=\"Category\">Wrong feature or model<\/td><td data-l=\"What to inspect\">The task needs a different workflow, capability or depth<\/td><td data-l=\"Typical correction\">Pick a better-suited feature or model<\/td><\/tr><tr><td data-l=\"Category\">Policy restriction or unsupported capability<\/td><td data-l=\"What to inspect\">A prohibited action, outside access or final authority is being asked for<\/td><td data-l=\"Typical correction\">Redesign the task and add human review or expertise<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A prompt can have a defect even when Claude is accurately reflecting contradictory sources. And excellent instructions cannot make an obsolete source authoritative. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"context-overload\">context overload<\/span> for the fifth row.<\/p>\n<p>A policy restriction limits what the organisation lets Claude receive, produce or decide. An unsupported capability is something Claude cannot reliably do from the material and access it has, such as verifying an event nobody told it about or giving an approval that needs an authorised person. More forceful wording fixes neither.<\/p>\n<h2>Reproduce before you repair<\/h2>\n<p>Use a small representative input. The single controlled question is ideal here because it removes everything unrelated. Record the original prompt, the sources available, the output and the acceptance criteria. Run the same test in separate <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"fresh-chat\">fresh chats<\/span> with the Project configuration unchanged.<\/p>\n<ol class=\"steps\"><li><b>Confirm the authoritative answer<\/b><span>35 days, in the current standard.<\/span><\/li><li><b>Run the original prompt<\/b><span>Record the answer and the reasoning it cites.<\/span><\/li><li><b>Test with the current standard alone<\/b><span>If it returns 35 days, the question itself is understandable.<\/span><\/li><li><b>Put the old procedure and the note back<\/b><span>If the conflict returns, look at currency, authority and missing instructions.<\/span><\/li><li><b>Apply the smallest correction<\/b><span>Then rerun the identical prompt.<\/span><\/li><\/ol>\n<p>That order separates prompt clarity from source conflict. Compare a case that worked with one that did not and look at what differed: sources, wording, attachments, format, earlier conversation, instructions. Do not assume a cause because something changed at the same time. Test it directly.<\/p>\n<h2>Apply a narrow correction and retest<\/h2>\n<p>The controlled tests point to two causes: an obsolete source is still available, and the Project has no authority rule. The 42-day note is not false as a report of what the team is doing. It cannot establish the official requirement. So the narrow fix is to remove the obsolete procedure, keep the note only if it is useful context, and add a short instruction that separates approved standards from informal notes.<\/p>\n<figure class=\"prompt\"><figcaption><span>Added Project instruction<\/span><\/figcaption><pre>For backup retention questions, treat the current Backup\nOperations Standard as authoritative. When sources conflict,\nprefer the most recent approved standard in effect. Treat team\nnotes as non-authoritative context. State the retention period,\nname the governing source, and do not infer exceptions that are\nnot supplied.<\/pre><\/figure>\n<p>Then use the <strong>same<\/strong> test question, not an easier one, and the same rubric: states 35 days, names the current standard, separates the informal practice if it mentions it, invents no exceptions. That is what makes the before and after comparison mean something.<\/p>\n<figure class=\"out good\"><figcaption>After the correction<\/figcaption><pre>Daily backups of production servers must be retained for 35 days,\nunder Section 4.2 of the Backup Operations Standard, effective\n1 April 2026. The team note describes dailies currently being\nkept for 42 days. That is not the approved retention requirement.<\/pre><\/figure>\n<aside class=\"note\"><b>Diagnosis result<\/b><p>The task was not rewritten. A superseded source was removed and an explicit authority rule was added.<\/p><\/aside>\n<h2>Know when another response is needed<\/h2>\n<dl class=\"defs\"><div><dt>Restart<\/dt><dd>When the conversation has collected irrelevant instructions or material that interfere with a focused test.<\/dd><\/div><div><dt>Replace a source<\/dt><dd>When it is obsolete, incomplete or not approved for the decision.<\/dd><\/div><div><dt>Update Project instructions<\/dt><dd>When a stable rule such as source priority or output format should govern repeated work.<\/dd><\/div><div><dt>Choose another feature or model<\/dt><dd>When the task needs something different, such as structured extraction in place of open drafting. A different option will not repair weak evidence.<\/dd><\/div><div><dt>Ask a human expert<\/dt><dd>When the materials do not establish the answer, policy interpretation needs an authorised owner, or an error would be costly.<\/dd><\/div><div><dt>Escalate a technical problem<\/dt><dd>After a controlled test documents the prompt, sources, configuration, expected result, actual result and repeated behaviour.<\/dd><\/div><\/dl>\n<p>That record gives support staff evidence to work with, and stops ordinary prompt or knowledge defects being logged as product failures.<\/p>","takeaways":["State the observable symptom and the acceptance criteria before revising anything.","Classify the cause: task, context, format, source quality, overload, fit, or a restriction.","Reproduce with the smallest representative test and keep its inputs.","Make one narrow change and rerun the same test against the same rubric.","A poor answer is not evidence of an outage. Escalate only with a documented, repeatable test."],"practice":"Take a recent AI answer that disappointed you. Write the symptom in one sentence and three acceptance criteria. Then pick the most likely category from the table and the one change you would test first.","deck":"decks/29-diagnosing-poor-outputs.html","quiz":[{"q":"A Project gives three different answers to the same factual question in separate chats. What should you do first?","multi":false,"o":[{"t":"Rewrite the whole prompt with more emphasis.","ok":false,"why":"Changing everything at once hides the cause."},{"t":"Report a product outage.","ok":false,"why":"A poor result is not evidence of a technical fault."},{"t":"Describe the symptom, define what a correct answer must contain, and reproduce it with a controlled test.","ok":true,"why":"Diagnosis starts from an observable symptom and a defined standard."},{"t":"Switch to a larger model.","ok":false,"why":"A different model does not repair conflicting sources."}]},{"q":"The question returns the right answer when only the current standard is available, and conflicting answers when an obsolete procedure and a team note are added back. What does that show?","multi":false,"o":[{"t":"The question is badly worded.","ok":false,"why":"It worked with the current standard alone, so the question is understandable."},{"t":"The cause is the source set and the lack of an authority rule.","ok":true,"why":"The conflict returns with the conflicting sources, which isolates the cause."},{"t":"Claude is malfunctioning.","ok":false,"why":"It is reflecting a conflict that exists in the material."},{"t":"The team note should become the standard.","ok":false,"why":"An informal note cannot establish the official requirement."}]},{"q":"After making a correction, how should you retest?","multi":false,"o":[{"t":"With an easier question, to confirm it works.","ok":false,"why":"An easier question does not show the original defect is fixed."},{"t":"With several other changes at the same time.","ok":false,"why":"Then you cannot tell which change helped."},{"t":"By reading the instruction again.","ok":false,"why":"Reading is not testing."},{"t":"With the identical question and the same rubric.","ok":true,"why":"That is what makes the before and after comparison meaningful."}]},{"q":"A request asks Claude to give a final approval that policy reserves for an authorised person. Which diagnosis fits?","multi":false,"o":[{"t":"Unsuitable format.","ok":false,"why":"Changing the layout does not change who may approve."},{"t":"Context overload.","ok":false,"why":"The amount of input is not the issue."},{"t":"Policy restriction or unsupported capability. Redesign the task and add human review.","ok":true,"why":"More forceful wording cannot fix a request Claude should not fulfil."},{"t":"Unclear task. Add more emphasis.","ok":false,"why":"The task is clear. It is one Claude should not perform."}]},{"q":"Which TWO belong in the record when you escalate a suspected technical problem?","multi":true,"o":[{"t":"The prompt, sources and configuration used.","ok":true,"why":"Support needs the exact inputs to reproduce it."},{"t":"How frustrated you are.","ok":false,"why":"Not evidence."},{"t":"The expected result, the actual result and whether it repeats.","ok":true,"why":"That shows what failed and that it is reproducible."},{"t":"A guess at which data centre is at fault.","ok":false,"why":"Speculation is not part of a controlled test record."}]}]},"30":{"lead":"\"The summary is not useful\" tells you something is wrong. It does not tell you what to change, or how you would know you had fixed it.","html":"<h2>Feedback is evidence, not a revision request<\/h2>\n<p>Collect evidence before changing a prompt, instruction, source, format, model or review rule. The record should show:<\/p>\n<ul><li>the input given to Claude,<\/li><li>the output received,<\/li><li>the behaviour expected,<\/li><li>the actual defect,<\/li><li>the impact on the user,<\/li><li>how often it happens.<\/li><\/ul>\n<p>Not all feedback carries the same weight.<\/p>\n<dl class=\"defs\"><div><dt>Factual defect<\/dt><dd>A statement that conflicts with the source material supplied.<\/dd><\/div><div><dt>Policy defect<\/dt><dd>A breach of an explicit handling, approval or formatting rule.<\/dd><\/div><div><dt>Stylistic preference<\/dt><dd>Tone, length, order or presentation.<\/dd><\/div><div><dt>Isolated edge case<\/dt><dd>Happens under unusual but legitimate input.<\/dd><\/div><\/dl>\n<p>All four can justify an improvement. They should not get the same priority or the same acceptance test.<\/p>\n<p class=\"pull\">Improve a workflow against repeatable criteria, not against one person's reaction.<\/p>\n<h2>Worked example: one meeting, two audiences<\/h2>\n<p>You prepare summaries from a recurring migration meeting. Service managers want a short update on decisions, named owners, dates and risks. The engineering team needs the same action information plus brief context for anything that affects current work. Claude must not infer anything that is not in the notes.<\/p>\n<p>Feedback on three recent summaries: managers say long background paragraphs bury what needs their attention. Engineers say a decision to defer a firewall review was left out, an action had no owner, and a stated due date was missing. Those are different problems. Too much detail is a presentation issue. Leaving out explicit decisions, owners, dates and risks is a completeness defect.<\/p>\n<figure class=\"doc\"><figcaption>Source notes<\/figcaption><pre>File server migration meeting notes, 14 May\n\n- The migration is 70% complete. Copy testing found orphaned\n  permission entries on the legacy shares. The team talked\n  through earlier clean-up work and why several share mappings\n  were originally chosen.\n- Decision: defer the firewall rule review until 28 May.\n- Action: prepare remediation options for the orphaned\n  permissions. Owner: storage lead. Due: 21 May.\n- Risk: if the remediation options are not approved by 21 May,\n  migration testing may run past the planned completion date.\n- The new monitoring dashboard was demonstrated. No decision or\n  action was recorded.<\/pre><\/figure>\n<p>The notes support only what they say. They name no person, do not say who approves the remediation options, and give no revised completion date. A reliable summary keeps those limits and does not turn likely assumptions into commitments.<\/p>\n<h2>Turn comments into acceptance criteria<\/h2>\n<p>Vague feedback becomes testable once it describes an observable result. \"Make it shorter\" will not do, because two readers can disagree about whether it is. These are the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"acceptance-criteria\">acceptance criteria<\/span> for this workflow:<\/p>\n<dl class=\"defs\"><div><dt>Manager criterion<\/dt><dd>No more than two context bullets, and every explicit decision, action, due date and risk is included.<\/dd><\/div><div><dt>Engineering criterion<\/dt><dd>Labelled Decisions, Actions, Risks and Context sections. Every explicit decision, owner, date and risk appears in the right one.<\/dd><\/div><div><dt>Grounding criterion<\/dt><dd>Where an owner, date or decision is not in the notes, the summary says it was not recorded or leaves the field out. It never invents one.<\/dd><\/div><\/dl>\n<p>The criteria separate defects from preferences. A missing decision fails completeness. Too much background fails length and structure. Whether the heading should be \"Key updates\" in place of \"Context\" can be looked at later. It is not needed to fix what was reported.<\/p>\n<h2>Use a small regression set<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"regression\">regression case<\/span> is a saved input with its expected behaviour, used to detect whether a later change breaks something that used to work. A small set is more practical than every past meeting, provided it covers ordinary input and meaningful variations. Always include the case that failed. You cannot call a change a success if the original failure is no longer tested.<\/p>\n<figure class=\"doc\"><figcaption>Regression set<\/figcaption><pre>Case 1: normal\nNotes hold one decision, one action with owner and date, one\nrisk and brief context.\nExpected: all fields present. Manager context within two bullets.\n\nCase 2: edge\nNotes hold three decisions and two risks, and no actions.\nExpected: all decisions and risks present. Actions says\n\"None recorded\".\n\nCase 3: incomplete\nNotes hold an action with no owner or due date.\nExpected: the action appears. Owner and date are marked\n\"Not recorded\".\n\nCase 4: previously failed\nThe 14 May notes.\nExpected: the deferred firewall review, storage lead, 21 May and\nthe testing risk all appear. The history is cut to brief context.<\/pre><\/figure>\n<p>The expected result tests behaviour and does not demand an exact sentence. Claude can word things differently and still keep the required facts and structure. Use the same <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"rubric\">rubric<\/span> before and after, or the comparison can hide a trade-off.<\/p>\n<h2>Change one identifiable component<\/h2>\n<figure class=\"prompt\"><figcaption><span>Original prompt<\/span><\/figcaption><pre>Summarise these meeting notes clearly and thoroughly for the\nservice managers and the engineering team.<\/pre><\/figure>\n<p>It asks for \"clearly and thoroughly\" and does not distinguish the audiences, require decisions and actions to be extracted, or forbid filling gaps. The narrowest useful change is the prompt itself. The notes, the source authority, the workflow and the reviewer stay the same, so any difference in results can reasonably be put down to the new instruction.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revised prompt<\/span><\/figcaption><pre>Using only the meeting notes, create two summaries.\n\nService manager summary:\n- Use the headings Decisions, Actions, Risks, Context.\n- Include every explicit decision, action, owner, due date\n  and risk.\n- Limit Context to two bullets at most.\n\nEngineering summary:\n- Use the same headings.\n- Include brief context that affects current work.\n- If a heading has no recorded items, write \"None recorded\".\n\nDo not infer names, dates, decisions, causes or commitments. For\nan action with no owner or due date, write \"Not recorded\" in\nthat field.<\/pre><\/figure>\n<p>Replacing the prompt, switching model, adding source documents and changing the review step all at once makes the result impossible to diagnose. A model change may be right when a controlled prompt revision cannot meet the requirement. Test it as a separate change with the same regression set.<\/p>\n<h2>Compare results with the same rubric<\/h2>\n<p>Before the revision, the 14 May output spent several sentences on share mappings and earlier clean-up. It mentioned migration testing and left out the deferred firewall review, the storage lead, the 21 May date and the conditional risk. It failed both audiences' criteria.<\/p>\n<figure class=\"out good\"><figcaption>After the revision: service manager summary<\/figcaption><pre>Service manager summary\n\nDecisions\n- Defer the firewall rule review until 28 May.\n\nActions\n- Prepare remediation options for the orphaned permissions.\n  Owner: storage lead. Due: 21 May.\n\nRisks\n- If the remediation options are not approved by 21 May,\n  migration testing may run past the planned completion date.\n\nContext\n- The migration is 70% complete. Copy testing found orphaned\n  permission entries on the legacy shares.<\/pre><\/figure>\n<p>It passes the previously failed case. Then run the same rubric over the normal, edge and incomplete cases. The incomplete case matters most: it has to still mark missing fields as not recorded. That is the proof that a stronger extraction instruction has not made Claude start filling gaps.<\/p>\n<h2>Record the limits<\/h2>\n<p>A passing test set supports a limited conclusion: the revised prompt did acceptably on the saved cases. It does not prove every future summary will be complete. New meeting formats, ambiguous notes and conflicting statements can produce failures the set does not cover.<\/p>\n<ul><li>Record the source of the feedback, the audience affected, the defect category and the frequency.<\/li><li>Save the old prompt, the revised prompt, the regression cases, the rubric and the results.<\/li><li>Record unresolved limitations, such as summaries depending on incomplete notes.<\/li><li>Roll back if the change creates a more serious omission, unsupported claim or policy issue.<\/li><li>Escalate ambiguous source material or high-consequence decisions to the responsible reviewer.<\/li><\/ul>\n<aside class=\"note\"><b>Risk boundary<\/b><p>A tighter format improves readability. It cannot fix missing or unclear notes. Human review is still needed when decisions, owners, dates or risks are unclear.<\/p><\/aside>","takeaways":["Capture the input, output, expected behaviour, defect, impact and frequency before changing anything.","Separate factual and policy defects from stylistic preferences and edge cases.","Turn vague comments into observable acceptance criteria.","Test normal, edge, incomplete and previously failed cases with the same rubric before and after.","Change one component at a time, record the limits, and roll back if it makes things worse."],"practice":"Take one piece of vague feedback you have had on a report or summary, such as \"too long\" or \"not clear\". Rewrite it as two acceptance criteria somebody else could check, and describe the four regression cases you would save.","deck":"decks/30-feedback-and-controlled-testing.html","quiz":[{"q":"An engineer says a summary left out a decision that was explicitly written in the meeting notes. What kind of feedback is that?","multi":false,"o":[{"t":"A stylistic preference.","ok":false,"why":"It is about missing content, not tone or layout."},{"t":"A completeness defect.","ok":true,"why":"An explicit item in the source is absent from the output."},{"t":"An isolated edge case.","ok":false,"why":"The input was ordinary."},{"t":"Proof the model must be changed.","ok":false,"why":"The cause has not been diagnosed yet."}]},{"q":"Which is a usable acceptance criterion?","multi":false,"o":[{"t":"\"Make it shorter.\"","ok":false,"why":"Two readers can disagree on whether it is short enough."},{"t":"\"Make it more useful.\"","ok":false,"why":"Nothing here can be observed or checked."},{"t":"\"No more than two context bullets, and every explicit decision, action, due date and risk is included.\"","ok":true,"why":"It describes a result somebody can check."},{"t":"\"Sound more senior.\"","ok":false,"why":"That is an impression."}]},{"q":"Why must the previously failed case stay in the regression set?","multi":false,"o":[{"t":"To make the set look bigger.","ok":false,"why":"Size is not the point."},{"t":"Because you cannot call the change a success if the original failure is no longer tested.","ok":true,"why":"The saved case is how you show the reported defect is fixed, and stays fixed."},{"t":"Because it is the easiest case to pass.","ok":false,"why":"It is the one that failed."},{"t":"To prove every future summary will be right.","ok":false,"why":"A passing set only supports a conclusion about the saved cases."}]},{"q":"After tightening the extraction instruction, which case shows Claude has not started inventing missing details?","multi":false,"o":[{"t":"The normal case.","ok":false,"why":"It has nothing missing to invent."},{"t":"The edge case with three decisions.","ok":false,"why":"It tests volume and an empty heading, not missing fields."},{"t":"The previously failed case.","ok":false,"why":"It tests that the omitted items now appear."},{"t":"The incomplete case, where owner and due date must still be marked \"Not recorded\".","ok":true,"why":"If those fields come back filled in, the stronger instruction introduced a new failure."}]},{"q":"Which TWO are good practice when improving a prompt from feedback?","multi":true,"o":[{"t":"Change the prompt, the model and the sources together to save time.","ok":false,"why":"You could not tell which change made the difference."},{"t":"Change one identifiable component and keep everything else the same.","ok":true,"why":"Then any difference in results can be attributed to that change."},{"t":"Use the same rubric before and after.","ok":true,"why":"Otherwise the comparison can hide a trade-off."},{"t":"Delete the old prompt once the new one passes.","ok":false,"why":"Keep it. You may need to roll back."}]}]},"31":{"lead":"A faster workflow that produces something nobody can use is not optimised. Get it right first. Then take out the work that never needed doing.","html":"<h2>Optimise for useful results first<\/h2>\n<dl class=\"defs\"><div><dt>Effectiveness<\/dt><dd>The workflow reliably produces an output that serves its purpose, is supported by evidence and gets the review it needs. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"effectiveness\">effectiveness<\/span>.<\/dd><\/div><div><dt>Efficiency<\/dt><dd>Getting that result with less unnecessary time, cost, duplication and human effort. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"efficiency\">efficiency<\/span>.<\/dd><\/div><\/dl>\n<p>A faster workflow is not optimised if its output cannot be used, introduces unsupported claims or skips a control.<\/p>\n<p>Look at the workflow end to end: collecting inputs, preparing context, using Claude, checking the result, handing it to the next person, and handling exceptions. A short interaction with Claude can still be a poor process if a colleague has to keep cleaning up the output or rebuilding evidence that was left out.<\/p>\n<p class=\"pull\">Remove avoidable work. Keep the evidence, the review and the accountability.<\/p>\n<p>Measure both operations and quality:<\/p>\n<div class=\"tw\"><table><thead><tr><th>Measure<\/th><th>What it tells you<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Measure\">Turnaround time<\/td><td data-l=\"What it tells you\">How long it takes from start to finish<\/td><\/tr><tr><td data-l=\"Measure\">Total user effort<\/td><td data-l=\"What it tells you\">How much human time goes in<\/td><\/tr><tr><td data-l=\"Measure\">Correction rate<\/td><td data-l=\"What it tells you\">The share of outputs needing substantive repair<\/td><\/tr><tr><td data-l=\"Measure\">Review burden<\/td><td data-l=\"What it tells you\">Time reviewers spend checking routine work, as opposed to real exceptions<\/td><\/tr><tr><td data-l=\"Measure\">Cost<\/td><td data-l=\"What it tells you\">What the usage costs<\/td><\/tr><tr><td data-l=\"Measure\">Failure rate<\/td><td data-l=\"What it tells you\">How often it produces something unusable<\/td><\/tr><tr><td data-l=\"Measure\">User satisfaction<\/td><td data-l=\"What it tells you\">Whether the people receiving it find it useful<\/td><\/tr><\/tbody><\/table><\/div>\n<p>See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"correction-rate\">correction rate<\/span> and <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"review-burden\">review burden<\/span>.<\/p>\n<h2>Worked example: the weekly patch compliance report<\/h2>\n<p>Every week you produce a patch compliance report from updates sent in by six customer account teams. The report has a summary per account, a table of agreed measures, stated risks and an appendix of source references. The stable materials are the approved report structure, the measure definitions, the writing standard and the escalation rule. Three things must go to a human reviewer before publication: a reported security incident, missing evidence for a required measure, and a conflict between source updates.<\/p>\n<p>The baseline process looks like this:<\/p>\n<ul><li>A separate chat for each account.<\/li><li>The same stable references uploaded every time.<\/li><li>Updates pasted in whatever format each team used.<\/li><li>Results copied into a spreadsheet and manually reshaped into the report structure.<\/li><li>The most capable model used for everything, including routine formatting.<\/li><li>No defined exception route. If Claude notices a security issue, you have to spot it while assembling the report.<\/li><\/ul>\n<p>That is repeated context, duplicated transformation, inconsistent input, more capability than the task needs, reformatting downstream, and an unreliable control on the highest-consequence items.<\/p>\n<h2>Find waste without removing controls<\/h2>\n<p>Map each handoff and ask three questions. What is stable? What changes each cycle? What has to stay visible for review?<\/p>\n<dl class=\"defs\"><div><dt>Stable<\/dt><dd>The report structure, approved terminology, measure definitions and escalation criteria.<\/dd><\/div><div><dt>Changes each cycle<\/dt><dd>This week's account updates and the supporting records they cite.<\/dd><\/div><\/dl>\n<p>Keeping the two apart ends the repeated uploads and still preserves the evidence for each cycle. The stable material goes into a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project\">project<\/span> as curated knowledge: selected, maintained references people can inspect and update. It is not an unfiltered archive of every past report.<\/p>\n<p>A standard <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"input-template\">input template<\/span> reduces variation before Claude sees anything. It makes omissions visible, supports batching and gives extraction a predictable structure.<\/p>\n<figure class=\"doc\"><figcaption>Standard account input template<\/figcaption><pre>Account:\nReporting week:\nMeasure results: [measure name, value, source reference]\nCompleted work: [source-supported statements]\nRisks or issues: [description and source reference]\nSecurity incident reported: Yes / No\nMissing or conflicting information: [describe, or None]<\/pre><\/figure>\n<p>A template does not make a claim true because it sits in a required field. The account team still has to supply current source information, and a reviewer still handles the designated exceptions.<\/p>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"batching\">Batching<\/span> means processing several similar, low-risk inputs together under the same rules. It suits routine account summaries with complete templates and no security incident, missing evidence or conflict. It is not a reason to mix exceptions in with ordinary work. Exceptions need focused human attention and a clear decision record.<\/p>\n<h2>Task tiers and better handoffs<\/h2>\n<p>Assign work to tiers by consequence, ambiguity and the reasoning needed. Do not assign by a preference for one model.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Tier<\/th><th>Work<\/th><th>Control<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Tier\">Low risk<\/td><td data-l=\"Work\">Extract submitted measures and format complete routine updates<\/td><td data-l=\"Control\">Completeness check<\/td><\/tr><tr><td data-l=\"Tier\">Standard<\/td><td data-l=\"Work\">Write the consolidated narrative from validated account summaries<\/td><td data-l=\"Control\">Normal review<\/td><\/tr><tr><td data-l=\"Tier\">High consequence<\/td><td data-l=\"Work\">Ambiguous conflicts, security-related content, material decisions<\/td><td data-l=\"Control\">Human review, whatever model is used<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Keep the higher-cost capability for work that needs its extra reasoning or synthesis. Routine formatting, field validation and repetitive extraction generally do not. That cuts cost without treating a cheaper model as a substitute for controls. The review requirement follows the consequence of the case, not the price of the model.<\/p>\n<p>Optimise the downstream handoff too. If the next person needs a spreadsheet-ready measure table and a report-ready narrative, ask for exactly those. Fixed headings and source-reference fields remove the copy, reformat and reconcile work. The output format is an interface between people and steps.<\/p>\n<h2>The redesigned workflow<\/h2>\n<p>One Project holds the approved report structure, measure definitions, writing standard and escalation rule. Each account sends the standard template with its current evidence.<\/p>\n<figure class=\"prompt\"><figcaption><span>Project instructions<\/span><\/figcaption><pre>Use only the supplied account inputs and approved Project\nknowledge.\nFor each account, produce the required report fields and keep\nevery source reference.\nDo not infer a missing measure, cause, owner, action or date.\nFlag for human review when a security incident is reported,\nrequired evidence is missing, or sources conflict.\nFor routine accounts, return a spreadsheet-ready measure table\nand a report-ready narrative under the approved headings.<\/pre><\/figure>\n<ol class=\"steps\"><li><b>Batch the routine accounts<\/b><span>Complete templates only, for extraction and formatting.<\/span><\/li><li><b>Check completeness<\/b><span>All accounts and all required fields are present.<\/span><\/li><li><b>Consolidate<\/b><span>Use the standard tier to write the narrative from the validated summaries.<\/span><\/li><li><b>Route the flags<\/b><span>Any flagged account leaves the batch and goes to the designated reviewer with its evidence. It is added back only after that review.<\/span><\/li><li><b>Approve release<\/b><span>You confirm completeness and that flags were resolved through the proper route.<\/span><\/li><\/ol>\n<div class=\"tw\"><table><thead><tr><th>Measure<\/th><th>Baseline<\/th><th>Improved<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Measure\">Quality<\/td><td data-l=\"Baseline\">Mixed inputs and manual copying cause omissions and inconsistent wording<\/td><td data-l=\"Improved\">Templates, fixed headings and source references support consistent checking<\/td><\/tr><tr><td data-l=\"Measure\">Elapsed time<\/td><td data-l=\"Baseline\">Repeated uploads, separate transformations and reformatting<\/td><td data-l=\"Improved\">Stable context, batching and ready-to-use output cut routine steps<\/td><\/tr><tr><td data-l=\"Measure\">User effort<\/td><td data-l=\"Baseline\">You rebuild context and restructure every result<\/td><td data-l=\"Improved\">You focus on validation, exceptions and release<\/td><\/tr><tr><td data-l=\"Measure\">Review risk<\/td><td data-l=\"Baseline\">Security and evidence issues can be buried in manual consolidation<\/td><td data-l=\"Improved\">Defined flags pull exceptions out for human review before publication<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"note\"><b>Optimisation result<\/b><p>Repeated preparation and rework are gone. Current evidence, traceable sources and human control over exceptions are all still there.<\/p><\/aside>\n<h2>Keep it working<\/h2>\n<p>Do not assume the workflow stays effective. Templates drift, measure definitions change, and people start sending incomplete material. Sample the routine outputs, inspect how exceptions were handled, and compare current measures with the baseline. If satisfaction drops or corrections rise, find the failing handoff before changing models or adding more instructions.<\/p>\n<ul><li>Keep Project knowledge to approved, stable, current references.<\/li><li>Update the input template when an approved report requirement changes.<\/li><li>Test routine and exception inputs separately after changing instructions or templates.<\/li><li>Check that reviewers receive the source evidence they need.<\/li><li>Measure whether the saved effort shows up downstream, not only during Claude use.<\/li><\/ul>","takeaways":["Effectiveness comes first. Faster is not better if the result is unsafe, unsupported or unusable.","Separate stable context from what changes each cycle. Reuse the first, supply the second.","A standard input template makes gaps visible and makes batching possible.","Batch routine work. Route security, evidence and conflict exceptions to a human.","Review follows the consequence of the case, not the price of the model. Measure the whole workflow."],"practice":"Map a recurring report you produce. Mark each step as stable context, variable input, transformation, review or handoff. Find one step you repeat every cycle that could be done once.","deck":"decks/31-optimising-workflows.html","quiz":[{"q":"A redesigned workflow is twice as fast, and reviewers now spend longer fixing unsupported claims in the output. Is it optimised?","multi":false,"o":[{"t":"Yes. Speed is the measure.","ok":false,"why":"Efficiency only counts once the result is useful."},{"t":"Yes, provided cost also fell.","ok":false,"why":"Cheap and fast does not help if the output cannot be used."},{"t":"No. Effectiveness comes first, and the effort has only moved downstream.","ok":true,"why":"A faster process that produces unusable or unsupported output is not optimised."},{"t":"It cannot be assessed.","ok":false,"why":"Correction rate and review burden assess exactly this."}]},{"q":"Which material belongs in the Project as stable context, not re-supplied every week?","multi":false,"o":[{"t":"This week's account updates.","ok":false,"why":"Those change every cycle."},{"t":"The supporting records for this week's figures.","ok":false,"why":"Current evidence is supplied each cycle."},{"t":"The approved report structure and measure definitions.","ok":true,"why":"They stay the same between cycles, so they are curated once and maintained."},{"t":"Every past report ever produced.","ok":false,"why":"An unfiltered archive is not curated knowledge."}]},{"q":"An account's template reports a security incident. What happens to it?","multi":false,"o":[{"t":"It is batched with the others to keep things moving.","ok":false,"why":"Exceptions need focused attention and are not mixed with routine work."},{"t":"It is removed from the batch and sent to the designated human reviewer with its evidence.","ok":true,"why":"A reported security incident is one of the three defined exception conditions."},{"t":"It is left out of the report.","ok":false,"why":"It is reviewed and then included, not dropped."},{"t":"It is sent to the most capable model in place of a reviewer.","ok":false,"why":"Review follows consequence. A stronger model is not a substitute."}]},{"q":"What should decide how much human review a task gets?","multi":false,"o":[{"t":"The price of the model used.","ok":false,"why":"A cheaper or dearer model does not change the consequence."},{"t":"How long the output is.","ok":false,"why":"Length is not risk."},{"t":"Whether the user is senior.","ok":false,"why":"Seniority is not a risk measure."},{"t":"The consequence and ambiguity of the case.","ok":true,"why":"High-consequence work needs human review whatever capability is selected."}]},{"q":"Which TWO does a standard input template give you?","multi":true,"o":[{"t":"It makes omissions visible before Claude receives the material.","ok":true,"why":"An empty required field is obvious."},{"t":"It makes any statement in a required field true.","ok":false,"why":"A template structures claims. It does not verify them."},{"t":"It gives extraction a predictable structure, which supports batching.","ok":true,"why":"Consistent inputs can be processed together under the same rules."},{"t":"It removes the need for a reviewer on exceptions.","ok":false,"why":"Designated exceptions still go to a human."}]}]}},"exams":{"1":{"title":"Practice exam 1","min":80,"target":29,"q":[{"s":6,"q":"A reviewer is checking an AI-generated compliance note against a single approved procedure document. The note includes a precise deadline that does not appear anywhere in the document. What is the best classification for that deadline?","a":3,"o":[{"t":"A supported inference because specificity improves operational clarity","why":"Being specific does not make something supported. An inference still needs something in the document to rest on."},{"t":"An unresolved question because any precise deadline is acceptable if plausible","why":"Plausible is not the test. The note states the deadline as fact, so it is a claim, and nothing backs it."},{"t":"A supported claim because deadlines are often implied by procedures","why":"What procedures often imply is general knowledge, not this document. The approved procedure is the only authority here."},{"t":"An unsupported claim because the authoritative document does not establish it","why":"The note asserts a fact the single authoritative source does not contain. That is the definition of an unsupported claim."}]},{"s":7,"q":"In a draft analysis, a key measure is defined at the start one way and later used with a different meaning, even though the wording stays similar. What defect does this illustrate?","a":1,"o":[{"t":"An external factual error","why":"Nothing is being checked against the outside world. The problem sits inside the draft itself."},{"t":"A terminology shift that changes the definition used in the analysis","why":"The same label is carrying two meanings, so later reasoning no longer rests on the measure that was defined."},{"t":"A complete evidence check that confirms the recommendation","why":"This describes a successful review, not a defect."},{"t":"An ambiguous reference","why":"An ambiguous reference is when it is unclear what a word such as 'it' or 'this option' points to. Here the term is clear each time, and its meaning changes."}]},{"s":25,"q":"Which statement best reflects an appropriate use of Claude in people-related workplace decisions?","a":2,"o":[{"t":"Claude may make the final hiring choice when its response is written in a professional and neutral tone.","why":"Tone does not make a decision appropriate to delegate. A consequential decision about a person needs an accountable human."},{"t":"Claude should replace human review when the source material includes multiple stakeholder comments.","why":"More input material raises the need for human judgment. It does not remove it."},{"t":"Claude may support structured review, drafting, and analysis of supplied material, while a human remains responsible for consequential hiring decisions.","why":"Claude assists with the work around the decision. Responsibility for the decision stays with a person."},{"t":"Claude can issue hiring recommendations as long as it avoids explicit references to protected groups.","why":"Avoiding explicit references does not prevent bias through proxies, and it still hands the judgment to the model."}]},{"s":3,"q":"What is the main purpose of iterative prompting when improving an AI-generated draft?","a":0,"o":[{"t":"To assess a draft, identify a specific weakness, revise the instruction narrowly, and compare the new result","why":"This is the loop: inspect, diagnose one defect, make a targeted change, compare."},{"t":"To encourage the model to generate alternative facts when the source material is limited","why":"If the source lacks a fact, iteration cannot supply it. That would be inventing content."},{"t":"To replace the need for reviewing the output against the original task","why":"Iteration depends on reviewing against the task. It does not replace it."},{"t":"To keep adding more instructions until the response becomes longer and more polished","why":"Longer and more polished is not the goal. Each revision should address an observed gap."}]},{"s":7,"q":"A report states that Plan X has the lowest monthly fee and therefore is the right choice. The source comparison only shows prices, service hours, and response times, but does not state which factor matters most to the decision owner. What is the main reasoning problem?","a":3,"o":[{"t":"The report is internally inconsistent because any lower-cost plan must also have the fastest response time","why":"There is no rule linking cost to response time, and the report does not contradict itself."},{"t":"The conclusion is valid because cost is always the clearest basis for selecting among options","why":"Cost is one possible criterion. Nothing in the source says it is the one that matters here."},{"t":"The report contains an external factual error because monthly fees should not be compared","why":"Comparing fees is fine. The fee figures are not the issue."},{"t":"The conclusion is unsupported because it assumes a selection criterion not established by the evidence","why":"The jump from 'cheapest' to 'right choice' only works if cost is the deciding factor, and the source never says so."}]},{"s":5,"q":"A team lead is reviewing an AI-generated recommendation that sounds professional and includes confident conclusions. What should the team lead do first?","a":2,"o":[{"t":"Revise the tone to make it more formal before checking details","why":"Polishing tone before checking substance spends effort on something that may be wrong."},{"t":"Approve it if the structure is clear and concise","why":"Clear structure says nothing about whether the content is right or complete."},{"t":"Check the source material and requested result before judging the writing","why":"Start with what was asked for and what the evidence says. Fluent writing is not evidence of accuracy."},{"t":"Compare it against a similar past document to judge quality","why":"A past document shows style. It does not verify this recommendation's facts."}]},{"s":9,"q":"A reviewer must validate a claim about whether a local discount program applies to a purchase made in a specific city during a certain month. Which source characteristic is most important to confirm in addition to authority?","a":0,"o":[{"t":"Whether the source's jurisdiction and effective dates match the claim","why":"An authoritative source for the wrong place or the wrong period does not answer the question."},{"t":"Whether the source uses detailed formatting and a recent publication style","why":"Presentation tells you nothing about whether the rule applies."},{"t":"Whether the source agrees with a secondary summary found elsewhere","why":"Agreement with a secondary summary is weaker than checking the primary source's scope."},{"t":"Whether the source includes broad background information about the product category","why":"Background material is not what decides whether this purchase qualifies."}]},{"s":6,"q":"Which statement best describes an unsupported claim?","a":2,"o":[{"t":"A statement that uses informal wording even though the source supports it","why":"Wording style is separate from support. This statement is supported."},{"t":"A statement that summarizes the source briefly without repeating every detail","why":"A faithful summary is supported by its source."},{"t":"A statement presented as factual without adequate support from the available authoritative source","why":"It is asserted as fact and the authoritative source does not back it."},{"t":"A statement that is cautious in tone even when it adds no source-based evidence","why":"This describes hedged wording. The defining feature of an unsupported claim is a factual assertion without backing."}]},{"s":5,"q":"Which evaluation dimension checks whether all required facts, criteria, and requested parts appear in an output?","a":1,"o":[{"t":"Audience fitness","why":"Audience fitness asks whether the output suits its readers."},{"t":"Completeness","why":"Completeness is the check that nothing required has been left out."},{"t":"Internal consistency","why":"Internal consistency asks whether the output agrees with itself."},{"t":"Relevance","why":"Relevance asks whether what is included belongs there. It does not catch what is missing."}]},{"s":9,"q":"Which statement best reflects a sound fact-checking approach when reviewing a business recommendation?","a":1,"o":[{"t":"Begin by confirming the writer's overall conclusion before checking individual statements","why":"The conclusion depends on the individual statements. Check those first."},{"t":"Separate checkable factual claims from opinions and recommendations before testing them against evidence","why":"Only factual claims can be verified. Pulling them out first tells you what to test and how."},{"t":"Focus mainly on persuasive language because it most strongly influences the reader","why":"Persuasive language affects the reader. It is not what makes a claim true."},{"t":"Treat every sentence in the draft as equally verifiable and confirm them in the same way","why":"Facts, opinions and recommendations need different handling. They are not equally verifiable."}]},{"s":9,"q":"During review, a team cannot find enough relevant evidence to confirm a claim about a purchase outcome. How should the claim be recorded?","a":3,"o":[{"t":"As contradicted, because missing evidence implies the claim is likely false","why":"Missing evidence is not evidence against. Contradicted needs a source that says otherwise."},{"t":"As verified, provided the claim seems reasonable and low risk","why":"Seeming reasonable is not verification."},{"t":"As partially supported, because some business claims can proceed without documentation","why":"Partially supported needs some evidence. Here there is not enough to say that."},{"t":"As unresolved, while noting what additional fact or source would settle it","why":"It is neither confirmed nor refuted. Recording what would settle it makes the gap actionable."}]},{"s":5,"q":"Why is building a task-specific review rubric before accepting an output useful?","a":3,"o":[{"t":"It allows reviewers to favor polished wording when evidence is limited","why":"A rubric exists to stop polish standing in for evidence."},{"t":"It reduces the need to consider audience needs or usability","why":"Audience and usability are usually criteria on the rubric."},{"t":"It replaces the need to inspect whether claims are supported by evidence","why":"Checking support is one of the things a rubric makes you do."},{"t":"It helps reviewers check requirements consistently instead of relying on overall impression","why":"A rubric turns a general impression into the same visible checks every time."}]},{"s":2,"q":"A team asks Claude to assemble a cross-functional update using validated figures, stakeholder notes, and event records. Which action is the best use of a human gate?","a":1,"o":[{"t":"Skip review between stages if the initial prompt listed all required inputs clearly","why":"Listing inputs in the prompt does not prove they were all used correctly."},{"t":"Pause after extraction so a person can confirm the checked facts before they are used in analysis","why":"Everything later depends on the extracted facts, so this is where a person should confirm them."},{"t":"Pause only after final formatting because headings and layout are the highest-risk step","why":"Formatting is the lowest-risk step. By then any early error is built into the whole document."},{"t":"Let Claude continue through analysis and drafting because validated figures remove the need for checkpoints","why":"The source figures were validated. The extraction of them still has to be checked."}]},{"s":7,"q":"A team lead asks for a verification pass on a draft comparison before updating a decision record. Which prompt is most appropriate?","a":0,"o":[{"t":"Compare the draft with the source record and list only contradictions in numbers, label mismatches, definition changes, ambiguous references, and unsupported conclusions. Do not recommend an option.","why":"It names exactly what to look for, ties the check to the source, and keeps Claude out of the decision."},{"t":"Summarize the source and add any likely business priorities needed to justify one selection.","why":"Adding 'likely priorities' asks Claude to invent the criteria the decision should rest on."},{"t":"Choose the strongest option based on the narrative, even if the source does not state the decision criteria.","why":"This asks for a decision without criteria, which is the opposite of verification."},{"t":"Read the draft quickly and rewrite it so the final recommendation is more decisive and persuasive.","why":"Making it more persuasive changes the wording and checks nothing."}]},{"s":1,"q":"Which requirement makes prompt success most observable?","a":3,"o":[{"t":"Make the response high quality and suitable for leadership review","why":"'High quality' cannot be checked. A reviewer has nothing specific to tick off."},{"t":"Prepare a strong final version with excellent business judgment","why":"'Strong' and 'excellent judgment' are impressions, not requirements."},{"t":"Write something polished that sounds professional and complete","why":"Sounding complete is not the same as containing the required parts."},{"t":"Use a concise, factual tone and include the sections Summary, Risks, and Next Steps","why":"Named sections and a stated tone can be verified by looking at the output."}]},{"s":6,"q":"A manager rewrites an unsupported claim to sound clearer and more professional without adding new evidence. What does this change accomplish?","a":1,"o":[{"t":"It turns interpretation into fact if the tone remains cautious","why":"Tone cannot convert an interpretation into a fact."},{"t":"It improves presentation but does not validate the claim","why":"The wording is better and the evidence is unchanged, so the claim is still unsupported."},{"t":"It replaces the need for source review when the sentence is concise","why":"A shorter sentence still has to be checked against the source."},{"t":"It makes the conclusion acceptable if the wording is more precise","why":"Precise wording with no evidence is more misleading, not more acceptable."}]},{"s":2,"q":"Which situation most strongly indicates that a task should be decomposed into multiple stages instead of handled in one prompt?","a":2,"o":[{"t":"The user can directly review one concise result with few dependencies","why":"This is the profile of a one-step task."},{"t":"The input is a single transcript and the output is a short list of action items","why":"One input and one limited output suits a single prompt."},{"t":"The work combines multiple sources, decisions, and deliverables that depend on checked intermediate results","why":"Several sources and dependencies mean later stages need earlier results to be checked first."},{"t":"The work involves rewriting one approved paragraph for a different audience","why":"A single transformation of one approved input is a one-step task."}]},{"s":6,"q":"Why should a reviewer treat exact citations, statistics, dates, names, and causal explanations with extra caution?","a":3,"o":[{"t":"They are usually less important than the main rule being summarized","why":"These details are often the most consequential part, because people act on them."},{"t":"They should be removed automatically, even when the source states them directly","why":"If the source states them, they belong. The point is to verify, not to delete."},{"t":"They are acceptable if they sound consistent with common practice","why":"Sounding typical is how fabricated specifics get through."},{"t":"Their precision creates an impression of authority and therefore requires direct evidence","why":"A specific figure or name reads as reliable, which is exactly why each one needs checking against the source."}]},{"s":8,"q":"A response recommends applicants who have a refined presentation style and membership in selective social organizations, even though the role requirements focus on supervising field teams and improving workflows. What is the strongest reason to question this recommendation?","a":1,"o":[{"t":"It uses language that is too informal for a workplace setting.","why":"Register is not the concern. The criteria are."},{"t":"It relies on proxy variables that substitute access or style for job-relevant evidence.","why":"Polish and club membership track background and access, not the ability to supervise teams or improve workflows."},{"t":"It gives too much weight to preferred rather than required criteria.","why":"These traits are not listed as criteria at all, preferred or required."},{"t":"It focuses on traits that are difficult to measure numerically.","why":"Being hard to quantify is not the problem. Being unrelated to the role is."}]},{"s":5,"q":"An AI-generated draft includes only source-supported facts, but it leaves out a mandatory criterion needed for the final decision. What is the best evaluation conclusion?","a":1,"o":[{"t":"The draft is compliant as long as no included sentence contradicts the source","why":"Accuracy of what is present does not cover what is absent."},{"t":"The draft may still be unusable because an omission can make the decision materially wrong","why":"Accurate and incomplete can still lead to the wrong decision when a mandatory criterion is missing."},{"t":"The draft should be judged mainly on whether its recommendation sounds reasonable","why":"Sounding reasonable is an impression, and it hides omissions."},{"t":"The draft should be accepted because factual statements are more important than coverage","why":"Accuracy and completeness are separate checks. Passing one does not excuse failing the other."}]},{"s":4,"q":"Which requirement is most important when writing a research prompt?","a":2,"o":[{"t":"Ask for a final recommendation with a ranked conclusion and short rationale","why":"A ranked recommendation is what an analysis prompt asks for."},{"t":"Instruct the model to generate many distinct possibilities before evaluation","why":"That is a brainstorming instruction."},{"t":"Define acceptable sources, recency expectations, citation method, and how to report unknowns","why":"Research is judged on traceable evidence, so the prompt has to set the source and citation rules and say what to do with gaps."},{"t":"Specify audience voice, message format, and revision criteria for clarity","why":"Those belong in a drafting prompt."}]},{"s":3,"q":"When should a user restart with a clean conversation instead of continuing with follow-up prompts?","a":2,"o":[{"t":"When the current draft is accurate but could be slightly shorter","why":"A small change to a sound draft is what a follow-up is for."},{"t":"When the user wants the model to make broader unsupported assumptions","why":"A restart is not a way round the evidence boundary."},{"t":"When accumulated drafts and conflicting instructions are causing context drift","why":"Once old drafts and replaced instructions are steering the output, a clean start with the current source and goal is more reliable."},{"t":"When a rubric has already been used once in the conversation","why":"Using a rubric does not damage the context."}]},{"s":2,"q":"After facts have been extracted into a structured record, what should happen before analysis begins?","a":1,"o":[{"t":"Draft recommendations so missing details can be filled in later","why":"Drafting before checking builds on facts nobody has confirmed."},{"t":"Compare the extracted record with the inventory to check completeness","why":"The completeness check catches anything skipped while it is still cheap to fix."},{"t":"Format the final output so reviewers can inspect it more easily","why":"Formatting comes last, after content is approved."},{"t":"Merge the raw sources with the draft to preserve more context","why":"Mixing raw material back in undoes the point of working from a checked record."}]},{"s":1,"q":"An internal note must mention a requested topic, but no facts about that topic were provided in the record. What is the best instruction to include in the prompt?","a":3,"o":[{"t":"Tell the model to omit the topic entirely so the note reads more confidently","why":"The topic was requested. Leaving it out hides the gap."},{"t":"Ask the model to supply the most likely missing details to keep the note complete","why":"This asks for invented facts presented as part of the record."},{"t":"Encourage the model to infer a reasonable next step from the surrounding context","why":"An inferred next step reads as a commitment nobody made."},{"t":"Require the response to state that the information was not supplied and avoid speculation","why":"This covers the topic honestly and gives Claude an acceptable way to handle the gap."}]},{"s":10,"q":"Which factor most strongly indicates that a response should receive increased human review before use?","a":3,"o":[{"t":"It contains polished writing and concise formatting","why":"Presentation quality is not a risk signal."},{"t":"It uses plain language that a broad audience can understand","why":"Readability does not raise the stakes."},{"t":"It was generated quickly and summarizes familiar material","why":"Speed and familiarity do not decide how much review is needed."},{"t":"It could influence safety, commitments, or consequential action","why":"Review effort should scale with what happens if the output is wrong."}]},{"s":3,"q":"A team reviews a draft announcement and notices that one required fact from the approved source is missing, while the tone and formatting are already acceptable. What is the best next step?","a":1,"o":[{"t":"Change the tone, length, and structure at the same time to improve the overall quality","why":"Changing several things at once risks breaking what already works and does not target the defect."},{"t":"Request a focused revision that keeps the accurate parts and adds the missing fact","why":"One named defect, one narrow change, and the sound parts are explicitly kept."},{"t":"Ask for a more creative and detailed rewrite so the missing information is more likely to appear","why":"Hoping the fact turns up is not a fix. Ask for it directly."},{"t":"Start a new conversation immediately, even though the source material and task remain clear","why":"The context is sound, so there is no reason to restart."}]},{"s":1,"q":"A manager wants a model-generated update to be easy to review for accuracy. Which prompt design best supports checking whether each claim is grounded in evidence?","a":2,"o":[{"t":"Ask for a polished response first and provide source facts only if revisions are needed","why":"Without the facts up front, the first response has nothing to be grounded in."},{"t":"Provide only a desired tone and let the model determine which details are important","why":"This leaves the content to the model's guesses."},{"t":"Place source facts in a clearly labeled block and state the task instructions separately","why":"Separating evidence from instructions lets a reviewer trace each statement back to the source."},{"t":"Combine all instructions and source notes into one paragraph so the model can infer priorities","why":"Blending the two makes it harder for the model and the reviewer to tell evidence from direction."}]},{"s":3,"q":"Which situation best indicates a genuine knowledge gap rather than a prompt-revision problem?","a":3,"o":[{"t":"The response uses an unsuitable tone even though the facts are present","why":"That is a tone defect, fixed by naming the audience and voice."},{"t":"The output omits a point that is clearly stated in the source material","why":"That is a completeness defect. The fact was available."},{"t":"The draft includes all necessary facts but does not separate them with headings","why":"That is a format defect."},{"t":"The needed answer is not contained in the provided material at all","why":"No rewording can produce a fact the source does not contain. Someone has to supply it."}]},{"s":6,"q":"An AI response says it is highly confident in its answer, but the reviewer has not yet checked the source text. What is the best next step?","a":3,"o":[{"t":"Keep the answer but soften its wording to reduce risk","why":"Softer wording leaves the same unchecked claims in place."},{"t":"Ask the AI to restate its confidence level in more detail","why":"More confidence language is still not evidence."},{"t":"Accept the answer if its tone is formal and internally consistent","why":"An answer can be formal, consistent and wrong."},{"t":"Verify each factual claim against the authoritative source instead of relying on confidence language","why":"Stated confidence is not verification. The source is."}]},{"s":2,"q":"Why is requesting a plan from Claude useful when handling a complex assignment?","a":3,"o":[{"t":"It replaces the need for completeness checks once the plan looks reasonable","why":"A reasonable-looking plan still has to be executed and checked."},{"t":"It allows formatting decisions to be made before the objective is clarified","why":"Formatting is the last stage. The objective comes first."},{"t":"It proves that all required work has already been completed correctly","why":"A plan is a proposal for work. It is not evidence the work was done."},{"t":"It lets a person review proposed stages, inputs, and gates before execution begins","why":"Reviewing the route before it runs is how gaps get caught early."}]},{"s":11,"q":"A team maintains a step-by-step operations document that several people must revise, share, and work through over multiple days. Which output format is the best fit?","a":0,"o":[{"t":"An Artifact, because the item is a substantial reusable object needing interaction and collaboration","why":"A standalone piece of work that people return to, edit and share is what an Artifact is for."},{"t":"Structured data, because all collaborative work should be converted into stable fields","why":"A procedural document is prose and steps, not records in fields."},{"t":"An inline answer, because readers can review it immediately in one message","why":"An inline reply is read once. It is a poor home for something revised over days."},{"t":"A short status paragraph, because concise text reduces the need for version control","why":"A paragraph cannot hold a step-by-step document."}]},{"s":9,"q":"A draft says a device will perform at a stated level in normal use. The only evidence is a source saying performance is \"up to\" that level under named test conditions. What is the best interpretation?","a":0,"o":[{"t":"The claim is not supported as written because removing the stated conditions changes the meaning","why":"'Up to' under test conditions is a ceiling in a specific setup. Dropping the qualifiers makes a different, stronger claim."},{"t":"The claim is unresolved because test conditions never matter when a number is published","why":"Test conditions are exactly what define what the number means."},{"t":"The claim is verified because \"up to\" performance establishes normal expected results","why":"A maximum is not a typical result."},{"t":"The claim is verified if the source comes from the manufacturer rather than an independent tester","why":"Who published it does not change what the source actually says."}]},{"s":4,"q":"A manager tells Claude to brainstorm outreach ideas but also requires that every idea be a verified conclusion supported by existing evidence. What is the main problem with this instruction?","a":1,"o":[{"t":"It replaces source-tracing rules with formatting rules that belong in drafting","why":"No formatting rules are involved."},{"t":"It applies a research or analysis standard too early and can reduce idea variety","why":"Demanding verified conclusions during idea generation filters out the untested options a brainstorm is for."},{"t":"It removes the need for human review between task transitions","why":"The instruction says nothing about review between stages."},{"t":"It makes the brainstorm too audience-specific and turns it into a drafting task","why":"Audience is not what changed. The evidence standard is."}]},{"s":8,"q":"Which review instruction is most actionable for evaluating recruiting criteria?","a":3,"o":[{"t":"Ensure the final output sounds fully neutral and free from any possible bias.","why":"'Sounds neutral' is about tone and cannot be checked. Bias can sit behind neutral wording."},{"t":"Prefer criteria that appear commonly associated with long-term leadership success.","why":"'Commonly associated' invites stereotypes and proxies."},{"t":"Use polished wording first, then evaluate whether the reasoning seems generally fair.","why":"'Seems generally fair' is an impression, and polishing first puts presentation ahead of substance."},{"t":"Trace each criterion to documented role evidence, identify missing affected perspectives, and state uncertainty where support is absent.","why":"Each part is a concrete check a reviewer can carry out and show."}]},{"s":10,"q":"When adapting one validated set of facts for executives, specialists, and operators, which four elements should change while the facts remain the same?","a":2,"o":[{"t":"Root-cause conclusion, technical detail, decision ownership, and chronology","why":"The root cause and the order of events are facts. They do not change with the reader."},{"t":"Evidence standard, source authority, confidence level, and factual scope","why":"These are about what is true and how well it is supported, which stay fixed for every audience."},{"t":"Depth, vocabulary, tone, and call to action","why":"These are the presentation choices that fit a message to its reader without touching the facts."},{"t":"Validation method, publication status, review authority, and business impact","why":"These describe process and consequences, not how a message is tailored."}]},{"s":7,"q":"Which review step best checks internal consistency in a response comparing multiple options?","a":0,"o":[{"t":"Trace numbers, units, labels, definitions, and conclusions across the full response","why":"Internal consistency means the response agrees with itself from start to finish, so the check has to follow each item all the way through."},{"t":"Focus on whether the final recommendation sounds confident and practical","why":"How it sounds says nothing about whether it contradicts itself."},{"t":"Accept the calculations if the terminology appears consistent within one paragraph","why":"Inconsistencies usually appear between sections, not inside one paragraph."},{"t":"Confirm that at least one number in the response matches a reliable outside source","why":"That is an external fact check, and on one number only."}]},{"s":4,"q":"A team wants Claude to compare three internal proposals and choose the best one using only a supplied set of approved facts. Which prompt type is the best fit?","a":0,"o":[{"t":"Analysis, because it narrows supplied evidence into a bounded decision","why":"Comparing given options against given facts to reach a choice is analysis."},{"t":"Research, because it focuses on tracing evidence and reporting unknowns","why":"The evidence is already supplied. Nothing needs to be found."},{"t":"Brainstorming, because it emphasizes producing the widest possible range of unfiltered ideas","why":"The task is to narrow three options to one, not to widen the field."},{"t":"Drafting, because it turns approved facts into audience-ready communication","why":"Drafting comes after the decision is made."}]},{"s":8,"q":"A review panel has input from managers and finance staff about a scheduling role, but no input from the support staff whose daily work would be shaped by the role. Which concern does this most directly illustrate?","a":1,"o":[{"t":"Framing bias, because the role has been defined too broadly.","why":"Nothing here is about how the role was framed or scoped."},{"t":"Factual imbalance, because the record shows a measurable gap in who provided input.","why":"You can point to who was asked and who was not. The affected group is absent from the record."},{"t":"Validated prediction, because multiple internal groups contributed feedback.","why":"Several groups contributing does not validate anything when the most affected group is missing."},{"t":"Stereotyping, because assumptions are being made about group behavior.","why":"No assumptions about a group's behaviour are described. The issue is missing input."}]},{"s":1,"q":"Which prompt element defines who will read the response and helps determine terminology, detail, and tone?","a":3,"o":[{"t":"Objective","why":"The objective is the piece of work to be produced."},{"t":"Authoritative inputs","why":"These are the facts Claude may use as evidence."},{"t":"Output format","why":"Format is the layout of the answer, such as headings or a table."},{"t":"Audience","why":"The audience is the readers, and their needs set vocabulary, depth and tone."}]},{"s":4,"q":"For complex work that needs brainstorming, research, analysis, and drafting, which sequence is generally the best order?","a":2,"o":[{"t":"Draft first, brainstorm revisions, research missing facts, then analyze alternatives","why":"Drafting first means writing before there are options, evidence or a decision."},{"t":"Analyze immediately, draft a recommendation, research supporting details, then brainstorm improvements","why":"There is nothing to analyse until options exist and evidence has been gathered."},{"t":"Brainstorm first, research selected options, analyze the evidence, then draft the communication","why":"Widen the options, gather evidence on the promising ones, deci
