"Effort and tone words give Claude nothing new to work with."},{"t":"Repeat the same request in a new chat","why":"The same vague request produces the same kind of vague result."},{"t":"Switch to the most capable model","why":"A stronger model still has to guess the audience, facts and format."}]},{"s":1,"q":"An analyst wants a customer update that must not promise a completion date. Where is the best place to say so?","a":[0],"o":[{"t":"In the prompt, as an explicit constraint","why":"A constraint Claude is told about can be followed and checked."},{"t":"Nowhere, because Claude avoids commitments by default","why":"Claude has no way to know this customer's rule unless it is stated."},{"t":"In a follow-up message after the draft is sent to the customer","why":"By then the commitment may already have gone out."},{"t":"In the file name of the attached notes","why":"A file name is not a reliable instruction."}]},{"s":2,"q":"A monthly report needs data extracted from three sources, a comparison, then a written summary. What is the main benefit of breaking this into steps?","a":[0],"o":[{"t":"Each intermediate result can be checked before the next step builds on it","why":"An early error is caught where it happens and does not flow through to the summary."},{"t":"Claude is unable to process more than one source document within a single conversation","why":"It can. The reason is control over errors, not a hard limit."},{"t":"It always uses fewer messages","why":"Steps usually add messages. The gain is reliability."},{"t":"It removes the need for a person to review the final report","why":"Review is still needed. Steps make it easier."}]},{"s":2,"q":"A quarterly report is being built in steps. Which TWO practices make the stepped approach reliable?","a":[0,1],"o":[{"t":"Checking each intermediate result against its source before moving on","why":"An early error is caught where it happens."},{"t":"Carrying a missing input forward as \"not supplied\" and not as zero","why":"A gap stays visible and is not turned into a value."},{"t":"Running all the steps in one prompt so nothing is lost between them","why":"That removes the checkpoints the steps exist to provide."},{"t":"Skipping the check on any step whose output looks tidy and complete","why":"Tidy output can still be wrong or incomplete."}]},{"s":3,"q":"A prompt produces a draft that is accurate but too long for executives. What is the best next step?","a":[0],"o":[{"t":"Identify the specific defect and change the one instruction that addresses it","why":"A targeted change fixes the length problem and keeps what already works."},{"t":"Rewrite the whole prompt from scratch","why":"That risks losing the accuracy you already have."},{"t":"Add the word \"concise\" five times","why":"Repetition is not a measurable instruction."},{"t":"Accept it, since it is accurate","why":"It does not meet the audience's need."}]},{"s":3,"q":"After revising a prompt, how should you judge whether the new version is better?","a":[0],"o":[{"t":"Run it on the same input and compare the result against the same criteria","why":"Holding the input and the criteria constant makes the comparison meaningful."},{"t":"Try it on an easier input","why":"An easier input hides whether the original problem is fixed."},{"t":"Ask Claude which of the two versions it prefers and go with the one it chooses","why":"Claude's preference is not your acceptance test."},{"t":"Go with whichever output is longer","why":"Length is not quality."}]},{"s":4,"q":"A team lead wants a wide range of ideas for reducing after-hours callouts before narrowing them down. Which instruction suits this brainstorming task?","a":[0],"o":[{"t":"Ask for many varied options without evaluating them yet, then assess them in a separate step","why":"Brainstorming benefits from breadth first. Judging too early narrows the set."},{"t":"Ask for the single best answer straight away, with a full justification of why it beats the others","why":"That is analysis, and it closes down the range of ideas."},{"t":"Ask for only ideas backed by a cited source","why":"That suits research, not idea generation."},{"t":"Ask for a polished final document","why":"That is drafting, which comes after the ideas are chosen."}]},{"s":4,"q":"An engineer asks Claude to analyse an incident timeline. Which instruction best fits an analysis task?","a":[0],"o":[{"t":"Separate what the timeline states from what is inferred, and show the reasoning","why":"Analysis needs conclusions that can be traced to the evidence."},{"t":"Be as creative as possible","why":"Creativity is for brainstorming. Analysis needs grounding."},{"t":"Write in a warm, persuasive tone","why":"Tone guidance suits drafting for an audience."},{"t":"Produce as many alternatives as you can","why":"That is a brainstorming instruction."}]},{"s":5,"q":"A comparison memo quotes every figure correctly and leaves out one mandatory selection criterion. How should it be rated?","a":[0],"o":[{"t":"Accurate in what it includes, and incomplete","why":"Accuracy and completeness are separate checks, and the omission can change the decision."},{"t":"Acceptable, because nothing in it is wrong and every figure checks out","why":"Nothing wrong is not the same as everything required being present."},{"t":"Inaccurate, because of the omission","why":"The included claims are accurate. The failure is completeness."},{"t":"Poorly formatted","why":"Format is not the issue."}]},{"s":5,"q":"What is the purpose of writing a review rubric before reading Claude's output?","a":[0],"o":[{"t":"To judge the output against the task's requirements and not against how well it reads","why":"A rubric built from the task keeps polish from standing in for quality."},{"t":"To make the review take longer","why":"The aim is consistency, not duration."},{"t":"To give Claude a numerical score it can learn from and use to improve its next attempt","why":"The rubric is for the reviewer's acceptance decision."},{"t":"To avoid checking the source material","why":"The rubric is used with the source, not in place of it."}]},{"s":5,"q":"A reviewer changes \"annual subscription cost\" to \"annual cost\" in a memo where only one annual cost exists. What kind of change is this?","a":[0],"o":[{"t":"A harmless stylistic preference","why":"The meaning and the decision are unchanged."},{"t":"A completeness defect","why":"Nothing required was removed."},{"t":"A factual error","why":"The fact is the same."},{"t":"An instruction compliance failure","why":"No instruction was broken."}]},{"s":6,"q":"A summary of a policy states that tests must be run \"every 90 days\". The policy gives no frequency. What is this?","a":[0],"o":[{"t":"An unsupported claim","why":"The summary asserts a specific fact the source does not contain."},{"t":"A supported inference","why":"An inference needs something in the source to rest on."},{"t":"A formatting issue","why":"The problem is content."},{"t":"An acceptable clarification","why":"Adding an invented requirement is not clarifying."}]},{"s":6,"q":"A summary of supplied meeting notes is being reviewed. Which TWO items should be treated as unsupported?","a":[0,1],"o":[{"t":"A due date that does not appear anywhere in the notes","why":"A specific detail absent from the source has no support."},{"t":"A named owner for an action the notes record without one","why":"Naming someone the notes do not name is invention."},{"t":"A decision quoted in the same words the notes use","why":"It matches the source."},{"t":"A statement that the notes do not record a budget figure","why":"That is honest reporting of a gap."}]},{"s":7,"q":"A draft says Option A is cheapest at $4,500 and later recommends Option B \"as the lowest-cost choice\" at $3,600. What should the reviewer flag?","a":[0],"o":[{"t":"An internal inconsistency between the figures and the conclusion","why":"Two statements in the same draft cannot both be right."},{"t":"A bias issue","why":"Nothing here concerns representation or fairness."},{"t":"A tone problem","why":"The wording is fine. The logic is not."},{"t":"Nothing, since both figures are present and the reader can work it out","why":"The figures being present does not resolve the contradiction."}]},{"s":7,"q":"A recommendation says a change is \"low risk\" and gives no basis for that judgement. What is missing?","a":[0],"o":[{"t":"The reasoning or evidence linking the facts to the conclusion","why":"A conclusion with no stated basis is a reasoning gap."},{"t":"A longer introduction","why":"Length does not supply the missing step."},{"t":"A second recommendation","why":"Another option does not justify this one."},{"t":"Bold formatting on the key phrase so that the reader notices it","why":"Emphasis is not evidence."}]},{"s":8,"q":"Claude is asked to shortlist team leads for an outreach programme and returns only people from the largest office. What should the reviewer check first?","a":[0],"o":[{"t":"Whether the criteria or the source data left out other groups","why":"Skewed output often comes from skewed input or criteria."},{"t":"Whether the list is in alphabetical order","why":"Ordering does not address who is missing."},{"t":"Whether the largest office is the most important","why":"That assumes the skew is justified without checking."},{"t":"Whether the shortlist is the right length","why":"Length does not address who is missing."}]},{"s":8,"q":"A draft describes one team as \"resistant\" and another as \"careful\" for the same behaviour. What is the concern?","a":[0],"o":[{"t":"Loaded language that frames the same behaviour differently","why":"Different labels for the same conduct introduce bias."},{"t":"A factual error about what the two teams actually did in the period","why":"The behaviour may be accurately reported. The framing is the problem."},{"t":"Excessive length","why":"Length is not the issue."},{"t":"A missing citation","why":"A citation would not fix the unequal framing."}]},{"s":9,"q":"Claude's draft cites a battery runtime figure. Which source is the best one to verify it against?","a":[0],"o":[{"t":"The manufacturer's current specification for that exact model","why":"A primary, current, specific source is the strongest check."},{"t":"A forum post that mentions a similar unit","why":"Informal and about a different unit."},{"t":"An older brochure for the previous model","why":"Out of date and the wrong model."},{"t":"Claude's own confirmation of the figure when it is asked a second time","why":"Asking the same model again is not independent verification."}]},{"s":9,"q":"Which TWO checks help establish that a source is suitable for verifying a factual claim?","a":[0,1],"o":[{"t":"Whether it comes from the body responsible for the fact","why":"Authority comes from who published it."},{"t":"Whether it is the current version and has not been replaced","why":"An authoritative source can still be out of date."},{"t":"Whether it appears near the top of the search results","why":"Ranking is not authority."},{"t":"Whether it is written in a confident and professional style","why":"Style says nothing about reliability."},{"t":"Whether several sites repeat it word for word","why":"Copies of one origin are not independent confirmation."}]},{"s":10,"q":"The same incident has to be explained to engineers, to managers and to the customer. What should change between the three versions?","a":[0],"o":[{"t":"The level of detail, the terminology and the emphasis, with the facts kept the same","why":"Audiences need different framing of the same accurate content."},{"t":"The facts themselves, so that each of the three audiences hears the version that suits it best","why":"Changing facts by audience is misleading."},{"t":"Nothing. One version should serve everyone","why":"A single version will be too technical for some and too thin for others."},{"t":"Only the font and layout","why":"Presentation alone does not meet different needs."}]},{"s":10,"q":"When is human review of Claude's output most important before use?","a":[0],"o":[{"t":"When the output will influence a decision, a commitment or an action with real consequences","why":"Review effort should follow the consequence of an error."},{"t":"Only when the output looks unpolished, has formatting problems or reads awkwardly to you on first pass","why":"Polished output can be wrong."},{"t":"Only when Claude says it is unsure","why":"Claude can be confidently wrong."},{"t":"Never, if the prompt was well written","why":"A good prompt reduces errors. It does not remove them."}]},{"s":11,"q":"A team repeatedly answers questions using the same style guide and reference documents. Which Claude capability fits best?","a":[0],"o":[{"t":"A Project with instructions and knowledge","why":"Projects hold stable instructions and reference material for recurring work."},{"t":"A new ordinary chat each time","why":"That means re-supplying the same context every time."},{"t":"An Artifact","why":"Artifacts are for standalone outputs to view and iterate on."},{"t":"Research","why":"Research is for gathering information from many sources."}]},{"s":11,"q":"Someone needs a current overview of a topic drawn from many web sources, with citations. Which capability suits this?","a":[0],"o":[{"t":"Research","why":"It is designed to search across sources and report with citations."},{"t":"A Project","why":"Projects organise recurring work with your own material."},{"t":"An Artifact","why":"An Artifact presents an output. It does not gather sources."},{"t":"A plain chat with no tools","why":"It cannot check current sources."}]},{"s":12,"q":"A high-volume task classifies short, simple tickets into five categories, and speed matters. Which kind of model is the sensible starting point?","a":[0],"o":[{"t":"The fastest, lowest-cost tier","why":"Simple, high-volume work rarely needs the most capable model."},{"t":"The most capable tier, to be safe","why":"That adds cost and latency with little benefit for a simple task."},{"t":"Whichever model is newest","why":"New is not a selection criterion."},{"t":"A different model for each ticket","why":"Inconsistent and unnecessary."}]},{"s":12,"q":"Which TWO tasks are reasonable candidates for the fastest, lowest-cost model tier?","a":[0,1],"o":[{"t":"Sorting short support messages into five fixed categories","why":"Simple, high-volume classification."},{"t":"Pulling the order number out of one-line confirmation emails","why":"Straightforward extraction."},{"t":"Weighing conflicting evidence across several long contracts","why":"Complex multi-document reasoning suits a more capable tier."},{"t":"Drafting a nuanced recommendation on an ambiguous policy question","why":"Nuanced judgement benefits from more capability."}]},{"s":13,"q":"Two model options produce acceptable quality on a routine task. One costs slightly more per item and needs far fewer human corrections. What should decide the choice?","a":[0],"o":[{"t":"The total cost including human correction time","why":"A cheaper model that needs more rework can cost more overall."},{"t":"The per-item model price alone","why":"That ignores the largest cost, which is people's time."},{"t":"Which model has the higher name recognition with stakeholders","why":"Not a business measure."},{"t":"Which is faster, regardless of rework","why":"Speed gained at the model can be lost in correction."}]},{"s":13,"q":"What is the right way to decide whether a cheaper, faster model is good enough for a task?","a":[0],"o":[{"t":"Test it on representative inputs against defined quality criteria","why":"Evidence from your own task beats assumptions about tiers."},{"t":"Assume cheaper always means worse","why":"For simple tasks a cheaper model may be fully adequate."},{"t":"Assume faster always means better","why":"Speed says nothing about meeting the quality bar."},{"t":"Ask the model whether it is good enough","why":"Self-assessment is not a test."}]},{"s":14,"q":"A long conversation has drifted across several topics and Claude starts mixing up details. What is the best response?","a":[0],"o":[{"t":"Start a new chat with a concise summary of what matters","why":"A clean context with the essential facts removes the clutter causing confusion."},{"t":"Keep going in the same chat and repeat the question more forcefully","why":"The interfering context is still there."},{"t":"Paste the whole conversation back in","why":"That adds more clutter."},{"t":"Assume the product is broken","why":"This is a context problem, not an outage."}]},{"s":15,"q":"Before deciding whether to use Claude for a process, what should be established first?","a":[0],"o":[{"t":"What the process must achieve, who uses the result and what a good outcome looks like","why":"Requirements come before tool choice."},{"t":"Which model is most popular with other organisations in the same industry at the moment","why":"Popularity does not define the need."},{"t":"How to automate every step","why":"Not every step should be automated."},{"t":"How to remove reviewers","why":"Removing review is not a requirement."}]},{"s":15,"q":"Which task is the weakest candidate for Claude assistance?","a":[0],"o":[{"t":"Giving final approval on a change that policy reserves for an authorised person","why":"Decisions reserved for an accountable person should not be handed to a tool."},{"t":"Summarising meeting notes for the team","why":"A common, reviewable use."},{"t":"Drafting a first version of a routine notice from approved facts","why":"Low risk and easy to review."},{"t":"Organising information from several documents for a reviewer","why":"A bounded preparation task."}]},{"s":16,"q":"An engineer uses Claude to compare three backup approaches. What makes the comparison trustworthy?","a":[0],"o":[{"t":"Stated criteria applied to each option, with sources for the key facts","why":"Consistent criteria and traceable facts make the comparison checkable."},{"t":"A confident recommendation at the top","why":"Confidence is not evidence."},{"t":"The longest and most detailed description possible of each option's features","why":"Length does not make the comparison fair."},{"t":"Leaving out the weaker options","why":"That hides the basis for the choice."}]},{"s":16,"q":"Claude has helped compare three hosting options. Which TWO things make the comparison trustworthy?","a":[0,1],"o":[{"t":"The same stated criteria were applied to every option","why":"Consistent criteria make the comparison fair."},{"t":"Key figures can be traced to a named source","why":"Traceable facts can be checked."},{"t":"The recommended option is described at the greatest length","why":"Length is not evidence."},{"t":"The weakest option was left out to keep it short","why":"That hides part of the basis for the choice."}]},{"s":17,"q":"A team lists ten possible process improvements. What is a sound way to choose where to start?","a":[0],"o":[{"t":"Weigh the expected benefit against effort and risk, using what the process data shows","why":"Prioritising on evidence of benefit, effort and risk gives a defensible order."},{"t":"Start with whichever is most interesting","why":"Interest is not business value."},{"t":"Do all ten at once","why":"That makes results impossible to attribute."},{"t":"Pick the one that uses the most AI","why":"AI usage is not a goal in itself."}]},{"s":17,"q":"Which is the best evidence that a step in a weekly reporting process is worth improving?","a":[0],"o":[{"t":"Measured time and rework on that step across several cycles","why":"Repeated measurements show a real, recurring cost."},{"t":"One person's comment that it feels slow","why":"A single impression is a prompt to measure, not proof."},{"t":"The step being the oldest in the process and unchanged for years","why":"Age is not a problem by itself."},{"t":"The step not yet using AI","why":"That is not evidence of a problem."}]},{"s":18,"q":"A team pilots a Claude-supported triage workflow. What should the pilot include?","a":[0],"o":[{"t":"A small scope, defined success measures and human review of the outputs","why":"A bounded pilot with measures and review shows whether the design works."},{"t":"Immediate rollout to every team so that the benefits arrive sooner","why":"That skips the learning a pilot is for."},{"t":"No measures, to avoid bias","why":"Without measures nobody can tell whether it worked."},{"t":"Only the easiest cases","why":"Easy cases alone hide how it handles real variation."}]},{"s":18,"q":"A team is planning a pilot of a Claude-supported workflow. Which TWO belong in the pilot design?","a":[0,1],"o":[{"t":"Success measures agreed before the pilot starts","why":"Criteria set in advance stop the goalposts moving."},{"t":"Human review of the outputs during the pilot","why":"Review shows where the design fails and limits harm."},{"t":"A test set made up only of the easiest cases","why":"Easy cases hide how it handles real variation."},{"t":"Rollout to every team on day one to gather more data","why":"That skips what a pilot is for."}]},{"s":19,"q":"A manager asks what value a Claude-supported workflow has delivered. What is the strongest answer?","a":[0],"o":[{"t":"Measured before and after results on agreed measures, with the limits stated","why":"Evidence against a baseline is credible and honest about scope."},{"t":"A statement that the team likes it and would not want to go back to the old way","why":"Satisfaction matters and does not show the business result by itself."},{"t":"The number of prompts written","why":"Activity is not value."},{"t":"A projection with no baseline","why":"Without a baseline there is nothing to compare with."}]},{"s":19,"q":"A workflow has Claude draft and a person review and approve. A stakeholder suggests removing the reviewer to save time. What is the best response?","a":[0],"o":[{"t":"Keep the review where errors would have consequences, and look for savings elsewhere","why":"Efficiency should not come from removing a necessary control."},{"t":"Agree, since Claude rarely makes mistakes and the reviewer almost never changes anything","why":"Rare errors in consequential work still need a control."},{"t":"Agree, provided a disclaimer is added","why":"A disclaimer does not catch errors."},{"t":"Refuse to discuss efficiency at all","why":"There may be real savings in other steps."}]},{"s":20,"q":"Which item belongs in a Project's instructions and not in an individual chat?","a":[0],"o":[{"t":"The approved terminology and tone for all notices","why":"It applies every time, so it is durable guidance."},{"t":"The date of this week's maintenance window","why":"It applies to one job."},{"t":"The name of the server being patched tonight","why":"One-off task context."},{"t":"A reminder to finish by 3 pm today","why":"Temporary."}]},{"s":20,"q":"Why test a Project in a fresh chat after changing its setup?","a":[0],"o":[{"t":"To confirm the saved instructions and knowledge are sufficient without earlier conversation","why":"A new chat has no history to lean on."},{"t":"Because fresh chats are more accurate in general than chats that have been running for a while","why":"The point is isolating the setup."},{"t":"To prove earlier chats are shared automatically","why":"It tests the opposite."},{"t":"To avoid reviewing the output","why":"The output is still reviewed."}]},{"s":21,"q":"Which Project instruction is the most testable?","a":[0],"o":[{"t":"Cite the document title and section for every requirement you state","why":"A reviewer can check a response for the citation."},{"t":"Be accurate","why":"A hoped-for result with no observable behaviour."},{"t":"Be helpful and clear","why":"Neither can be checked directly."},{"t":"Use good judgement about which sources to rely on for each answer","why":"It leaves the key decision unstated."}]},{"s":21,"q":"Which TWO instructions belong in a Project's standing instructions?","a":[0,1],"o":[{"t":"Treat the approved standard as the authority when sources disagree","why":"A rule that applies every time."},{"t":"If information is missing, list it and do not assume it","why":"A standing rule for handling gaps."},{"t":"Answer this question in time for Thursday's briefing","why":"A one-off request belongs in the chat."},{"t":"The outage on 3 June affected Site B only","why":"A one-off fact that will go stale."}]},{"s":22,"q":"A Project's knowledge contains two identical copies of a standard in different formats. What is the best action?","a":[0],"o":[{"t":"Keep one canonical copy","why":"Duplicates add upkeep and competing retrieval targets without adding evidence."},{"t":"Keep both for safety","why":"Two copies are not two sources."},{"t":"Add a third copy as a backup","why":"More duplication, same problem."},{"t":"Delete both","why":"The Project still needs the standard."}]},{"s":23,"q":"A connector reports that a named document cannot be accessed. How should Claude's output handle that?","a":[0],"o":[{"t":"State that it could not be accessed and draw no conclusion about its contents","why":"An access limit is a known gap, not evidence."},{"t":"Describe what it probably contains","why":"That is guessing."},{"t":"Use an older copy of the document without saying so, since it is probably similar","why":"The reader would be misled about the source."},{"t":"Ignore it silently","why":"A named source being unavailable should be visible."}]},{"s":24,"q":"A policy the Project depends on has been replaced. What is the correct maintenance action?","a":[0],"o":[{"t":"Replace the old source and rule, record the change and rerun the regression tests","why":"Obsolete content is removed, and the change is tested before reuse."},{"t":"Add an instruction to ignore the old rule","why":"Both rules would remain and conflict."},{"t":"Wait for a user to report a wrong answer","why":"A new source version is already a trigger."},{"t":"Upload the new policy alongside the old one","why":"Conflicting sources side by side."}]},{"s":25,"q":"Which use of Claude best preserves human accountability in a regulated review?","a":[0],"o":[{"t":"Claude organises the evidence and an authorised reviewer makes the decision","why":"Preparation is separated from judgement."},{"t":"Claude makes the decision and a person is told about it afterwards for the record","why":"Being told afterwards is not control."},{"t":"Claude makes the decision and sends the notice","why":"That hands over judgement and communication authority."},{"t":"Claude decides the easy cases alone","why":"Easy-looking cases can still carry consequences."}]},{"s":25,"q":"What makes a human review step meaningful?","a":[0],"o":[{"t":"The reviewer has the authority, the source material, the time and the expertise to reject the output","why":"Without those the review is a formality."},{"t":"The reviewer's name and the date appear on the record next to the decision, showing that a person saw it","why":"A name is not scrutiny."},{"t":"The review happens within one minute","why":"Speed is not the test."},{"t":"The output includes a disclaimer","why":"A disclaimer does not review anything."}]},{"s":25,"q":"Which TWO are needed for a human review step to be meaningful?","a":[0,1],"o":[{"t":"The reviewer can see the source material the output was based on","why":"They need something to check the output against."},{"t":"The reviewer has the authority to reject the output","why":"Without the power to reject, the review changes nothing."},{"t":"The reviewer approves within a fixed thirty seconds","why":"A time cap removes the chance to challenge."},{"t":"The output carries a note saying it was reviewed","why":"A label is not scrutiny."}]},{"s":26,"q":"A dataset has names removed and keeps postcode, job title and start date. Why might it still be personal information?","a":[0],"o":[{"t":"The combination can single out an individual","why":"Quasi-identifiers together create re-identification risk."},{"t":"It cannot be, without names","why":"Names are not the only way to identify someone."},{"t":"Because all workplace data is personal information","why":"Not all of it is. The risk here is the combination of fields."},{"t":"Because it was exported from an HR system","why":"The origin does not decide it. What the fields can reveal does."}]},{"s":26,"q":"An analyst needs monthly totals by category. Which data control fits?","a":[0],"o":[{"t":"Aggregation","why":"Group-level counts answer the question without individual records."},{"t":"Synthetic data","why":"It may not preserve the real totals."},{"t":"Redacting only the email column","why":"Row-level data would remain for no reason."},{"t":"No control","why":"That exposes more than the task needs."}]},{"s":27,"q":"A colleague says \"just use your personal AI account, it's quicker\". Policy requires the approved workspace. What should the employee do?","a":[0],"o":[{"t":"Use the approved workspace, and escalate if an exception is really needed","why":"Only the authorised exception process changes a control."},{"t":"Use the personal account once","why":"One breach is still a breach."},{"t":"Use the personal account this once and delete the chat when the work is done","why":"Deleting does not undo it."},{"t":"Use it if the colleague is senior","why":"Seniority does not override the control."}]},{"s":27,"q":"A request conflicts with the AI policy. Which TWO actions are part of a sound response?","a":[0,1],"o":[{"t":"Pause before any prohibited data is entered","why":"Stopping first prevents the breach."},{"t":"Record the specific conflict and send it to the designated approver","why":"Escalation with the policy basis lets an authorised person decide."},{"t":"Go ahead once, since the requester is senior","why":"Seniority is not an approved exception."},{"t":"Remove one sensitive field and carry on as asked","why":"Other conflicts would remain."}]},{"s":28,"q":"A panel asks Claude to score applicants using writing quality as a sign of capability. What is the concern?","a":[0],"o":[{"t":"Writing quality is a proxy that may reflect advantage and not the approved criteria","why":"A proxy can import unfairness while looking objective."},{"t":"Claude cannot assess writing","why":"It can, which is why the risk is real."},{"t":"Scores should be out of ten","why":"The scale is not the issue."},{"t":"There is no concern if the panel agrees","why":"Agreement does not make a proxy fair."}]},{"s":28,"q":"People affected by an AI-assisted decision are told \"all decisions are final\". What is missing?","a":[0],"o":[{"t":"A practical route to correct errors or challenge the process","why":"Contestability needs a real way to raise and resolve a concern."},{"t":"A longer notice","why":"Length does not create a route."},{"t":"A numerical score","why":"A score does not let anyone challenge it."},{"t":"The name and version of the model that was used in the process","why":"That alone gives no route to challenge."}]},{"s":29,"q":"A Project gives different answers to the same question in separate chats. What is the first step?","a":[0],"o":[{"t":"Describe the symptom, define a correct answer and reproduce it with a controlled test","why":"Diagnosis starts from an observable symptom and a standard."},{"t":"Rewrite every instruction in the Project so that the answer is stated in several places","why":"Wholesale change hides the cause."},{"t":"Report an outage","why":"A poor result is not evidence of a technical fault."},{"t":"Change the model","why":"That does not address conflicting sources."}]},{"s":29,"q":"A request asks Claude to confirm that an event happened which appears in none of its sources. Which diagnosis fits?","a":[0],"o":[{"t":"An unsupported capability: Claude cannot verify it from what it has","why":"Stronger wording will not create the evidence."},{"t":"Unsuitable format","why":"Layout is not the issue."},{"t":"Context overload","why":"The problem is missing evidence, not too much input."},{"t":"A stylistic preference","why":"This concerns facts."}]},{"s":30,"q":"Which piece of feedback is ready to use as an acceptance criterion?","a":[0],"o":[{"t":"Every action must show an owner and due date, or say \"not recorded\"","why":"It describes a result that can be checked."},{"t":"Make it better","why":"Nothing to check."},{"t":"It feels off","why":"An impression, not a criterion."},{"t":"Shorter, please, and with less background than the last few summaries","why":"People can disagree on whether it is short enough."}]},{"s":30,"q":"Which TWO cases should be in a small regression set for a summarisation prompt?","a":[0,1],"o":[{"t":"The input that previously produced the defect","why":"It shows the defect is fixed and stays fixed."},{"t":"An input with a required field missing","why":"It checks that gaps are reported and not filled."},{"t":"An input chosen because the prompt already handles it well","why":"That flatters the prompt and tests nothing new."},{"t":"A copy of the first case with a different file name","why":"A duplicate adds no coverage."}]},{"s":31,"q":"A redesigned workflow is faster, and reviewers now spend more time fixing its output. What does that indicate?","a":[0],"o":[{"t":"Efficiency was gained at the cost of effectiveness","why":"Effort moved downstream. The workflow is not optimised."},{"t":"The workflow is fully optimised","why":"Unusable output is not optimisation."},{"t":"Reviewers should be removed","why":"They are catching real problems."},{"t":"Speed is the only measure that matters","why":"Quality and total effort matter too."}]},{"s":31,"q":"In a weekly report workflow, which item should be supplied fresh each cycle and not stored as stable context?","a":[0],"o":[{"t":"This week's figures and their supporting records","why":"Current evidence changes every cycle."},{"t":"The approved report structure","why":"Stable."},{"t":"The agreed definitions of the measures being reported","why":"Stable."},{"t":"The escalation rule","why":"Stable."}]}]},"2":{"title":"Practice exam 2","min":120,"target":45,"v":"a9a0a356","q":[{"s":1,"q":"A prompt asks Claude to \"summarise the attached incident report\". The summary is accurate and aimed at the wrong reader. Which element was missing from the prompt?","a":[0],"o":[{"t":"The intended audience","why":"Without knowing who will read it, Claude cannot choose the right detail or terminology."},{"t":"A request to be accurate","why":"The summary was already accurate."},{"t":"A longer source document","why":"The source was sufficient."},{"t":"A stronger model","why":"Capability was not the limiting factor."}]},{"s":1,"q":"Which TWO additions would most improve the prompt \"Write an update about the migration\"?","a":[0,1],"o":[{"t":"Who the update is for and what they need to decide or do","why":"Audience and purpose shape what to include."},{"t":"The facts that may be used and anything that must not be claimed","why":"Evidence and constraints keep it accurate and safe."},{"t":"A request to make the update as impressive as possible","why":"It gives no usable direction."},{"t":"A reminder that the migration matters a great deal to the business","why":"Importance does not tell Claude what to write."}]},{"s":2,"q":"A task asks Claude in one prompt to read five documents, reconcile conflicts, calculate totals and write an executive brief. The totals are wrong. What is the best redesign?","a":[0],"o":[{"t":"Split it into steps and verify the extraction and totals before drafting","why":"Checking intermediate results stops a calculation error flowing into the brief."},{"t":"Ask for the brief first and the totals afterwards","why":"The brief depends on the totals."},{"t":"Add \"double-check your maths before answering\" to the end of the single prompt","why":"It gives no checkpoint a person can inspect."},{"t":"Remove the documents and describe them from memory","why":"That removes the evidence."}]},{"s":2,"q":"In a multi-step workflow, what should be passed from one step to the next?","a":[0],"o":[{"t":"The verified output of the previous step and the instructions for the current one","why":"Each step should build on checked results with a clear task."},{"t":"Only the original request, repeated in full each time","why":"That discards the work already verified."},{"t":"Nothing, so that every step starts fresh and unbiased","why":"Later steps need the earlier results."},{"t":"Every draft produced so far, including the ones that were rejected","why":"Rejected drafts add noise and can reintroduce errors."}]},{"s":3,"q":"The first output of a prompt uses the wrong term for a service throughout. What is the most efficient fix?","a":[0],"o":[{"t":"Add the approved term to the prompt and rerun","why":"A specific correction addresses the specific defect."},{"t":"Start again with a completely different prompt","why":"Everything else was working."},{"t":"Correct each instance by hand every time the prompt is used","why":"The defect would recur on the next run."},{"t":"Tell Claude the output was wrong, with no detail","why":"Claude would have to guess what to change."}]},{"s":3,"q":"An analyst changes the audience, the format and the source material in a prompt all at once, and the output improves. What is the weakness in this approach?","a":[0],"o":[{"t":"There is no way to tell which change produced the improvement","why":"Changing several things together makes the result impossible to attribute."},{"t":"Three changes will always make an output worse","why":"They may help. The problem is not knowing why."},{"t":"Prompts should never be changed once they have been written and used","why":"Iteration is expected."},{"t":"The output must now be longer than before","why":"Length is unrelated."}]},{"s":4,"q":"A manager wants Claude's help researching options for a monitoring tool. Which instruction best suits a research task?","a":[0],"o":[{"t":"Report what each source says, name the source, and flag anything that could not be confirmed","why":"Research needs traceable findings and honesty about gaps."},{"t":"Generate as many imaginative ideas as possible","why":"That is brainstorming."},{"t":"Write a persuasive recommendation for the cheapest tool, to save the manager time comparing them","why":"That decides the conclusion before the research."},{"t":"Keep the answer to one sentence","why":"Too little to compare options."}]},{"s":4,"q":"An engineer needs a customer-facing notice drafted from approved facts. What matters most in a drafting prompt?","a":[0],"o":[{"t":"The audience, the tone, the facts that may be used and the limits on what may be claimed","why":"Drafting needs voice and boundaries as well as content."},{"t":"A request for twenty alternative versions to choose from","why":"That is idea generation, not a draft for sending."},{"t":"An instruction to analyse the root cause of the issue in depth","why":"That is analysis, and may not belong in a customer notice."},{"t":"An instruction to find extra facts on the web to fill it out","why":"The notice must stay within approved facts."}]},{"s":5,"q":"A reviewer reads a polished report and finds no sentence that looks wrong. What should they do before accepting it?","a":[0],"o":[{"t":"Check each requirement of the task against the report to see whether anything is missing","why":"Omissions do not show up as wrong sentences."},{"t":"Accept it, because a polished report with no visible errors can safely be treated as complete","why":"Completeness has not been checked at all."},{"t":"Ask a colleague whether the report reads well to them","why":"Readability is not the open question."},{"t":"Run the spelling checker one more time","why":"Spelling says nothing about coverage."}]},{"s":5,"q":"Which TWO findings are completeness defects, as opposed to accuracy defects?","a":[0,1],"o":[{"t":"A mandatory criterion from the brief is never mentioned","why":"A required item is absent."},{"t":"The brief asked for a recommendation and none is given","why":"A requested part of the output is missing."},{"t":"A cost is quoted as $116,000 where the source says $106,000","why":"That is an accuracy defect."},{"t":"A vendor is described as certified when the source says it is not","why":"That is an accuracy defect."}]},{"s":6,"q":"A summary says a supplier \"has agreed\" to a new delivery date. The source email says the supplier \"will consider\" it. How should this be classified?","a":[0],"o":[{"t":"An unsupported claim, because it overstates what the source says","why":"\"Will consider\" does not support \"has agreed\"."},{"t":"A supported claim, because the supplier and the date were both mentioned in the email","why":"Mentioning the supplier does not support the specific assertion."},{"t":"A reasonable inference that can go out as written","why":"It turns a possibility into a commitment."},{"t":"A formatting error","why":"The problem is meaning."}]},{"s":6,"q":"Claude's answer includes a specific statistic with no source. The task allowed outside knowledge. What should the reviewer do?","a":[0],"o":[{"t":"Verify it against an authoritative source before relying on it","why":"A precise, unsourced figure is exactly what needs checking."},{"t":"Accept it, because precise numbers like this one are usually right","why":"Precision is not evidence."},{"t":"Remove every number from the document","why":"Verified numbers are useful."},{"t":"Ask Claude whether it is sure, and accept a yes","why":"Reassurance from the same source is not verification."}]},{"s":6,"q":"Which wording in an output is the clearest warning sign of a possible fabrication?","a":[0],"o":[{"t":"A named policy clause and number that the supplied policy does not contain","why":"Specific details absent from the source are the hallmark of an invented claim."},{"t":"A sentence that says a particular detail was not stated anywhere in the source","why":"That is honest gap reporting."},{"t":"A direct quotation that matches the source word for word","why":"That is supported."},{"t":"A heading that restates the task","why":"Harmless."}]},{"s":7,"q":"A report defines \"availability\" as uptime during business hours, then later quotes a 24-hour figure under the same label. What defect is this?","a":[0],"o":[{"t":"A shift in the meaning of a term part-way through","why":"The same word is carrying two definitions, so the comparison is unreliable."},{"t":"A missing citation","why":"A citation would not fix the changed definition."},{"t":"A biased sample","why":"Nothing here concerns who was included."},{"t":"An appropriate simplification","why":"It misleads the reader."}]},{"s":7,"q":"An instruction says \"notify the team by end of week\". Why might a reviewer flag it?","a":[0],"o":[{"t":"It is ambiguous about which team and which day","why":"Different readers could act differently on the same sentence."},{"t":"It is too short to be treated as a real instruction","why":"Short instructions can be perfectly clear."},{"t":"It contains a factual error","why":"No fact is asserted."},{"t":"It is written in the wrong tense","why":"Tense is not the issue."}]},{"s":8,"q":"Claude is asked for case studies on remote work and returns five, all from large technology companies. What is the representation concern?","a":[0],"o":[{"t":"The examples may not reflect smaller organisations or other sectors","why":"A narrow sample can make one experience look universal."},{"t":"Five is always too few examples","why":"The number is not the problem. The spread is."},{"t":"Technology companies are unreliable sources","why":"They are not unreliable. They are just not everyone."},{"t":"The examples should be presented in alphabetical order by company name","why":"Ordering is irrelevant."}]},{"s":8,"q":"Which TWO steps help check an AI-drafted shortlist for unfair skew?","a":[0,1],"o":[{"t":"Comparing who is on the list with who was eligible","why":"It shows who is missing."},{"t":"Checking whether the criteria or the source data favoured one group","why":"Skewed output often starts with skewed input."},{"t":"Confirming the names are in alphabetical order","why":"Ordering does not address representation."},{"t":"Asking Claude to confirm that the list is fair","why":"Self-report is not a check."}]},{"s":9,"q":"Which source should carry the most weight for confirming a company's current leave policy?","a":[0],"o":[{"t":"The current approved policy document from the policy owner","why":"It is primary, authoritative and current."},{"t":"A colleague's recollection of what the policy says","why":"Secondhand and possibly out of date."},{"t":"A blog post describing typical leave policies","why":"General, not this company's rule."},{"t":"An earlier draft of the policy that was found in a shared folder","why":"Drafts are not approved."}]},{"s":9,"q":"Claude provides a claim with a link. What does the link's presence establish?","a":[0],"o":[{"t":"Only that a source was offered. The source still has to be opened and checked","why":"A citation can be wrong, irrelevant or misread."},{"t":"That the claim is true","why":"A link is not proof."},{"t":"That the source behind the link is authoritative and suitable for this purpose","why":"Authority depends on who published it."},{"t":"That the claim is current","why":"The source may be old."}]},{"s":10,"q":"A technically correct incident summary is going to a customer's executives. What adaptation is most appropriate?","a":[0],"o":[{"t":"Lead with impact and next steps, and reduce the technical detail","why":"Executives need consequence and action more than mechanics."},{"t":"Add more log extracts and timestamps so that they can verify the cause themselves","why":"That suits engineers."},{"t":"Change the cause to something that sounds less serious","why":"That would be misleading."},{"t":"Send it unchanged, since it is correct","why":"Correct is not the same as fit for the audience."}]},{"s":10,"q":"Claude offers a comparison of four options across five criteria as paragraphs. What format change would help the reader most?","a":[0],"o":[{"t":"A table with options as rows and criteria as columns","why":"A grid lets the reader compare across the same criteria at a glance."},{"t":"A single long paragraph","why":"Harder to compare."},{"t":"A numbered list of twenty separate facts, one per line","why":"It loses the structure of the comparison."},{"t":"An email with the detail left out","why":"The detail is the point."}]},{"s":11,"q":"A user wants Claude to produce a standalone one-page checklist they can view beside the chat and refine. Which capability fits?","a":[0],"o":[{"t":"An Artifact","why":"Artifacts present standalone content that can be viewed and iterated on."},{"t":"Research","why":"Nothing needs gathering from sources."},{"t":"A connector","why":"No outside system is involved."},{"t":"A Project with no instructions","why":"That adds setup without addressing the need."}]},{"s":12,"q":"Which statement about choosing between model tiers is most accurate?","a":[0],"o":[{"t":"Match the tier to the complexity and volume of the task, then confirm with testing","why":"Tiers trade capability against speed and cost, and testing confirms the fit."},{"t":"Always use the most capable tier","why":"Often unnecessary and more expensive."},{"t":"Always use the cheapest tier","why":"It may not meet the quality the task needs."},{"t":"The tier makes no real difference to results, so pick on price alone and move on","why":"It does."}]},{"s":12,"q":"A team uses the most capable model to reformat dates in thousands of rows. What is the most reasonable critique?","a":[0],"o":[{"t":"The task is simple and repetitive, so a faster, cheaper tier would probably do","why":"Extra capability adds cost without benefit on routine work."},{"t":"The model is too weak for this task","why":"It is more than enough."},{"t":"Date formatting cannot be done by AI","why":"It can."},{"t":"They should use two models at the same time","why":"No reason to."}]},{"s":13,"q":"A customer-facing chatbot must reply within two seconds. A more capable model gives slightly better answers and takes six. What is the key consideration?","a":[0],"o":[{"t":"Whether the quality gain is worth missing the response-time requirement","why":"Speed is a requirement here, so the trade-off has to be made explicitly."},{"t":"Only which model gives the best answers, whatever the delay to the customer","why":"Latency is part of the requirement."},{"t":"Only which model is cheapest","why":"Cost is one factor of three."},{"t":"Nothing, since users do not notice delay","why":"They do."}]},{"s":13,"q":"Which TWO belong in the total cost of an AI-assisted task?","a":[0,1],"o":[{"t":"Time people spend reviewing and correcting the outputs","why":"Often the largest cost."},{"t":"Time people spend preparing the inputs","why":"Preparation is real effort."},{"t":"The number of words in the prompt","why":"Not a meaningful cost on its own terms here."},{"t":"How well known the model is","why":"Not a cost."}]},{"s":14,"q":"A user starts a new chat and asks Claude to \"continue the plan from yesterday\". Nothing from yesterday is in the chat or the Project. What should the user expect?","a":[0],"o":[{"t":"Claude will not have yesterday's details unless they are supplied or stored somewhere it can use","why":"A new conversation does not automatically carry an earlier one's content."},{"t":"Claude will recall the plan exactly","why":"That should not be assumed."},{"t":"Claude will ask yesterday's chat for the details","why":"Chats do not consult each other by default."},{"t":"Claude will refuse to answer anything","why":"It will respond. It just lacks the context."}]},{"s":14,"q":"What should a handoff summary for a new chat contain?","a":[0],"o":[{"t":"The goal, the decisions made, the constraints that still apply and the open items","why":"Those let the new chat continue without the old clutter."},{"t":"The full transcript of the previous chat","why":"That brings the clutter along."},{"t":"Only the last message","why":"Too little context."},{"t":"Nothing, since the new chat should start from zero and reach its own conclusions","why":"Then decisions already made are lost."}]},{"s":15,"q":"A team wants to use Claude to \"improve onboarding\". What is the first thing to clarify?","a":[0],"o":[{"t":"Which specific problem in onboarding needs solving, and how success will be measured","why":"A vague goal cannot be designed for or evaluated."},{"t":"Which model to buy","why":"Tool choice follows the requirement."},{"t":"How many prompts to write","why":"Not yet known."},{"t":"How to announce the initiative to the wider company once it has been approved","why":"Communication comes after there is something defined to announce."}]},{"s":15,"q":"Which TWO make a task a good candidate for Claude assistance?","a":[0,1],"o":[{"t":"It happens often and is mostly language work","why":"Frequent text work gives real benefit."},{"t":"A person can easily review and correct the result","why":"Reviewable output keeps the risk manageable."},{"t":"The decision is reserved by policy for a named officer","why":"That authority cannot be handed to a tool."},{"t":"Nobody would be able to check the output before it is used","why":"Unreviewable output is a risk."}]},{"s":16,"q":"Claude is helping plan a migration. Which request makes best use of it?","a":[0],"o":[{"t":"List the dependencies and risks found in these documents, and mark anything the documents do not cover","why":"It grounds the plan in evidence and exposes the gaps."},{"t":"Tell us the exact cutover date","why":"Claude cannot know a date nobody has decided."},{"t":"Approve the migration plan","why":"Approval belongs to an accountable person."},{"t":"Guarantee there will be no downtime during the cutover, so the customer can be told with confidence","why":"No one can guarantee that from documents."}]},{"s":16,"q":"During research, Claude summarises a vendor's capability from the vendor's own marketing page. How should the researcher treat it?","a":[0],"o":[{"t":"As the vendor's claim, to be corroborated before it drives a decision","why":"A vendor describing itself is not an independent source."},{"t":"As independently verified fact","why":"It is not independent."},{"t":"As false, because vendors cannot be trusted to describe their own products","why":"It may be accurate. It needs checking."},{"t":"As irrelevant to the comparison","why":"It is relevant and needs corroboration."}]},{"s":17,"q":"A process has five steps. Which one is the best target for improvement?","a":[0],"o":[{"t":"The step with the most rework and waiting, according to measurements","why":"Measured rework and delay point to where the benefit is."},{"t":"The first step, because it comes first","why":"Position does not indicate value."},{"t":"The step done by the newest team member","why":"That is about a person, not the process."},{"t":"The step that already works well","why":"Least to gain."}]},{"s":17,"q":"A proposed improvement would save ten minutes a week and needs a month of setup. Another saves two hours a week with a day of setup. How should they be ranked?","a":[0],"o":[{"t":"The second first, since it gives more benefit for less effort","why":"Benefit weighed against effort gives the order."},{"t":"The first, because it is the smaller change and seems less disruptive","why":"Small is not the criterion."},{"t":"Equally, since both are improvements","why":"They differ a great deal in return."},{"t":"Neither can be ranked","why":"They can, on the figures given."}]},{"s":18,"q":"After a pilot, outputs meet the quality bar on routine cases and fail on unusual ones. What is a sound design response?","a":[0],"o":[{"t":"Keep Claude on routine cases and route unusual ones to a person","why":"Design around what the evidence shows it does well."},{"t":"Roll it out to all cases anyway","why":"That ignores the failures."},{"t":"Abandon it altogether","why":"It works on routine cases."},{"t":"Leave the unusual cases out of the reported results, since they are rare","why":"That falsifies the evaluation."}]},{"s":18,"q":"When iterating on a Claude-supported solution, what should stay fixed between versions so results can be compared?","a":[0],"o":[{"t":"The test inputs and the evaluation criteria","why":"A constant yardstick makes the comparison valid."},{"t":"Nothing. Everything should change each time","why":"Then nothing can be compared."},{"t":"The prompt wording","why":"That is usually what you are changing."},{"t":"The people's opinions of it","why":"Opinions are not a fixed measure."}]},{"s":19,"q":"A stakeholder is worried that a Claude-assisted process will replace their team's judgement. What is the most accurate way to describe an augmentation design?","a":[0],"o":[{"t":"Claude prepares drafts and summaries, and the team makes and owns the decisions","why":"Augmentation keeps people accountable and removes preparation work."},{"t":"Claude makes the decisions and the team monitors the results in case of problems","why":"That is automation of judgement."},{"t":"Nothing about the team's work changes","why":"The preparation work does change."},{"t":"The team will no longer be needed","why":"Not what augmentation means."}]},{"s":19,"q":"Which TWO statements make a credible report of a workflow's value?","a":[0,1],"o":[{"t":"Turnaround fell from six days to four across fifteen cases","why":"Specific and measured against a baseline."},{"t":"Exceptions still need manual handling","why":"Honest about the limits."},{"t":"The team feels the new way is much better","why":"An impression, not a measure."},{"t":"The workflow uses the most advanced model available","why":"A feature, not a result."}]},{"s":20,"q":"What does a Project boundary define?","a":[0],"o":[{"t":"Its purpose, users, inputs, outputs and what it does not do","why":"Those tell people what belongs there."},{"t":"Only the file size limit","why":"A product detail."},{"t":"Which model tier the Project uses","why":"Model choice is not what defines the Project's scope."},{"t":"A list of every chat held so far","why":"The boundary defines scope. It is not a history."}]},{"s":21,"q":"Recurring answers from a Project keep ignoring a rule. Where should the fix be made?","a":[0],"o":[{"t":"In the Project instructions, followed by a rerun of the same test","why":"A recurring defect belongs where the standing rules live."},{"t":"In each individual prompt, every time","why":"That treats the symptom over and over."},{"t":"Nowhere. Users should correct the outputs by hand as they come across them","why":"The defect continues."},{"t":"In the file names","why":"Not where rules are set."}]},{"s":22,"q":"Which document should be excluded from a Project that answers questions about current policy?","a":[0],"o":[{"t":"A superseded version with a different requirement","why":"It would compete with the current version and give wrong answers."},{"t":"The current approved policy","why":"That is the source the Project needs."},{"t":"The policy owner's approved list of frequently asked questions","why":"Authoritative and relevant."},{"t":"The approved request form","why":"Relevant and approved."}]},{"s":22,"q":"Which TWO documents should be excluded from a Project that explains the current approved policy?","a":[0,1],"o":[{"t":"An unsigned draft proposing a different requirement","why":"Unapproved and conflicting."},{"t":"A second copy of the current policy in another file format","why":"A duplicate adds upkeep and competing targets."},{"t":"The current approved policy, named with its version and date","why":"That is the source the Project needs."},{"t":"The policy owner's approved guidance note on applying it","why":"Authoritative and relevant."}]},{"s":23,"q":"Why might a team choose a connector over uploading a copy of a document?","a":[0],"o":[{"t":"The document changes often and the current version is the authority","why":"A connector reaches the live record, where an upload is a fixed snapshot."},{"t":"Connectors remove the permission limits that apply to uploaded files","why":"Access is still bounded by permissions."},{"t":"Uploads are not allowed in Projects","why":"They are."},{"t":"Connectors make every record relevant","why":"Retrieval should still be limited to what the task needs."}]},{"s":23,"q":"A connector could let Claude send email. Policy requires confirmation before sending. What does least privilege suggest?","a":[0],"o":[{"t":"Grant only the access the task needs, and keep human confirmation for the send","why":"Minimal access plus explicit confirmation limits unintended actions."},{"t":"Grant full access to save time later","why":"Unneeded access is unnecessary risk."},{"t":"Let Claude send without review, because the connector supports sending and was approved","why":"Support for an action does not remove the control."},{"t":"Disable all connectors permanently","why":"Not required."}]},{"s":24,"q":"What is the purpose of a configuration register?","a":[0],"o":[{"t":"To record what a Project depends on, who owns each part, and when it is next reviewed","why":"It makes dependencies and accountability visible."},{"t":"To store users' chat history","why":"Not its role."},{"t":"To replace testing","why":"Testing is still needed."},{"t":"To list every prompt ever written","why":"Not what it tracks."}]},{"s":25,"q":"Which factor most increases the risk of using Claude for a task?","a":[0],"o":[{"t":"The output directly affects someone's employment, money or access to a service","why":"Consequence to people is the main driver of risk."},{"t":"The output is a first draft for internal review by the team that requested it","why":"Low consequence and reviewable."},{"t":"The source material is public","why":"That lowers data risk."},{"t":"The task is repetitive","why":"Repetition alone is not risk."}]},{"s":25,"q":"A reviewer pastes Claude's unverified recommendation into a decision record as their own analysis. What is wrong with that?","a":[0],"o":[{"t":"It disguises AI output as verified professional judgement","why":"The reviewer has to examine the evidence and make the judgement themselves."},{"t":"Nothing, provided the recommendation is well written and reads as sound","why":"Quality of writing is not verification."},{"t":"It uses too much storage","why":"Irrelevant."},{"t":"It should have been pasted into an email","why":"The medium is not the issue."}]},{"s":26,"q":"Before pasting a spreadsheet into Claude, what should be established first?","a":[0],"o":[{"t":"Its data classification and whether this use and workspace are permitted","why":"Classification and permitted purpose come before any sharing."},{"t":"Whether it will fit in one message","why":"A technical detail, not a permission."},{"t":"Whether Claude will find it interesting","why":"Not a consideration."},{"t":"Whether the file name is descriptive","why":"Not the governing question."}]},{"s":26,"q":"Which statement about \"do not store this data\" in a prompt is correct?","a":[0],"o":[{"t":"It does not override workspace settings, policy or contractual obligations","why":"Retention is controlled through configuration and governance."},{"t":"It guarantees deletion","why":"A prompt cannot guarantee that."},{"t":"It makes restricted data acceptable to share, because Claude has been told not to keep it","why":"The sharing decision comes first."},{"t":"It replaces the need for classification","why":"It does not."}]},{"s":26,"q":"An export is being prepared for a trend analysis by category and month. Which TWO fields should be removed?","a":[0,1],"o":[{"t":"Customer email address","why":"A direct identifier the trend does not need."},{"t":"A free-text note containing a temporary password","why":"A credential must not be shared."},{"t":"The month of the transaction","why":"Needed for the trend."},{"t":"The product category","why":"Needed for the trend."}]},{"s":27,"q":"Who is typically responsible for deciding whether source information may be used with an AI tool?","a":[0],"o":[{"t":"The data owner","why":"The data owner sets the conditions for use of that information."},{"t":"Whoever writes the prompt, alone","why":"The user follows the controls. They do not set them."},{"t":"The AI tool","why":"A tool does not grant permission."},{"t":"Nobody","why":"Accountability has to be assigned."}]},{"s":27,"q":"An employee realises they pasted prohibited customer data into an AI tool. What should they do?","a":[0],"o":[{"t":"Report it promptly through the organisation's incident process","why":"Incident reporting exists so there is a defined response."},{"t":"Delete the chat, say nothing and be more careful with data next time","why":"That hides an incident."},{"t":"Wait to see if anyone notices","why":"Delay makes the response harder."},{"t":"Paste more data to add context","why":"That compounds it."}]},{"s":28,"q":"What is automation bias?","a":[0],"o":[{"t":"Trusting a system's output because it looks systematic or numerical","why":"The appearance of rigour creates confidence the inputs may not justify."},{"t":"A preference for doing things by hand","why":"The opposite tendency."},{"t":"Bias in how automation is priced","why":"Unrelated."},{"t":"Bias introduced when a process is first automated","why":"The term is about how people respond to the output."}]},{"s":28,"q":"Which TWO support contestability in an AI-assisted decision process?","a":[0,1],"o":[{"t":"A stated way to ask for a factual error to be corrected","why":"A practical route to raise a concern."},{"t":"Review of a challenge by someone not involved in the original decision","why":"Independent review can change the outcome."},{"t":"A notice saying that all decisions are final","why":"That closes off challenge."},{"t":"A statement that the system has a high accuracy rate","why":"It gives no way to challenge a particular decision."}]},{"s":29,"q":"A question gets the right answer when Claude has only the current policy, and the wrong one when two older documents are added. What is the most likely cause?","a":[0],"o":[{"t":"Conflicting sources with no rule about which one governs","why":"The defect appears with the conflicting material, which isolates it."},{"t":"A badly worded question","why":"It worked with the current policy alone."},{"t":"A product outage","why":"Nothing suggests unavailability."},{"t":"The model being too small to handle three documents at once","why":"Not indicated by the test."}]},{"s":29,"q":"Which TWO belong at the start of diagnosing a poor output?","a":[0,1],"o":[{"t":"A description of the observable symptom","why":"Diagnosis starts from what can be seen."},{"t":"The conditions a correct answer has to meet","why":"A standard is needed to judge any fix."},{"t":"A full rewrite of the prompt","why":"It hides the cause."},{"t":"A report to the vendor that the product is faulty","why":"A poor result is not evidence of a fault."}]},{"s":30,"q":"Users say meeting summaries are \"too wordy\". How should that become a requirement?","a":[0],"o":[{"t":"Define a measurable limit, such as no more than two context bullets","why":"A measurable limit can be tested."},{"t":"Tell Claude to be less wordy","why":"Still subjective."},{"t":"Remove the summaries altogether and send the raw meeting notes around","why":"That removes the value too."},{"t":"Switch to a more capable model","why":"Capability does not define what short enough means."}]},{"s":30,"q":"A prompt change fixes missing owners in summaries. Which regression case checks that it did not cause invented owners?","a":[0],"o":[{"t":"Notes where an action has no owner recorded","why":"The output must still say the owner was not recorded."},{"t":"Notes where every action has an owner recorded","why":"Nothing there to invent."},{"t":"Notes with no actions at all","why":"It tests a different behaviour."},{"t":"Notes written in a different language","why":"It tests something else."}]},{"s":31,"q":"What is batching appropriate for?","a":[0],"o":[{"t":"Several similar, low-risk inputs processed under the same rules","why":"Routine, uniform work can be handled together."},{"t":"Mixing exceptions in with routine items to save time","why":"Exceptions need focused attention."},{"t":"High-consequence decisions","why":"Those need individual review."},{"t":"Inputs in inconsistent formats","why":"Batching needs consistent structure."}]},{"s":31,"q":"Which measure best shows that a workflow's output quality is slipping?","a":[0],"o":[{"t":"A rising correction rate","why":"More outputs needing substantive repair is a direct quality signal."},{"t":"A stable subscription price","why":"Unrelated to quality."},{"t":"More people using it","why":"Usage is not quality."},{"t":"Shorter prompts","why":"Not a quality measure."}]}]},"3":{"title":"Practice exam 3","min":120,"target":45,"v":"c190a254","q":[{"s":1,"q":"Two colleagues give Claude the same data. One asks \"what do you think?\" and the other asks for \"three risks for the steering group, each with the supporting figure\". Why is the second result more useful?","a":[0],"o":[{"t":"The prompt specified the deliverable, the audience and the evidence wanted","why":"A defined output gives Claude a target and gives the reader what they need."},{"t":"The second colleague used a better model","why":"Nothing in the scenario says so."},{"t":"Longer prompts always produce better results, whatever they actually happen to say","why":"Length is not the cause. Specificity is."},{"t":"Claude prefers being asked about risks","why":"It has no such preference."}]},{"s":1,"q":"A prompt supplies background, a goal and a format, and still produces content that breaks a company rule. What was most likely missing?","a":[0],"o":[{"t":"The constraint stating what must not be included","why":"Claude cannot follow a rule it was never given."},{"t":"More enthusiasm in the wording","why":"Tone does not convey rules."},{"t":"A second copy of the background, placed at the end","why":"Repetition is not a constraint."},{"t":"A request for a longer answer","why":"Length does not prevent a breach."}]},{"s":2,"q":"Which task benefits most from being decomposed into steps?","a":[0],"o":[{"t":"Producing a board paper from several reports, where the figures must reconcile first","why":"Several dependent stages with checkable intermediate results suit a stepped approach."},{"t":"Fixing a typo in one sentence of an otherwise finished document","why":"A single trivial action."},{"t":"Translating a short greeting into one other language for an email","why":"One step is enough."},{"t":"Asking for a synonym for one word in a sentence you have written","why":"No stages to separate."}]},{"s":2,"q":"After step one of a three-step workflow, the extracted list is missing an item that is in the source. What should happen next?","a":[0],"o":[{"t":"Correct the extraction before moving on","why":"Later steps would build on an incomplete base."},{"t":"Carry on and fix it in the final document","why":"The gap may be harder to see by then."},{"t":"Start the whole project again with a different tool","why":"The method is fine. One step needs correcting."},{"t":"Ignore it, since one item rarely matters","why":"That cannot be assumed."}]},{"s":3,"q":"What is the value of keeping the earlier version of a prompt when you iterate?","a":[0],"o":[{"t":"You can compare results and go back if the new version is worse","why":"A saved baseline makes improvement measurable and reversible."},{"t":"It makes the conversation look longer and more thorough to a reviewer","why":"Not a benefit."},{"t":"Claude needs it to remember the task","why":"Not the reason."},{"t":"There is no value in keeping it","why":"Without a baseline there is nothing to compare against."}]},{"s":3,"q":"Which TWO practices make prompt iteration effective?","a":[0,1],"o":[{"t":"Changing one thing at a time","why":"The effect of each change can be seen."},{"t":"Rerunning on the same input and judging with the same criteria","why":"A constant yardstick makes the comparison valid."},{"t":"Switching to an easier input once the output looks better","why":"That hides whether the original problem is fixed."},{"t":"Deleting earlier versions so only the latest prompt exists","why":"A baseline is needed for comparison and rollback."}]},{"s":4,"q":"A user wants Claude to help decide between two suppliers. Which request is best framed as analysis?","a":[0],"o":[{"t":"Compare both suppliers against these four criteria using the attached quotes, and show where each figure comes from","why":"Defined criteria and traceable evidence are what analysis needs."},{"t":"Write a catchy slogan for each supplier","why":"A creative task."},{"t":"List fifty possible suppliers","why":"That is brainstorming or search."},{"t":"Draft a thank-you note to the supplier we pick","why":"Drafting, after the decision."}]},{"s":4,"q":"Which instruction would harm a brainstorming task?","a":[0],"o":[{"t":"Give only ideas you can fully justify with a cited source","why":"It shuts down the range of ideas brainstorming is meant to produce."},{"t":"Offer a wide range of ideas, including some unconventional options","why":"That helps."},{"t":"Do not evaluate the ideas yet","why":"That helps breadth."},{"t":"Group similar ideas afterwards","why":"Useful organisation."}]},{"s":5,"q":"An output answers a different question from the one asked, and does it accurately and well. Which dimension did it fail?","a":[0],"o":[{"t":"Relevance","why":"Accurate content that does not address the task is not relevant."},{"t":"Factual accuracy","why":"The content was accurate."},{"t":"Internal consistency","why":"No contradiction is described."},{"t":"Spelling","why":"Not at issue."}]},{"s":5,"q":"What is the most reliable way to detect that a required element is missing from an output?","a":[0],"o":[{"t":"List the requirements and mark each as present or absent","why":"A requirement-by-requirement check exposes gaps a read-through misses."},{"t":"Read it through quickly to form an overall impression of quality","why":"Omissions do not stand out on a quick read."},{"t":"Check the word count","why":"Length does not show coverage."},{"t":"Ask whether it sounds complete","why":"Sounding complete is not being complete."}]},{"s":6,"q":"A source says \"most servers were patched\". Claude writes \"87% of servers were patched\". How should the figure be treated?","a":[0],"o":[{"t":"As unsupported, because the source gives no percentage","why":"A precise figure was added that the source does not contain."},{"t":"As a helpful clarification","why":"It invents precision."},{"t":"As supported, since 87% is most","why":"Being consistent with the source is not being stated by it."},{"t":"As a formatting choice","why":"It changes the content."}]},{"s":6,"q":"What separates a supported inference from an unsupported claim?","a":[0],"o":[{"t":"An inference follows from stated facts and is labelled as such. An unsupported claim has nothing in the source to rest on","why":"The test is whether the source provides a basis."},{"t":"Inferences are always wrong","why":"They can be sound when grounded and labelled."},{"t":"Unsupported claims are always shorter than inferences, which is how a reviewer can reliably tell the two apart at a glance","why":"Length is irrelevant."},{"t":"Nothing separates them","why":"They are different."}]},{"s":7,"q":"A plan says a task takes \"two weeks\", starts on 1 March and ends on 1 April. What should the reviewer flag?","a":[0],"o":[{"t":"The duration and the dates do not agree","why":"The numbers in the same document contradict each other."},{"t":"The use of the word \"task\" where \"activity\" is standard","why":"Not a problem."},{"t":"The date format used","why":"The format is fine. The dates disagree with the duration."},{"t":"A bias concern","why":"Nothing concerns representation."}]},{"s":7,"q":"A recommendation depends on \"usage staying flat\" and never says so. What is this?","a":[0],"o":[{"t":"An unstated assumption","why":"The conclusion rests on a premise the reader cannot see or test."},{"t":"A hallucinated source","why":"No source is cited."},{"t":"A formatting defect","why":"The issue is reasoning."},{"t":"An appropriate simplification","why":"Hiding a key premise is not simplifying."}]},{"s":7,"q":"Which TWO are examples of an internal inconsistency?","a":[0,1],"o":[{"t":"A total that does not match the figures it is said to add up","why":"The numbers contradict each other."},{"t":"A conclusion of \"on track\" beside a list of missed milestones","why":"The conclusion does not fit the stated facts."},{"t":"A claim that cannot be found in the source document","why":"That is an unsupported claim."},{"t":"A summary pitched too technically for its readers","why":"That is audience fitness."}]},{"s":8,"q":"An AI-written overview of customer feedback draws only on survey responses submitted online. Who may be under-represented?","a":[0],"o":[{"t":"Customers who do not use online channels","why":"The collection method shapes who is heard."},{"t":"Nobody, since a survey is an objective instrument","why":"A survey reflects whoever answered it."},{"t":"The survey designers","why":"They are not the population of interest."},{"t":"Customers who gave high scores","why":"Nothing suggests that."}]},{"s":8,"q":"What is a balanced way to handle a contested topic in a briefing?","a":[0],"o":[{"t":"Present the main positions fairly and attribute each of them","why":"The reader can see the range of views and where each comes from."},{"t":"Present only the most popular view, since most readers will hold it","why":"It leaves out legitimate positions."},{"t":"Present only the author's own view","why":"One-sided."},{"t":"Avoid the topic","why":"The briefing needs to cover it."}]},{"s":9,"q":"What makes a source \"primary\" for a factual claim?","a":[0],"o":[{"t":"It is the original record or the body responsible for the fact","why":"Primary sources are closest to the fact."},{"t":"It appears first in search results","why":"Ranking is not authority."},{"t":"It is the longest document","why":"Length is irrelevant."},{"t":"Many people have shared it","why":"Popularity is not provenance."}]},{"s":9,"q":"A regulation was amended last month. Claude's summary reflects the previous version. Which check would have caught this?","a":[0],"o":[{"t":"Confirming the date and version of the source","why":"A currency check finds superseded material."},{"t":"Checking grammar","why":"Unrelated."},{"t":"Counting how many citations the summary includes","why":"Quantity does not show currency."},{"t":"Reading it aloud","why":"It does not reveal an outdated source."}]},{"s":10,"q":"An output will be pasted into a ticketing system that accepts plain text only. What should the prompt specify?","a":[0],"o":[{"t":"Plain text, with no tables or special formatting","why":"The format has to suit where the output is going."},{"t":"A richly formatted table with merged cells and colour","why":"It will not display."},{"t":"An image","why":"Not accepted."},{"t":"Nothing about format","why":"Then the result may not be usable."}]},{"s":10,"q":"The same findings go to executives and to engineers. Which TWO should differ between the versions?","a":[0,1],"o":[{"t":"The level of technical detail","why":"Each audience needs a different depth."},{"t":"What is emphasised first","why":"Executives need impact and action up front."},{"t":"The root cause that is reported","why":"Facts must not change by audience."},{"t":"The figures quoted","why":"Figures must stay the same."}]},{"s":11,"q":"A user wants to ask a quick one-off question about wording an email. Which option is proportionate?","a":[0],"o":[{"t":"An ordinary chat","why":"A one-off question needs no maintained setup."},{"t":"A new Project with full instructions and knowledge","why":"Too much setup for one question."},{"t":"A Research run","why":"Nothing to research."},{"t":"A connector to the mail system","why":"Not needed to word an email."}]},{"s":11,"q":"Which TWO needs are well matched to a Project?","a":[0,1],"o":[{"t":"Applying the same style guide to every letter for a year","why":"Stable guidance used repeatedly."},{"t":"Answering recurring questions from one approved set of documents","why":"Maintained reference material for repeated work."},{"t":"Asking one quick question about wording","why":"A one-off suits a chat."},{"t":"Getting a cited overview of this week's news on a topic","why":"That suits Research."}]},{"s":12,"q":"What generally distinguishes the most capable model tier from the fastest tier?","a":[0],"o":[{"t":"Stronger reasoning on complex tasks, at higher cost and lower speed","why":"The trade is capability for speed and cost."},{"t":"It is faster and cheaper to run, at the cost of some accuracy on simple tasks","why":"The reverse."},{"t":"It needs no prompt","why":"All models need clear prompts."},{"t":"It never makes errors","why":"No model is error-free."}]},{"s":13,"q":"A team must process 50,000 simple items overnight within a fixed budget. What should drive model choice?","a":[0],"o":[{"t":"Meeting the quality bar at a cost and speed that fit the budget and deadline","why":"All three constraints have to be satisfied together."},{"t":"The highest capability regardless of budget","why":"It may exceed budget and time."},{"t":"Personal preference","why":"Not a business basis."},{"t":"Whichever model the team used on its last project","why":"A different task has different requirements."}]},{"s":13,"q":"After testing, the cheaper model fails the quality bar on a fifth of items. What is the reasonable conclusion?","a":[0],"o":[{"t":"It is not good enough for this task as designed, so change the design or use a more capable tier","why":"The evidence shows the requirement is not met."},{"t":"Use it anyway, since it is cheaper","why":"It fails the requirement."},{"t":"Lower the quality bar so that the cheaper model passes, without asking the people who rely on the output","why":"That changes the requirement to fit the tool."},{"t":"Stop measuring quality","why":"That hides the problem."}]},{"s":
