14,"q":"Why can a very long conversation reduce the quality of responses?","a":[0],"o":[{"t":"Earlier, less relevant content can compete with what matters now","why":"Accumulated context can dilute the current task."},{"t":"The model quietly switches to a weaker tier as the conversation grows","why":"That is not what happens."},{"t":"Long conversations are deleted","why":"Not the mechanism."},{"t":"It cannot, ever","why":"It can."}]},{"s":14,"q":"A long chat is being handed off to a new one. Which TWO belong in the handoff summary?","a":[0,1],"o":[{"t":"The decisions already made","why":"So they are not reopened or lost."},{"t":"The constraints that still apply","why":"So the new chat stays inside them."},{"t":"Every draft that was rejected along the way","why":"Rejected drafts add clutter."},{"t":"The full transcript, pasted in","why":"That carries the clutter over."}]},{"s":15,"q":"A stakeholder says \"we need AI in this process\". What is the best first question?","a":[0],"o":[{"t":"What outcome are you trying to improve, and how is it measured today?","why":"The need has to be defined before a solution."},{"t":"Which vendor do you prefer?","why":"Too early."},{"t":"How soon can we remove staff?","why":"Not a requirement."},{"t":"Which model is newest?","why":"Not relevant yet."}]},{"s":15,"q":"When assessing a use case, why does reversibility matter?","a":[0],"o":[{"t":"An error that cannot easily be undone needs stronger controls before action","why":"Irreversible outcomes raise the cost of a mistake."},{"t":"Irreversible tasks can never involve Claude in any part of the work, however small","why":"They can, with stronger controls."},{"t":"Reversible tasks do not need any review","why":"They need less, not none."},{"t":"It does not matter","why":"It does."}]},{"s":16,"q":"Which planning output from Claude most needs human confirmation before use?","a":[0],"o":[{"t":"Resource and date commitments attributed to named teams","why":"Commitments have to be confirmed by the people being committed."},{"t":"A list of questions to put to stakeholders before planning starts","why":"Low risk."},{"t":"A suggested document outline","why":"Low risk."},{"t":"A summary of the supplied meeting notes","why":"It can be checked against the notes."}]},{"s":16,"q":"Claude is asked to research a topic and cannot find evidence on one sub-question. What is the best output behaviour?","a":[0],"o":[{"t":"Say that no evidence was found for that sub-question","why":"Honest gaps are better than filled ones."},{"t":"Provide a confident estimate anyway","why":"It may mislead."},{"t":"Skip it without saying so","why":"The reader will assume it was covered."},{"t":"Invent a source","why":"A fabrication."}]},{"s":17,"q":"Why map a process before trying to improve it with Claude?","a":[0],"o":[{"t":"To see where time, rework and handoffs actually occur","why":"Improvement should target real bottlenecks."},{"t":"To make the project take longer","why":"Not a goal."},{"t":"To decide which model tier to buy before any design work starts","why":"Model choice follows from the design, not the other way round."},{"t":"To justify removing reviews","why":"Not the purpose."}]},{"s":17,"q":"Which TWO are sound evidence for prioritising a process improvement?","a":[0,1],"o":[{"t":"Measured rework on the step over several cycles","why":"Repeated measurement shows a recurring cost."},{"t":"Measured waiting time before the step starts","why":"Delay is a measurable cost."},{"t":"The step being the one people mention most at lunch","why":"Volume of comment is not measurement."},{"t":"The step not yet involving any AI","why":"That is not evidence of a problem."}]},{"s":18,"q":"What is the purpose of defining success measures before a pilot starts?","a":[0],"o":[{"t":"So that results are judged against agreed criteria, not impressions formed afterwards","why":"Criteria set in advance prevent moving the goalposts."},{"t":"To guarantee the pilot succeeds","why":"Measures do not guarantee an outcome."},{"t":"To avoid collecting data","why":"The opposite."},{"t":"To choose the model tier","why":"Measures judge the result. They do not pick the model."}]},{"s":18,"q":"A solution works in testing with tidy inputs and struggles with real, messy ones. What should the next iteration focus on?","a":[0],"o":[{"t":"Testing with representative real inputs, and standardising inputs where that is practical","why":"The design has to handle what it will really receive."},{"t":"Continuing to test only with tidy inputs, since those are the ones the design was built to handle","why":"That hides the problem."},{"t":"Blaming the users","why":"Not a design response."},{"t":"Removing the evaluation","why":"That removes the insight."}]},{"s":19,"q":"Which integration approach carries the least risk when first introducing Claude to an existing process?","a":[0],"o":[{"t":"Adding Claude to one bounded step, with the existing review kept in place","why":"A small, controlled change limits exposure and shows what works."},{"t":"Replacing the whole process at once","why":"High risk and hard to diagnose."},{"t":"Removing all checks to see what happens","why":"Unsafe."},{"t":"Letting each person integrate it into their own work in whatever way suits them","why":"Inconsistent and unmeasurable."}]},{"s":19,"q":"A sponsor asks for the return on a Claude-supported workflow. Which pair of facts is needed?","a":[0],"o":[{"t":"The baseline before the change and the measured result after it","why":"Value is a comparison."},{"t":"The number of features in the tool","why":"Not value."},{"t":"The length of the prompts","why":"Irrelevant."},{"t":"The team's enthusiasm","why":"Useful, and not a return figure."}]},{"s":20,"q":"A Project's instructions contain \"the outage on 3 June affected Site B\". Why is that a problem?","a":[0],"o":[{"t":"It is one-off task context that may be reused wrongly later","why":"Temporary facts in permanent instructions go stale."},{"t":"Project instructions are not permitted to contain any dates","why":"They can. The issue is durability."},{"t":"It is too short","why":"Length is not the issue."},{"t":"It is written in the past tense","why":"Tense is not the issue."}]},{"s":20,"q":"Which TWO belong in a Project's boundary?","a":[0,1],"o":[{"t":"What outputs it produces and who they are for","why":"Outputs and users define what belongs."},{"t":"What it does not do, such as approve changes","why":"Exclusions stop scope creep."},{"t":"The date of this week's maintenance window","why":"One-off task context."},{"t":"The name of the engineer on call tonight","why":"One-off task context."}]},{"s":21,"q":"Which element should Project instructions include for handling out-of-scope requests?","a":[0],"o":[{"t":"A statement of what the Project does not cover and what to say in that case","why":"A defined boundary prevents improvised answers."},{"t":"An instruction to answer everything","why":"That invites unsupported answers."},{"t":"Nothing","why":"Then behaviour is undefined."},{"t":"A longer description of everything the Project does cover","why":"It still leaves out-of-scope behaviour undefined."}]},{"s":22,"q":"What is wrong with the file name \"final_v2_NEW (1).docx\" for a knowledge source?","a":[0],"o":[{"t":"It does not show the document's purpose, status, version or date","why":"Names are working metadata for the people who maintain the set."},{"t":"It is too long","why":"Length is not the issue."},{"t":"It uses brackets and spaces, which some systems handle badly","why":"Not the main problem."},{"t":"Nothing","why":"It tells a maintainer nothing useful."}]},{"s":23,"q":"What determines the effective access Claude has through a connector?","a":[0],"o":[{"t":"The narrowest limit set by source permissions, connector authorisation, organisational controls and product capability","why":"Every layer has to allow it."},{"t":"Whatever the user asks for in the prompt, provided the request is worded clearly and the user has a business need for it","why":"A request does not grant access."},{"t":"The size of the document","why":"Irrelevant."},{"t":"The model tier","why":"It does not change permissions."}]},{"s":24,"q":"Which event should trigger a review of a Project's configuration?","a":[0],"o":[{"t":"A source document it relies on is replaced","why":"A changed dependency is a review trigger."},{"t":"A user asks an unusually long question","why":"A long question is not a change to anything the Project depends on."},{"t":"The Project is opened on a different device","why":"The device does not change the configuration."},{"t":"Nothing should trigger one","why":"Configurations decay if never reviewed."}]},{"s":24,"q":"Which TWO are sensible triggers for reviewing a Project's configuration?","a":[0,1],"o":[{"t":"A policy it relies on has been revised","why":"A dependency has changed."},{"t":"The same wrong answer has been reported several times","why":"A recurring error points to a configuration problem."},{"t":"A user opened the Project on a new laptop","why":"The device changes nothing."},{"t":"The Project was used more often this week than last","why":"Usage alone is not a change."}]},{"s":25,"q":"Which is an example of a safeguard?","a":[0],"o":[{"t":"Requiring an authorised person's approval before a consequential action","why":"It is an operational control that limits harm."},{"t":"Adding a line at the end saying that the output may contain errors","why":"A disclaimer does not limit what happens next."},{"t":"Writing a longer prompt","why":"Length is not a safeguard."},{"t":"Trusting the output more","why":"The opposite of a control."}]},{"s":25,"q":"Which TWO uses keep Claude in a support role?","a":[0,1],"o":[{"t":"Listing which required fields are present in a case record","why":"A completeness check for a reviewer."},{"t":"Quoting the policy passages relevant to a case","why":"Retrieval for a person to apply."},{"t":"Deciding the outcome of the case","why":"A consequential decision."},{"t":"Sending the outcome notice to the person affected","why":"Communication authority belongs to the reviewer."}]},{"s":26,"q":"Which is a direct identifier?","a":[0],"o":[{"t":"An email address","why":"It points to a specific person by itself."},{"t":"An age band","why":"A quasi-identifier."},{"t":"A month","why":"Not identifying alone."},{"t":"A product category","why":"Not about the person."}]},{"s":26,"q":"When should an analyst escalate a data-handling question?","a":[0],"o":[{"t":"When the classification or permitted purpose is unclear","why":"Uncertainty about permission is a reason to seek review."},{"t":"Never","why":"Escalation exists for this."},{"t":"Only after sharing the data","why":"Too late."},{"t":"Only if the data is public","why":"Public data is the least likely to need it."}]},{"s":27,"q":"Policy says public content needs reviewer approval. A deadline is tight. What is the compliant course?","a":[0],"o":[{"t":"Get the review, or get a written exception from the designated approver","why":"Urgency does not waive the control."},{"t":"Publish now and seek review later","why":"That reverses the control."},{"t":"Publish it now with a visible note saying that it has not yet been reviewed","why":"Still non-compliant."},{"t":"Ask a friend to glance at it","why":"Not the designated reviewer."}]},{"s":27,"q":"What should an exception request include?","a":[0],"o":[{"t":"The activity, the specific policy conflict and a proposed compliant alternative","why":"It gives the approver a clear basis and a workable option."},{"t":"Only a statement that the work is urgent and the deadline cannot move for anyone","why":"Urgency is not a policy basis."},{"t":"The requester's job title only","why":"Seniority is not justification."},{"t":"Nothing in writing","why":"Exceptions need a record."}]},{"s":27,"q":"What is the purpose of record keeping for AI-assisted public content?","a":[0],"o":[{"t":"To make the source, the validation and the approval traceable","why":"Records make authorised decisions reviewable."},{"t":"To make unsafe activity acceptable","why":"Documentation does not do that."},{"t":"To slow publication","why":"Not the purpose."},{"t":"To replace review","why":"It records review. It does not replace it."}]},{"s":28,"q":"A process is fully compliant, and a group with limited internet access cannot complete its online-only form. What kind of issue is this?","a":[0],"o":[{"t":"A fairness and accessibility issue beyond compliance","why":"A compliant process can still exclude people."},{"t":"No issue at all, since the process is fully compliant","why":"Compliance is not the whole test."},{"t":"A formatting issue","why":"More than formatting."},{"t":"A model selection issue","why":"Unrelated."}]},{"s":28,"q":"Who is accountable for the outcome of an AI-assisted allocation decision?","a":[0],"o":[{"t":"The people who design, approve and use the process","why":"Accountability cannot be transferred to a tool or a score."},{"t":"The AI system","why":"It does not hold responsibility."},{"t":"Nobody","why":"Someone must be."},{"t":"The applicants, since they chose to take part in the process","why":"They are the ones affected."}]},{"s":29,"q":"An output is in paragraphs when the user needed a checklist. Which diagnostic category fits?","a":[0],"o":[{"t":"Unsuitable format","why":"The content may be fine. The structure is wrong for the use."},{"t":"Policy restriction","why":"No policy is involved."},{"t":"Poor source quality","why":"The sources are not at issue."},{"t":"Outage","why":"The product is working."}]},{"s":29,"q":"A prompt includes forty pages of loosely related material and the answer misses the key point. What is a likely cause?","a":[0],"o":[{"t":"Context overload from unrelated or duplicated material","why":"The relevant evidence is buried."},{"t":"Too little context","why":"The opposite."},{"t":"A policy restriction","why":"Not indicated."},{"t":"An outage","why":"Not indicated."}]},{"s":30,"q":"What should a feedback record capture before any change is made?","a":[0],"o":[{"t":"The input, the output, the expected behaviour, the defect, the impact and how often it occurs","why":"That evidence defines the problem and its priority."},{"t":"Only the user's comment that the output was unhelpful, since the user is the one who knows what they wanted","why":"A comment alone does not define the defect."},{"t":"Only the output","why":"Without the input and the expected behaviour, the defect cannot be defined."},{"t":"Nothing","why":"Then the change is a guess."}]},{"s":30,"q":"A revised prompt passes all four saved test cases. What can be concluded?","a":[0],"o":[{"t":"It performed acceptably on those cases, with no guarantee for every future input","why":"A test set supports a limited conclusion."},{"t":"It will never fail","why":"Not established."},{"t":"Testing is no longer needed","why":"New inputs can still fail."},{"t":"The old prompt should now be deleted so that nobody uses it by mistake in future","why":"Keep it for rollback."}]},{"s":31,"q":"What does a standard input template mainly achieve?","a":[0],"o":[{"t":"It reduces variation and makes missing information visible","why":"Consistent structure supports extraction and shows gaps."},{"t":"It guarantees the content is true","why":"Structure is not verification."},{"t":"It removes the need for review","why":"Exceptions still need it."},{"t":"It makes the model faster","why":"Not its purpose."}]},{"s":31,"q":"Which TWO items are stable context to hold in a Project, and not supply fresh each week?","a":[0,1],"o":[{"t":"The approved report structure","why":"It does not change week to week."},{"t":"The definitions of the measures","why":"Stable reference material."},{"t":"This week's figures from each unit","why":"Current evidence, supplied each cycle."},{"t":"The source records behind this week's figures","why":"Current evidence, supplied each cycle."}]}]},"4":{"title":"Practice exam 4","min":120,"target":45,"v":"118e73fd","q":[{"s":1,"q":"A finance analyst asks Claude for \"a summary of the attached budget report\". Which added detail would most improve the first result?","a":[0],"o":[{"t":"That it is for the operations director, who needs the three largest variances and what caused them","why":"Audience and purpose tell Claude what to select and how much to say."},{"t":"That the summary should be of high quality","why":"Quality words carry no usable direction."},{"t":"That the analyst is in a hurry","why":"Urgency does not shape the content."},{"t":"That the report took the finance team a long time to prepare and has been through several rounds of edits","why":"Irrelevant to what the summary should contain."}]},{"s":1,"q":"A prompt includes the sentence \"Use only the attached release notes\". What is that sentence doing?","a":[0],"o":[{"t":"Setting an evidence boundary","why":"It limits what Claude may draw on, which makes the output checkable against one source."},{"t":"Setting the tone","why":"Tone is about voice, not sources."},{"t":"Defining the audience","why":"It says nothing about the reader."},{"t":"Specifying the format of the output","why":"It does not describe structure."}]},{"s":2,"q":"An operations lead wants one prompt that reads a contract, lists the obligations, assesses risk and drafts a response to the supplier. What is the main risk of doing it in one go?","a":[0],"o":[{"t":"An error in the list of obligations would carry through unnoticed into the risk view and the response","why":"With no checkpoint, later stages inherit earlier mistakes."},{"t":"Claude will refuse a request with four parts","why":"It will attempt it. The concern is reliability."},{"t":"The response will always be too short","why":"Not a predictable result."},{"t":"Contracts cannot be read by AI tools","why":"They can."}]},{"s":2,"q":"Which is a good checkpoint between an extraction step and a drafting step?","a":[0],"o":[{"t":"Comparing the extracted items with the source to confirm nothing is missing or added","why":"Verifying the intermediate output protects everything built on it."},{"t":"Checking that the extracted list is consistently formatted and easy to read before it is used","why":"Format does not confirm the content is right."},{"t":"Moving straight on if the list looks long enough","why":"Length is not completeness."},{"t":"Asking Claude whether it is happy with the list","why":"Self-assessment is not verification."}]},{"s":3,"q":"A prompt has been revised four times and the output is now worse than the second version. What is the sensible move?","a":[0],"o":[{"t":"Return to the second version and change one thing from there","why":"A known good baseline is a better starting point than a degraded one."},{"t":"Keep adding further instructions to the current version until it improves","why":"Piling on instructions tends to bury what matters."},{"t":"Conclude the task cannot be done","why":"The second version showed it can."},{"t":"Change models and keep the worst prompt","why":"That leaves the prompt problem in place."}]},{"s":3,"q":"Which observation is the most useful starting point for improving a prompt?","a":[0],"o":[{"t":"The output omitted the rollback steps that the source document contains","why":"A specific, observable defect points to a specific correction."},{"t":"The output was disappointing","why":"It does not say what to change."},{"t":"The output could be better","why":"True of anything, and not actionable."},{"t":"The output did not feel right","why":"An impression is not a diagnosis."}]},{"s":4,"q":"A product manager asks Claude for \"research on competitor pricing\" and receives a confident table with no sources. What should the prompt have required?","a":[0],"o":[{"t":"A source for each figure, and a flag on anything that could not be confirmed","why":"Research output has to be traceable to be usable."},{"t":"A more attractive table","why":"Presentation does not make figures reliable."},{"t":"A larger number of competitors, so that the table covers more of the market overall","why":"More rows of unsourced figures is not better."},{"t":"A persuasive conclusion","why":"A conclusion built on unsourced figures is not supported."}]},{"s":4,"q":"Which TWO instructions suit a research task?","a":[0,1],"o":[{"t":"Name the source for each finding","why":"Research has to be traceable."},{"t":"Flag anything that could not be confirmed","why":"Honesty about gaps."},{"t":"Give as many unconventional ideas as you can","why":"That is brainstorming."},{"t":"Write in a warm, persuasive voice","why":"That is drafting guidance."}]},{"s":5,"q":"A policy summary is accurate and complete, and uses specialist legal terms throughout. It is for front-line staff. Which dimension fails?","a":[0],"o":[{"t":"Audience fitness","why":"The reader cannot act on content pitched at the wrong level."},{"t":"Factual accuracy","why":"The content is accurate."},{"t":"Completeness","why":"Nothing required is missing."},{"t":"Internal consistency","why":"No contradiction is described."}]},{"s":5,"q":"A reviewer corrects an AI-drafted recommendation by adding their own opinion about a vendor's reputation, which is not in the source. What is wrong with that?","a":[0],"o":[{"t":"The correction introduces an unsupported claim","why":"Corrections should come from the evidence, not from added assumptions."},{"t":"Reviewers are not allowed to edit drafts","why":"They are. The issue is what was added."},{"t":"The recommendation is now too long","why":"Length is not the concern."},{"t":"Nothing, because the reviewer is a person and people can add context","why":"A person can add unsupported claims too."}]},{"s":6,"q":"A meeting summary names an action owner. The transcript records the action and no owner. What should the summary have said?","a":[0],"o":[{"t":"That no owner was recorded","why":"Reporting the gap is accurate. Naming someone is invention."},{"t":"The name of the most senior attendee","why":"Seniority does not make someone the owner."},{"t":"The name of whoever spoke last","why":"Nothing supports that."},{"t":"Nothing about the action at all","why":"The action was recorded and should appear."}]},{"s":6,"q":"Which TWO prompt instructions reduce the risk of invented content?","a":[0,1],"o":[{"t":"Use only the supplied material","why":"It sets an evidence boundary."},{"t":"Where something is not in the material, say so","why":"It gives an honest way to handle gaps."},{"t":"Be as detailed and thorough as you possibly can","why":"A push for detail invites gap-filling."},{"t":"Answer with confidence and avoid hedging","why":"It discourages admitting gaps."}]},{"s":7,"q":"A business case states that a tool \"saves 10 hours a week per person across 12 people, about 60 hours in total\". What should be flagged?","a":[0],"o":[{"t":"The total does not match the figures given","why":"Ten hours for twelve people is 120, so the document contradicts itself."},{"t":"The use of the word \"about\"","why":"Hedging is not the defect."},{"t":"The lack of a table","why":"Format is not the problem."},{"t":"Nothing. The saving is clearly a large one either way","why":"A large claim still has to add up."}]},{"s":7,"q":"A report concludes \"the new process is better\" after showing only that it is faster. What gap should the reviewer raise?","a":[0],"o":[{"t":"Speed alone does not establish \"better\" without evidence on quality or cost","why":"The conclusion goes further than the evidence."},{"t":"The report should be longer","why":"Length would not close the gap."},{"t":"Faster is always better","why":"That is the assumption being questioned."},{"t":"The report is biased against the old process","why":"The issue is reasoning, not fairness."}]},{"s":8,"q":"A reviewer notices that an AI-written performance summary describes assertiveness positively for some staff and negatively for others. What should they do?","a":[0],"o":[{"t":"Check the descriptions against the evidence and apply the same standard to everyone","why":"Similar behaviour should be described in the same terms."},{"t":"Leave it, since tone varies naturally","why":"Unequal framing can change outcomes for people."},{"t":"Remove every mention of behaviour","why":"That discards relevant evidence."},{"t":"Ask Claude to rewrite the summaries so that every person is described in positive terms","why":"That hides differences the evidence may support."}]},{"s":8,"q":"An AI-generated market overview relies entirely on English-language sources. Why might that matter?","a":[0],"o":[{"t":"Markets and viewpoints covered mainly in other languages may be missing","why":"The choice of sources shapes who and what is represented."},{"t":"English-language sources are less accurate than sources in other languages","why":"Not the point. The concern is coverage."},{"t":"It makes the overview too long","why":"Unrelated."},{"t":"It does not matter","why":"It can skew the picture."}]},{"s":8,"q":"Which request is most likely to reduce one-sidedness in a briefing on a disputed proposal?","a":[0],"o":[{"t":"Set out the strongest case for and against, and attribute each point","why":"It surfaces more than one position and shows where each comes from."},{"t":"Summarise why the proposal is a good idea","why":"That asks for one side."},{"t":"Keep it short","why":"Brevity does not create balance."},{"t":"Use neutral fonts","why":"Not a content control."}]},{"s":9,"q":"Claude cites a study. The reviewer cannot find any record that it exists. What is the right response?","a":[0],"o":[{"t":"Treat the claim as unverified and remove it or replace it with a confirmed source","why":"A citation that cannot be found does not support anything."},{"t":"Keep it, since a citation was given","why":"A citation has to be real to count."},{"t":"Assume the study sits behind a paywall, keep the citation as it is and move on to the next","why":"That is an assumption, not a check."},{"t":"Ask Claude to cite it again more confidently","why":"Confidence does not make it exist."}]},{"s":9,"q":"A draft cites a statistic that matters to a decision. Which TWO responses are appropriate?","a":[0,1],"o":[{"t":"Find the original source and confirm the figure","why":"Verification against the origin."},{"t":"Mark it as unverified if it cannot be confirmed","why":"The reader should know its status."},{"t":"Keep it because a link was provided","why":"A link is not proof."},{"t":"Ask Claude to repeat it and accept a matching answer","why":"Repetition is not verification."}]},{"s":10,"q":"A draft for a customer contains an internal ticket number and an engineer's surname. What should review catch?","a":[0],"o":[{"t":"Internal details that do not belong in an external communication","why":"Fitness for the audience includes what should be left out."},{"t":"That the draft is too polite","why":"Tone is not the issue."},{"t":"That ticket numbers are always wrong","why":"They are fine internally."},{"t":"Nothing. More detail is always better for the customer to have to hand","why":"Not for an external reader."}]},{"s":10,"q":"A reviewer has thirty seconds to approve each AI-drafted contract clause. What is the weakness in this control?","a":[0],"o":[{"t":"The reviewer lacks the time to challenge the output, so the review is not meaningful","why":"Review needs time, material and authority to be real."},{"t":"Thirty seconds is too long","why":"The problem is the opposite."},{"t":"Contracts should not be reviewed","why":"They should, properly."},{"t":"There is no weakness if a person is involved","why":"Presence alone is not review."}]},{"s":11,"q":"A consultant needs a multi-source briefing on recent regulatory changes, with references they can check. Which capability is the natural fit?","a":[0],"o":[{"t":"Research","why":"It gathers from many sources and reports with citations."},{"t":"An Artifact","why":"That is for presenting an output, not gathering evidence."},{"t":"A plain chat with no search","why":"It cannot check recent sources."},{"t":"A Project with no knowledge added","why":"Nothing in it would supply the recent changes."}]},{"s":11,"q":"A user asks Claude to build a small interactive calculator they can try out and refine. Which capability is designed for that?","a":[0],"o":[{"t":"An Artifact","why":"Artifacts hold standalone, viewable content that can be iterated on."},{"t":"Research","why":"Nothing needs researching."},{"t":"A connector","why":"No outside system is needed."},{"t":"Project knowledge","why":"Knowledge supplies reference material, not an interactive output."}]},{"s":12,"q":"Which task most clearly justifies a more capable model tier?","a":[0],"o":[{"t":"Reconciling conflicting clauses across several long agreements and explaining the implications","why":"Multi-document reasoning with nuance is where capability pays off."},{"t":"Tagging thousands of short customer messages as either a \"question\" or a \"complaint\" for routing","why":"Simple classification suits a faster tier."},{"t":"Converting a list to title case","why":"Trivial formatting."},{"t":"Extracting a date from a one-line message","why":"Simple extraction."}]},{"s":12,"q":"Which TWO statements about model tiers are sound?","a":[0,1],"o":[{"t":"Tiers trade capability against speed and cost","why":"That is the basic trade-off."},{"t":"A choice should be confirmed by testing on the real task","why":"Evidence beats assumption."},{"t":"The newest tier is always the right choice","why":"New is not a selection criterion."},{"t":"A larger model will fix answers built on bad sources","why":"Model choice does not repair evidence."}]},{"s":13,"q":"Which statement best describes the trade-off between quality, speed and cost?","a":[0],"o":[{"t":"Improving one often costs another, so the task's requirements decide the balance","why":"The right balance depends on what the task needs."},{"t":"All three can always be maximised together","why":"Usually not."},{"t":"Only cost ever matters","why":"Quality and speed can be requirements."},{"t":"Speed and quality are the same thing","why":"They are different measures."}]},{"s":14,"q":"A user pastes a long document and, many messages later, asks about a detail from its first page. The answer is vague. What is the most practical fix?","a":[0],"o":[{"t":"Re-supply the relevant passage with the question, or start a focused chat with it","why":"Putting the needed evidence next to the question removes the dependence on distant context."},{"t":"Repeat the question in capital letters so that Claude treats it as more important this time","why":"Emphasis does not bring the passage back into focus."},{"t":"Accept the vague answer","why":"A better one is available."},{"t":"Assume the document was deleted","why":"Not the likely cause."}]},{"s":14,"q":"Which statement about memory and separate conversations is the safest working assumption?","a":[0],"o":[{"t":"Do not rely on one conversation's details being available in another unless they are explicitly stored or supplied","why":"Behaviour varies by product and settings, so dependable context should be explicit."},{"t":"Every conversation automatically shares all of its content with every other conversation the user has ever had with Claude","why":"That should not be assumed."},{"t":"Nothing can ever be reused between conversations","why":"Explicit Project context and supplied summaries can be."},{"t":"Memory behaves identically on every plan and setting","why":"It varies, which is why it should be verified."}]},{"s":15,"q":"A team wants Claude to \"handle customer complaints\". Which reframing produces a workable use case?","a":[0],"o":[{"t":"Claude drafts a response from the complaint and the approved policy, and an agent reviews and sends it","why":"A bounded step with a clear input, output and reviewer can be designed and tested."},{"t":"Claude resolves complaints however it sees fit","why":"No boundary, no source and no reviewer."},{"t":"Claude replaces the complaints team","why":"That is an outcome, not a use case."},{"t":"Claude decides compensation amounts","why":"A consequential decision that belongs to an authorised person."}]},{"s":15,"q":"Which piece of information is most useful when judging whether a use case is suitable?","a":[0],"o":[{"t":"What happens if the output is wrong, and who would catch it","why":"Consequence and oversight decide how much control the use needs."},{"t":"How impressive the demo looked","why":"A demo is not the operating environment."},{"t":"How many other companies in the same sector are already doing it","why":"Their context is not yours."},{"t":"How long the prompt would be","why":"Not a suitability test."}]},{"s":16,"q":"A manager asks Claude to compare three office locations. Claude returns a recommendation and no criteria. What should the manager ask for?","a":[0],"o":[{"t":"The criteria used and how each location was rated against them","why":"A recommendation can only be judged if its basis is visible."},{"t":"A second recommendation, to see whether it agrees with the first","why":"Another conclusion without criteria has the same problem."},{"t":"A more confident tone","why":"Confidence is not a basis."},{"t":"A shorter answer","why":"Shorter still hides the reasoning."}]},{"s":16,"q":"Claude produced a project plan. Which TWO items need confirming with people before the plan is used?","a":[0,1],"o":[{"t":"Dates attributed to named teams","why":"Commitments must be confirmed by those committed."},{"t":"Owners assigned to tasks","why":"Ownership cannot be assigned by a draft."},{"t":"The order of the headings","why":"A presentation choice."},{"t":"The wording of the introduction","why":"A presentation choice."}]},{"s":17,"q":"A team has data showing where their monthly close spends its time. What should they do with it before choosing an improvement?","a":[0],"o":[{"t":"Identify the steps with the most delay and rework and estimate the benefit of fixing each","why":"Evidence-based prioritisation targets real cost."},{"t":"Set the data aside and pick the step that people complain about most loudly in team meetings","why":"Volume of complaint is not measurement."},{"t":"Improve every step equally","why":"That spreads effort without regard to return."},{"t":"Wait for more data indefinitely","why":"Enough evidence exists to act."}]},{"s":17,"q":"Which proposed improvement should be questioned hardest?","a":[0],"o":[{"t":"One that shortens the process by removing the step where errors are caught","why":"A saving that removes error detection can cost more than it gains."},{"t":"One that standardises an input form","why":"Low risk and usually helpful."},{"t":"One that reuses approved reference text","why":"Reduces repetition without removing control."},{"t":"One that produces output in the exact format the next team needs for its work","why":"Removes downstream rework."}]},{"s":18,"q":"A pilot's results look excellent. On inspection, the test cases were chosen by the person who wrote the prompt, after tuning it. What is the concern?","a":[0],"o":[{"t":"The cases may not represent real inputs, so the result may not hold in use","why":"A test set shaped around the prompt flatters it."},{"t":"The results are too good to publish","why":"Good results are fine if the test is fair."},{"t":"Pilots should not have test cases","why":"They should."},{"t":"There is no concern","why":"The selection of cases weakens the evidence."}]},{"s":18,"q":"A workflow processes incoming documents that may contain hostile text. Which TWO design choices help?","a":[0,1],"o":[{"t":"Treating document content as data and not as instructions","why":"Instructions come from the workflow owner."},{"t":"Keeping a person in the loop for consequential actions","why":"A human check limits the damage of a bad output."},{"t":"Following any line in a document that begins with \"system\"","why":"A label inside the data is not authority."},{"t":"Removing review for documents that look routine","why":"Hostile text can look routine."}]},{"s":19,"q":"A sceptical stakeholder asks why a Claude-supported workflow should be trusted. What is the best answer?","a":[0],"o":[{"t":"Here is what it does and does not do, how outputs are checked, and the measured results so far","why":"Scope, controls and evidence are what earn trust."},{"t":"Everyone is using AI now","why":"Not a reason to trust this workflow."},{"t":"The vendor says it is safe, and has published a long document describing its safeguards","why":"A vendor's claim is not your evidence."},{"t":"It has not gone wrong yet","why":"Absence of a visible failure is not assurance."}]},{"s":19,"q":"After integration, a workflow's benefit is reported as \"hours saved in drafting\". What might that measure miss?","a":[0],"o":[{"t":"Extra time spent downstream reviewing and correcting the drafts","why":"Value should be measured across the whole workflow, not one step."},{"t":"Nothing. Drafting time is the whole story","why":"Savings in one step can reappear as cost in another."},{"t":"The number of prompts used","why":"Not a value measure."},{"t":"Which model tier was used","why":"The tier is not a measure of value delivered."}]},{"s":20,"q":"A team creates a separate Project for every individual ticket. What is the drawback?","a":[0],"o":[{"t":"It adds setup and upkeep without the benefit of recurring, stable context","why":"Projects pay off when work recurs."},{"t":"Projects cannot hold tickets","why":"They can. It is just not worthwhile."},{"t":"Tickets are too short to give Claude enough context to work with at all","why":"Not the issue."},{"t":"There is no drawback","why":"The upkeep is real."}]},{"s":21,"q":"Which instruction creates a real escalation path?","a":[0],"o":[{"t":"When a request needs an exception, say that written approval from the policy owner is required","why":"It names who decides and what is needed."},{"t":"If you are unsure about a request, suggest that someone might want to take a look at it at some point","why":"No named decision maker and no action."},{"t":"Use your judgement on exceptions","why":"That lets Claude decide what it should escalate."},{"t":"Approve exceptions that seem reasonable","why":"Approving is outside the Project's role."}]},{"s":21,"q":"A Project's instructions have grown to three pages of rules, old exceptions and repeated guidance. Answers are getting less consistent. What is the best remedy?","a":[0],"o":[{"t":"Remove outdated exceptions and duplication so the rules that matter are clear","why":"Fewer, clearer rules are followed more reliably than a buried few."},{"t":"Add a fourth page summarising the first three","why":"More text makes it worse."},{"t":"Repeat the important rules in capitals","why":"Emphasis does not fix clutter."},{"t":"Leave it, since more instruction is always better","why":"It is not."}]},{"s":22,"q":"Which question tests a knowledge source's authority?","a":[0],"o":[{"t":"Was it approved by the person or team able to set this rule?","why":"Authority comes from who approved it."},{"t":"Is it the largest file?","why":"Size is not authority."},{"t":"Was it uploaded most recently?","why":"Upload date is not approval."},{"t":"Does it have the word \"official\" in its file name or its title?","why":"A label is not approval."}]},{"s":23,"q":"A search through a connector returns five documents with similar titles. What should happen before any of them is used?","a":[0],"o":[{"t":"Check each one's status, date and owner, and narrow the search","why":"A record's identity has to be established before its content is relied on."},{"t":"Use the first result returned, since search ranks the best match first","why":"Result order is not authority."},{"t":"Merge all five","why":"That mixes current and outdated content."},{"t":"Pick the longest","why":"Length is not authority."}]},{"s":23,"q":"Which TWO statements about connectors are correct?","a":[0,1],"o":[{"t":"Access is limited by the user's permissions in the source system","why":"The connector cannot see more than the account behind it."},{"t":"A record that cannot be accessed should be reported as unavailable","why":"A gap, not evidence of its contents."},{"t":"A connector makes every record in the system relevant to the task","why":"Retrieval should be limited to what the task needs."},{"t":"If a connector supports sending, no confirmation is needed","why":"Consequential actions need explicit confirmation."}]},{"s":24,"q":"Who should confirm the factual content of a knowledge source after a policy change?","a":[0],"o":[{"t":"The source owner","why":"The owner of the source is the authority for its content."},{"t":"Whoever last used the Project","why":"Usage does not confer authority."},{"t":"Claude","why":"A tool cannot confirm its own sources."},{"t":"Nobody, if the file name is unchanged","why":"Content can change under the same name."}]},{"s":25,"q":"A team proposes that Claude screens job applications and rejects the weakest automatically. What is the best redesign?","a":[0],"o":[{"t":"Claude organises each application against the stated criteria, and recruiters make every decision","why":"Preparation is kept and the consequential judgement stays with people."},{"t":"Claude rejects only the bottom ten per cent","why":"Still an automated consequential decision."},{"t":"Claude rejects automatically and recruiters audit yearly","why":"A later audit does not protect the people affected."},{"t":"Keep the proposal and add a disclaimer","why":"A disclaimer is not a control."}]},{"s":25,"q":"Which use is appropriate with ordinary review?","a":[0],"o":[{"t":"Drafting an internal summary from facts a manager has already approved","why":"The person controls the facts and checks the result."},{"t":"Deciding a customer's eligibility for a refund without anyone reviewing it","why":"A consequential decision made without oversight."},{"t":"Issuing safety instructions directly to the public","why":"High consequence and needs expert control."},{"t":"Giving regulated financial advice to a client","why":"Regulated advice needs a qualified, accountable person."}]},{"s":26,"q":"Records are aggregated by team and month. One team has two members. What is the remaining risk?","a":[0],"o":[{"t":"Very small groups can still reveal information about individuals","why":"Aggregation protects less when a group is tiny."},{"t":"None. Aggregated data is always anonymous, whatever the size of the group","why":"Small groups are the exception."},{"t":"The totals will be wrong","why":"Accuracy is not the concern."},{"t":"The file will be too small to analyse","why":"Not the risk."}]},{"s":26,"q":"Which TWO statements about data controls are correct?","a":[0,1],"o":[{"t":"Aggregation suits questions about group trends","why":"Group values answer group questions."},{"t":"Removing names does not guarantee anonymity","why":"Other fields can identify people in combination."},{"t":"Synthetic data always reproduces the real results exactly","why":"It may not preserve real results."},{"t":"A prompt instruction not to retain data controls retention","why":"Retention is set through configuration and governance."}]},{"s":27,"q":"A team wants to start using a new AI service that the organisation has not assessed. What does governance typically require first?","a":[0],"o":[{"t":"Assessment and approval through the procurement or approval process","why":"Unapproved services should not become business systems informally."},{"t":"Nothing, if the service has a free tier","why":"Price is not approval."},{"t":"Only that one manager likes it","why":"One person's preference is not an assessment."},{"t":"Using it quietly for a trial","why":"That bypasses the control."}]},{"s":27,"q":"Policy is silent on whether a particular use is allowed. What should the employee do?","a":[0],"o":[{"t":"Pause and ask the designated owner or approver","why":"Unclear authorisation is a reason to check, not to improvise."},{"t":"Assume it is allowed","why":"Silence is not permission."},{"t":"Assume it is forbidden forever","why":"It may be allowed once clarified."},{"t":"Ask the AI tool whether the use is allowed","why":"The tool does not know the organisation's policy."}]},{"s":28,"q":"An AI-assisted process produces a ranked list, and reviewers almost always approve the top names without reading the applications. What has happened?","a":[0],"o":[{"t":"Automation bias has turned the review into a formality","why":"People are deferring to the ranking and not exercising judgement."},{"t":"The process is working as intended","why":"The human judgement it relies on is absent."},{"t":"The reviewers are being efficient","why":"Speed has replaced scrutiny."},{"t":"The ranking has been shown to be correct by the reviewers","why":"Agreement without examination proves nothing."}]},{"s":28,"q":"Which design best supports contestability?","a":[0],"o":[{"t":"A documented route to request correction, reviewed by someone not involved in the original decision","why":"It is practical and independent, and can change the outcome."},{"t":"A statement that the model is very accurate","why":"That gives no way to challenge."},{"t":"An email address that is not monitored","why":"A route nobody answers is not a route."},{"t":"A second run of the same prompt","why":"It repeats the process and reviews nothing."}]},{"s":28,"q":"A panel wants Claude's help with applications. Which TWO tasks are appropriate for Claude?","a":[0,1],"o":[{"t":"Listing the submitted evidence under each approved criterion","why":"Organising evidence for the panel."},{"t":"Writing \"not supplied\" where an application is silent","why":"Honest gap reporting."},{"t":"Scoring applicants on how polished their writing is","why":"A proxy, and not an approved criterion."},{"t":"Ranking applications so the panel reads only the top few","why":"That makes the decision for most applicants."}]},{"s":29,"q":"A prompt asks \"what should we do about the backlog?\" and gets a generic answer. Which diagnostic category fits best?","a":[0],"o":[{"t":"Unclear task","why":"No outcome, audience, scope or criteria were given."},{"t":"Policy restriction","why":"Nothing prohibited was requested."},{"t":"Wrong model","why":"A stronger model would still lack the specifics."},{"t":"Outage","why":"The product responded."}]},{"s":29,"q":"Why compare a case that worked with a case that failed?","a":[0],"o":[{"t":"To see what differed between them, and then test that difference directly","why":"Differences suggest candidate causes, which then have to be confirmed."},{"t":"To prove the product is faulty so that the issue can be escalated quickly","why":"That is a conclusion, not a method."},{"t":"To pick the one you prefer","why":"Preference is not diagnosis."},{"t":"There is no reason to","why":"It is a standard way to isolate a cause."}]},{"s":30,"q":"A stakeholder dislikes the heading \"Context\" and prefers \"Key updates\". Summaries are otherwise complete and correct. How should this be prioritised?","a":[0],"o":[{"t":"As a stylistic preference, below any factual or policy defects","why":"It does not affect meaning, compliance or usefulness."},{"t":"As a critical defect","why":"Nothing is wrong with the content."},{"t":"As a reason to change the model","why":"Unrelated."},{"t":"As evidence the workflow has failed","why":"It is working."}]},{"s":30,"q":"Which TWO are factual or policy defects, as opposed to stylistic preferences?","a":[0,1],"o":[{"t":"The summary states a date the source does not contain","why":"A factual defect."},{"t":"The output includes data the handling rule prohibits","why":"A policy defect."},{"t":"The reader would like the headings in a different order","why":"A preference."},{"t":"The reader finds the tone slightly formal","why":"A preference."}]},{"s":31,"q":"A coordinator re-uploads the same reference documents into a new chat every week. What is the most direct improvement?","a":[0],"o":[{"t":"Hold the stable references in a Project and supply only the week's new material","why":"Reusing stable context removes repeated preparation."},{"t":"Upload them twice in each chat to be safe, in case the first upload is not fully read","why":"More repetition."},{"t":"Stop using references","why":"That removes the evidence."},{"t":"Use a larger model","why":"It does not remove the repeated work."}]},{"s":31,"q":"The next team needs Claude's output as a table they can paste into a spreadsheet. Claude returns paragraphs and someone reformats them each time. Where is the waste?","a":[0],"o":[{"t":"In the handoff, because the output format does not match what the next step needs","why":"Asking for the needed format removes the rework."},{"t":"In the model's speed","why":"Speed is not the problem."},{"t":"In the reviewers","why":"They are not the cause."},{"t":"There is none","why":"Repeated manual reformatting is avoidable work."}]}]},"5":{"title":"Practice exam 5","min":120,"target":45,"v":"acbcd41e","q":[{"s":1,"q":"A marketing coordinator's prompt reads: \"Write a post about our new service.\" Which revision gives Claude the most to work with?","a":[0],"o":[{"t":"Write a 120-word LinkedIn post for IT managers announcing the service, using only the three facts below, with no pricing claims","why":"It states format, audience, purpose, evidence and a constraint."},{"t":"Write a really great post about our new service","why":"\"Great\" adds no direction."},{"t":"Write a post about our new service, make it good this time, and remember that it is very important to the business that it lands well","why":"It still says nothing about audience, facts or limits."},{"t":"Write several posts and I will choose","why":"More untargeted drafts do not fix the missing direction."}]},{"s":1,"q":"Which TWO are constraints in a prompt, as opposed to context?","a":[0,1],"o":[{"t":"Do not include pricing","why":"It limits what may be said."},{"t":"Keep it under 150 words","why":"It limits length."},{"t":"The service launched last month in two regions","why":"Background information."},{"t":"The readers are IT managers at mid-sized firms","why":"Audience information."}]},{"s":2,"q":"A prompt asks Claude to \"review these ten policies and tell me everything that needs fixing\". The response is shallow. What restructuring would help most?","a":[0],"o":[{"t":"Review one policy at a time against a stated checklist, then combine the findings","why":"Smaller units with defined criteria get more thorough, checkable results."},{"t":"Ask for everything again, more firmly","why":"The scope is still too broad."},{"t":"Add ten more policies","why":"That widens the problem."},{"t":"Ask for a one-line answer","why":"That guarantees a shallow result."}]},{"s":2,"q":"In a stepped task, the second step depends on a figure from the first. The first step reports that the figure was not in the source. What should the second step do?","a":[0],"o":[{"t":"Carry the gap forward as \"not available\" and not calculate with an invented value","why":"A missing input should stay visible, not be replaced by a guess."},{"t":"Use an industry average in place of the missing figure, without saying so in the output","why":"That hides a substitution from the reader."},{"t":"Use zero","why":"Zero is a value. It is not the same as unknown."},{"t":"Skip the second step and say nothing","why":"The reader would not know why it is absent."}]},{"s":3,"q":"A user reruns the same prompt five times hoping for a better answer and gets the same problem each time. What does this suggest?","a":[0],"o":[{"t":"The problem is in the prompt or the inputs, and one of them needs to change","why":"A consistent defect points to a consistent cause."},{"t":"The sixth attempt will work","why":"Nothing has changed to make it work."},{"t":"The product is down","why":"It is responding consistently."},{"t":"Claude is ignoring the user on purpose and needs to be told so in stronger terms","why":"Not a useful or accurate explanation."}]},{"s":3,"q":"An instruction says \"keep it brief\" and the output is still too long. What is the most effective revision?","a":[0],"o":[{"t":"Give a concrete limit, such as five bullets of no more than twenty words each","why":"A measurable limit can be followed and checked."},{"t":"Write \"keep it VERY brief\"","why":"Still subjective."},{"t":"Add \"please\"","why":"Politeness does not define length."},{"t":"Remove the instruction","why":"That removes the only guidance on length."}]},{"s":4,"q":"Which pairing of task type and instruction is correct?","a":[0],"o":[{"t":"Research: cite where each finding comes from and flag what could not be confirmed","why":"Traceability and honesty about gaps are what research needs."},{"t":"Brainstorming: give one answer only and justify it fully before offering any others","why":"Brainstorming wants range before judgement."},{"t":"Analysis: generate as many wild ideas as possible","why":"Analysis wants grounded reasoning."},{"t":"Drafting: do not consider who will read it","why":"Drafting depends on the audience."}]},{"s":4,"q":"A team lead brainstorms with Claude and gets twenty ideas. What is the sensible next prompt?","a":[0],"o":[{"t":"Assess these ideas against our three criteria and show the reasoning for each","why":"Evaluation is a separate step that needs stated criteria."},{"t":"Give me twenty more","why":"More ideas do not help choose."},{"t":"Pick your favourite","why":"A favourite with no criteria is not a basis for a decision."},{"t":"Turn all twenty ideas into finished documents so they can be compared side by side","why":"Drafting comes after choosing."}]},{"s":5,"q":"A summary states one figure correctly in the first paragraph and a different figure for the same thing in the last. Which dimension fails?","a":[0],"o":[{"t":"Internal consistency","why":"The output contradicts itself."},{"t":"Audience fitness","why":"Not the defect described."},{"t":"Relevance","why":"Both figures are on topic."},{"t":"Instruction compliance","why":"No instruction is described as broken."}]},{"s":5,"q":"Which TWO steps belong in a repeatable process for accepting an AI-drafted document?","a":[0,1],"o":[{"t":"Listing the task's requirements before reading the draft","why":"The rubric comes from the task."},{"t":"Marking each requirement as present, absent, accurate or unsupported","why":"A requirement-by-requirement check finds gaps."},{"t":"Accepting it if no sentence looks wrong on a first read","why":"Omissions do not show up that way."},{"t":"Judging it mainly on how professional it sounds","why":"Polish is not evidence."}]},{"s":6,"q":"A source lists four risks. Claude's summary lists five, one of which is plausible and not in the source. What should happen?","a":[0],"o":[{"t":"Remove or clearly label the added risk, because the source does not support it","why":"A plausible addition is still unsupported."},{"t":"Keep it, since the extra risk is plausible and makes the summary look more thorough","why":"Thoroughness does not justify adding unsourced content."},{"t":"Keep it and remove one of the real risks","why":"That makes it worse."},{"t":"Nothing. Five is close to four","why":"The count is not the issue. The provenance is."}]},{"s":6,"q":"Which prompt is most likely to produce a fabricated answer?","a":[0],"o":[{"t":"Asking for a specific figure the supplied document does not contain, with no option to say it is missing","why":"With no honest way out, a gap tends to get filled."},{"t":"Asking for a summary of what the document says","why":"The answer can come from the source."},{"t":"Asking Claude to list the topics the document does not cover, and to say clearly where it found nothing relevant","why":"That invites gap reporting."},{"t":"Asking for direct quotes with section numbers","why":"Quotes can be checked against the source."}]},{"s":7,"q":"A status report says a project is \"on track\" and also that two of its three milestones were missed. What should the reviewer do?","a":[0],"o":[{"t":"Flag the contradiction and ask what \"on track\" is based on","why":"The conclusion does not fit the facts stated beside it."},{"t":"Accept it, since the author knows best","why":"The document contradicts itself."},{"t":"Delete the milestone information","why":"That removes the evidence."},{"t":"Change \"on track\" to \"ahead of schedule\"","why":"That moves further from the evidence."}]},{"s":7,"q":"Which TWO are signs of a reasoning gap in a recommendation?","a":[0,1],"o":[{"t":"A conclusion with no stated basis","why":"The step from facts to conclusion is missing."},{"t":"A key assumption that is never stated","why":"The reader cannot test the premise."},{"t":"A table used where a list would do","why":"A format choice."},{"t":"A shorter introduction than usual","why":"Length is not reasoning."}]},{"s":8,"q":"Claude drafts personas for a product and all five are urban professionals in their thirties. What should the reviewer ask?","a":[0],"o":[{"t":"Who uses or could use this product and is not represented here?","why":"Naming who is missing is the first step in checking representation."},{"t":"Can the personas be given more interesting hobbies and backgrounds?","why":"That does not address coverage."},{"t":"Can there be ten in place of five?","why":"More of the same group is not broader."},{"t":"Is the font accessible?","why":"Not the representation question."}]},{"s":8,"q":"Which is the best evidence that an output treats groups unevenly?","a":[0],"o":[{"t":"Similar inputs that differ only in a group characteristic produce different assessments","why":"A controlled comparison isolates the effect of the characteristic."},{"t":"The output is long","why":"Unrelated."},{"t":"The output mentions more than one group and describes each of them in a separate paragraph","why":"Mentioning groups is not unequal treatment."},{"t":"A reader has a feeling about it","why":"A feeling is a reason to test, not evidence."}]},{"s":9,"q":"A claim in a draft matters to a decision and cannot be traced to any source. What is the right handling?","a":[0],"o":[{"t":"Mark it as unverified and either confirm it or take it out before the decision","why":"An important claim with no source should not drive a decision."},{"t":"Leave it in, since it is probably right","why":"Probably is not good enough for a decision."},{"t":"Move it to a footnote","why":"Placement does not make it supported."},{"t":"Reword it to sound more certain","why":"That makes the problem worse."}]},{"s":9,"q":"Which source is most authoritative for the terms of a contract?","a":[0],"o":[{"t":"The signed contract","why":"The executed document is the authority for its own terms."},{"t":"An email summarising the contract","why":"A summary can omit or misstate terms."},{"t":"A slide from the sales presentation","why":"Marketing material is not the agreement."},{"t":"Someone's memory of the negotiation","why":"Recollection is not the record."}]},{"s":9,"q":"A source is authoritative and three years old. The subject changes frequently. What should the reviewer check?","a":[0],"o":[{"t":"Whether a more recent version or update has replaced it","why":"Authority does not guarantee currency."},{"t":"Nothing, because the source is authoritative for this subject","why":"It may have been superseded."},{"t":"Whether it is long enough","why":"Length is irrelevant."},{"t":"Whether it has been shared widely","why":"Popularity is not currency."}]},{"s":10,"q":"The same findings are needed as a one-page brief for directors and a detailed annex for analysts. What is the best approach?","a":[0],"o":[{"t":"Produce both from the same verified facts, varying depth and emphasis","why":"Each audience gets what it needs and the facts stay consistent."},{"t":"Send the annex to everyone","why":"Directors will not get a usable brief."},{"t":"Send the brief to everyone","why":"Analysts will lack the detail."},{"t":"Write a different set of facts for each audience, chosen to suit their interests","why":"The facts must not vary by audience."}]},{"s":10,"q":"A report is going to readers who will view it on phones. Which format choice is weakest?","a":[0],"o":[{"t":"A twelve-column table","why":"It will not be readable on a small screen."},{"t":"Short sections with clear headings","why":"Easy to scan."},{"t":"A brief summary at the top","why":"Helps a reader on the move."},{"t":"Short bullet lists","why":"Readable on a phone."}]},{"s":11,"q":"A team wants their style guide and templates applied to every customer letter they draft over the coming year. What should they set up?","a":[0],"o":[{"t":"A Project holding the style guide, templates and instructions","why":"Stable material used repeatedly belongs in a Project."},{"t":"A new chat for each letter, with the style guide pasted in every time","why":"Repeated effort and inconsistent application."},{"t":"A Research task per letter","why":"Nothing needs researching."},{"t":"An Artifact containing the style guide","why":"An Artifact presents an output. It does not govern future work."}]},{"s":11,"q":"Which need is poorly matched to the capability named?","a":[0],"o":[{"t":"Using an Artifact to gather current information from many websites","why":"Gathering sources is what Research is for."},{"t":"Using Research to produce a cited overview of a topic","why":"A good match."},{"t":"Using a Project for recurring work that draws on the same references","why":"A good match."},{"t":"Using a chat for a one-off question","why":"A good match."}]},{"s":12,"q":"Which statement about model tiers should a team rely on when planning?","a":[0],"o":[{"t":"Tiers differ in capability, speed and cost, and specific details should be checked in current documentation","why":"The trade-off is stable. The specifics change."},{"t":"The fastest tier is always the most accurate, because it has less time to drift away from the question it was asked","why":"Speed and capability are different."},{"t":"All tiers cost the same","why":"They do not."},{"t":"Model details never change","why":"They do, which is why they should be verified."}]},{"s":12,"q":"A workflow has a simple extraction step followed by a complex judgement step. What is a reasonable model strategy?","a":[0],"o":[{"t":"A faster tier for extraction and a more capable tier for the judgement, each tested","why":"Capability is matched to what each step needs."},{"t":"The most capable tier for both, without testing","why":"Possibly wasteful, and untested."},{"t":"The fastest tier for both, without testing","why":"It may fail the complex step."},{"t":"No model for either step","why":"Not a strategy."}]},{"s":13,"q":"A manager says \"use the cheapest model, cost is all that matters\". Outputs then need heavy correction. What should be pointed out?","a":[0],"o":[{"t":"Correction time is a cost too, and the total may now be higher","why":"The model price is only part of the cost."},{"t":"Cheaper models are always the best choice for a business, whatever the task","why":"Not when rework rises."},{"t":"Correction time is free","why":"It is people's time."},{"t":"Nothing. The manager decided","why":"The evidence is relevant to the decision."}]},{"s":13,"q":"A chatbot must answer within two seconds. Which TWO facts matter most to choosing its model?","a":[0,1],"o":[{"t":"Whether answers meet the quality bar on representative questions","why":"Quality is a requirement."},{"t":"Whether responses arrive inside the time limit","why":"Speed is a requirement here."},{"t":"Which model the team used on its previous project","why":"A different task."},{"t":"Which model has the most recent release date","why":"Not a measure of fit."}]},{"s":14,"q":"A long working session has produced a decision, three constraints and a list of open questions. The chat is getting muddled. What is the best move?","a":[0],"o":[{"t":"Summarise those points and continue in a new chat","why":"A concise handoff keeps what matters and drops the clutter."},{"t":"Keep going in the same chat","why":"The muddle will continue."},{"t":"Start a new chat with no context at all","why":"The decision and constraints would be lost."},{"t":"Copy the whole transcript into a new chat and carry on","why":"That carries the clutter over."}]},{"s":15,"q":"Which question best tests whether a requirement is clear enough to design for?","a":[0],"o":[{"t":"Could two people check independently whether it has been met?","why":"A requirement that can be verified can be designed and tested."},{"t":"Does it sound ambitious enough to hold the interest of the sponsor?","why":"Ambition is not clarity."},{"t":"Is it short?","why":"Short can still be vague."},{"t":"Does it mention AI?","why":"Not a test of clarity."}]},{"s":15,"q":"Which TWO questions belong at the start of assessing a use case?","a":[0,1],"o":[{"t":"What happens if the output is wrong?","why":"Consequence drives the controls needed."},{"t":"Who will check the output before it is used?","why":"Oversight has to exist."},{"t":"Which model has the most impressive demo?","why":"A demo is not the requirement."},{"t":"How quickly can the reviewers be removed?","why":"Removing review is not a goal."}]},{"s":16,"q":"Claude is asked to compare four tools and is given documentation for only three. What should a good response do about the fourth?","a":[0],"o":[{"t":"Say that no information was supplied for it and leave it unrated","why":"An honest gap is better than a rating based on nothing."},{"t":"Rate it from general knowledge without saying so","why":"The reader would think it was assessed on the same basis."},{"t":"Rate it lowest","why":"Nothing supports that."},{"t":"Leave it out with no explanation","why":"The reader would not know it was considered."}]},{"s":16,"q":"A plan produced with Claude looks thorough. What is the best test of whether it is usable?","a":[0],"o":[{"t":"Whether the people responsible confirm the dependencies, dates and owners in it","why":"A plan is only as good as the commitments behind it."},{"t":"Whether it has many sections","why":"Structure is not validity."},{"t":"Whether it uses confident language","why":"Confidence is not confirmation."},{"t":"Whether it is noticeably longer and more detailed than the plan produced last year","why":"Length is not usability."}]},{"s":17,"q":"Two improvement ideas look equally valuable. One touches a regulated step. How should that affect prioritisation?","a":[0],"o":[{"t":"The regulated one carries more risk and needs more control, which should be weighed in","why":"Risk is part of the prioritisation, alongside benefit and effort."},{"t":"It should not affect it at all","why":"Risk matters."},{"t":"The regulated one must always go first","why":"Not necessarily."},{"t":"The regulated one must never be attempted, whatever controls could be put in place around it","why":"It can be, with the right controls."}]},{"s":17,"q":"A team wants to show that an improvement worked. What do they need to have recorded before making the change?","a":[0],"o":[{"t":"A baseline of the measures they expect to improve","why":"Without a baseline there is nothing to compare the result with."},{"t":"A list of who supported the idea","why":"Support is not a measure."},{"t":"A full description of the new tool's features and settings","why":"Features are not a measure of the current process."},{"t":"Nothing","why":"Then the improvement cannot be shown."}]},{"s":18,"q":"A Claude-supported solution is designed, tested once on five examples and released to the whole company. What step was skipped?","a":[0],"o":[{"t":"A bounded pilot with representative inputs and defined measures","why":"Five examples do not show how it behaves across real variation."},{"t":"A change to a more capable model tier shortly before the release","why":"Nothing indicates the model was the gap."},{"t":"A longer prompt","why":"Not the missing step."},{"t":"Nothing was skipped","why":"The evidence base is too thin for a full release."}]},{"s":18,"q":"During iteration, a change improves quality on routine cases and makes one type of exception worse. What should the team do?","a":[0],"o":[{"t":"Weigh the trade-off openly, and consider routing that exception type to a person","why":"A trade-off should be decided deliberately, not discovered later."},{"t":"Ship it and say nothing","why":"That hides a known regression."},{"t":"Discard the improvement without discussion, since any regression at all is unacceptable","why":"The routine gain may be worth keeping with a control."},{"t":"Remove the exception cases from the tests","why":"That hides the problem."}]},{"s":19,"q":"Which statement best communicates a workflow's limits to stakeholders?","a":[0],"o":[{"t":"It prepares first drafts from approved sources, and every draft is reviewed before it is sent","why":"It is specific about scope and control."},{"t":"It can do anything","why":"Untrue and unhelpful."},{"t":"It is basically perfect","why":"No workflow is."},{"t":"You do not need to know how it works","why":"Stakeholders need to know its scope and controls."}]},{"s":19,"q":"A process is being redesigned around Claude. Which TWO need reassessing?","a":[0,1],"o":[{"t":"Who is accountable for each decision","why":"Roles change in a redesign."},{"t":"Which controls apply at each step","why":"Controls have to be redesigned with the process."},{"t":"The colour scheme of the report template","why":"Not a redesign risk."},{"t":"The name of the Project","why":"Not a redesign risk."}]},{"s":20,"q":"A Project's test draft came back correct. What should the owner check next?","a":[0],"o":[{"t":"That the saved instructions and knowledge contain no one-off task details","why":"Looking at the setup directly confirms the boundary held."},{"t":"Nothing more. A correct draft proves that the Project's setup is right","why":"It shows one good result, not a clean setup."},{"t":"That the chat is long enough","why":"Irrelevant."},{"t":"That the draft has a title","why":"Not the point."}]},{"s":21,"q":"Which is the best order for resolving conflicts in a Project?","a":[0],"o":[{"t":"Follow the Project's stated rules, then the designated authoritative source, then treat other material by its stated status","why":"An explicit order prevents ad hoc resolution."},{"t":"Follow whichever document is longest","why":"Length is not authority."},{"t":"Follow the most recent chat message over everything","why":"A chat request does not override source authority."},{"t":"Choose at random","why":"Not a rule."}]},{"s":22,"q":"A knowledge source is authoritative, current and relevant. What else should be recorded about it?","a":[0],"o":[{"t":"Its owner and when it is next due for review","why":"Ownership and review keep it trustworthy over time."},{"t":"Its file size","why":"Not what keeps it trustworthy."},{"t":"The number of pages and the file format it was saved in","why":"Not relevant."},{"t":"Nothing","why":"Without an owner it will go stale unnoticed."}]},{"s":22,"q":"Which TWO criteria should every knowledge source be checked against?","a":[0,1],"o":[{"t":"Whether it was approved by whoever can set the rule","why":"Authority."},{"t":"Whether it is the current version","why":"Currency."},{"t":"Whether it is the largest file available","why":"Size is not a criterion."},{"t":"Whether it was uploaded most recently","why":"Upload date is not approval."}]},{"s":23,"q":"An uploaded copy of a schedule was correct last month. The live schedule has since changed. What does this illustrate?","a":[0],"o":[{"t":"An upload is a snapshot and does not follow later changes","why":"A copy reflects the moment it was taken."},{"t":"Uploads update themselves","why":"They do not."},{"t":"The live schedule must be wrong","why":"The live record is the current one."},{"t":"Connectors are unreliable","why":"The scenario shows the limit of a copy, not of a connector."}]},{"s":24,"q":"A maintainer adds \"ignore the old approval limit\" to a Project and leaves the old limit in place. What is the risk?","a":[0],"o":[{"t":"Both rules remain available, so answers may still use the old one","why":"Stacking an exception on an obsolete rule leaves ambiguity."},{"t":"There is no risk","why":"The conflict is still there."},{"t":"The Project will stop working","why":"It will work, unreliably."},{"t":"The new rule will be deleted automatically when the current chat ends","why":"Nothing removes it."}]},{"s":24,"q":"Current sources are correct, and a prompt keeps producing the wrong format. Which kind of problem is this?","a":[0],"o":[{"t":"Prompt troubleshooting, not content maintenance","why":"The facts are fine. The request needs fixing."},{"t":"Content maintenance","why":"Nothing authoritative has changed."},{"t":"A product outage","why":"The product is responding."},{"t":"A permissions problem with the connected source","why":"Access is not the issue."}]},{"s":25,"q":"A hospital administrator wants Claude to draft appointment reminder wording from an approved template. How should this be classified?","a":[0],"o":[{"t":"Appropriate with review, since it is drafting from approved content","why":"The content is controlled and a person checks it."},{"t":"Inappropriate, because it is healthcare","why":"The sector alone does not decide it. The role does."},{"t":"Appropriate with no review, because it is only wording","why":"Review is still proportionate."},{"t":"Higher risk, needing legal sign-off for every word","why":"Disproportionate for templated wording."}]},{"s":25,"q":"Which factor should carry the most weight when deciding how much oversight a use needs?","a":[0],"o":[{"t":"The consequence of an error and whether it can be reversed","why":"Oversight should scale with potential harm."},{"t":"How fluent the output is","why":"Fluency is not a risk measure."},{"t":"How new the model is","why":"Not a measure of consequence."},{"t":"How much the user likes working with the tool","why":"Preference is not risk."}]},{"s":25,"q":"Which TWO are safeguards in an AI-assisted review?","a":[0,1],"o":[{"t":"Comparing each quoted passage with its source","why":"Validation."},{"t":"Escalating missing evidence to an authorised reviewer","why":"Escalation."},{"t":"Adding a line that the output may contain errors","why":"A disclaimer controls nothing."},{"t":"Relying on a quarterly audit in place of approval","why":"A later audit does not prevent harm."}]},{"s":26,"q":"An HR export includes a column of medical accommodation notes. The analysis is about training completion rates. What should happen to that column?","a":[0],"o":[{"t":"Remove it before anything is shared","why":"Sensitive health information that the task does not need should not be included."},{"t":"Keep it in case it turns out to be useful","why":"That breaches data minimisation."},{"t":"Keep it and rename the heading","why":"The content is unchanged."},{"t":"Summarise it into the prompt","why":"That still exposes it."}]},{"s":26,"q":"Which statement about anonymisation is correct?","a":[0],"o":[{"t":"Removing names alone may not be enough if other fields can identify people in combination","why":"Re-identification risk comes from what remains."},{"t":"Removing names always anonymises data","why":"Not reliably."},{"t":"Anonymised data can never be useful","why":"It often is."},{"t":"Anonymisation and redaction are the same thing","why":"Redaction masks specific content. Anonymisation aims to prevent identification."}]},{"s":27,"q":"Which statement best describes the relationship between a tool's capability and permission to use it?","a":[0],"o":[{"t":"A tool being able to do something does not mean the organisation allows it","why":"Permission comes from policy, data classification, purpose and required review."},{"t":"If the tool allows it, policy allows it","why":"The two are separate."},{"t":"Capability overrides policy","why":"It does not."},{"t":"Policy applies only to tools that the IT team has installed itself","why":"Policy applies regardless."}]},{"s":27,"q":"Which TWO are typical parts of an organisation's AI policy?","a":[0,1],"o":[{"t":"Which tools and accounts are approved","why":"A core control."},{"t":"How to report an incident","why":"A defined response when something goes wrong."},{"t":"Which model each employee personally prefers","why":"Preference is not policy."},{"t":"How to get round a control when work is urgent","why":"Policy defines exceptions, not workarounds."}]},{"s":28,"q":"A committee wants efficiency and proposes that Claude ranks applications so members read only the top ten. What is the main ethical concern?","a":[0],"o":[{"t":"The ranking would in effect make the decision for most applicants, on criteria nobody approved","why":"People outside the top ten are never really considered by a human."},{"t":"Ten is too many to read","why":"Not the concern."},{"t":"Ranking is slow","why":"It is fast, which is the appeal."},{"t":"There is no concern if members agree","why":"Agreement does not make the process fair to applicants."}]},{"s":28,"q":"Why should records of an AI-assisted allocation process be kept and reviewed over time?","a":[0],"o":[{"t":"To detect whether the process is producing unequal effects and to correct it","why":"Patterns only show up across cases and time."},{"t":"To prove nobody made a mistake","why":"Records are for learning and accountability."},{"t":"Because every record must be kept forever, whatever the retention policy says","why":"Retention follows policy. The purpose here is detecting patterns."},{"t":"To avoid having to explain decisions","why":"Records support explanation."}]},{"s":29,"q":"A user concludes \"Claude is broken\" after one poor answer. What is missing from that conclusion?","a":[0],"o":[{"t":"A controlled test showing that the prompt, the sources and the configuration do not explain it","why":"A poor result alone is not evidence of a technical fault."},{"t":"A louder complaint","why":"Not evidence."},{"t":"A second poor answer, to a different and unrelated question, which would show the first was not a one-off","why":"Unrelated questions do not isolate a cause."},{"t":"Nothing. One poor answer is proof","why":"It is not."}]},{"s":29,"q":"Which TWO belong in the record when escalating a suspected technical fault?","a":[0,1],"o":[{"t":"The exact prompt, sources and configuration used","why":"Support needs the inputs to reproduce it."},{"t":"The expected result, the actual result and whether it repeats","why":"It shows what failed and that it is reproducible."},{"t":"A guess at what is wrong inside the product","why":"Speculation is not evidence."},{"t":"A list of unrelated prompts that also disappointed","why":"Unrelated cases do not isolate a cause."}]},{"s":30,"q":"Which set of regression cases gives the best coverage for a summarisation prompt?","a":[0],"o":[{"t":"A normal input, an edge case, an incomplete input and the case that failed before","why":"Together they test ordinary behaviour, variation, gap handling and the original defect."},{"t":"Four normal inputs","why":"They do not test variation or gaps."},{"t":"Only the case that failed before","why":"It would not show whether anything else broke."},{"t":"Four inputs chosen because the prompt is already known to handle them well","why":"That flatters the prompt."}]},{"s":30,"q":"After a prompt change, a new and more serious omission appears. What is the right response?","a":[0],"o":[{"t":"Roll back to the previous version and investigate","why":"A change that makes things worse should be reversed while the cause is found."},{"t":"Keep the change, since it fixed the original issue","why":"A more serious defect outweighs it."},{"t":"Add several more changes straight away","why":"That obscures the cause."},{"t":"Stop testing","why":"Testing is what found it."}]},{"s":31,"q":"A team measures only how long Claude takes to respond and declares the workflow efficient. What are they missing?","a":[0],"o":[{"t":"The end-to-end picture: preparation, checking, correction and handoff","why":"A quick response can sit inside a slow or wasteful p
