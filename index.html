    '<div class="tip" id="tip"><b>Keep it on your phone.</b> Open this page in your phone browser, then choose Add to Home screen from the browser menu (on iPhone: Share, then Add to Home Screen). It opens like an app and works offline.</div>'+
    '<footer class="ft"><div>Built by Justin VanAusdall for his team. Unofficial study material, not affiliated with or endorsed by Anthropic. Practice questions are original and are not taken from the exam.</div>'+
    '<div>Your quiz answers are never saved or sent anywhere. They clear every time you open or reload this page.</div></footer></div>';
  $('#view').innerHTML=h;document.title='Claude Foundations training';
  $('#find').addEventListener('input',function(){
    var v=this.value.trim();$('#list').innerHTML=routeHTML(null,v);
    var hits='';if(v.length>1){var f=v.toLowerCase();Object.keys(D.glossary).forEach(function(k){var g=D.glossary[k];
      if(g[0].toLowerCase().indexOf(f)>=0)hits+='<li><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></li>'})}
    $('#hits').innerHTML=hits;
  });
  if(deferred){var b=$('#inst');b.hidden=false;b.onclick=function(){deferred.prompt();deferred=null;b.hidden=true}}
  if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#tip').hidden=true;
  drawRail(null);
}
function section(id){
  var c=D.content[id],s=D.sections[id-1];if(!c){location.hash='#/';return}
  var dm=D.domains[s.d],prev=null,next=null;
  D.sections.forEach(function(x){if(has(x.id)){if(x.id<id)prev=x;if(x.id>id&&!next)next=x}});
  var h='<article class="wrap"><p class="crumb"><b>'+pad(id)+'</b>'+esc(dm.name)+'</p><h1 class="t" id="top">'+esc(s.title)+'</h1><p class="lead">'+c.lead+'</p>'+
    '<div class="acts"><a class="btn" href="'+c.deck+'">Open the slides</a><a class="btn" href="#quiz">Go to the questions</a></div>'+
    '<div class="body">'+c.html+'</div>'+
    '<section class="take"><h2>Keep these</h2><ul>'+c.takeaways.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></section>'+
    '<section class="prac"><h2>Try it this week</h2><p>'+c.practice+'</p></section>'+
    '<section class="quiz" id="quiz"><h2>Five questions</h2><p>Pick an answer to see the reason behind every option.</p><div id="qs"></div><div id="score"></div></section>'+
    '<nav class="pn" aria-label="Other sessions">'+(prev?'<a href="#/s/'+prev.id+'"><small>Previous</small>'+esc(prev.title)+'</a>':'<span></span>')+
    (next?'<a class="nx" href="#/s/'+next.id+'"><small>Next</small>'+esc(next.title)+'</a>':'<a class="nx" href="#/"><small>Back to</small>All sessions</a>')+'</nav></article>';
  $('#view').innerHTML=h;document.title=s.title+' | Claude Foundations';
  $$('figure.prompt',$('#view')).forEach(function(f){
    var b=document.createElement('button');b.className='copy';b.textContent='Copy';
    b.onclick=function(){copy($('pre',f).textContent,b)};$('figcaption',f).appendChild(b);
  });
  drawQuiz(id);drawRail(id);
}
function drawQuiz(id){
  var c=D.content[id],st=qstate(id),box=$('#qs');box.innerHTML='';
  c.quiz.forEach(function(q,i){
    var e=st[i]||(st[i]={sel:[],done:false});
    if(!e.ord||e.ord.length!==q.o.length){e.ord=q.o.map(function(_,k){return k});for(var k=e.ord.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=e.ord[k];e.ord[k]=e.ord[j];e.ord[j]=t}}
    var el=document.createElement('div');el.className='q'+(q.multi?' multi':'')+(e.done?' done':'');
    var h='<div class="qn">Question '+(i+1)+' of '+c.quiz.length+'</div><h3 id="q'+i+'">'+esc(q.q)+'</h3>'+(q.multi?'<p class="hint">Choose two.</p>':'')+'<div role="group" aria-labelledby="q'+i+'">';
    e.ord.forEach(function(k){var o=q.o[k],sel=e.sel.indexOf(k)>=0,cls='opt'+(sel?' sel':''),tag='',mk='';
      if(e.done){if(o.ok){cls+=sel?' right':' right missed';tag='<span class="tag">'+(sel?'Correct':'Correct answer')+'</span>';mk='✓'}
        else if(sel){cls+=' wrong';tag='<span class="tag">Your answer</span>';mk='✕'}}
      else if(sel)mk=q.multi?'✓':'';
      h+='<button class="'+cls+'" data-k="'+k+'"'+(e.done?' disabled':'')+' aria-pressed="'+sel+'"><span class="box" aria-hidden="true">'+mk+'</span><span>'+esc(o.t)+
        '</span><span class="why">'+tag+esc(o.why)+'</span></button>'});
    h+='</div>';
    if(q.multi&&!e.done)h+='<button class="btn check" data-check="1"'+(e.sel.length===2?'':' disabled style="opacity:.5"')+'>Check my answer</button>';
    if(e.done){var ok=isRight(q,e.sel);h+='<p class="verdict '+(ok?'y':'n')+'">'+(ok?'Right.':'Not this time. Read the reasons above.')+'</p>'}
    el.innerHTML=h;
    el.addEventListener('click',function(ev){
      var b=ev.target.closest('button');if(!b||e.done)return;
      if(b.dataset.check){if(e.sel.length!==2)return;e.done=true}
      else if(b.dataset.k!==undefined){var k=+b.dataset.k;
        if(q.multi){var at=e.sel.indexOf(k);if(at>=0)e.sel.splice(at,1);else{if(e.sel.length>=2)e.sel.shift();e.sel.push(k)}}
        else{e.sel=[k];e.done=true}}
      save(S);var y=window.scrollY;drawQuiz(id);drawRail(id);drawProg();window.scrollTo(0,y);
    });
    box.appendChild(el);
  });
  var r=result(id),sc=$('#score');
  if(r.answered===r.total){
    sc.innerHTML='<div class="score"><div><b>'+r.right+' of '+r.total+'</b><span>'+(r.right===r.total?'Clean sheet.':r.right>=4?'Solid. Re-read the reasons on the one you missed.':'Go back through the section, then try again.')+'</span></div><button class="btn" id="again">Try the questions again</button></div>';
    $('#again').onclick=function(){S.quiz[id]={};drawQuiz(id);drawRail(id);drawProg();$('#quiz').scrollIntoView()};
  }else sc.innerHTML='';
  save(S);
}

/* ---------- practice exam ---------- */
var LET=['A','B','C','D','E'],tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function examScore(k){var x=D.exams[k],st=S.exam[k],n=0;if(!st)return 0;x.q.forEach(function(q,i){if(st.ans[i]===q.a)n++});return n}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return (m<10?'0':'')+m+':'+(s%60<10?'0':'')+(s%60)}
function exam(k){
  var x=D.exams[k],st=S.exam[k];drawRail('x'+k);document.title=x.title+' | Claude Foundations';
  if(!st)return examIntro(k);if(st.done)return examResult(k);examQ(k);
}
function examIntro(k){
  var x=D.exams[k];
  $('#view').innerHTML='<div class="wrap"><p class="crumb">Practice exam</p><h1 class="t">'+esc(x.title)+'</h1>'+
    '<p class="lead">'+x.q.length+' multiple-choice questions, one correct answer each. You see the answers and the reasons only after you finish, like the real thing.</p>'+
    '<div class="facts"><div><b>'+x.q.length+'</b>questions</div><div><b>'+x.min+' min</b>if you use the timer</div><div><b>'+x.target+' of '+x.q.length+'</b>a good score to aim for</div></div>'+
    '<div class="cta"><button class="btn pri" id="go1">Start</button><button class="btn" id="go2">Start with a '+x.min+'-minute timer</button></div>'+
    '<div class="tip">You can jump between questions, change answers and flag any you want to come back to. Nothing is saved or sent. If you reload the page, the exam starts again. '+
    'The target is a study guide only. The real exam uses its own scaled scoring.</div></div>';
  function start(timed){S.exam[k]={ans:{},flag:{},cur:0,done:false,end:timed?Date.now()+x.min*6e4:0};exam(k);window.scrollTo(0,0)}
  $('#go1').onclick=function(){start(false)};$('#go2').onclick=function(){start(true)};
}
function examQ(k){
  var x=D.exams[k],st=S.exam[k],i=st.cur,q=x.q[i],n=x.q.length,left=n-Object.keys(st.ans).length;
  var h='<div class="wrap exq"><div class="ex-top"><p class="crumb">'+esc(x.title)+'</p>'+(st.end?'<span class="timer" id="tm"></span>':'')+'</div><ol class="strip">';
  x.q.forEach(function(_,j){var c=[];if(st.ans[j]!==undefined)c.push('ans');if(st.flag[j])c.push('flag');if(j===i)c.push('cur');
    h+='<li><button class="'+c.join(' ')+'" data-j="'+j+'" aria-label="Question '+(j+1)+(st.ans[j]!==undefined?', answered':'')+(st.flag[j]?', flagged':'')+'"'+(j===i?' aria-current="true"':'')+'>'+(j+1)+'</button></li>'});
  h+='</ol><div class="qn">Question '+(i+1)+' of '+n+'</div><h2 id="exh">'+esc(q.q)+'</h2><div role="radiogroup" aria-labelledby="exh">';
  q.o.forEach(function(o,j){var sel=st.ans[i]===j;
    h+='<button class="opt'+(sel?' sel':'')+'" role="radio" aria-checked="'+sel+'" data-o="'+j+'"><span class="box let" aria-hidden="true">'+LET[j]+'</span><span>'+esc(o.t)+'</span></button>'});
  h+='</div><div class="exnav"><button class="btn" id="pv"'+(i?'':' disabled')+'>Previous</button><button class="btn'+(st.flag[i]?' on':'')+'" id="fl" aria-pressed="'+!!st.flag[i]+'">'+(st.flag[i]?'Flagged':'Flag for review')+'</button>'+
    '<span class="sp"></span>'+(i<n-1?'<button class="btn pri" id="nx">Next</button>':'')+'<button class="btn" id="fin">Finish exam</button></div><div id="warn"></div></div>';
  $('#view').innerHTML=h;
  var cb=$('.strip .cur'),sp=$('.strip');if(cb&&sp.scrollWidth>sp.clientWidth)sp.scrollLeft=cb.parentNode.offsetLeft-sp.clientWidth/2+18;
  function to(j,top){st.cur=j;var y=window.scrollY;examQ(k);window.scrollTo(0,top?0:y)}
  $$('.strip button').forEach(function(b){b.onclick=function(){to(+b.dataset.j)}});
  $$('.opt[data-o]').forEach(function(b){b.onclick=function(){st.ans[i]=+b.dataset.o;to(i)}});
  $('#pv').onclick=function(){if(i)to(i-1,true)};if($('#nx'))$('#nx').onclick=function(){to(i+1,true)};
  $('#fl').onclick=function(){st.flag[i]=!st.flag[i];to(i)};
  $('#fin').onclick=function(){
    var fl=Object.keys(st.flag).filter(function(j){return st.flag[j]}).length;
    if(!left&&!fl){finish(k);return}
    $('#warn').innerHTML='<div class="warn"><span>'+(left?left+' unanswered':'')+(left&&fl?' and ':'')+(fl?fl+' flagged':'')+'. Unanswered questions score zero.</span><button class="btn pri" id="fin2">Finish anyway</button></div>';
    $('#fin2').onclick=function(){finish(k)};$('#fin2').focus();
  };
  if(st.end){var tm=$('#tm'),upd=function(){var ms=st.end-Date.now();if(ms<=0){finish(k);return}tm.textContent=fmt(ms)+' left';tm.classList.toggle('low',ms<3e5)};upd();stopTimer();tick=setInterval(upd,1000)}
}
function finish(k){stopTimer();S.exam[k].done=true;S.exam[k].only=false;exam(k);window.scrollTo(0,0);drawProg()}
function examResult(k){
  var x=D.exams[k],st=S.exam[k],n=x.q.length,sc=examScore(k),dom={},ses={};
  x.q.forEach(function(q,i){var d=D.sections[q.s-1].d,ok=st.ans[i]===q.a;dom[d]=dom[d]||[0,0];dom[d][1]++;if(ok)dom[d][0]++;else{ses[q.s]=(ses[q.s]||0)+1}});
  var pct=Math.round(100*sc/n),msg=sc>=x.target?'At or above the target. Read the reasons for anything you missed.':'Below the target of '+x.target+'. The list below shows where to spend your time.';
  var h='<div class="wrap"><p class="crumb">'+esc(x.title)+', result</p><p class="big">'+sc+'<small>of '+n+' ('+pct+'%)</small></p><p class="lead" style="margin-top:14px">'+msg+'</p>'+
    '<h2 class="h2">By exam domain</h2><div class="bars">';
  Object.keys(dom).sort(function(a,b){return a-b}).forEach(function(d){var v=dom[d];
    h+='<div class="row"><span>'+esc(D.domains[d].name)+'</span><b>'+v[0]+'/'+v[1]+'</b><div class="track"><div class="fill" style="width:'+(100*v[0]/v[1])+'%"></div></div></div>'});
  h+='</div>';
  var miss=Object.keys(ses).sort(function(a,b){return ses[b]-ses[a]||a-b});
  if(miss.length){h+='<h2 class="h2">Sessions to revisit</h2><ul class="rev">';
    miss.forEach(function(s){var sec=D.sections[s-1],t=pad(+s)+' '+esc(sec.title);
      h+='<li>'+(has(+s)?'<a href="#/s/'+s+'">'+t+'</a>':t+' <span style="color:var(--dim)">(not published yet)</span>')+'<span style="color:var(--mute)">, '+ses[s]+' missed</span></li>'});
    h+='</ul>'}
  h+='<h2 class="h2">Every question, with reasons</h2><div class="cta" style="margin:10px 0 18px"><button class="btn'+(st.only?' on':'')+'" id="only" aria-pressed="'+!!st.only+'">'+(st.only?'Showing missed only':'Show only the ones I missed')+'</button><button class="btn" id="redo">Start this exam again</button></div>';
  x.q.forEach(function(q,i){var a=st.ans[i],ok=a===q.a;if(st.only&&ok)return;
    h+='<div class="q done"><div class="qn">Question '+(i+1)+(a===undefined?', not answered':'')+'</div><h3>'+esc(q.q)+'</h3>';
    q.o.forEach(function(o,j){var cls='opt',tag='';
      if(j===q.a){cls+=' right'+(a===j?'':' missed');tag='<span class="tag">'+(a===j?'Correct':'Correct answer')+'</span>'}else if(a===j){cls+=' wrong';tag='<span class="tag">Your answer</span>'}
      h+='<div class="'+cls+'"><span class="box let" aria-hidden="true">'+LET[j]+'</span><span>'+esc(o.t)+'</span><span class="why">'+tag+esc(o.why)+'</span></div>'});
    h+='</div>'});
  if(st.only&&sc===n)h+='<p class="lead">Nothing missed.</p>';
  $('#view').innerHTML=h+'</div>';
  $('#only').onclick=function(){st.only=!st.only;var y=window.scrollY;examResult(k);window.scrollTo(0,y)};
  $('#redo').onclick=function(){delete S.exam[k];exam(k);window.scrollTo(0,0)};
  drawRail('x'+k);
}
document.addEventListener('keydown',function(e){
  var m=location.hash.match(/^#\/exam\/(\d+)/);if(!m||e.metaKey||e.ctrlKey||e.altKey)return;var st=S.exam[m[1]];if(!st||st.done)return;
  var x=D.exams[m[1]],k=e.key.toUpperCase(),j=LET.indexOf(k);if(j<0&&/^[1-5]$/.test(k))j=+k-1;
  if(j>=0&&j<x.q[st.cur].o.length){st.ans[st.cur]=j;examQ(m[1])}
  else if(e.key==='ArrowRight'&&st.cur<x.q.length-1){st.cur++;examQ(m[1])}
  else if(e.key==='ArrowLeft'&&st.cur>0){st.cur--;examQ(m[1])}
});
function glossary(){
  var keys=Object.keys(D.glossary).sort(function(a,b){return D.glossary[a][0].localeCompare(D.glossary[b][0])});
  $('#view').innerHTML='<div class="wrap"><p class="crumb">Reference</p><h1 class="t">Glossary</h1><p class="lead">Every underlined term in the sessions, in one place.</p><dl class="gl">'+
    keys.map(function(k){var g=D.glossary[k];return '<div id="g-'+k+'"><dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd></div>'}).join('')+'</dl></div>';
  document.title='Glossary | Claude Foundations';drawRail(null);
}
function go(){
  closePop();document.body.classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');$('#scrim').hidden=true;
  var m=location.hash.match(/^#\/s\/(\d+)/);
  if(location.hash==='#quiz'){var q=$('#quiz');if(q){q.scrollIntoView();return}}
  var x=location.hash.match(/^#\/exam\/(\d+)/);stopTimer();
  if(m)section(+m[1]);else if(x&&D.exams[x[1]])exam(x[1]);else if(location.hash==='#/glossary')glossary();else home();
  drawProg();window.scrollTo(0,0);
}
var lastRoute='';
window.addEventListener('hashchange',function(){
  if(location.hash==='#quiz'){var q=$('#quiz');if(q){q.scrollIntoView({behavior:'smooth'});history.replaceState(null,'',lastRoute||'#/');return}}
  lastRoute=location.hash;go();
});

/* ---------- glossary pop-up ---------- */
var pop=$('#pop'),cur=null,fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches,hideT;
function openPop(el){
  var g=D.glossary[el.dataset.g];if(!g)return;clearTimeout(hideT);
  if(cur&&cur!==el)cur.setAttribute('aria-expanded','false');cur=el;el.setAttribute('aria-expanded','true');
  pop.innerHTML='<b>'+esc(g[0])+'</b>'+esc(g[1]);pop.hidden=false;
  if(window.innerWidth>640){var r=el.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
    var x=Math.max(12,Math.min(window.innerWidth-w-12,r.left+r.width/2-w/2)),y=r.bottom+10;
    if(y+h>window.innerHeight-10&&r.top-h-10>60)y=r.top-h-10;
    pop.style.left=(x+window.scrollX)+'px';pop.style.top=(y+window.scrollY)+'px'}
  else{pop.style.left='';pop.style.top=''}
}
function closePop(){if(cur){cur.setAttribute('aria-expanded','false');cur=null}pop.hidden=true}
document.addEventListener('click',function(e){
  var g=e.target.closest('.g');
  if(g){e.preventDefault();if(cur===g&&!fine)closePop();else openPop(g);return}
  if(!e.target.closest('#pop'))closePop();
});
if(fine){
  document.addEventListener('mouseover',function(e){var g=e.target.closest('.g');if(g)openPop(g);else if(e.target.closest('#pop'))clearTimeout(hideT)});
  document.addEventListener('mouseout',function(e){if(e.target.closest('.g')||e.target.closest('#pop')){clearTimeout(hideT);hideT=setTimeout(closePop,220)}});
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closePop();document.body.classList.remove('open');$('#scrim').hidden=true}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('g')){e.preventDefault();if(cur===e.target)closePop();else openPop(e.target)}
});
document.addEventListener('focusout',function(e){if(e.target.classList&&e.target.classList.contains('g'))closePop()});
window.addEventListener('scroll',function(){if(cur&&window.innerWidth>640&&!fine)closePop()},{passive:true});

/* ---------- menu, copy, toast, install ---------- */
$('#menuBtn').addEventListener('click',function(){var o=document.body.classList.toggle('open');this.setAttribute('aria-expanded',o);$('#scrim').hidden=!o});
$('#scrim').addEventListener('click',function(){document.body.classList.remove('open');this.hidden=true;$('#menuBtn').setAttribute('aria-expanded','false')});
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},1800)}
function copy(text,btn){
  function ok(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy'},1500)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fb)}else fb();
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('Select the text and copy it manually')}document.body.removeChild(ta)}
}
var deferred=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;var b=$('#inst');if(b){b.hidden=false;b.onclick=function(){deferred.prompt();deferred=null;b.hidden=true}}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
/* start clean when a page comes back from the browser's back-forward cache, or after 30 minutes in the background */
var hiddenAt=0;
function fresh(){stopTimer();S={quiz:{},exam:{}};go()}
window.addEventListener('pageshow',function(e){if(e.persisted)fresh()});
document.addEventListener('visibilitychange',function(){if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>18e5)fresh()});
lastRoute=location.hash;go();
})();
</script>
