comparison fits the decision, the reasoning is visible, and conclusions stay inside the evidence<\/td><\/tr><tr><td>Research<\/td><td>Question, scope, recency, acceptable sources, citations, how to report unknowns<\/td><td>Every finding traces to an acceptable source and the unknowns are listed<\/td><\/tr><tr><td>Drafting<\/td><td>Reader, purpose, voice, factual limits, format, revision criteria<\/td><td>It fits the audience, purpose, voice, facts and format<\/td><\/tr><tr><td>Brainstorming<\/td><td>Quantity, categories, hard constraints, no ranking yet<\/td><td>The ideas are varied, respect the constraints and have not been filtered early<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Do not mark all four as if they were final recommendations. The analysis ranks, because ranking was asked for. The research refuses to turn last quarter into a forecast. The email gives numbers and one request without adding anything the fact pack cannot support. The brainstorm is a good brainstorm because it is varied, not because each idea is proven.<\/p>\n<aside class=\"note\"><b>Common mismatch<\/b><p>\"Give only verified conclusions\" belongs in research and analysis. In a brainstorm, apply it to the hard constraints only, never as a filter on untested ideas.<\/p><\/aside>\n<h2>Chain them in a sensible order<\/h2>\n<ol class=\"steps\"><li><b>Brainstorm<\/b><span>Get a broad set of options while enforcing the constraints that cannot move.<\/span><\/li><li><b>Research<\/b><span>Look into the promising ones, with stated source and recency rules.<\/span><\/li><li><b>Analyse<\/b><span>Compare the evidence against the real decision criteria.<\/span><\/li><li><b>Draft<\/b><span>Write for the reader, using approved facts and the chosen direction.<\/span><\/li><\/ol>\n<p>This is <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"chaining\">prompt chaining<\/span>, and a person reviews at each handover. Someone decides which ideas are worth researching, whether the sources are good enough, whether each <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"assumption\">assumption<\/span> is acceptable, and whether the draft can go out.<\/p>","takeaways":["Analysis makes a decision: define the options, the comparison and the assumptions.","Research makes evidence traceable: set scope, sources, recency, citations and how to report unknowns.","Drafting serves a reader: set purpose, voice, factual limits and format.","Brainstorming widens the options: ask for variety first, evaluate later.","Chain them brainstorm, research, analyse, draft, with a person checking each handover."],"practice":"Take one problem your team is working on. Write four one-line prompts for it: one each for brainstorming, research, analysis and drafting. Check that each asks for a different kind of result.","deck":"decks/04-adapting-prompts.html","quiz":[{"q":"Which instruction belongs in a brainstorming prompt?","multi":false,"o":[{"t":"\"State only conclusions supported by the supplied evidence.\"","ok":false,"why":"That protects analysis from overclaiming. In a brainstorm it removes the untested ideas you are looking for."},{"t":"\"Cite each finding by source heading.\"","ok":false,"why":"Citations make research traceable. Brainstormed ideas are not findings."},{"t":"\"Give 12 clearly different approaches across four categories. Do not rank or reject any yet.\"","ok":true,"why":"Quantity, spread across categories and delayed evaluation are what keep a brainstorm wide."},{"t":"\"Keep the body under 150 words with a subject line.\"","ok":false,"why":"That is a format requirement for a draft, not for generating options."}]},{"q":"A research output is good when:","multi":false,"o":[{"t":"it ends with a single confident recommendation.","ok":false,"why":"Recommending is the job of analysis. Research supplies and traces the evidence."},{"t":"each finding can be traced to an acceptable source, and what remains unknown is listed.","ok":true,"why":"Traceability and an honest list of gaps are the standard for research."},{"t":"it contains as many ideas as possible.","ok":false,"why":"Breadth of ideas is the standard for brainstorming."},{"t":"it reads well for a non-technical audience.","ok":false,"why":"Fit to a reader is the standard for drafting."}]},{"q":"You ask for an analysis using only the fact pack. Claude writes: \"Log growth is caused by verbose debug logging left on after a release.\" What is the problem?","multi":false,"o":[{"t":"The analysis is too short.","ok":false,"why":"Length is not the issue. One sentence can overstep the evidence."},{"t":"It should have included more ideas.","ok":false,"why":"Generating ideas is brainstorming. The request was for analysis."},{"t":"It states a cause the fact pack does not support.","ok":true,"why":"The fact pack gives counts, not causes. This is a conclusion outside the evidence boundary, which is the main failure for analysis."},{"t":"It should have been written as an email.","ok":false,"why":"Format belongs to drafting and is unrelated to the unsupported claim."}]},{"q":"A team needs options, evidence, a decision and then a message to the customer. What order should the four kinds of prompt run in?","multi":false,"o":[{"t":"Draft, analyse, research, brainstorm.","ok":false,"why":"Drafting first means writing a message before any decision or evidence exists."},{"t":"Research, brainstorm, draft, analyse.","ok":false,"why":"Research needs options to investigate, and a draft should follow the decision."},{"t":"Analyse, brainstorm, research, draft.","ok":false,"why":"There is nothing to analyse until options exist and evidence has been gathered."},{"t":"Brainstorm, research, analyse, draft.","ok":true,"why":"Widen the options, gather evidence on the promising ones, decide, then communicate."}]},{"q":"Which TWO items belong in a drafting prompt?","multi":true,"o":[{"t":"The intended reader and the purpose of the message.","ok":true,"why":"A draft is judged by whether it helps a particular reader understand and act."},{"t":"How recent a source must be to count.","ok":false,"why":"Recency rules belong in a research prompt."},{"t":"The required format and length.","ok":true,"why":"Layout and length are part of what makes a draft fit for its use."},{"t":"An instruction not to rank the ideas.","ok":false,"why":"Holding back evaluation is a brainstorming instruction."}]}]}},"exams":{"1":{"title":"Practice exam 1","min":80,"target":29,"q":[{"s":6,"q":"A reviewer is checking an AI-generated compliance note against a single approved procedure document. The note includes a precise deadline that does not appear anywhere in the document. What is the best classification for that deadline?","a":3,"o":[{"t":"A supported inference because specificity improves operational clarity","why":"Being specific does not make something supported. An inference still needs something in the document to rest on."},{"t":"An unresolved question because any precise deadline is acceptable if plausible","why":"Plausible is not the test. The note states the deadline as fact, so it is a claim, and nothing backs it."},{"t":"A supported claim because deadlines are often implied by procedures","why":"What procedures often imply is general knowledge, not this document. The approved procedure is the only authority here."},{"t":"An unsupported claim because the authoritative document does not establish it","why":"The note asserts a fact the single authoritative source does not contain. That is the definition of an unsupported claim."}]},{"s":7,"q":"In a draft analysis, a key measure is defined at the start one way and later used with a different meaning, even though the wording stays similar. What defect does this illustrate?","a":1,"o":[{"t":"An external factual error","why":"Nothing is being checked against the outside world. The problem sits inside the draft itself."},{"t":"A terminology shift that changes the definition used in the analysis","why":"The same label is carrying two meanings, so later reasoning no longer rests on the measure that was defined."},{"t":"A complete evidence check that confirms the recommendation","why":"This describes a successful review, not a defect."},{"t":"An ambiguous reference","why":"An ambiguous reference is when it is unclear what a word such as 'it' or 'this option' points to. Here the term is clear each time, and its meaning changes."}]},{"s":25,"q":"Which statement best reflects an appropriate use of Claude in people-related workplace decisions?","a":2,"o":[{"t":"Claude may make the final hiring choice when its response is written in a professional and neutral tone.","why":"Tone does not make a decision appropriate to delegate. A consequential decision about a person needs an accountable human."},{"t":"Claude should replace human review when the source material includes multiple stakeholder comments.","why":"More input material raises the need for human judgment. It does not remove it."},{"t":"Claude may support structured review, drafting, and analysis of supplied material, while a human remains responsible for consequential hiring decisions.","why":"Claude assists with the work around the decision. Responsibility for the decision stays with a person."},{"t":"Claude can issue hiring recommendations as long as it avoids explicit references to protected groups.","why":"Avoiding explicit references does not prevent bias through proxies, and it still hands the judgment to the model."}]},{"s":3,"q":"What is the main purpose of iterative prompting when improving an AI-generated draft?","a":0,"o":[{"t":"To assess a draft, identify a specific weakness, revise the instruction narrowly, and compare the new result","why":"This is the loop: inspect, diagnose one defect, make a targeted change, compare."},{"t":"To encourage the model to generate alternative facts when the source material is limited","why":"If the source lacks a fact, iteration cannot supply it. That would be inventing content."},{"t":"To replace the need for reviewing the output against the original task","why":"Iteration depends on reviewing against the task. It does not replace it."},{"t":"To keep adding more instructions until the response becomes longer and more polished","why":"Longer and more polished is not the goal. Each revision should address an observed gap."}]},{"s":7,"q":"A report states that Plan X has the lowest monthly fee and therefore is the right choice. The source comparison only shows prices, service hours, and response times, but does not state which factor matters most to the decision owner. What is the main reasoning problem?","a":3,"o":[{"t":"The report is internally inconsistent because any lower-cost plan must also have the fastest response time","why":"There is no rule linking cost to response time, and the report does not contradict itself."},{"t":"The conclusion is valid because cost is always the clearest basis for selecting among options","why":"Cost is one possible criterion. Nothing in the source says it is the one that matters here."},{"t":"The report contains an external factual error because monthly fees should not be compared","why":"Comparing fees is fine. The fee figures are not the issue."},{"t":"The conclusion is unsupported because it assumes a selection criterion not established by the evidence","why":"The jump from 'cheapest' to 'right choice' only works if cost is the deciding factor, and the source never says so."}]},{"s":5,"q":"A team lead is reviewing an AI-generated recommendation that sounds professional and includes confident conclusions. What should the team lead do first?","a":2,"o":[{"t":"Revise the tone to make it more formal before checking details","why":"Polishing tone before checking substance spends effort on something that may be wrong."},{"t":"Approve it if the structure is clear and concise","why":"Clear structure says nothing about whether the content is right or complete."},{"t":"Check the source material and requested result before judging the writing","why":"Start with what was asked for and what the evidence says. Fluent writing is not evidence of accuracy."},{"t":"Compare it against a similar past document to judge quality","why":"A past document shows style. It does not verify this recommendation's facts."}]},{"s":9,"q":"A reviewer must validate a claim about whether a local discount program applies to a purchase made in a specific city during a certain month. Which source characteristic is most important to confirm in addition to authority?","a":0,"o":[{"t":"Whether the source's jurisdiction and effective dates match the claim","why":"An authoritative source for the wrong place or the wrong period does not answer the question."},{"t":"Whether the source uses detailed formatting and a recent publication style","why":"Presentation tells you nothing about whether the rule applies."},{"t":"Whether the source agrees with a secondary summary found elsewhere","why":"Agreement with a secondary summary is weaker than checking the primary source's scope."},{"t":"Whether the source includes broad background information about the product category","why":"Background material is not what decides whether this purchase qualifies."}]},{"s":6,"q":"Which statement best describes an unsupported claim?","a":2,"o":[{"t":"A statement that uses informal wording even though the source supports it","why":"Wording style is separate from support. This statement is supported."},{"t":"A statement that summarizes the source briefly without repeating every detail","why":"A faithful summary is supported by its source."},{"t":"A statement presented as factual without adequate support from the available authoritative source","why":"It is asserted as fact and the authoritative source does not back it."},{"t":"A statement that is cautious in tone even when it adds no source-based evidence","why":"This describes hedged wording. The defining feature of an unsupported claim is a factual assertion without backing."}]},{"s":5,"q":"Which evaluation dimension checks whether all required facts, criteria, and requested parts appear in an output?","a":1,"o":[{"t":"Audience fitness","why":"Audience fitness asks whether the output suits its readers."},{"t":"Completeness","why":"Completeness is the check that nothing required has been left out."},{"t":"Internal consistency","why":"Internal consistency asks whether the output agrees with itself."},{"t":"Relevance","why":"Relevance asks whether what is included belongs there. It does not catch what is missing."}]},{"s":9,"q":"Which statement best reflects a sound fact-checking approach when reviewing a business recommendation?","a":1,"o":[{"t":"Begin by confirming the writer's overall conclusion before checking individual statements","why":"The conclusion depends on the individual statements. Check those first."},{"t":"Separate checkable factual claims from opinions and recommendations before testing them against evidence","why":"Only factual claims can be verified. Pulling them out first tells you what to test and how."},{"t":"Focus mainly on persuasive language because it most strongly influences the reader","why":"Persuasive language affects the reader. It is not what makes a claim true."},{"t":"Treat every sentence in the draft as equally verifiable and confirm them in the same way","why":"Facts, opinions and recommendations need different handling. They are not equally verifiable."}]},{"s":9,"q":"During review, a team cannot find enough relevant evidence to confirm a claim about a purchase outcome. How should the claim be recorded?","a":3,"o":[{"t":"As contradicted, because missing evidence implies the claim is likely false","why":"Missing evidence is not evidence against. Contradicted needs a source that says otherwise."},{"t":"As verified, provided the claim seems reasonable and low risk","why":"Seeming reasonable is not verification."},{"t":"As partially supported, because some business claims can proceed without documentation","why":"Partially supported needs some evidence. Here there is not enough to say that."},{"t":"As unresolved, while noting what additional fact or source would settle it","why":"It is neither confirmed nor refuted. Recording what would settle it makes the gap actionable."}]},{"s":5,"q":"Why is building a task-specific review rubric before accepting an output useful?","a":3,"o":[{"t":"It allows reviewers to favor polished wording when evidence is limited","why":"A rubric exists to stop polish standing in for evidence."},{"t":"It reduces the need to consider audience needs or usability","why":"Audience and usability are usually criteria on the rubric."},{"t":"It replaces the need to inspect whether claims are supported by evidence","why":"Checking support is one of the things a rubric makes you do."},{"t":"It helps reviewers check requirements consistently instead of relying on overall impression","why":"A rubric turns a general impression into the same visible checks every time."}]},{"s":2,"q":"A team asks Claude to assemble a cross-functional update using validated figures, stakeholder notes, and event records. Which action is the best use of a human gate?","a":1,"o":[{"t":"Skip review between stages if the initial prompt listed all required inputs clearly","why":"Listing inputs in the prompt does not prove they were all used correctly."},{"t":"Pause after extraction so a person can confirm the checked facts before they are used in analysis","why":"Everything later depends on the extracted facts, so this is where a person should confirm them."},{"t":"Pause only after final formatting because headings and layout are the highest-risk step","why":"Formatting is the lowest-risk step. By then any early error is built into the whole document."},{"t":"Let Claude continue through analysis and drafting because validated figures remove the need for checkpoints","why":"The source figures were validated. The extraction of them still has to be checked."}]},{"s":7,"q":"A team lead asks for a verification pass on a draft comparison before updating a decision record. Which prompt is most appropriate?","a":0,"o":[{"t":"Compare the draft with the source record and list only contradictions in numbers, label mismatches, definition changes, ambiguous references, and unsupported conclusions. Do not recommend an option.","why":"It names exactly what to look for, ties the check to the source, and keeps Claude out of the decision."},{"t":"Summarize the source and add any likely business priorities needed to justify one selection.","why":"Adding 'likely priorities' asks Claude to invent the criteria the decision should rest on."},{"t":"Choose the strongest option based on the narrative, even if the source does not state the decision criteria.","why":"This asks for a decision without criteria, which is the opposite of verification."},{"t":"Read the draft quickly and rewrite it so the final recommendation is more decisive and persuasive.","why":"Making it more persuasive changes the wording and checks nothing."}]},{"s":1,"q":"Which requirement makes prompt success most observable?","a":3,"o":[{"t":"Make the response high quality and suitable for leadership review","why":"'High quality' cannot be checked. A reviewer has nothing specific to tick off."},{"t":"Prepare a strong final version with excellent business judgment","why":"'Strong' and 'excellent judgment' are impressions, not requirements."},{"t":"Write something polished that sounds professional and complete","why":"Sounding complete is not the same as containing the required parts."},{"t":"Use a concise, factual tone and include the sections Summary, Risks, and Next Steps","why":"Named sections and a stated tone can be verified by looking at the output."}]},{"s":6,"q":"A manager rewrites an unsupported claim to sound clearer and more professional without adding new evidence. What does this change accomplish?","a":1,"o":[{"t":"It turns interpretation into fact if the tone remains cautious","why":"Tone cannot convert an interpretation into a fact."},{"t":"It improves presentation but does not validate the claim","why":"The wording is better and the evidence is unchanged, so the claim is still unsupported."},{"t":"It replaces the need for source review when the sentence is concise","why":"A shorter sentence still has to be checked against the source."},{"t":"It makes the conclusion acceptable if the wording is more precise","why":"Precise wording with no evidence is more misleading, not more acceptable."}]},{"s":2,"q":"Which situation most strongly indicates that a task should be decomposed into multiple stages instead of handled in one prompt?","a":2,"o":[{"t":"The user can directly review one concise result with few dependencies","why":"This is the profile of a one-step task."},{"t":"The input is a single transcript and the output is a short list of action items","why":"One input and one limited output suits a single prompt."},{"t":"The work combines multiple sources, decisions, and deliverables that depend on checked intermediate results","why":"Several sources and dependencies mean later stages need earlier results to be checked first."},{"t":"The work involves rewriting one approved paragraph for a different audience","why":"A single transformation of one approved input is a one-step task."}]},{"s":6,"q":"Why should a reviewer treat exact citations, statistics, dates, names, and causal explanations with extra caution?","a":3,"o":[{"t":"They are usually less important than the main rule being summarized","why":"These details are often the most consequential part, because people act on them."},{"t":"They should be removed automatically, even when the source states them directly","why":"If the source states them, they belong. The point is to verify, not to delete."},{"t":"They are acceptable if they sound consistent with common practice","why":"Sounding typical is how fabricated specifics get through."},{"t":"Their precision creates an impression of authority and therefore requires direct evidence","why":"A specific figure or name reads as reliable, which is exactly why each one needs checking against the source."}]},{"s":8,"q":"A response recommends applicants who have a refined presentation style and membership in selective social organizations, even though the role requirements focus on supervising field teams and improving workflows. What is the strongest reason to question this recommendation?","a":1,"o":[{"t":"It uses language that is too informal for a workplace setting.","why":"Register is not the concern. The criteria are."},{"t":"It relies on proxy variables that substitute access or style for job-relevant evidence.","why":"Polish and club membership track background and access, not the ability to supervise teams or improve workflows."},{"t":"It gives too much weight to preferred rather than required criteria.","why":"These traits are not listed as criteria at all, preferred or required."},{"t":"It focuses on traits that are difficult to measure numerically.","why":"Being hard to quantify is not the problem. Being unrelated to the role is."}]},{"s":5,"q":"An AI-generated draft includes only source-supported facts, but it leaves out a mandatory criterion needed for the final decision. What is the best evaluation conclusion?","a":1,"o":[{"t":"The draft is compliant as long as no included sentence contradicts the source","why":"Accuracy of what is present does not cover what is absent."},{"t":"The draft may still be unusable because an omission can make the decision materially wrong","why":"Accurate and incomplete can still lead to the wrong decision when a mandatory criterion is missing."},{"t":"The draft should be judged mainly on whether its recommendation sounds reasonable","why":"Sounding reasonable is an impression, and it hides omissions."},{"t":"The draft should be accepted because factual statements are more important than coverage","why":"Accuracy and completeness are separate checks. Passing one does not excuse failing the other."}]},{"s":4,"q":"Which requirement is most important when writing a research prompt?","a":2,"o":[{"t":"Ask for a final recommendation with a ranked conclusion and short rationale","why":"A ranked recommendation is what an analysis prompt asks for."},{"t":"Instruct the model to generate many distinct possibilities before evaluation","why":"That is a brainstorming instruction."},{"t":"Define acceptable sources, recency expectations, citation method, and how to report unknowns","why":"Research is judged on traceable evidence, so the prompt has to set the source and citation rules and say what to do with gaps."},{"t":"Specify audience voice, message format, and revision criteria for clarity","why":"Those belong in a drafting prompt."}]},{"s":3,"q":"When should a user restart with a clean conversation instead of continuing with follow-up prompts?","a":2,"o":[{"t":"When the current draft is accurate but could be slightly shorter","why":"A small change to a sound draft is what a follow-up is for."},{"t":"When the user wants the model to make broader unsupported assumptions","why":"A restart is not a way round the evidence boundary."},{"t":"When accumulated drafts and conflicting instructions are causing context drift","why":"Once old drafts and replaced instructions are steering the output, a clean start with the current source and goal is more reliable."},{"t":"When a rubric has already been used once in the conversation","why":"Using a rubric does not damage the context."}]},{"s":2,"q":"After facts have been extracted into a structured record, what should happen before analysis begins?","a":1,"o":[{"t":"Draft recommendations so missing details can be filled in later","why":"Drafting before checking builds on facts nobody has confirmed."},{"t":"Compare the extracted record with the inventory to check completeness","why":"The completeness check catches anything skipped while it is still cheap to fix."},{"t":"Format the final output so reviewers can inspect it more easily","why":"Formatting comes last, after content is approved."},{"t":"Merge the raw sources with the draft to preserve more context","why":"Mixing raw material back in undoes the point of working from a checked record."}]},{"s":1,"q":"An internal note must mention a requested topic, but no facts about that topic were provided in the record. What is the best instruction to include in the prompt?","a":3,"o":[{"t":"Tell the model to omit the topic entirely so the note reads more confidently","why":"The topic was requested. Leaving it out hides the gap."},{"t":"Ask the model to supply the most likely missing details to keep the note complete","why":"This asks for invented facts presented as part of the record."},{"t":"Encourage the model to infer a reasonable next step from the surrounding context","why":"An inferred next step reads as a commitment nobody made."},{"t":"Require the response to state that the information was not supplied and avoid speculation","why":"This covers the topic honestly and gives Claude an acceptable way to handle the gap."}]},{"s":10,"q":"Which factor most strongly indicates that a response should receive increased human review before use?","a":3,"o":[{"t":"It contains polished writing and concise formatting","why":"Presentation quality is not a risk signal."},{"t":"It uses plain language that a broad audience can understand","why":"Readability does not raise the stakes."},{"t":"It was generated quickly and summarizes familiar material","why":"Speed and familiarity do not decide how much review is needed."},{"t":"It could influence safety, commitments, or consequential action","why":"Review effort should scale with what happens if the output is wrong."}]},{"s":3,"q":"A team reviews a draft announcement and notices that one required fact from the approved source is missing, while the tone and formatting are already acceptable. What is the best next step?","a":1,"o":[{"t":"Change the tone, length, and structure at the same time to improve the overall quality","why":"Changing several things at once risks breaking what already works and does not target the defect."},{"t":"Request a focused revision that keeps the accurate parts and adds the missing fact","why":"One named defect, one narrow change, and the sound parts are explicitly kept."},{"t":"Ask for a more creative and detailed rewrite so the missing information is more likely to appear","why":"Hoping the fact turns up is not a fix. Ask for it directly."},{"t":"Start a new conversation immediately, even though the source material and task remain clear","why":"The context is sound, so there is no reason to restart."}]},{"s":1,"q":"A manager wants a model-generated update to be easy to review for accuracy. Which prompt design best supports checking whether each claim is grounded in evidence?","a":2,"o":[{"t":"Ask for a polished response first and provide source facts only if revisions are needed","why":"Without the facts up front, the first response has nothing to be grounded in."},{"t":"Provide only a desired tone and let the model determine which details are important","why":"This leaves the content to the model's guesses."},{"t":"Place source facts in a clearly labeled block and state the task instructions separately","why":"Separating evidence from instructions lets a reviewer trace each statement back to the source."},{"t":"Combine all instructions and source notes into one paragraph so the model can infer priorities","why":"Blending the two makes it harder for the model and the reviewer to tell evidence from direction."}]},{"s":3,"q":"Which situation best indicates a genuine knowledge gap rather than a prompt-revision problem?","a":3,"o":[{"t":"The response uses an unsuitable tone even though the facts are present","why":"That is a tone defect, fixed by naming the audience and voice."},{"t":"The output omits a point that is clearly stated in the source material","why":"That is a completeness defect. The fact was available."},{"t":"The draft includes all necessary facts but does not separate them with headings","why":"That is a format defect."},{"t":"The needed answer is not contained in the provided material at all","why":"No rewording can produce a fact the source does not contain. Someone has to supply it."}]},{"s":6,"q":"An AI response says it is highly confident in its answer, but the reviewer has not yet checked the source text. What is the best next step?","a":3,"o":[{"t":"Keep the answer but soften its wording to reduce risk","why":"Softer wording leaves the same unchecked claims in place."},{"t":"Ask the AI to restate its confidence level in more detail","why":"More confidence language is still not evidence."},{"t":"Accept the answer if its tone is formal and internally consistent","why":"An answer can be formal, consistent and wrong."},{"t":"Verify each factual claim against the authoritative source instead of relying on confidence language","why":"Stated confidence is not verification. The source is."}]},{"s":2,"q":"Why is requesting a plan from Claude useful when handling a complex assignment?","a":3,"o":[{"t":"It replaces the need for completeness checks once the plan looks reasonable","why":"A reasonable-looking plan still has to be executed and checked."},{"t":"It allows formatting decisions to be made before the objective is clarified","why":"Formatting is the last stage. The objective comes first."},{"t":"It proves that all required work has already been completed correctly","why":"A plan is a proposal for work. It is not evidence the work was done."},{"t":"It lets a person review proposed stages, inputs, and gates before execution begins","why":"Reviewing the route before it runs is how gaps get caught early."}]},{"s":11,"q":"A team maintains a step-by-step operations document that several people must revise, share, and work through over multiple days. Which output format is the best fit?","a":0,"o":[{"t":"An Artifact, because the item is a substantial reusable object needing interaction and collaboration","why":"A standalone piece of work that people return to, edit and share is what an Artifact is for."},{"t":"Structured data, because all collaborative work should be converted into stable fields","why":"A procedural document is prose and steps, not records in fields."},{"t":"An inline answer, because readers can review it immediately in one message","why":"An inline reply is read once. It is a poor home for something revised over days."},{"t":"A short status paragraph, because concise text reduces the need for version control","why":"A paragraph cannot hold a step-by-step document."}]},{"s":9,"q":"A draft says a device will perform at a stated level in normal use. The only evidence is a source saying performance is \"up to\" that level under named test conditions. What is the best interpretation?","a":0,"o":[{"t":"The claim is not supported as written because removing the stated conditions changes the meaning","why":"'Up to' under test conditions is a ceiling in a specific setup. Dropping the qualifiers makes a different, stronger claim."},{"t":"The claim is unresolved because test conditions never matter when a number is published","why":"Test conditions are exactly what define what the number means."},{"t":"The claim is verified because \"up to\" performance establishes normal expected results","why":"A maximum is not a typical result."},{"t":"The claim is verified if the source comes from the manufacturer rather than an independent tester","why":"Who published it does not change what the source actually says."}]},{"s":4,"q":"A manager tells Claude to brainstorm outreach ideas but also requires that every idea be a verified conclusion supported by existing evidence. What is the main problem with this instruction?","a":1,"o":[{"t":"It replaces source-tracing rules with formatting rules that belong in drafting","why":"No formatting rules are involved."},{"t":"It applies a research or analysis standard too early and can reduce idea variety","why":"Demanding verified conclusions during idea generation filters out the untested options a brainstorm is for."},{"t":"It removes the need for human review between task transitions","why":"The instruction says nothing about review between stages."},{"t":"It makes the brainstorm too audience-specific and turns it into a drafting task","why":"Audience is not what changed. The evidence standard is."}]},{"s":8,"q":"Which review instruction is most actionable for evaluating recruiting criteria?","a":3,"o":[{"t":"Ensure the final output sounds fully neutral and free from any possible bias.","why":"'Sounds neutral' is about tone and cannot be checked. Bias can sit behind neutral wording."},{"t":"Prefer criteria that appear commonly associated with long-term leadership success.","why":"'Commonly associated' invites stereotypes and proxies."},{"t":"Use polished wording first, then evaluate whether the reasoning seems generally fair.","why":"'Seems generally fair' is an impression, and polishing first puts presentation ahead of substance."},{"t":"Trace each criterion to documented role evidence, identify missing affected perspectives, and state uncertainty where support is absent.","why":"Each part is a concrete check a reviewer can carry out and show."}]},{"s":10,"q":"When adapting one validated set of facts for executives, specialists, and operators, which four elements should change while the facts remain the same?","a":2,"o":[{"t":"Root-cause conclusion, technical detail, decision ownership, and chronology","why":"The root cause and the order of events are facts. They do not change with the reader."},{"t":"Evidence standard, source authority, confidence level, and factual scope","why":"These are about what is true and how well it is supported, which stay fixed for every audience."},{"t":"Depth, vocabulary, tone, and call to action","why":"These are the presentation choices that fit a message to its reader without touching the facts."},{"t":"Validation method, publication status, review authority, and business impact","why":"These describe process and consequences, not how a message is tailored."}]},{"s":7,"q":"Which review step best checks internal consistency in a response comparing multiple options?","a":0,"o":[{"t":"Trace numbers, units, labels, definitions, and conclusions across the full response","why":"Internal consistency means the response agrees with itself from start to finish, so the check has to follow each item all the way through."},{"t":"Focus on whether the final recommendation sounds confident and practical","why":"How it sounds says nothing about whether it contradicts itself."},{"t":"Accept the calculations if the terminology appears consistent within one paragraph","why":"Inconsistencies usually appear between sections, not inside one paragraph."},{"t":"Confirm that at least one number in the response matches a reliable outside source","why":"That is an external fact check, and on one number only."}]},{"s":4,"q":"A team wants Claude to compare three internal proposals and choose the best one using only a supplied set of approved facts. Which prompt type is the best fit?","a":0,"o":[{"t":"Analysis, because it narrows supplied evidence into a bounded decision","why":"Comparing given options against given facts to reach a choice is analysis."},{"t":"Research, because it focuses on tracing evidence and reporting unknowns","why":"The evidence is already supplied. Nothing needs to be found."},{"t":"Brainstorming, because it emphasizes producing the widest possible range of unfiltered ideas","why":"The task is to narrow three options to one, not to widen the field."},{"t":"Drafting, because it turns approved facts into audience-ready communication","why":"Drafting comes after the decision is made."}]},{"s":8,"q":"A review panel has input from managers and finance staff about a scheduling role, but no input from the support staff whose daily work would be shaped by the role. Which concern does this most directly illustrate?","a":1,"o":[{"t":"Framing bias, because the role has been defined too broadly.","why":"Nothing here is about how the role was framed or scoped."},{"t":"Factual imbalance, because the record shows a measurable gap in who provided input.","why":"You can point to who was asked and who was not. The affected group is absent from the record."},{"t":"Validated prediction, because multiple internal groups contributed feedback.","why":"Several groups contributing does not validate anything when the most affected group is missing."},{"t":"Stereotyping, because assumptions are being made about group behavior.","why":"No assumptions about a group's behaviour are described. The issue is missing input."}]},{"s":1,"q":"Which prompt element defines who will read the response and helps determine terminology, detail, and tone?","a":3,"o":[{"t":"Objective","why":"The objective is the piece of work to be produced."},{"t":"Authoritative inputs","why":"These are the facts Claude may use as evidence."},{"t":"Output format","why":"Format is the layout of the answer, such as headings or a table."},{"t":"Audience","why":"The audience is the readers, and their needs set vocabulary, depth and tone."}]},{"s":4,"q":"For complex work that needs brainstorming, research, analysis, and drafting, which sequence is generally the best order?","a":2,"o":[{"t":"Draft first, brainstorm revisions, research missing facts, then analyze alternatives","why":"Drafting first means writing before there are options, evidence or a decision."},{"t":"Analyze immediately, draft a recommendation, research supporting details, then brainstorm improvements","why":"There is nothing to analyse until options exist and evidence has been gathered."},{"t":"Brainstorm first, research selected options, analyze the evidence, then draft the communication","why":"Widen the options, gather evidence on the promising ones, decide, then write it up."},{"t":"Research everything first, draft a message, brainstorm backup options, then analyze trade-offs","why":"Researching everything before choosing options wastes effort, and drafting before analysis puts the message ahead of the decision."}]}]}}}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
/* Answers live in memory only: nothing is stored or sent, and every visit starts clean. */
try{localStorage.removeItem('ct.v1')}catch(e){}
var S={quiz:{},exam:{}};
function save(){}
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function has(id){return !!D.content[id]}
function qstate(id){return S.quiz[id]||(S.quiz[id]={})}
function result(id){ // {answered, right, total}
  var c=D.content[id];if(!c)return null;var st=S.quiz[id]||{},a=0,r=0;
  c.quiz.forEach(function(q,i){var e=st[i];if(e&&e.done){a++;if(isRight(q,e.sel))r++}});
  return {answered:a,right:r,total:c.quiz.length};
}
function isRight(q,sel){var ok=q.o.map(function(o,i){return o.ok?i:-1}).filter(function(i){return i>=0});
  return ok.length===sel.length&&ok.every(function(i){return sel.indexOf(i)>=0})}
function nextUp(){for(var i=0;i<D.sections.length;i++){var s=D.sections[i];if(has(s.id)){var r=result(s.id);if(r.answered<r.total)return s.id}}return null}

function routeHTML(cur,filter){
  var h='<ol class="route">',last=-1,f=(filter||'').toLowerCase();
  D.sections.forEach(function(s){
    if(f&&s.title.toLowerCase().indexOf(f)<0)return;
    if(s.d!==last){last=s.d;var dm=D.domains[s.d];h+='<li class="dom">'+esc(dm.name)+(dm.w?' <span>'+dm.w+'% of exam</span>':'')+'</li>'}
    var r=has(s.id)?result(s.id):null,cls=[];
    if(!has(s.id))cls.push('soon');if(r&&r.answered===r.total)cls.push('done');if(s.id===cur)cls.push('cur');
    h+='<li><a class="'+cls.join(' ')+'" '+(has(s.id)?'href="#/s/'+s.id+'"':'aria-disabled="true"')+(s.id===cur?' aria-current="page"':'')+'>'+
      '<span class="n">'+pad(s.id)+'</span><span>'+esc(s.title)+(has(s.id)?'':' <span class="sr">(coming soon)</span>')+'</span>'+
      (r&&r.answered===r.total?'<span class="sc">'+r.right+'/'+r.total+'</span>':'')+'</a></li>';
  });
  Object.keys(D.exams).forEach(function(k,n){var x=D.exams[k];
    if(f&&x.title.toLowerCase().indexOf(f)<0)return;
    if(!n)h+='<li class="dom">Practice exams</li>';
    var st=S.exam[k],cls=[];if(st&&st.done)cls.push('done');if(cur==='x'+k)cls.push('cur');
    h+='<li><a class="'+cls.join(' ')+'" href="#/exam/'+k+'"><span class="n">P'+k+'</span><span>'+esc(x.title)+', '+x.q.length+' questions</span>'+
      (st&&st.done?'<span class="sc">'+examScore(k)+'/'+x.q.length+'</span>':'')+'</a></li>'});
  return h+'</ol>';
}
function drawRail(cur){$('#rail').innerHTML=routeHTML(cur)+'<a class="xl" href="#/glossary">Glossary</a>'}
function overall(){var done=0,avail=0;D.sections.forEach(function(s){if(has(s.id)){avail++;var r=result(s.id);if(r.answered===r.total)done++}});return {done:done,avail:avail}}
function drawProg(){var o=overall();$('#barprog').style.width=(o.avail?Math.round(100*o.done/D.sections.length):0)+'%'}

/* ---------- views ---------- */
function home(){
  var o=overall(),nx=nextUp(),first=D.sections.filter(function(s){return has(s.id)})[0];
  var started=Object.keys(S.quiz).some(function(k){return Object.keys(S.quiz[k]).length});
  var cta=nx?'<a class="btn pri" href="#/s/'+nx+'">'+(started?'Continue with session '+nx:'Start session '+nx)+'</a>':
    '<a class="btn pri" href="#/s/'+first.id+'">Review from session '+first.id+'</a>';
  var h='<div class="wide home"><section class="hero"><div><h1>Thirty-two short sessions to exam day.</h1>'+
    '<p>A study guide for the Claude Certified Associate, Foundations exam. Read a section, sit its five questions, see why each answer is right or wrong.</p>'+
    '<div class="cta">'+cta+'<button class="btn" id="inst" hidden>Install on this device</button></div></div>'+
    '<img class="mark" src="assets/logo-transparent-1024.png" alt="" width="170" height="170"></section>'+
    '<div class="stat"><div><b>'+o.avail+'</b>of '+D.sections.length+' sessions published</div><div><b>'+o.done+'</b>quizzes finished this visit</div><div><b>'+Object.keys(D.exams).length+'</b>practice exam'+(Object.keys(D.exams).length===1?'':'s')+'</div><div><b>'+Object.keys(D.glossary).length+'</b>glossary terms</div></div>'+
    '<div class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
    '<label class="sr" for="find">Find a session or term</label><input id="find" type="search" placeholder="Find a session or a term" autocomplete="off"></div>'+
    '<ul class="hits" id="hits"></ul><div id="list">'+routeHTML(null)+'</div>'+
    '<div class="tip" id="tip"><b>Keep it on your phone.</b> Open this page in your phone browser, then choose Add to Home screen from the browser menu (on iPhone: Share, then Add to Home Screen). It opens like an app and works offline.</div>'+
    '<footer class="ft"><div>Built by Justin VanAusdall for his team. Unofficial study material, not affiliated with or endorsed by Anthropic. Practice questions are original and are not taken from the exam.</div>'+
    '<div>Your quiz answers are never saved or sent anywhere. They clear every time you open or reload this page.</div></footer></div>';
  $('#view').innerHTML=h;document.title='Claude Foundations training';
  $('#find').addEventListener('input',function(){
    var v=this.value.trim();$('#list').innerHTML=routeHTML(null,v);
    var hits='';if(v.length>1){var f=v.toLowerCase();Object.keys(D.glossary).forEach(function(k){var g=D.glossary[k];
      if(g[0].toLowerCase().indexOf(f)>=0)hits+='<li><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></li>'})}
    $('#hits').innerHTML=hits;
  });
  if(deferred){var b=$('#inst');b.hidden=false;b.onclick=function(){deferred.prompt();deferred=null;b.hidden=true}}
  if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#tip').hidden=true;
  drawRail(null);
}
function section(id){
  var c=D.content[id],s=D.sections[id-1];if(!c){location.hash='#/';return}
  var dm=D.domains[s.d],prev=null,next=null;
  D.sections.forEach(function(x){if(has(x.id)){if(x.id<id)prev=x;if(x.id>id&&!next)next=x}});
  var h='<article class="wrap"><p class="crumb"><b>'+pad(id)+'</b>'+esc(dm.name)+'</p><h1 class="t" id="top">'+esc(s.title)+'</h1><p class="lead">'+c.lead+'</p>'+
    '<div class="acts"><a class="btn" href="'+c.deck+'">Open the slides</a><a class="btn" href="#quiz">Go to the questions</a></div>'+
    '<div class="body">'+c.html+'</div>'+
    '<section class="take"><h2>Keep these</h2><ul>'+c.takeaways.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></section>'+
    '<section class="prac"><h2>Try it this week</h2><p>'+c.practice+'</p></section>'+
    '<section class="quiz" id="quiz"><h2>Five questions</h2><p>Pick an answer to see the reason behind every option.</p><div id="qs"></div><div id="score"></div></section>'+
    '<nav class="pn" aria-label="Other sessions">'+(prev?'<a href="#/s/'+prev.id+'"><small>Previous</small>'+esc(prev.title)+'</a>':'<span></span>')+
    (next?'<a class="nx" href="#/s/'+next.id+'"><small>Next</small>'+esc(next.title)+'</a>':'<a class="nx" href="#/"><small>Back to</small>All sessions</a>')+'</nav></article>';
  $('#view').innerHTML=h;document.title=s.title+' | Claude Foundations';
  $$('figure.prompt',$('#view')).forEach(function(f){
    var b=document.createElement('button');b.className='copy';b.textContent='Copy';
    b.onclick=function(){copy($('pre',f).textContent,b)};$('figcaption',f).appendChild(b);
  });
  drawQuiz(id);drawRail(id);
}
function drawQuiz(id){
  var c=D.content[id],st=qstate(id),box=$('#qs');box.innerHTML='';
  c.quiz.forEach(function(q,i){
    var e=st[i]||(st[i]={sel:[],done:false});
    if(!e.ord||e.ord.length!==q.o.length){e.ord=q.o.map(function(_,k){return k});for(var k=e.ord.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=e.ord[k];e.ord[k]=e.ord[j];e.ord[j]=t}}
    var el=document.createElement('div');el.className='q'+(q.multi?' multi':'')+(e.done?' done':'');
    var h='<div class="qn">Question '+(i+1)+' of '+c.quiz.length+'</div><h3 id="q'+i+'">'+esc(q.q)+'</h3>'+(q.multi?'<p class="hint">Choose two.</p>':'')+'<div role="group" aria-labelledby="q'+i+'">';
    e.ord.forEach(function(k){var o=q.o[k],sel=e.sel.indexOf(k)>=0,cls='opt'+(sel?' sel':''),tag='',mk='';
      if(e.done){if(o.ok){cls+=sel?' right':' right missed';tag='<span class="tag">'+(sel?'Correct':'Correct answer')+'</span>';mk='✓'}
        else if(sel){cls+=' wrong';tag='<span class="tag">Your answer</span>';mk='✕'}}
      else if(sel)mk=q.multi?'✓':'';
      h+='<button class="'+cls+'" data-k="'+k+'"'+(e.done?' disabled':'')+' aria-pressed="'+sel+'"><span class="box" aria-hidden="true">'+mk+'</span><span>'+esc(o.t)+
        '</span><span class="why">'+tag+esc(o.why)+'</span></button>'});
    h+='</div>';
    if(q.multi&&!e.done)h+='<button class="btn check" data-check="1"'+(e.sel.length===2?'':' disabled style="opacity:.5"')+'>Check my answer</button>';
    if(e.done){var ok=isRight(q,e.sel);h+='<p class="verdict '+(ok?'y':'n')+'">'+(ok?'Right.':'Not this time. Read the reasons above.')+'</p>'}
    el.innerHTML=h;
    el.addEventListener('click',function(ev){
      var b=ev.target.closest('button');if(!b||e.done)return;
      if(b.dataset.check){if(e.sel.length!==2)return;e.done=true}
      else if(b.dataset.k!==undefined){var k=+b.dataset.k;
        if(q.multi){var at=e.sel.indexOf(k);if(at>=0)e.sel.splice(at,1);else{if(e.sel.length>=2)e.sel.shift();e.sel.push(k)}}
        else{e.sel=[k];e.done=true}}
      save(S);var y=window.scrollY;drawQuiz(id);drawRail(id);drawProg();window.scrollTo(0,y);
    });
    box.appendChild(el);
  });
  var r=result(id),sc=$('#score');
  if(r.answered===r.total){
    sc.innerHTML='<div class="score"><div><b>'+r.right+' of '+r.total+'</b><span>'+(r.right===r.total?'Clean sheet.':r.right>=4?'Solid. Re-read the reasons on the one you missed.':'Go back through the section, then try again.')+'</span></div><button class="btn" id="again">Try the questions again</button></div>';
    $('#again').onclick=function(){S.quiz[id]={};drawQuiz(id);drawRail(id);drawProg();$('#quiz').scrollIntoView()};
  }else sc.innerHTML='';
  save(S);
}

/* ---------- practice exam ---------- */
var LET=['A','B','C','D','E'],tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function examScore(k){var x=D.exams[k],st=S.exam[k],n=0;if(!st)return 0;x.q.forEach(function(q,i){if(st.ans[i]===q.a)n++});return n}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return (m<10?'0':'')+m+':'+(s%60<10?'0':'')+(s%60)}
function exam(k){
  var x=D.exams[k],st=S.exam[k];drawRail('x'+k);document.title=x.title+' | Claude Foundations';
  if(!st)return examIntro(k);if(st.done)return examResult(k);examQ(k);
}
function examIntro(k){
  var x=D.exams[k];
  $('#view').innerHTML='<div class="wrap"><p class="crumb">Practice exam</p><h1 class="t">'+esc(x.title)+'</h1>'+
    '<p class="lead">'+x.q.length+' multiple-choice questions, one correct answer each. You see the answers and the reasons only after you finish, like the real thing.</p>'+
    '<div class="facts"><div><b>'+x.q.length+'</b>questions</div><div><b>'+x.min+' min</b>if you use the timer</div><div><b>'+x.target+' of '+x.q.length+'</b>a good score to aim for</div></div>'+
    '<div class="cta"><button class="btn pri" id="go1">Start</button><button class="btn" id="go2">Start with a '+x.min+'-minute timer</button></div>'+
    '<div class="tip">You can jump between questions, change answers and flag any you want to come back to. Nothing is saved or sent. If you reload the page, the exam starts again. '+
    'The target is a study guide only. The real exam uses its own scaled scoring.</div></div>';
  function start(timed){S.exam[k]={ans:{},flag:{},cur:0,done:false,end:timed?Date.now()+x.min*6e4:0};exam(k);window.scrollTo(0,0)}
  $('#go1').onclick=function(){start(false)};$('#go2').onclick=function(){start(true)};
}
function examQ(k){
  var x=D.exams[k],st=S.exam[k],i=st.cur,q=x.q[i],n=x.q.length,left=n-Object.keys(st.ans).length;
  var h='<div class="wrap exq"><div class="ex-top"><p class="crumb">'+esc(x.title)+'</p>'+(st.end?'<span class="timer" id="tm"></span>':'')+'</div><ol class="strip">';
  x.q.forEach(function(_,j){var c=[];if(st.ans[j]!==undefined)c.push('ans');if(st.flag[j])c.push('flag');if(j===i)c.push('cur');
    h+='<li><button class="'+c.join(' ')+'" data-j="'+j+'" aria-label="Question '+(j+1)+(st.ans[j]!==undefined?', answered':'')+(st.flag[j]?', flagged':'')+'"'+(j===i?' aria-current="true"':'')+'>'+(j+1)+'</button></li>'});
  h+='</ol><div class="qn">Question '+(i+1)+' of '+n+'</div><h2 id="exh">'+esc(q.q)+'</h2><div role="radiogroup" aria-labelledby="exh">';
  q.o.forEach(function(o,j){var sel=st.ans[i]===j;
    h+='<button class="opt'+(sel?' sel':'')+'" role="radio" aria-checked="'+sel+'" data-o="'+j+'"><span class="box let" aria-hidden="true">'+LET[j]+'</span><span>'+esc(o.t)+'</span></button>'});
  h+='</div><div class="exnav"><button class="btn" id="pv"'+(i?'':' disabled')+'>Previous</button><button class="btn'+(st.flag[i]?' on':'')+'" id="fl" aria-pressed="'+!!st.flag[i]+'">'+(st.flag[i]?'Flagged':'Flag for review')+'</button>'+
    '<span class="sp"></span>'+(i<n-1?'<button class="btn pri" id="nx">Next</button>':'')+'<button class="btn" id="fin">Finish exam</button></div><div id="warn"></div></div>';
  $('#view').innerHTML=h;
  var cb=$('.strip .cur'),sp=$('.strip');if(cb&&sp.scrollWidth>sp.clientWidth)sp.scrollLeft=cb.parentNode.offsetLeft-sp.clientWidth/2+18;
  function to(j,top){st.cur=j;var y=window.scrollY;examQ(k);window.scrollTo(0,top?0:y)}
  $$('.strip button').forEach(function(b){b.onclick=function(){to(+b.dataset.j)}});
  $$('.opt[data-o]').forEach(function(b){b.onclick=function(){st.ans[i]=+b.dataset.o;to(i)}});
  $('#pv').onclick=function(){if(i)to(i-1,true)};if($('#nx'))$('#nx').onclick=function(){to(i+1,true)};
  $('#fl').onclick=function(){st.flag[i]=!st.flag[i];to(i)};
  $('#fin').onclick=function(){
    var fl=Object.keys(st.flag).filter(function(j){return st.flag[j]}).length;
    if(!left&&!fl){finish(k);return}
    $('#warn').innerHTML='<div class="warn"><span>'+(left?left+' unanswered':'')+(left&&fl?' and ':'')+(fl?fl+' flagged':'')+'. Unanswered questions score zero.</span><button class="btn pri" id="fin2">Finish anyway</button></div>';
    $('#fin2').onclick=function(){finish(k)};$('#fin2').focus();
  };
  if(st.end){var tm=$('#tm'),upd=function(){var ms=st.end-Date.now();if(ms<=0){finish(k);return}tm.textContent=fmt(ms)+' left';tm.classList.toggle('low',ms<3e5)};upd();stopTimer();tick=setInterval(upd,1000)}
}
function finish(k){stopTimer();S.exam[k].done=true;S.exam[k].only=false;exam(k);window.scrollTo(0,0);drawProg()}
function examResult(k){
  var x=D.exams[k],st=S.exam[k],n=x.q.length,sc=examScore(k),dom={},ses={};
  x.q.forEach(function(q,i){var d=D.sections[q.s-1].d,ok=st.ans[i]===q.a;dom[d]=dom[d]||[0,0];dom[d][1]++;if(ok)dom[d][0]++;else{ses[q.s]=(ses[q.s]||0)+1}});
  var pct=Math.round(100*sc/n),msg=sc>=x.target?'At or above the target. Read the reasons for anything you missed.':'Below the target of '+x.target+'. The list below shows where to spend your time.';
  var h='<div class="wrap"><p class="crumb">'+esc(x.title)+', result</p><p class="big">'+sc+'<small>of '+n+' ('+pct+'%)</small></p><p class="lead" style="margin-top:14px">'+msg+'</p>'+
    '<h2 class="h2">By exam domain</h2><div class="bars">';
  Object.keys(dom).sort(function(a,b){return a-b}).forEach(function(d){var v=dom[d];
    h+='<div class="row"><span>'+esc(D.domains[d].name)+'</span><b>'+v[0]+'/'+v[1]+'</b><div class="track"><div class="fill" style="width:'+(100*v[0]/v[1])+'%"></div></div></div>'});
  h+='</div>';
  var miss=Object.keys(ses).sort(function(a,b){return ses[b]-ses[a]||a-b});
  if(miss.length){h+='<h2 class="h2">Sessions to revisit</h2><ul class="rev">';
    miss.forEach(function(s){var sec=D.sections[s-1],t=pad(+s)+' '+esc(sec.title);
      h+='<li>'+(has(+s)?'<a href="#/s/'+s+'">'+t+'</a>':t+' <span style="color:var(--dim)">(not published yet)</span>')+'<span style="color:var(--mute)">, '+ses[s]+' missed</span></li>'});
    h+='</ul>'}
  h+='<h2 class="h2">Every question, with reasons</h2><div class="cta" style="margin:10px 0 18px"><button class="btn'+(st.only?' on':'')+'" id="only" aria-pressed="'+!!st.only+'">'+(st.only?'Showing missed only':'Show only the ones I missed')+'</button><button class="btn" id="redo">Start this exam again</button></div>';
  x.q.forEach(function(q,i){var a=st.ans[i],ok=a===q.a;if(st.only&&ok)return;
    h+='<div class="q done"><div class="qn">Question '+(i+1)+(a===undefined?', not answered':'')+'</div><h3>'+esc(q.q)+'</h3>';
    q.o.forEach(function(o,j){var cls='opt',tag='';
      if(j===q.a){cls+=' right'+(a===j?'':' missed');tag='<span class="tag">'+(a===j?'Correct':'Correct answer')+'</span>'}else if(a===j){cls+=' wrong';tag='<span class="tag">Your answer</span>'}
      h+='<div class="'+cls+'"><span class="box let" aria-hidden="true">'+LET[j]+'</span><span>'+esc(o.t)+'</span><span class="why">'+tag+esc(o.why)+'</span></div>'});
    h+='</div>'});
  if(st.only&&sc===n)h+='<p class="lead">Nothing missed.</p>';
  $('#view').innerHTML=h+'</div>';
  $('#only').onclick=function(){st.only=!st.only;var y=window.scrollY;examResult(k);window.scrollTo(0,y)};
  $('#redo').onclick=function(){delete S.exam[k];exam(k);window.scrollTo(0,0)};
  drawRail('x'+k);
}
document.addEventListener('keydown',function(e){
  var m=location.hash.match(/^#\/exam\/(\d+)/);if(!m||e.metaKey||e.ctrlKey||e.altKey)return;var st=S.exam[m[1]];if(!st||st.done)return;
  var x=D.exams[m[1]],k=e.key.toUpperCase(),j=LET.indexOf(k);if(j<0&&/^[1-5]$/.test(k))j=+k-1;
  if(j>=0&&j<x.q[st.cur].o.length){st.ans[st.cur]=j;examQ(m[1])}
  else if(e.key==='ArrowRight'&&st.cur<x.q.length-1){st.cur++;examQ(m[1])}
  else if(e.key==='ArrowLeft'&&st.cur>0){st.cur--;examQ(m[1])}
});
function glossary(){
  var keys=Object.keys(D.glossary).sort(function(a,b){return D.glossary[a][0].localeCompare(D.glossary[b][0])});
  $('#view').innerHTML='<div class="wrap"><p class="crumb">Reference</p><h1 class="t">Glossary</h1><p class="lead">Every underlined term in the sessions, in one place.</p><dl class="gl">'+
    keys.map(function(k){var g=D.glossary[k];return '<div id="g-'+k+'"><dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd></div>'}).join('')+'</dl></div>';
  document.title='Glossary | Claude Foundations';drawRail(null);
}
function go(){
  closePop();document.body.classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');$('#scrim').hidden=true;
  var m=location.hash.match(/^#\/s\/(\d+)/);
  if(location.hash==='#quiz'){var q=$('#quiz');if(q){q.scrollIntoView();return}}
  var x=location.hash.match(/^#\/exam\/(\d+)/);stopTimer();
  if(m)section(+m[1]);else if(x&&D.exams[x[1]])exam(x[1]);else if(location.hash==='#/glossary')glossary();else home();
  drawProg();window.scrollTo(0,0);
}
var lastRoute='';
window.addEventListener('hashchange',function(){
  if(location.hash==='#quiz'){var q=$('#quiz');if(q){q.scrollIntoView({behavior:'smooth'});history.replaceState(null,'',lastRoute||'#/');return}}
  lastRoute=location.hash;go();
});

/* ---------- glossary pop-up ---------- */
var pop=$('#pop'),cur=null,fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches,hideT;
function openPop(el){
  var g=D.glossary[el.dataset.g];if(!g)return;clearTimeout(hideT);
  if(cur&&cur!==el)cur.setAttribute('aria-expanded','false');cur=el;el.setAttribute('aria-expanded','true');
  pop.innerHTML='<b>'+esc(g[0])+'</b>'+esc(g[1]);pop.hidden=false;
  if(window.innerWidth>640){var r=el.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
    var x=Math.max(12,Math.min(window.innerWidth-w-12,r.left+r.width/2-w/2)),y=r.bottom+10;
    if(y+h>window.innerHeight-10&&r.top-h-10>60)y=r.top-h-10;
    pop.style.left=(x+window.scrollX)+'px';pop.style.top=(y+window.scrollY)+'px'}
  else{pop.style.left='';pop.style.top=''}
}
function closePop(){if(cur){cur.setAttribute('aria-expanded','false');cur=null}pop.hidden=true}
document.addEventListener('click',function(e){
  var g=e.target.closest('.g');
  if(g){e.preventDefault();if(cur===g&&!fine)closePop();else openPop(g);return}
  if(!e.target.closest('#pop'))closePop();
});
if(fine){
  document.addEventListener('mouseover',function(e){var g=e.target.closest('.g');if(g)openPop(g);else if(e.target.closest('#pop'))clearTimeout(hideT)});
  document.addEventListener('mouseout',function(e){if(e.target.closest('.g')||e.target.closest('#pop')){clearTimeout(hideT);hideT=setTimeout(closePop,220)}});
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closePop();document.body.classList.remove('open');$('#scrim').hidden=true}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('g')){e.preventDefault();if(cur===e.target)closePop();else openPop(e.target)}
});
document.addEventListener('focusout',function(e){if(e.target.classList&&e.target.classList.contains('g'))closePop()});
window.addEventListener('scroll',function(){if(cur&&window.innerWidth>640&&!fine)closePop()},{passive:true});

/* ---------- menu, copy, toast, install ---------- */
$('#menuBtn').addEventListener('click',function(){var o=document.body.classList.toggle('open');this.setAttribute('aria-expanded',o);$('#scrim').hidden=!o});
$('#scrim').addEventListener('click',function(){document.body.classList.remove('open');this.hidden=true;$('#menuBtn').setAttribute('aria-expanded','false')});
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},1800)}
function copy(text,btn){
  function ok(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy'},1500)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fb)}else fb();
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('Select the text and copy it manually')}document.body.removeChild(ta)}
}
var deferred=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;var b=$('#inst');if(b){b.hidden=false;b.onclick=function(){deferred.prompt();deferred=null;b.hidden=true}}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
/* start clean when a page comes back from the browser's back-forward cache, or after 30 minutes in the background */
var hiddenAt=0;
function fresh(){stopTimer();S={quiz:{},exam:{}};go()}
window.addEventListener('pageshow',function(e){if(e.persisted)fresh()});
document.addEventListener('visibilitychange',function(){if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>18e5)fresh()});
lastRoute=location.hash;go();
})();
</script>
</body>
</html>
