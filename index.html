 field and carry on, or release unreviewed content. Each of those leaves at least one conflict in place.<\/p>\n<figure class=\"out good\"><figcaption>Exception record and compliant alternative<\/figcaption><pre>Activity: draft a customer-facing knowledge article about a\nrecurring RDP certificate warning.\n\nPolicy conflicts\n- Personal AI account: conflicts with clause 1, Approved workspace.\n- Full ticket thread: conflicts with clause 2, Protected data.\n- Release without review: conflicts with clause 3, External\n  content.\n\nAction: pause the requested workflow. Send this record to the\ndesignated AI governance approver and tell the business owner.\n\nProposed compliant workflow\n1. Use the approved AI workspace and organisation account.\n2. Write a minimised summary of the issue with no customer names,\n   email addresses, hostnames, IP addresses, credentials or\n   ticket text.\n3. Ask Claude to draft a general article from that summary.\n4. Validate the draft against the approved support procedure.\n5. Get and record subject-matter reviewer approval before\n   publishing.\n6. Keep the source reference, prompt version, validation result\n   and approval record.<\/pre><\/figure>\n<p>The record cites the policy. It does not argue from urgency or seniority. It also gives the approver something workable: approve the compliant alternative, ask for more review, or formally decide whether an exception is justified. Until written approval exists, the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"exception-approval\">exception<\/span> is not authorised.<\/p>\n<aside class=\"note\"><b>Escalation boundary<\/b><p>An informal instruction, a verbal assurance or a request to move quickly is not an approved exception.<\/p><\/aside>\n<h2>Keep the controls on during the work<\/h2>\n<p>Governance continues after the first decision. Check that the minimised summary really contains no prohibited data, use the designated workspace, and compare the draft with the approved procedure. If the draft contains an unsupported statement, remove it or go back to the authoritative source.<\/p>\n<p>Changes create new decision points. Swapping the summary for a ticket thread, changing the destination from internal draft to public article, or adding a new AI service all change the risk and may need reassessment.<\/p>\n<ul><li>Keep the final approval attached to the version that was released, not an earlier draft.<\/li><li>Record material changes to the source summary, prompt or audience.<\/li><li>Report a possible policy incident promptly through the defined process.<\/li><li>Review recurring exceptions. They may mean the standard workflow or the policy needs adjusting.<\/li><\/ul>","takeaways":["Capability is not permission. Permission comes from the approved tool, the data classification, the purpose and the required review.","Turn policy into a checklist: purpose, workspace, data, review, record, escalate.","Users, owners, reviewers, support functions and approvers each have a distinct responsibility.","Seniority, urgency and verbal assurance do not authorise an exception. Written approval through the defined process does.","When a request conflicts with policy, pause, document the conflict and offer a minimised compliant alternative."],"practice":"Find your organisation's AI or acceptable-use policy. Turn it into a six-line checklist you could run before using an AI tool on customer work. Note anything the policy does not clearly answer.","deck":"decks/27-ai-policies-and-governance.html","quiz":[{"q":"A tool will technically accept a full customer ticket thread. Does that mean you may paste one in?","multi":false,"o":[{"t":"Yes. If the tool accepts it, it is allowed.","ok":false,"why":"Technical capability creates no organisational permission."},{"t":"Yes, if you delete the conversation afterwards.","ok":false,"why":"Deleting afterwards does not undo entering prohibited data."},{"t":"No. Permission depends on the approved tool and account, the data classification, the purpose and the required review.","ok":true,"why":"Governance decides permission. The product's features do not."},{"t":"Only if the customer is a small one.","ok":false,"why":"Customer size is not a policy test."}]},{"q":"A senior colleague tells you to use a personal AI account and skip the review, to save time. What authorises a departure from policy?","multi":false,"o":[{"t":"The colleague's seniority.","ok":false,"why":"Seniority does not override a control."},{"t":"The urgency of the deadline.","ok":false,"why":"Urgency is not an approval."},{"t":"A verbal assurance that it will be fine.","ok":false,"why":"An informal assurance is not an approved exception."},{"t":"Written approval from the designated approver, before the activity takes place.","ok":true,"why":"Only the policy's authorised exception process changes a control."}]},{"q":"Faced with that request, what is the right first action?","multi":false,"o":[{"t":"Do it, and note your concerns afterwards.","ok":false,"why":"The prohibited data would already have been entered."},{"t":"Remove the IP addresses and carry on in the personal account.","ok":false,"why":"That still breaks the workspace and review clauses, and leaves other protected data."},{"t":"Pause, document the policy conflicts, escalate to the approver and propose a compliant alternative.","ok":true,"why":"It stops the breach, cites the policy basis and gives the approver a workable path."},{"t":"Refuse and say nothing more.","ok":false,"why":"The work may be legitimate. A compliant alternative keeps it moving."}]},{"q":"What is the subject-matter reviewer's job for a customer-facing article?","multi":false,"o":[{"t":"Checking grammar and spelling.","ok":false,"why":"That is proofreading, not subject-matter review."},{"t":"Confirming the guidance is accurate, complete and operationally suitable.","ok":true,"why":"The reviewer confirms the public content correctly represents the process."},{"t":"Deciding whether the data may be used.","ok":false,"why":"That is the data owner's role."},{"t":"Approving policy exceptions.","ok":false,"why":"That belongs to the designated approver."}]},{"q":"Which TWO changes during the work should prompt a reassessment?","multi":true,"o":[{"t":"The destination changes from an internal draft to a public article.","ok":true,"why":"External release changes the consequence and the review required."},{"t":"The draft's heading is reworded.","ok":false,"why":"A cosmetic edit does not change the risk."},{"t":"The minimised summary is swapped for a full ticket thread.","ok":true,"why":"The data going in has changed category."},{"t":"The article is saved under a new file name.","ok":false,"why":"Renaming does not change data, purpose or audience."}]}]},"28":{"lead":"A score out of five looks objective. Whether it is depends entirely on what went into it, and Claude will happily score things nobody should be scored on.","html":"<h2>Ethics goes beyond compliance<\/h2>\n<p>Complying with law, policy and approval rules is necessary. It is not the whole ethical test. A process can follow every stated rule and still hand out benefits unfairly, shut out people who cannot use its format, or make a consequential decision impossible to question. Ethical judgement asks whether the process treats the people it affects with care and respect.<\/p>\n<p>Claude produces text, summaries, classifications and suggested structures from what it is given. It does not hold responsibility for a decision and does not live with the consequences. The people who design, approve and use an AI-assisted process stay accountable for its criteria, its inputs, its decisions and its effects.<\/p>\n<p class=\"pull\">AI can support judgement. Accountable people make consequential decisions and stand behind them.<\/p>\n<p>Fairness does not mean treating everyone identically. It means relevant criteria, applied consistently, with attention to unequal barriers, in a process that can notice when neutral-looking rules produce unequal effects. Think also about the people who are not in the room: unsuccessful applicants, the customers a team supports, and the staff who have to explain the outcome.<\/p>\n<h2>Worked example: allocating certification funding<\/h2>\n<p>A panel has to allocate a limited certification budget across 46 applications from engineers. The panel has asked Claude to organise the submitted evidence before members review each one.<\/p>\n<figure class=\"doc\"><figcaption>What the panel has<\/figcaption><pre>Approved criteria\n1. Role relevance\n2. Feasibility\n3. Expected team benefit\n4. Budget fit\n\nApplication fields\n- Certification requested and cost\n- Current role and accounts supported\n- Why it is needed\n- Study plan\n- Supporting documents\n\nNot supplied\n- Previous funding history\n- The applicant's reputation\n- Performance ratings\n- Whether anyone helped write the application\n- Reasons for missing detail<\/pre><\/figure>\n<p>Some applications are short, written in a non-standard style or thin on context. Those applicants may have been on call that week, be writing in a second language, or never have filled in a form like this before. The application is the record of what was claimed. It establishes nothing hidden about the applicant's quality or likely success. A polished application may reflect help or practice. A short one may reflect time, language or circumstance, and not a weaker case.<\/p>\n<h2>Proxy criteria create hidden risk<\/h2>\n<p>A proxy is a stand-in measure used to infer something that was not measured directly. Proxies look objective because they are countable or easy to compare. They can end up measuring access to resources, cultural norms or past advantage in place of the approved criterion. Polished writing is not feasibility. Being loud in the team channel is not expected team benefit.<\/p>\n<figure class=\"prompt\"><figcaption><span>The panel's first idea<\/span><\/figcaption><pre>For each application, give a readiness score from 1 to 5.\nUse writing quality, number of attachments, number of\ncertifications already held, how visible the person is in team\nchannels, and how sophisticated the study plan looks.\nRank all applications from strongest to weakest and recommend\nfunding for the top ones.<\/pre><\/figure>\n<p>This brings in criteria the panel never approved and asks Claude to infer qualities the record does not support. The proxies can disadvantage people with less time, less familiarity with formal writing or a quieter communication style. Missing context makes the inference less reliable, and ranking makes it more likely that an early presentation choice shapes who gets the money.<\/p>\n<aside class=\"note\"><b>Automation bias<\/b><p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"automation-bias\">Automation bias<\/span> is the tendency to accept a system's recommendation because it looks systematic, polished or numerical. A score and a ranking create confidence that the inputs may not deserve.<\/p><\/aside>\n<h2>Test the process for fairness<\/h2>\n<p>Evaluate the workflow, not only individual outputs.<\/p>\n<ol class=\"steps\"><li><b>Compare each AI task with the approved criteria<\/b><span>Claude may extract a cost or find a statement about accounts supported. It should not turn missing information, writing style or visibility into a judgement about readiness.<\/span><\/li><li><b>Look at who gains and who carries the burden<\/b><span>A ranking can steer scarce funding to people already able to produce extensive paperwork.<\/span><\/li><li><b>Check accessibility<\/b><span>Forms, outcome notices and correction routes should not assume everyone can work through a complex process or write in one preferred style.<\/span><\/li><\/ol>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"transparency\">Transparency<\/span> matters when AI involvement materially affects what people receive, how they are assessed or how they can respond. How much to disclose depends on what the audience expects, what the rules require and what is at stake. Here applicants should be told that Claude organised the submitted information, that panel members applied the approved criteria, and that no automated ranking decided the awards.<\/p>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"contestability\">Contestability<\/span> means a person has a practical way to identify and challenge an error or a process problem. \"Decisions are final\" does not provide one. A real route says what can be corrected, how to raise a concern, who reviews it, and whether that reviewer can change the record or reconsider the decision.<\/p>\n<h2>Use Claude for bounded evidence organisation<\/h2>\n<p>The narrowest useful change is to take out automated scoring, ranking, recommendation and proxy-based inference. Claude can still save the panel real effort by producing a consistent evidence sheet per application. A blank field or \"Not supplied\" is more accurate than a plausible guess.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revised prompt<\/span><\/figcaption><pre>Using only the application materials provided, create one\nevidence sheet per application. For each approved criterion, list\nthe relevant submitted evidence and name the field it came from.\nDo not score, rank, recommend, or infer the applicant's quality.\nDo not use writing style, attachment count, certifications\nalready held or visibility as criteria. Where relevant\ninformation is absent, write \"Not supplied\". Use neutral\nlanguage.<\/pre><\/figure>\n<p>The panel then applies the approved criteria itself. Meaningful <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"human-gate\">human oversight<\/span> is more than somebody clicking approve. Reviewers need the authority to reject Claude's organisation of the material, access to the original application, enough time to compare the two, and permission to ask for clarification where the process allows it.<\/p>\n<figure class=\"doc\"><figcaption>Revised review workflow<\/figcaption><pre>1. Claude creates a neutral evidence sheet from each application.\n2. A panel member compares each sheet with the original.\n3. The panel discusses and applies the four approved criteria.\n4. The panel records each decision and the criterion-based reason.\n5. Applicants get an outcome notice that explains how AI was used.\n6. Applicants can ask for a factual error to be corrected or\n   raise a concern about the process. Someone who was not on the\n   panel checks the record and documents the response.<\/pre><\/figure>\n<p>The independent check in step 6 supports accountability, because the person looking at a challenge can examine the evidence and the process. They are not just restating the original result.<\/p>\n<h2>Maintain accountability over time<\/h2>\n<p>Ethical controls need upkeep. A sound prompt can be changed, reviewers can drift into trusting tidy outputs, and recurring complaints can reveal a barrier nobody anticipated. Keep the approved criteria, prompt, evidence sheets, decision reasons, notices and correction records available for review. Look at correction requests and outcomes for patterns from time to time, and adjust the instructions, the accessibility support or the review practice when the evidence shows the process is not working as intended.<\/p>\n<p>Accountability cannot be transferred to a prompt, a score or a workflow diagram.<\/p>","takeaways":["Compliance is necessary and not sufficient. Also assess fairness, access and the effect on people.","Proxies such as writing polish or visibility measure advantage, not the approved criterion.","Scores and rankings invite automation bias. Remove them when the inputs do not justify them.","Reviewers need the original material, the authority and the time to reject what Claude organised.","Disclose material AI involvement and give people a practical route to correct errors or challenge the process."],"practice":"Think of a decision your team makes about people or priorities, such as who goes on a course or which request is done first. List the approved criteria. Then list two proxies that could creep in if an AI tool were asked to \"rank\" the options.","deck":"decks/28-ethics-fairness-and-accountability.html","quiz":[{"q":"What is a proxy criterion?","multi":false,"o":[{"t":"A criterion the panel formally approved.","ok":false,"why":"A proxy stands in for an approved criterion. It is not one."},{"t":"A stand-in measure used to infer something that was not measured directly.","ok":true,"why":"For example, treating polished writing as if it measured feasibility."},{"t":"A backup reviewer.","ok":false,"why":"That is not what the term means here."},{"t":"A network device.","ok":false,"why":"Wrong kind of proxy."}]},{"q":"A panel wants Claude to score applications from 1 to 5 using writing quality and number of attachments, then rank them. What is the main problem?","multi":false,"o":[{"t":"Claude cannot produce numbers.","ok":false,"why":"It can. That is exactly the danger."},{"t":"Five points is too few for a scale.","ok":false,"why":"The scale is not the issue."},{"t":"It uses criteria nobody approved, which can disadvantage people with less time or writing experience, and a ranking invites automation bias.","ok":true,"why":"The proxies measure resources and style, and the score makes them look objective."},{"t":"It would take too long.","ok":false,"why":"Speed is not the concern."}]},{"q":"Which statement best describes meaningful contestability?","multi":false,"o":[{"t":"\"All decisions are final.\"","ok":false,"why":"That closes off any challenge."},{"t":"\"Contact us if you have questions.\"","ok":false,"why":"It names no route, reviewer or possible outcome."},{"t":"The process says what can be corrected, how to raise it, who reviews it and whether they can change the outcome.","ok":true,"why":"A practical route is specific about each of those."},{"t":"Applicants can read the prompt that was used.","ok":false,"why":"That may help transparency. It is not a way to challenge an error."}]},{"q":"Which TWO are required for human oversight to be meaningful?","multi":true,"o":[{"t":"Access to the original application, not only Claude's sheet.","ok":true,"why":"The reviewer must be able to compare the summary with the source."},{"t":"A reviewer who signs off quickly so the process is not delayed.","ok":false,"why":"Speed without scrutiny is a rubber stamp."},{"t":"Authority to reject what Claude produced.","ok":true,"why":"Without the power to reject, the review changes nothing."},{"t":"A numerical score to make the decision easier.","ok":false,"why":"A score invites automation bias."}]},{"q":"A process follows every stated policy rule. Is it therefore ethical?","multi":false,"o":[{"t":"Yes. Compliance is the complete test.","ok":false,"why":"Compliance is necessary and not sufficient."},{"t":"Yes, provided AI was involved.","ok":false,"why":"AI involvement does not make a process fair."},{"t":"Only if everyone was treated identically.","ok":false,"why":"Fairness needs relevant criteria and attention to unequal barriers, not identical treatment."},{"t":"Not necessarily. It can still distribute benefits unfairly, exclude people or be impossible to question.","ok":true,"why":"Ethical judgement looks at the effect on people, beyond whether the rules were followed."}]}]},"29":{"lead":"When Claude gives a bad answer, the instinct is to rewrite the whole prompt. Treat it like any other fault: reproduce it, isolate the cause, change one thing, test again.","html":"<h2>Start with the symptom and the standard<\/h2>\n<p>An underperforming prompt is not always a badly written prompt. A result can fail because the task is unclear, context is missing, the sources conflict, a source is weak, or the request is beyond what Claude should decide or do. Changing everything at once hides the real cause and makes any improvement impossible to verify.<\/p>\n<p>Begin by describing the observable <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"symptom\">symptom<\/span>: different answers to the same question, required fields missing, unsupported claims in a summary, the wrong format. Then define <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"acceptance-criteria\">acceptance criteria<\/span>, the conditions a usable result has to meet. For a factual workplace answer that might be the correct value, a named authoritative source, an explanation of uncertainty where sources disagree, and no invented policy.<\/p>\n<p class=\"pull\">Diagnose against a defined standard before you change the prompt, the sources or the tool.<\/p>\n<p>This also stops a wrong default assumption. A poor result does not show that the product has a fault. Most problems can be investigated first through the task, the prompt, the material available and the workflow. Technical escalation is appropriate only after controlled testing shows that configuration and sources do not explain it.<\/p>\n<h2>Worked example: three answers to one question<\/h2>\n<p>Your team's Project answers internal questions about backups. It holds one current standard, one obsolete procedure and one informal note that disagrees with both. No instruction says which source wins. Asked the same question in separate chats, it gives different answers.<\/p>\n<figure class=\"doc\"><figcaption>What is in the Project<\/figcaption><pre>Backup Operations Standard, effective 1 April 2026\nSection 4.2: daily backups of production servers must be retained\nfor 35 days. This standard replaces earlier retention procedures.\n\nBackup Procedure, revised 15 June 2024\nSection 3.1: daily backups of production servers are retained\nfor 30 days.\n\nBackup team note, 8 April 2026\nWe have been keeping dailies for 42 days on the new storage\nlately.\n\nOriginal prompt\nHow long are daily backups of production servers retained?<\/pre><\/figure>\n<p>One chat says 35 days. Another says 30, or describes 42 as the retention period. The outputs conflict, but the conflict was already in the material. The prompt does not say which document governs, whether dates matter, or that an informal practice is different from a required standard.<\/p>\n<h2>Classify the plausible cause<\/h2>\n<p>Classifying a failure limits unnecessary changes. More than one category can apply. Test the smallest plausible explanation first.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Category<\/th><th>What to inspect<\/th><th>Typical correction<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Category\">Unclear task<\/td><td data-l=\"What to inspect\">Missing outcome, audience, scope or acceptance criteria<\/td><td data-l=\"Typical correction\">State the deliverable and the decision boundary<\/td><\/tr><tr><td data-l=\"Category\">Missing or conflicting context<\/td><td data-l=\"What to inspect\">Absent facts, inconsistent documents, competing instructions<\/td><td data-l=\"Typical correction\">Supply the facts and define source priority<\/td><\/tr><tr><td data-l=\"Category\">Unsuitable format<\/td><td data-l=\"What to inspect\">Prose where a table, checklist or extraction was needed<\/td><td data-l=\"Typical correction\">Specify the output structure<\/td><\/tr><tr><td data-l=\"Category\">Poor source quality<\/td><td data-l=\"What to inspect\">Outdated, informal, incomplete or unapproved material<\/td><td data-l=\"Typical correction\">Replace, remove or clearly label the source<\/td><\/tr><tr><td data-l=\"Category\">Context overload<\/td><td data-l=\"What to inspect\">Too much unrelated or duplicated material<\/td><td data-l=\"Typical correction\">Cut the input back to relevant authoritative evidence<\/td><\/tr><tr><td data-l=\"Category\">Wrong feature or model<\/td><td data-l=\"What to inspect\">The task needs a different workflow, capability or depth<\/td><td data-l=\"Typical correction\">Pick a better-suited feature or model<\/td><\/tr><tr><td data-l=\"Category\">Policy restriction or unsupported capability<\/td><td data-l=\"What to inspect\">A prohibited action, outside access or final authority is being asked for<\/td><td data-l=\"Typical correction\">Redesign the task and add human review or expertise<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A prompt can have a defect even when Claude is accurately reflecting contradictory sources. And excellent instructions cannot make an obsolete source authoritative. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"context-overload\">context overload<\/span> for the fifth row.<\/p>\n<p>A policy restriction limits what the organisation lets Claude receive, produce or decide. An unsupported capability is something Claude cannot reliably do from the material and access it has, such as verifying an event nobody told it about or giving an approval that needs an authorised person. More forceful wording fixes neither.<\/p>\n<h2>Reproduce before you repair<\/h2>\n<p>Use a small representative input. The single controlled question is ideal here because it removes everything unrelated. Record the original prompt, the sources available, the output and the acceptance criteria. Run the same test in separate <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"fresh-chat\">fresh chats<\/span> with the Project configuration unchanged.<\/p>\n<ol class=\"steps\"><li><b>Confirm the authoritative answer<\/b><span>35 days, in the current standard.<\/span><\/li><li><b>Run the original prompt<\/b><span>Record the answer and the reasoning it cites.<\/span><\/li><li><b>Test with the current standard alone<\/b><span>If it returns 35 days, the question itself is understandable.<\/span><\/li><li><b>Put the old procedure and the note back<\/b><span>If the conflict returns, look at currency, authority and missing instructions.<\/span><\/li><li><b>Apply the smallest correction<\/b><span>Then rerun the identical prompt.<\/span><\/li><\/ol>\n<p>That order separates prompt clarity from source conflict. Compare a case that worked with one that did not and look at what differed: sources, wording, attachments, format, earlier conversation, instructions. Do not assume a cause because something changed at the same time. Test it directly.<\/p>\n<h2>Apply a narrow correction and retest<\/h2>\n<p>The controlled tests point to two causes: an obsolete source is still available, and the Project has no authority rule. The 42-day note is not false as a report of what the team is doing. It cannot establish the official requirement. So the narrow fix is to remove the obsolete procedure, keep the note only if it is useful context, and add a short instruction that separates approved standards from informal notes.<\/p>\n<figure class=\"prompt\"><figcaption><span>Added Project instruction<\/span><\/figcaption><pre>For backup retention questions, treat the current Backup\nOperations Standard as authoritative. When sources conflict,\nprefer the most recent approved standard in effect. Treat team\nnotes as non-authoritative context. State the retention period,\nname the governing source, and do not infer exceptions that are\nnot supplied.<\/pre><\/figure>\n<p>Then use the <strong>same<\/strong> test question, not an easier one, and the same rubric: states 35 days, names the current standard, separates the informal practice if it mentions it, invents no exceptions. That is what makes the before and after comparison mean something.<\/p>\n<figure class=\"out good\"><figcaption>After the correction<\/figcaption><pre>Daily backups of production servers must be retained for 35 days,\nunder Section 4.2 of the Backup Operations Standard, effective\n1 April 2026. The team note describes dailies currently being\nkept for 42 days. That is not the approved retention requirement.<\/pre><\/figure>\n<aside class=\"note\"><b>Diagnosis result<\/b><p>The task was not rewritten. A superseded source was removed and an explicit authority rule was added.<\/p><\/aside>\n<h2>Know when another response is needed<\/h2>\n<dl class=\"defs\"><div><dt>Restart<\/dt><dd>When the conversation has collected irrelevant instructions or material that interfere with a focused test.<\/dd><\/div><div><dt>Replace a source<\/dt><dd>When it is obsolete, incomplete or not approved for the decision.<\/dd><\/div><div><dt>Update Project instructions<\/dt><dd>When a stable rule such as source priority or output format should govern repeated work.<\/dd><\/div><div><dt>Choose another feature or model<\/dt><dd>When the task needs something different, such as structured extraction in place of open drafting. A different option will not repair weak evidence.<\/dd><\/div><div><dt>Ask a human expert<\/dt><dd>When the materials do not establish the answer, policy interpretation needs an authorised owner, or an error would be costly.<\/dd><\/div><div><dt>Escalate a technical problem<\/dt><dd>After a controlled test documents the prompt, sources, configuration, expected result, actual result and repeated behaviour.<\/dd><\/div><\/dl>\n<p>That record gives support staff evidence to work with, and stops ordinary prompt or knowledge defects being logged as product failures.<\/p>","takeaways":["State the observable symptom and the acceptance criteria before revising anything.","Classify the cause: task, context, format, source quality, overload, fit, or a restriction.","Reproduce with the smallest representative test and keep its inputs.","Make one narrow change and rerun the same test against the same rubric.","A poor answer is not evidence of an outage. Escalate only with a documented, repeatable test."],"practice":"Take a recent AI answer that disappointed you. Write the symptom in one sentence and three acceptance criteria. Then pick the most likely category from the table and the one change you would test first.","deck":"decks/29-diagnosing-poor-outputs.html","quiz":[{"q":"A Project gives three different answers to the same factual question in separate chats. What should you do first?","multi":false,"o":[{"t":"Rewrite the whole prompt with more emphasis.","ok":false,"why":"Changing everything at once hides the cause."},{"t":"Report a product outage.","ok":false,"why":"A poor result is not evidence of a technical fault."},{"t":"Describe the symptom, define what a correct answer must contain, and reproduce it with a controlled test.","ok":true,"why":"Diagnosis starts from an observable symptom and a defined standard."},{"t":"Switch to a larger model.","ok":false,"why":"A different model does not repair conflicting sources."}]},{"q":"The question returns the right answer when only the current standard is available, and conflicting answers when an obsolete procedure and a team note are added back. What does that show?","multi":false,"o":[{"t":"The question is badly worded.","ok":false,"why":"It worked with the current standard alone, so the question is understandable."},{"t":"The cause is the source set and the lack of an authority rule.","ok":true,"why":"The conflict returns with the conflicting sources, which isolates the cause."},{"t":"Claude is malfunctioning.","ok":false,"why":"It is reflecting a conflict that exists in the material."},{"t":"The team note should become the standard.","ok":false,"why":"An informal note cannot establish the official requirement."}]},{"q":"After making a correction, how should you retest?","multi":false,"o":[{"t":"With an easier question, to confirm it works.","ok":false,"why":"An easier question does not show the original defect is fixed."},{"t":"With several other changes at the same time.","ok":false,"why":"Then you cannot tell which change helped."},{"t":"By reading the instruction again.","ok":false,"why":"Reading is not testing."},{"t":"With the identical question and the same rubric.","ok":true,"why":"That is what makes the before and after comparison meaningful."}]},{"q":"A request asks Claude to give a final approval that policy reserves for an authorised person. Which diagnosis fits?","multi":false,"o":[{"t":"Unsuitable format.","ok":false,"why":"Changing the layout does not change who may approve."},{"t":"Context overload.","ok":false,"why":"The amount of input is not the issue."},{"t":"Policy restriction or unsupported capability. Redesign the task and add human review.","ok":true,"why":"More forceful wording cannot fix a request Claude should not fulfil."},{"t":"Unclear task. Add more emphasis.","ok":false,"why":"The task is clear. It is one Claude should not perform."}]},{"q":"Which TWO belong in the record when you escalate a suspected technical problem?","multi":true,"o":[{"t":"The prompt, sources and configuration used.","ok":true,"why":"Support needs the exact inputs to reproduce it."},{"t":"How frustrated you are.","ok":false,"why":"Not evidence."},{"t":"The expected result, the actual result and whether it repeats.","ok":true,"why":"That shows what failed and that it is reproducible."},{"t":"A guess at which data centre is at fault.","ok":false,"why":"Speculation is not part of a controlled test record."}]}]},"30":{"lead":"\"The summary is not useful\" tells you something is wrong. It does not tell you what to change, or how you would know you had fixed it.","html":"<h2>Feedback is evidence, not a revision request<\/h2>\n<p>Collect evidence before changing a prompt, instruction, source, format, model or review rule. The record should show:<\/p>\n<ul><li>the input given to Claude,<\/li><li>the output received,<\/li><li>the behaviour expected,<\/li><li>the actual defect,<\/li><li>the impact on the user,<\/li><li>how often it happens.<\/li><\/ul>\n<p>Not all feedback carries the same weight.<\/p>\n<dl class=\"defs\"><div><dt>Factual defect<\/dt><dd>A statement that conflicts with the source material supplied.<\/dd><\/div><div><dt>Policy defect<\/dt><dd>A breach of an explicit handling, approval or formatting rule.<\/dd><\/div><div><dt>Stylistic preference<\/dt><dd>Tone, length, order or presentation.<\/dd><\/div><div><dt>Isolated edge case<\/dt><dd>Happens under unusual but legitimate input.<\/dd><\/div><\/dl>\n<p>All four can justify an improvement. They should not get the same priority or the same acceptance test.<\/p>\n<p class=\"pull\">Improve a workflow against repeatable criteria, not against one person's reaction.<\/p>\n<h2>Worked example: one meeting, two audiences<\/h2>\n<p>You prepare summaries from a recurring migration meeting. Service managers want a short update on decisions, named owners, dates and risks. The engineering team needs the same action information plus brief context for anything that affects current work. Claude must not infer anything that is not in the notes.<\/p>\n<p>Feedback on three recent summaries: managers say long background paragraphs bury what needs their attention. Engineers say a decision to defer a firewall review was left out, an action had no owner, and a stated due date was missing. Those are different problems. Too much detail is a presentation issue. Leaving out explicit decisions, owners, dates and risks is a completeness defect.<\/p>\n<figure class=\"doc\"><figcaption>Source notes<\/figcaption><pre>File server migration meeting notes, 14 May\n\n- The migration is 70% complete. Copy testing found orphaned\n  permission entries on the legacy shares. The team talked\n  through earlier clean-up work and why several share mappings\n  were originally chosen.\n- Decision: defer the firewall rule review until 28 May.\n- Action: prepare remediation options for the orphaned\n  permissions. Owner: storage lead. Due: 21 May.\n- Risk: if the remediation options are not approved by 21 May,\n  migration testing may run past the planned completion date.\n- The new monitoring dashboard was demonstrated. No decision or\n  action was recorded.<\/pre><\/figure>\n<p>The notes support only what they say. They name no person, do not say who approves the remediation options, and give no revised completion date. A reliable summary keeps those limits and does not turn likely assumptions into commitments.<\/p>\n<h2>Turn comments into acceptance criteria<\/h2>\n<p>Vague feedback becomes testable once it describes an observable result. \"Make it shorter\" will not do, because two readers can disagree about whether it is. These are the <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"acceptance-criteria\">acceptance criteria<\/span> for this workflow:<\/p>\n<dl class=\"defs\"><div><dt>Manager criterion<\/dt><dd>No more than two context bullets, and every explicit decision, action, due date and risk is included.<\/dd><\/div><div><dt>Engineering criterion<\/dt><dd>Labelled Decisions, Actions, Risks and Context sections. Every explicit decision, owner, date and risk appears in the right one.<\/dd><\/div><div><dt>Grounding criterion<\/dt><dd>Where an owner, date or decision is not in the notes, the summary says it was not recorded or leaves the field out. It never invents one.<\/dd><\/div><\/dl>\n<p>The criteria separate defects from preferences. A missing decision fails completeness. Too much background fails length and structure. Whether the heading should be \"Key updates\" in place of \"Context\" can be looked at later. It is not needed to fix what was reported.<\/p>\n<h2>Use a small regression set<\/h2>\n<p>A <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"regression\">regression case<\/span> is a saved input with its expected behaviour, used to detect whether a later change breaks something that used to work. A small set is more practical than every past meeting, provided it covers ordinary input and meaningful variations. Always include the case that failed. You cannot call a change a success if the original failure is no longer tested.<\/p>\n<figure class=\"doc\"><figcaption>Regression set<\/figcaption><pre>Case 1: normal\nNotes hold one decision, one action with owner and date, one\nrisk and brief context.\nExpected: all fields present. Manager context within two bullets.\n\nCase 2: edge\nNotes hold three decisions and two risks, and no actions.\nExpected: all decisions and risks present. Actions says\n\"None recorded\".\n\nCase 3: incomplete\nNotes hold an action with no owner or due date.\nExpected: the action appears. Owner and date are marked\n\"Not recorded\".\n\nCase 4: previously failed\nThe 14 May notes.\nExpected: the deferred firewall review, storage lead, 21 May and\nthe testing risk all appear. The history is cut to brief context.<\/pre><\/figure>\n<p>The expected result tests behaviour and does not demand an exact sentence. Claude can word things differently and still keep the required facts and structure. Use the same <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"rubric\">rubric<\/span> before and after, or the comparison can hide a trade-off.<\/p>\n<h2>Change one identifiable component<\/h2>\n<figure class=\"prompt\"><figcaption><span>Original prompt<\/span><\/figcaption><pre>Summarise these meeting notes clearly and thoroughly for the\nservice managers and the engineering team.<\/pre><\/figure>\n<p>It asks for \"clearly and thoroughly\" and does not distinguish the audiences, require decisions and actions to be extracted, or forbid filling gaps. The narrowest useful change is the prompt itself. The notes, the source authority, the workflow and the reviewer stay the same, so any difference in results can reasonably be put down to the new instruction.<\/p>\n<figure class=\"prompt\"><figcaption><span>Revised prompt<\/span><\/figcaption><pre>Using only the meeting notes, create two summaries.\n\nService manager summary:\n- Use the headings Decisions, Actions, Risks, Context.\n- Include every explicit decision, action, owner, due date\n  and risk.\n- Limit Context to two bullets at most.\n\nEngineering summary:\n- Use the same headings.\n- Include brief context that affects current work.\n- If a heading has no recorded items, write \"None recorded\".\n\nDo not infer names, dates, decisions, causes or commitments. For\nan action with no owner or due date, write \"Not recorded\" in\nthat field.<\/pre><\/figure>\n<p>Replacing the prompt, switching model, adding source documents and changing the review step all at once makes the result impossible to diagnose. A model change may be right when a controlled prompt revision cannot meet the requirement. Test it as a separate change with the same regression set.<\/p>\n<h2>Compare results with the same rubric<\/h2>\n<p>Before the revision, the 14 May output spent several sentences on share mappings and earlier clean-up. It mentioned migration testing and left out the deferred firewall review, the storage lead, the 21 May date and the conditional risk. It failed both audiences' criteria.<\/p>\n<figure class=\"out good\"><figcaption>After the revision: service manager summary<\/figcaption><pre>Service manager summary\n\nDecisions\n- Defer the firewall rule review until 28 May.\n\nActions\n- Prepare remediation options for the orphaned permissions.\n  Owner: storage lead. Due: 21 May.\n\nRisks\n- If the remediation options are not approved by 21 May,\n  migration testing may run past the planned completion date.\n\nContext\n- The migration is 70% complete. Copy testing found orphaned\n  permission entries on the legacy shares.<\/pre><\/figure>\n<p>It passes the previously failed case. Then run the same rubric over the normal, edge and incomplete cases. The incomplete case matters most: it has to still mark missing fields as not recorded. That is the proof that a stronger extraction instruction has not made Claude start filling gaps.<\/p>\n<h2>Record the limits<\/h2>\n<p>A passing test set supports a limited conclusion: the revised prompt did acceptably on the saved cases. It does not prove every future summary will be complete. New meeting formats, ambiguous notes and conflicting statements can produce failures the set does not cover.<\/p>\n<ul><li>Record the source of the feedback, the audience affected, the defect category and the frequency.<\/li><li>Save the old prompt, the revised prompt, the regression cases, the rubric and the results.<\/li><li>Record unresolved limitations, such as summaries depending on incomplete notes.<\/li><li>Roll back if the change creates a more serious omission, unsupported claim or policy issue.<\/li><li>Escalate ambiguous source material or high-consequence decisions to the responsible reviewer.<\/li><\/ul>\n<aside class=\"note\"><b>Risk boundary<\/b><p>A tighter format improves readability. It cannot fix missing or unclear notes. Human review is still needed when decisions, owners, dates or risks are unclear.<\/p><\/aside>","takeaways":["Capture the input, output, expected behaviour, defect, impact and frequency before changing anything.","Separate factual and policy defects from stylistic preferences and edge cases.","Turn vague comments into observable acceptance criteria.","Test normal, edge, incomplete and previously failed cases with the same rubric before and after.","Change one component at a time, record the limits, and roll back if it makes things worse."],"practice":"Take one piece of vague feedback you have had on a report or summary, such as \"too long\" or \"not clear\". Rewrite it as two acceptance criteria somebody else could check, and describe the four regression cases you would save.","deck":"decks/30-feedback-and-controlled-testing.html","quiz":[{"q":"An engineer says a summary left out a decision that was explicitly written in the meeting notes. What kind of feedback is that?","multi":false,"o":[{"t":"A stylistic preference.","ok":false,"why":"It is about missing content, not tone or layout."},{"t":"A completeness defect.","ok":true,"why":"An explicit item in the source is absent from the output."},{"t":"An isolated edge case.","ok":false,"why":"The input was ordinary."},{"t":"Proof the model must be changed.","ok":false,"why":"The cause has not been diagnosed yet."}]},{"q":"Which is a usable acceptance criterion?","multi":false,"o":[{"t":"\"Make it shorter.\"","ok":false,"why":"Two readers can disagree on whether it is short enough."},{"t":"\"Make it more useful.\"","ok":false,"why":"Nothing here can be observed or checked."},{"t":"\"No more than two context bullets, and every explicit decision, action, due date and risk is included.\"","ok":true,"why":"It describes a result somebody can check."},{"t":"\"Sound more senior.\"","ok":false,"why":"That is an impression."}]},{"q":"Why must the previously failed case stay in the regression set?","multi":false,"o":[{"t":"To make the set look bigger.","ok":false,"why":"Size is not the point."},{"t":"Because you cannot call the change a success if the original failure is no longer tested.","ok":true,"why":"The saved case is how you show the reported defect is fixed, and stays fixed."},{"t":"Because it is the easiest case to pass.","ok":false,"why":"It is the one that failed."},{"t":"To prove every future summary will be right.","ok":false,"why":"A passing set only supports a conclusion about the saved cases."}]},{"q":"After tightening the extraction instruction, which case shows Claude has not started inventing missing details?","multi":false,"o":[{"t":"The normal case.","ok":false,"why":"It has nothing missing to invent."},{"t":"The edge case with three decisions.","ok":false,"why":"It tests volume and an empty heading, not missing fields."},{"t":"The previously failed case.","ok":false,"why":"It tests that the omitted items now appear."},{"t":"The incomplete case, where owner and due date must still be marked \"Not recorded\".","ok":true,"why":"If those fields come back filled in, the stronger instruction introduced a new failure."}]},{"q":"Which TWO are good practice when improving a prompt from feedback?","multi":true,"o":[{"t":"Change the prompt, the model and the sources together to save time.","ok":false,"why":"You could not tell which change made the difference."},{"t":"Change one identifiable component and keep everything else the same.","ok":true,"why":"Then any difference in results can be attributed to that change."},{"t":"Use the same rubric before and after.","ok":true,"why":"Otherwise the comparison can hide a trade-off."},{"t":"Delete the old prompt once the new one passes.","ok":false,"why":"Keep it. You may need to roll back."}]}]},"31":{"lead":"A faster workflow that produces something nobody can use is not optimised. Get it right first. Then take out the work that never needed doing.","html":"<h2>Optimise for useful results first<\/h2>\n<dl class=\"defs\"><div><dt>Effectiveness<\/dt><dd>The workflow reliably produces an output that serves its purpose, is supported by evidence and gets the review it needs. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"effectiveness\">effectiveness<\/span>.<\/dd><\/div><div><dt>Efficiency<\/dt><dd>Getting that result with less unnecessary time, cost, duplication and human effort. See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"efficiency\">efficiency<\/span>.<\/dd><\/div><\/dl>\n<p>A faster workflow is not optimised if its output cannot be used, introduces unsupported claims or skips a control.<\/p>\n<p>Look at the workflow end to end: collecting inputs, preparing context, using Claude, checking the result, handing it to the next person, and handling exceptions. A short interaction with Claude can still be a poor process if a colleague has to keep cleaning up the output or rebuilding evidence that was left out.<\/p>\n<p class=\"pull\">Remove avoidable work. Keep the evidence, the review and the accountability.<\/p>\n<p>Measure both operations and quality:<\/p>\n<div class=\"tw\"><table><thead><tr><th>Measure<\/th><th>What it tells you<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Measure\">Turnaround time<\/td><td data-l=\"What it tells you\">How long it takes from start to finish<\/td><\/tr><tr><td data-l=\"Measure\">Total user effort<\/td><td data-l=\"What it tells you\">How much human time goes in<\/td><\/tr><tr><td data-l=\"Measure\">Correction rate<\/td><td data-l=\"What it tells you\">The share of outputs needing substantive repair<\/td><\/tr><tr><td data-l=\"Measure\">Review burden<\/td><td data-l=\"What it tells you\">Time reviewers spend checking routine work, as opposed to real exceptions<\/td><\/tr><tr><td data-l=\"Measure\">Cost<\/td><td data-l=\"What it tells you\">What the usage costs<\/td><\/tr><tr><td data-l=\"Measure\">Failure rate<\/td><td data-l=\"What it tells you\">How often it produces something unusable<\/td><\/tr><tr><td data-l=\"Measure\">User satisfaction<\/td><td data-l=\"What it tells you\">Whether the people receiving it find it useful<\/td><\/tr><\/tbody><\/table><\/div>\n<p>See <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"correction-rate\">correction rate<\/span> and <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"review-burden\">review burden<\/span>.<\/p>\n<h2>Worked example: the weekly patch compliance report<\/h2>\n<p>Every week you produce a patch compliance report from updates sent in by six customer account teams. The report has a summary per account, a table of agreed measures, stated risks and an appendix of source references. The stable materials are the approved report structure, the measure definitions, the writing standard and the escalation rule. Three things must go to a human reviewer before publication: a reported security incident, missing evidence for a required measure, and a conflict between source updates.<\/p>\n<p>The baseline process looks like this:<\/p>\n<ul><li>A separate chat for each account.<\/li><li>The same stable references uploaded every time.<\/li><li>Updates pasted in whatever format each team used.<\/li><li>Results copied into a spreadsheet and manually reshaped into the report structure.<\/li><li>The most capable model used for everything, including routine formatting.<\/li><li>No defined exception route. If Claude notices a security issue, you have to spot it while assembling the report.<\/li><\/ul>\n<p>That is repeated context, duplicated transformation, inconsistent input, more capability than the task needs, reformatting downstream, and an unreliable control on the highest-consequence items.<\/p>\n<h2>Find waste without removing controls<\/h2>\n<p>Map each handoff and ask three questions. What is stable? What changes each cycle? What has to stay visible for review?<\/p>\n<dl class=\"defs\"><div><dt>Stable<\/dt><dd>The report structure, approved terminology, measure definitions and escalation criteria.<\/dd><\/div><div><dt>Changes each cycle<\/dt><dd>This week's account updates and the supporting records they cite.<\/dd><\/div><\/dl>\n<p>Keeping the two apart ends the repeated uploads and still preserves the evidence for each cycle. The stable material goes into a <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"project\">project<\/span> as curated knowledge: selected, maintained references people can inspect and update. It is not an unfiltered archive of every past report.<\/p>\n<p>A standard <span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"input-template\">input template<\/span> reduces variation before Claude sees anything. It makes omissions visible, supports batching and gives extraction a predictable structure.<\/p>\n<figure class=\"doc\"><figcaption>Standard account input template<\/figcaption><pre>Account:\nReporting week:\nMeasure results: [measure name, value, source reference]\nCompleted work: [source-supported statements]\nRisks or issues: [description and source reference]\nSecurity incident reported: Yes / No\nMissing or conflicting information: [describe, or None]<\/pre><\/figure>\n<p>A template does not make a claim true because it sits in a required field. The account team still has to supply current source information, and a reviewer still handles the designated exceptions.<\/p>\n<p><span class=\"g\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\" data-g=\"batching\">Batching<\/span> means processing several similar, low-risk inputs together under the same rules. It suits routine account summaries with complete templates and no security incident, missing evidence or conflict. It is not a reason to mix exceptions in with ordinary work. Exceptions need focused human attention and a clear decision record.<\/p>\n<h2>Task tiers and better handoffs<\/h2>\n<p>Assign work to tiers by consequence, ambiguity and the reasoning needed. Do not assign by a preference for one model.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Tier<\/th><th>Work<\/th><th>Control<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Tier\">Low risk<\/td><td data-l=\"Work\">Extract submitted measures and format complete routine updates<\/td><td data-l=\"Control\">Completeness check<\/td><\/tr><tr><td data-l=\"Tier\">Standard<\/td><td data-l=\"Work\">Write the consolidated narrative from validated account summaries<\/td><td data-l=\"Control\">Normal review<\/td><\/tr><tr><td data-l=\"Tier\">High consequence<\/td><td data-l=\"Work\">Ambiguous conflicts, security-related content, material decisions<\/td><td data-l=\"Control\">Human review, whatever model is used<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Keep the higher-cost capability for work that needs its extra reasoning or synthesis. Routine formatting, field validation and repetitive extraction generally do not. That cuts cost without treating a cheaper model as a substitute for controls. The review requirement follows the consequence of the case, not the price of the model.<\/p>\n<p>Optimise the downstream handoff too. If the next person needs a spreadsheet-ready measure table and a report-ready narrative, ask for exactly those. Fixed headings and source-reference fields remove the copy, reformat and reconcile work. The output format is an interface between people and steps.<\/p>\n<h2>The redesigned workflow<\/h2>\n<p>One Project holds the approved report structure, measure definitions, writing standard and escalation rule. Each account sends the standard template with its current evidence.<\/p>\n<figure class=\"prompt\"><figcaption><span>Project instructions<\/span><\/figcaption><pre>Use only the supplied account inputs and approved Project\nknowledge.\nFor each account, produce the required report fields and keep\nevery source reference.\nDo not infer a missing measure, cause, owner, action or date.\nFlag for human review when a security incident is reported,\nrequired evidence is missing, or sources conflict.\nFor routine accounts, return a spreadsheet-ready measure table\nand a report-ready narrative under the approved headings.<\/pre><\/figure>\n<ol class=\"steps\"><li><b>Batch the routine accounts<\/b><span>Complete templates only, for extraction and formatting.<\/span><\/li><li><b>Check completeness<\/b><span>All accounts and all required fields are present.<\/span><\/li><li><b>Consolidate<\/b><span>Use the standard tier to write the narrative from the validated summaries.<\/span><\/li><li><b>Route the flags<\/b><span>Any flagged account leaves the batch and goes to the designated reviewer with its evidence. It is added back only after that review.<\/span><\/li><li><b>Approve release<\/b><span>You confirm completeness and that flags were resolved through the proper route.<\/span><\/li><\/ol>\n<div class=\"tw\"><table><thead><tr><th>Measure<\/th><th>Baseline<\/th><th>Improved<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Measure\">Quality<\/td><td data-l=\"Baseline\">Mixed inputs and manual copying cause omissions and inconsistent wording<\/td><td data-l=\"Improved\">Templates, fixed headings and source references support consistent checking<\/td><\/tr><tr><td data-l=\"Measure\">Elapsed time<\/td><td data-l=\"Baseline\">Repeated uploads, separate transformations and reformatting<\/td><td data-l=\"Improved\">Stable context, batching and ready-to-use output cut routine steps<\/td><\/tr><tr><td data-l=\"Measure\">User effort<\/td><td data-l=\"Baseline\">You rebuild context and restructure every result<\/td><td data-l=\"Improved\">You focus on validation, exceptions and release<\/td><\/tr><tr><td data-l=\"Measure\">Review risk<\/td><td data-l=\"Baseline\">Security and evidence issues can be buried in manual consolidation<\/td><td data-l=\"Improved\">Defined flags pull exceptions out for human review before publication<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"note\"><b>Optimisation result<\/b><p>Repeated preparation and rework are gone. Current evidence, traceable sources and human control over exceptions are all still there.<\/p><\/aside>\n<h2>Keep it working<\/h2>\n<p>Do not assume the workflow stays effective. Templates drift, measure definitions change, and people start sending incomplete material. Sample the routine outputs, inspect how exceptions were handled, and compare current measures with the baseline. If satisfaction drops or corrections rise, find the failing handoff before changing models or adding more instructions.<\/p>\n<ul><li>Keep Project knowledge to approved, stable, current references.<\/li><li>Update the input template when an approved report requirement changes.<\/li><li>Test routine and exception inputs separately after changing instructions or templates.<\/li><li>Check that reviewers receive the source evidence they need.<\/li><li>Measure whether the saved effort shows up downstream, not only during Claude use.<\/li><\/ul>","takeaways":["Effectiveness comes first. Faster is not better if the result is unsafe, unsupported or unusable.","Separate stable context from what changes each cycle. Reuse the first, supply the second.","A standard input template makes gaps visible and makes batching possible.","Batch routine work. Route security, evidence and conflict exceptions to a human.","Review follows the consequence of the case, not the price of the model. Measure the whole workflow."],"practice":"Map a recurring report you produce. Mark each step as stable context, variable input, transformation, review or handoff. Find one step you repeat every cycle that could be done once.","deck":"decks/31-optimising-workflows.html","quiz":[{"q":"A redesigned workflow is twice as fast, and reviewers now spend longer fixing unsupported claims in the output. Is it optimised?","multi":false,"o":[{"t":"Yes. Speed is the measure.","ok":false,"why":"Efficiency only counts once the result is useful."},{"t":"Yes, provided cost also fell.","ok":false,"why":"Cheap and fast does not help if the output cannot be used."},{"t":"No. Effectiveness comes first, and the effort has only moved downstream.","ok":true,"why":"A faster process that produces unusable or unsupported output is not optimised."},{"t":"It cannot be assessed.","ok":false,"why":"Correction rate and review burden assess exactly this."}]},{"q":"Which material belongs in the Project as stable context, not re-supplied every week?","multi":false,"o":[{"t":"This week's account updates.","ok":false,"why":"Those change every cycle."},{"t":"The supporting records for this week's figures.","ok":false,"why":"Current evidence is supplied each cycle."},{"t":"The approved report structure and measure definitions.","ok":true,"why":"They stay the same between cycles, so they are curated once and maintained."},{"t":"Every past report ever produced.","ok":false,"why":"An unfiltered archive is not curated knowledge."}]},{"q":"An account's template reports a security incident. What happens to it?","multi":false,"o":[{"t":"It is batched with the others to keep things moving.","ok":false,"why":"Exceptions need focused attention and are not mixed with routine work."},{"t":"It is removed from the batch and sent to the designated human reviewer with its evidence.","ok":true,"why":"A reported security incident is one of the three defined exception conditions."},{"t":"It is left out of the report.","ok":false,"why":"It is reviewed and then included, not dropped."},{"t":"It is sent to the most capable model in place of a reviewer.","ok":false,"why":"Review follows consequence. A stronger model is not a substitute."}]},{"q":"What should decide how much human review a task gets?","multi":false,"o":[{"t":"The price of the model used.","ok":false,"why":"A cheaper or dearer model does not change the consequence."},{"t":"How long the output is.","ok":false,"why":"Length is not risk."},{"t":"Whether the user is senior.","ok":false,"why":"Seniority is not a risk measure."},{"t":"The consequence and ambiguity of the case.","ok":true,"why":"High-consequence work needs human review whatever capability is selected."}]},{"q":"Which TWO does a standard input template give you?","multi":true,"o":[{"t":"It makes omissions visible before Claude receives the material.","ok":true,"why":"An empty required field is obvious."},{"t":"It makes any statement in a required field true.","ok":false,"why":"A template structures claims. It does not verify them."},{"t":"It gives extraction a predictable structure, which supports batching.","ok":true,"why":"Consistent inputs can be processed together under the same rules."},{"t":"It removes the need for a reviewer on exceptions.","ok":false,"why":"Designated exceptions still go to a human."}]}]},"32":{"lead":"You have done the content. This session covers what the exam looks like, how to pace it, how the questions are built, and how to use the five practice exams.","html":"<h2>What you are sitting<\/h2>\n<p>The Claude Certified Associate, Foundations exam (code CCAO-F) is Anthropic's entry-level certification for people who use Claude at work. No coding or API knowledge is needed. It tests whether you can prompt well, judge an output, pick the right tool, design a sensible workflow, configure a Project, work within governance and fix things when results are poor.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td data-l=\"\">Questions<\/td><td data-l=\"Detail\">60<\/td><\/tr><tr><td data-l=\"\">Time<\/td><td data-l=\"Detail\">120 minutes, about two minutes a question<\/td><\/tr><tr><td data-l=\"\">Question types<\/td><td data-l=\"Detail\">Multiple choice (one answer) and multiple response (more than one answer)<\/td><\/tr><tr><td data-l=\"\">Style<\/td><td data-l=\"Detail\">Short workplace scenarios. Pick the best response<\/td><\/tr><tr><td data-l=\"\">Passing score<\/td><td data-l=\"Detail\">720 on a scale of 100 to 1,000<\/td><\/tr><tr><td data-l=\"\">Delivery<\/td><td data-l=\"Detail\">Proctored, closed book<\/td><\/tr><tr><td data-l=\"\">Fee<\/td><td data-l=\"Detail\">US$99<\/td><\/tr><tr><td data-l=\"\">Eligibility<\/td><td data-l=\"Detail\">Staff of organisations in the Claude Partner Network<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"note\"><b>Check before you book<\/b><p>These details were current when this session was written in November 2026. Exam details change. Confirm them in the official exam guide when you register, and go with the guide if anything differs.<\/p><\/aside>\n<p>A scaled score is not a percentage. 720 does not mean 72% of questions correct. Scaling adjusts for the difficulty of the particular set of questions you get, so nobody can tell you the exact number of questions you need. Aim well clear of the line.<\/p>\n<h2>Where the marks are<\/h2>\n<p>The exam has seven domains with published weightings. This is how they map to the sessions, and roughly how many of the 60 questions each one is worth.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Domain<\/th><th>Weight<\/th><th>About<\/th><th>Sessions<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Domain\">Prompting and task execution<\/td><td data-l=\"Weight\">14%<\/td><td data-l=\"About\">8 questions<\/td><td data-l=\"Sessions\">1 to 4<\/td><\/tr><tr><td data-l=\"Domain\">Output evaluation and validation<\/td><td data-l=\"Weight\">21%<\/td><td data-l=\"About\">13 questions<\/td><td data-l=\"Sessions\">5 to 10<\/td><\/tr><tr><td data-l=\"Domain\">Product and model selection<\/td><td data-l=\"Weight\">12%<\/td><td data-l=\"About\">7 questions<\/td><td data-l=\"Sessions\">11 to 14<\/td><\/tr><tr><td data-l=\"Domain\">Workflow integration and solution design<\/td><td data-l=\"Weight\">16%<\/td><td data-l=\"About\">10 questions<\/td><td data-l=\"Sessions\">15 to 19<\/td><\/tr><tr><td data-l=\"Domain\">Configuration and knowledge management<\/td><td data-l=\"Weight\">12%<\/td><td data-l=\"About\">7 questions<\/td><td data-l=\"Sessions\">20 to 24<\/td><\/tr><tr><td data-l=\"Domain\">Governance, risk and responsible use<\/td><td data-l=\"Weight\">15%<\/td><td data-l=\"About\">9 questions<\/td><td data-l=\"Sessions\">25 to 28<\/td><\/tr><tr><td data-l=\"Domain\">Troubleshooting and optimisation<\/td><td data-l=\"Weight\">10%<\/td><td data-l=\"About\">6 questions<\/td><td data-l=\"Sessions\">29 to 31<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Output evaluation is the biggest single block. Add governance and more than a third of the exam is about checking what Claude produced and deciding what is appropriate. Prompt writing, which is what most people think the exam is about, is under a sixth.<\/p>\n<h2>How the questions are built<\/h2>\n<p>Nearly every question is a short scenario followed by \"what is the best response\" or \"what should happen first\". Usually more than one option sounds reasonable. You are choosing the best one, so read all four before you answer.<\/p>\n<p>The right answer tends to share a few habits. You have seen them in every session:<\/p>\n<ul><li><strong>It stays inside the evidence.<\/strong> It uses what was supplied and says \"not stated\" about what was not.<\/li><li><strong>It keeps a person accountable.<\/strong> Claude prepares. An authorised person decides, approves and sends.<\/li><li><strong>It is the narrow fix.<\/strong> Change one thing, rerun the same test, compare with the same criteria.<\/li><li><strong>It names an authority.<\/strong> The current approved source wins over drafts, notes and older versions.<\/li><li><strong>It matches effort to consequence.<\/strong> More review where an error would hurt. Less where it would not.<\/li><li><strong>It checks before it assumes.<\/strong> Classification before sharing. Status and date before using a record.<\/li><\/ul>\n<p>The wrong answers have habits too. Learn to spot them and you can often eliminate two options straight away.<\/p>\n<div class=\"tw\"><table><thead><tr><th>If an option says...<\/th><th>It is usually wrong because...<\/th><\/tr><\/thead><tbody><tr><td data-l=\"If an option says...\">Use the most capable model<\/td><td data-l=\"It is usually wrong because...\">A bigger model does not fix a vague prompt, a bad source or a missing control<\/td><\/tr><tr><td data-l=\"If an option says...\">Remove the review to save time<\/td><td data-l=\"It is usually wrong because...\">Efficiency never comes from removing a necessary control<\/td><\/tr><tr><td data-l=\"If an option says...\">Tell Claude more firmly, or repeat the instruction<\/td><td data-l=\"It is usually wrong because...\">Emphasis is not information<\/td><\/tr><tr><td data-l=\"If an option says...\">Rewrite the whole prompt or start again<\/td><td data-l=\"It is usually wrong because...\">It hides the cause and throws away what works<\/td><\/tr><tr><td data-l=\"If an option says...\">Estimate it, assume it or fill the gap<\/td><td data-l=\"It is usually wrong because...\">Missing information gets reported, not invented<\/td><\/tr><tr><td data-l=\"If an option says...\">The newest file, or the first result, wins<\/td><td data-l=\"It is usually wrong because...\">Authority comes from approval and status, not date or order<\/td><\/tr><tr><td data-l=\"If an option says...\">It is fine because someone senior said so<\/td><td data-l=\"It is usually wrong because...\">Only the authorised exception process changes a control<\/td><\/tr><tr><td data-l=\"If an option says...\">Ask Claude whether its answer is right<\/td><td data-l=\"It is usually wrong because...\">Self-confirmation is not verification<\/td><\/tr><tr><td data-l=\"If an option says...\">Report an outage<\/td><td data-l=\"It is usually wrong because...\">A poor answer is not evidence of a technical fault<\/td><\/tr><tr><td data-l=\"If an option says...\">Add a disclaimer<\/td><td data-l=\"It is usually wrong because...\">A disclaimer controls nothing<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"note\"><b>Watch the absolute words<\/b><p>\"Always\", \"never\", \"guarantees\" and \"all\" are rarely right in this exam. The subject is judgement, and judgement depends on context.<\/p><\/aside>\n<h2>Multiple response questions<\/h2>\n<p>Some questions ask you to select more than one answer, and they tell you how many. Read the instruction line first. Treat each option as its own true or false question against the scenario, then check you have selected the number asked for. Every section quiz in this guide has one \"choose two\" question, and each practice exam has ten. In the practice exams a \"choose two\" question scores only if you pick both correct options. That is the strict reading. Check the official guide for how the real exam scores them.<\/p>\n<h2>Pacing<\/h2>\n<p>Sixty questions in 120 minutes is two minutes each. Most people do not need all of it, and you want time in hand at the end.<\/p>\n<ol class=\"steps\"><li><b>First pass: about 75 minutes<\/b><span>Answer everything you can. If a question takes more than about 90 seconds, pick your best option, flag it and move on.<\/span><\/li><li><b>Second pass: about 30 minutes<\/b><span>Go back through the flagged questions only.<\/span><\/li><li><b>Final check: about 15 minutes<\/b><span>Make sure nothing is unanswered. Check the multiple response questions have the right number selected.<\/span><\/li><\/ol>\n<p>Never leave a question blank. An unanswered question scores the same as a wrong one, so a guess can only help. Be careful about changing answers on the second pass. Change one only if you can say what you misread the first time.<\/p>\n<p>A quick checkpoint: you should be at about question 20 after 25 minutes and about question 40 after 50.<\/p>\n<h2>How the practice exams here work<\/h2>\n<p>There are five practice exams in the menu. Each has 60 questions spread across the seven domains in the same proportions as the real exam: 8, 13, 7, 10, 7, 9 and 6. All 300 questions are different. Fifty of each exam's questions have one correct answer and ten ask you to choose two.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Feature<\/th><th>How it works<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Feature\">Timer<\/td><td data-l=\"How it works\">Optional. \"Start with a 120-minute timer\" gives you the real time limit. The clock pauses if you leave the exam and resumes when you come back<\/td><\/tr><tr><td data-l=\"Feature\">Moving around<\/td><td data-l=\"How it works\">Tap any number in the strip, or use Previous and Next. On a keyboard, A to D or 1 to 4 answers and the arrow keys move<\/td><\/tr><tr><td data-l=\"Feature\">Flag for review<\/td><td data-l=\"How it works\">Marks a question so you can find it again. Flagged and unanswered questions are counted for you before you finish<\/td><\/tr><tr><td data-l=\"Feature\">Answers<\/td><td data-l=\"How it works\">Hidden until you finish, like the real exam<\/td><\/tr><tr><td data-l=\"Feature\">Result<\/td><td data-l=\"How it works\">Your score, a bar for each exam domain, and a list of sessions to revisit with links<\/td><\/tr><tr><td data-l=\"Feature\">Reasons<\/td><td data-l=\"How it works\">Every option on every question has a reason, right or wrong. \"Show only the ones I missed\" filters the list<\/td><\/tr><tr><td data-l=\"Feature\">Saving<\/td><td data-l=\"How it works\">Your progress and result stay in this browser on this device until you start that exam again. Close the page and come back and it is still there<\/td><\/tr><tr><td data-l=\"Feature\">Privacy<\/td><td data-l=\"How it works\">Nothing is sent anywhere. Nobody else can see your answers or your score<\/td><\/tr><tr><td data-l=\"Feature\">Starting again<\/td><td data-l=\"How it works\">\"Start this exam again\" clears the saved result and puts both the questions and the answer options in a new order<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The section quizzes behave differently on purpose. Those reset every time you visit, because they are for quick practice. The practice exams are kept, because you will want to come back and read the reasons.<\/p>\n<p>Because the result is saved in the browser, it does not follow you between devices. If you start an exam on your phone, finish it on your phone. Private or incognito windows will not keep it once they are closed.<\/p>\n<aside class=\"note\"><b>What score to aim for<\/b><p>The target shown on each exam is 45 of 60, which is 75%. That is a study guide and not the pass mark, because the real exam is scaled. If you are consistently at 50 or above across the five, you are in good shape. If one domain's bar is clearly shorter than the rest, that is where your time should go.<\/p><\/aside>\n<h2>Getting the most out of a practice exam<\/h2>\n<ul><li>Sit at least one with the timer on, in one sitting, with nothing else open. It is closed book on the day.<\/li><li>Read the reasons for the questions you got <strong>right<\/strong> as well. A lucky guess is a gap you have not found yet.<\/li><li>For each miss, work out which wrong-answer habit caught you. If it is the same one three times, that is your pattern.<\/li><li>Do not redo an exam the same day. You will be remembering answers, not reasoning. The shuffle helps, and a few days helps more.<\/li><li>Do not burn all five in a weekend. Space them so the result pages can steer your revision in between.<\/li><\/ul>\n<h2>A two-week plan<\/h2>\n<figure class=\"doc\"><figcaption>Suggested run-in<\/figcaption><pre>Two weeks out\n- Sit Practice exam 1 with the timer on. Do not look anything up.\n- Read the result page. Note your two weakest domains.\n- Re-read the sessions listed under \"Sessions to revisit\".\n\nOne week out\n- Sit Practice exams 2 and 3 on different days.\n- For every miss, read all four reasons, not only the right one.\n- Redo the section quizzes for your weakest domain.\n\nLast few days\n- Sit Practice exams 4 and 5.\n- Redo any exam where you scored under 45.\n- Skim the takeaways at the end of each session.\n\nThe day before\n- No new material. Check your booking, ID and equipment.<\/pre><\/figure>\n<h2>On the day<\/h2>\n<ul><li>Have your ID ready and sign in early. Proctored exams have check-in steps that take time.<\/li><li>If you are sitting it remotely, clear your desk and close other applications beforehand. The proctoring rules will tell you what is allowed.<\/li><li>Read the last line of each question first. It tells you what you are looking for in the scenario.<\/li><li>When two options both look right, ask which one keeps the evidence boundary and keeps a person accountable.<\/li><li>If you hit a run of hard questions, flag and keep moving. The questions are not in order of difficulty.<\/li><\/ul>\n<p>You have covered all seven domains and you have 300 practice questions with reasons. The exam is checking whether you use Claude with good judgement, which is the same thing the last 31 sessions have been about.<\/p>","takeaways":["60 questions, 120 minutes, about two minutes each. Pass is 720 on a scaled 100 to 1,000, which is not a percentage.","Output evaluation and governance together are more than a third of the exam.","The best answer stays inside the evidence, keeps a person accountable and makes the narrowest fix.","Never leave a blank. Flag, move on and come back.","The five practice exams save on your device until you restart them, and reshuffle when you do."],"practice":"Book a 120-minute slot this week and sit Practice exam 1 with the timer on. Afterwards, write down your two weakest domains and the wrong-answer habit that caught you most often.","deck":"decks/32-preparing-for-the-exam.html","quiz":[{"q":"The exam has 60 questions and a 120-minute limit. You have spent three minutes on one question and are still unsure. What is the best move?","multi":false,"o":[{"t":"Keep working on it until you are certain.","ok":false,"why":"Time spent here comes off questions you could answer quickly."},{"t":"Leave it blank and move on.","ok":false,"why":"A blank scores the same as a wrong answer, so a guess can only help."},{"t":"Choose your best option, flag it and move on.","ok":true,"why":"You bank a possible mark and can come back if there is time."},{"t":"Pick the longest option.","ok":false,"why":"Length is not a reliable guide."}]},{"q":"The passing score is 720 on a scale of 100 to 1,000. What does that mean?","multi":false,"o":[{"t":"You need exactly 72% of the questions correct.","ok":false,"why":"A scaled score is not a percentage of questions."},{"t":"It is a scaled score, so it does not convert directly to a number of correct answers.","ok":true,"why":"Scaling adjusts for the difficulty of the question set, so aim well clear of the line."},{"t":"You need 720 questions correct.","ok":false,"why":"There are 60 questions."},{"t":"Only the first 72 minutes count.","ok":false,"why":"The score is not about time."}]},{"q":"Two options both look reasonable. Which test is most likely to separate them?","multi":false,"o":[{"t":"Which one uses the most technical language.","ok":false,"why":"Jargon is not correctness."},{"t":"Which one recommends the most capable model.","ok":false,"why":"That is a common wrong-answer habit."},{"t":"Which one is listed first.","ok":false,"why":"Position means nothing."},{"t":"Which one stays inside the evidence and keeps a person accountable.","ok":true,"why":"Those two habits run through the correct answers in every domain."}]},{"q":"Which TWO statements about the practice exams in this guide are correct?","multi":true,"o":[{"t":"Your progress and result are saved on your device until you start that exam again.","ok":true,"why":"They are kept in the browser so you can come back to the reasons."},{"t":"Your score is visible to your manager.","ok":false,"why":"Nothing is sent anywhere. Nobody else can see it."},{"t":"Starting an exam again puts the questions and the answer options in a new order.","ok":true,"why":"Each attempt is reshuffled."},{"t":"They reset every time you open the page, like the section quizzes.","ok":false,"why":"Section quizzes reset. Practice exams are kept."}]},{"q":"You scored 52 of 60 on a practice exam. What is the most useful thing to do next?","multi":false,"o":[{"t":"Sit the same exam again straight away to get 60.","ok":false,"why":"You would be remembering answers, not reasoning."},{"t":"Read the reasons for the eight you missed, check the domain bars, and skim the reasons on the ones you guessed.","ok":true,"why":"The result page shows where to spend time, and lucky guesses are gaps too."},{"t":"Stop revising. You have passed.","ok":false,"why":"A practice score is a guide and the real exam is scaled."},{"t":"Skip the result page and start the next exam.","ok":false,"why":"The result page is where the learning is."}]}]}},"exams":{"1":{"title":"Practice exam 1","min":120,"target":45,"v":"8d35cc10","q":[{"s":1,"q":"A service desk lead asks Claude to \"write something about the patching delay\". The result is generic and the wrong length. Which change to the prompt is most likely to fix it?","a":[0],"o":[{"t":"State the audience, the purpose, the facts to use and the format wanted","why":"Naming who it is for, what it must achieve, what it may draw on and its shape removes the guesswork that produced a generic result."},{"t":"Ask Claude to try harder, be more professional and take the request more seriously","why":
