<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>%%TITLE%% | Claude Foundations</title>
<meta name="theme-color" content="#0A162B">
<link rel="icon" type="image/png" href="data:image/png;base64,%%ICON32%%">
<style>
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,%%F_DISP%%) format("woff2");font-weight:200 800}
@font-face{font-family:"Figtree";src:url(data:font/woff2;base64,%%F_BODY%%) format("woff2");font-weight:300 900}
@font-face{font-family:"JBMono";src:url(data:font/woff2;base64,%%F_MONO%%) format("woff2");font-weight:100 800}
:root{--ink:#0A162B;--ink2:#0E1D38;--ink3:#15284A;--line:#2A4573;--text:#EEF3FB;--mute:#A3B4D2;--dim:#6F84A8;
  --ember:#FF6A3D;--sun:#FFC55A;--volt:#4466FF;--sky:#9FD4FB;--ok:#57D39B;--bad:#FF8177;
  --routeh:linear-gradient(90deg,var(--ember) 0%,var(--sun) 30%,var(--volt) 68%,var(--sky) 100%);
  --disp:"Bricolage","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;--mono:"JBMono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden}
body{font:400 clamp(15px,calc(.72vw + .95vh),27px)/1.45 var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 30% 40%,rgba(10,22,43,.05) 0%,rgba(10,22,43,.55) 60%,rgba(10,22,43,.9) 100%)}
.prog{position:fixed;top:0;left:0;height:4px;width:0;background:var(--routeh);z-index:30;transition:width .7s cubic-bezier(.7,0,.2,1);border-radius:0 4px 4px 0}
.chrome{position:fixed;z-index:30;display:flex;align-items:center;gap:.6em;font-size:max(12px,.62em);color:var(--mute)}
.c-brand{top:1.6em;left:2em;font:600 1em/1 var(--disp);color:var(--text);opacity:.85}
.c-brand img{width:1.9em;height:1.9em}
.c-tools{top:1.3em;right:1.6em}
.c-hint{bottom:1.6em;left:2em;opacity:.7}
.c-nav{bottom:1.2em;right:1.6em;gap:.5em}
.pill{height:2.7em;min-width:2.7em;padding:0 1em;border-radius:999px;border:1px solid var(--line);background:rgba(14,29,56,.75);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-weight:600;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill:hover{border-color:var(--sky);color:var(--text)}
.pill svg{width:1.2em;height:1.2em}
.count{font:500 1em/1 var(--mono);min-width:4.6em;text-align:center;color:var(--text)}
kbd{font:500 .92em/1 var(--mono);border:1px solid var(--line);border-radius:.4em;padding:.25em .5em;color:var(--text)}
:fullscreen .c-tools,:fullscreen .c-hint{opacity:.25;transition:opacity .3s}
:fullscreen .c-tools:hover,:fullscreen .c-hint:hover{opacity:1}

.deck{position:fixed;inset:0;z-index:10;perspective:1700px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5.2em 7vw 5em;opacity:0;pointer-events:none;
  transform:rotateY(13deg) translate3d(7vw,0,-280px);filter:blur(12px);
  transition:opacity .8s cubic-bezier(.65,0,.25,1),transform .8s cubic-bezier(.65,0,.25,1),filter .8s cubic-bezier(.65,0,.25,1)}
.slide.past{transform:rotateY(-13deg) translate3d(-7vw,0,-280px)}
.slide.on{opacity:1;pointer-events:auto;transform:none;filter:none}
.in{width:100%;max-width:1500px;margin:0 auto}
h1,h2{font-family:var(--disp);margin:0;text-wrap:balance}
h1{font-weight:750;font-size:4.5em;line-height:.96;letter-spacing:-.04em}
h2{font-weight:700;font-size:2.35em;line-height:1.04;letter-spacing:-.03em;margin-bottom:.75em;max-width:22em}
.sub{font-size:1.25em;color:var(--mute);margin:1.2em 0 0}
.by{margin-top:3em;display:flex;align-items:center;gap:.8em;color:var(--mute)}
.by b{color:var(--text);font-weight:650}
.t-title .mark{width:7em;height:7em;margin-bottom:1.6em;filter:drop-shadow(0 .6em 2em rgba(68,102,255,.35))}
.t-title .rule{height:5px;width:11em;border-radius:5px;background:var(--routeh);margin-top:1.6em}
.t-big h2{font-size:3.6em;line-height:1;max-width:15em;margin-bottom:.45em}
.t-big p{font-size:1.4em;color:var(--mute);max-width:30em;margin:0}

.fr{opacity:0;transform:translateY(.7em);transition:opacity .45s ease,transform .45s ease}
.fr.show{opacity:1;transform:none}

.grid{display:grid;gap:.9em}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:rgba(14,29,56,.82);border:1px solid var(--line);border-radius:.9em;padding:1.05em 1.2em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h3{font:650 1.28em/1.15 var(--disp);margin:0 0 .35em;letter-spacing:-.01em}
.card p{margin:0;color:#C9D6EC;font-size:.98em}
.c2 .card h3{font-size:1.45em}
.c2 .card p{font-size:1.08em}

ul.rows{list-style:none;margin:0;padding:0;display:grid;gap:.7em;max-width:44em}
ul.rows li{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:1.4em;align-items:baseline;padding:.75em 0;border-bottom:1px solid var(--line)}
ul.rows b{font:650 1.3em/1.2 var(--disp)}
ul.rows span{color:#C9D6EC}

.two{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1.1em;align-items:start}
.two.even{grid-template-columns:1fr 1fr}
.pane{background:rgba(9,18,36,.9);border:1px solid var(--line);border-radius:.9em;overflow:hidden}
.pane .lb{padding:.6em 1em;font-weight:650;font-size:.82em;color:var(--mute);border-bottom:1px solid var(--line)}
.pane pre{margin:0;padding:1em 1.1em;font:450 .8em/1.58 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#DDE7F8;max-height:58vh;overflow:auto}
.pane.bad{border-color:rgba(255,129,119,.6)}.pane.bad .lb{color:var(--bad)}
.pane.good{border-color:rgba(87,211,155,.6)}.pane.good .lb{color:var(--ok)}
.pane.ask{border-color:rgba(68,102,255,.7)}.pane.ask .lb{color:var(--sky)}
.single{max-width:54em}
.single pre{font-size:.86em;max-height:62vh}
.single.small pre{font-size:.72em;line-height:1.5}
mark{background:none;color:inherit;border-bottom:2px solid transparent;transition:background .5s,color .5s,border-color .5s;border-radius:3px;padding:0 2px}
.lit mark{background:rgba(255,129,119,.26);color:#FFDAD6;border-color:var(--bad)}
.reveal{margin-top:1em;padding:.9em 1.2em;border-radius:.9em;background:rgba(255,197,90,.1);border:1px solid rgba(255,197,90,.5);font-size:1.12em;max-width:44em}
.reveal b{color:var(--sun);margin-right:.5em}
.t-ask h2{font-size:2.6em;max-width:18em}
.t-ask .pane{max-width:50em;margin-bottom:.2em}
.t-ask .pane pre{max-height:40vh}

.way{display:flex;align-items:flex-start;position:relative;margin-top:2.2em}
.way::before{content:"";position:absolute;left:1.1em;right:1.1em;top:1.05em;height:5px;border-radius:5px;background:var(--routeh)}
.way li{list-style:none;flex:1;position:relative;padding-top:3.4em;font:650 1.3em/1.15 var(--disp);letter-spacing:-.01em}
.way li::before{content:"";position:absolute;left:0;top:0;width:1.65em;height:1.65em;border-radius:50%;background:var(--ink);border:.28em solid var(--sun);box-sizing:border-box;font-size:1em}
.way li small{display:block;font:500 .5em/1 var(--mono);color:var(--dim);margin-bottom:.6em}
ol.way{padding:0;margin-left:0;margin-bottom:0}

.t-quiz .two{grid-template-columns:auto minmax(0,1fr);gap:3em;align-items:center}
.qr{background:#fff;border-radius:1em;padding:.9em;width:15em;height:15em}
.qr svg{display:block;width:100%;height:100%}
.t-quiz p{font-size:1.3em;color:var(--mute);margin:0 0 1em;max-width:24em}
.t-quiz .url{font:500 .95em/1.4 var(--mono);color:var(--sky);word-break:break-all;-webkit-user-select:text;user-select:text}
.t-quiz a.pill{text-decoration:none;color:var(--text);margin-top:1.4em;font-size:.9em}

.notes{position:fixed;left:50%;bottom:4.6em;transform:translateX(-50%);z-index:40;width:min(46em,92vw);padding:1em 1.3em;border-radius:1em;background:rgba(23,48,90,.96);border:1px solid var(--line);
  font-size:max(14px,.78em);box-shadow:0 1em 3em rgba(0,0,0,.5)}
.notes b{color:var(--sun);display:block;margin-bottom:.25em;font-size:.85em}
.notes[hidden]{display:none}

@media (max-width:900px),(max-aspect-ratio:1/1){
  html,body{overflow:hidden}
  body{font-size:clamp(14px,3.9vw,20px)}
  .slide{justify-content:flex-start;padding:4.6em 6vw 5.6em;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .slide.t-title,.slide.t-big{justify-content:center}
  h1{font-size:2.9em}h2{font-size:1.75em}.t-big h2{font-size:2.3em}.t-ask h2{font-size:1.8em}
  .grid.c2,.grid.c3,.two,.two.even,.t-quiz .two{grid-template-columns:1fr}
  ul.rows li{grid-template-columns:1fr;gap:.2em}
  .pane pre{max-height:none;font-size:.78em}
  .way{flex-direction:column;gap:0;margin-top:1.2em}
  .way::before{left:calc(.6875em - 2.5px);right:auto;top:.8em;bottom:1.4em;width:5px;height:auto;background:linear-gradient(180deg,var(--ember),var(--sun) 30%,var(--volt) 68%,var(--sky))}
  .way li{padding:.1em 0 .95em 2em;font-size:1.25em}
  .way li::before{width:1.1em;height:1.1em;top:.15em;border-width:.2em}
  .way li small{display:inline;margin-right:.6em}
  .c-hint{display:none}
  .c-brand span{display:none}
  .qr{width:11em;height:11em}
  .t-quiz .two{gap:1.4em}
}
@media (prefers-reduced-motion:reduce){.slide,.fr,.prog,mark{transition:none!important}.slide{transform:none!important;filter:none!important}}
@media print{html,body{overflow:visible;height:auto}.deck{position:static}.slide{position:relative;opacity:1;transform:none;filter:none;page-break-after:always;min-height:100vh}.fr{opacity:1;transform:none}#field,.veil,.chrome,.prog{display:none}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="veil"></div>
<div class="prog" id="prog"></div>
<div class="chrome c-brand"><img src="data:image/png;base64,%%LOGO%%" alt=""><span>Claude Foundations</span></div>
<div class="chrome c-tools">
  <button class="pill" id="bNotes" title="Presenter notes (N)">Notes</button>
  <button class="pill" id="bFull" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="fullLbl">Fullscreen</span></button>
</div>
<div class="chrome c-hint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> move <kbd>F</kbd> fullscreen <kbd>N</kbd> notes</div>
<div class="chrome c-nav">
  <button class="pill" id="bPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="count" id="count" aria-live="polite"></span>
  <button class="pill" id="bNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="notes" id="notes" hidden></div>
<main class="deck" id="deck">
%%SLIDES%%
</main>
<script>
(function(){
"use strict";
var slides=[].slice.call(document.querySelectorAll('.slide')),i=0,RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var count=document.getElementById('count'),prog=document.getElementById('prog'),notes=document.getElementById('notes');
function frs(s){return [].slice.call(s.querySelectorAll('.fr'))}
function shown(s){return frs(s).filter(function(f){return f.classList.contains('show')}).length}
function setFr(s,n){frs(s).forEach(function(f,k){f.classList.toggle('show',k<n)});
  var lit=s.querySelector('[data-lit]');if(lit)lit.classList.toggle('lit',n>=1)}
function render(){
  slides.forEach(function(s,k){s.classList.toggle('on',k===i);s.classList.toggle('past',k<i);s.setAttribute('aria-hidden',k!==i)});
  count.textContent=(i+1)+' / '+slides.length;prog.style.width=(100*(i+1)/slides.length)+'%';
  notes.innerHTML='<b>Presenter notes</b>'+(slides[i].dataset.notes||'No notes for this slide.');
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
  spin+=.42;if(RM)requestAnimationFrame(frame);
}
function next(){var s=slides[i],n=shown(s),t=frs(s).length;if(n<t){setFr(s,n+1);return}if(i<slides.length-1){i++;if(shown(slides[i])===0)setFr(slides[i],0);render()}}
function prev(){var s=slides[i],n=shown(s);if(n>0){setFr(s,n-1);return}if(i>0){i--;setFr(slides[i],frs(slides[i]).length);spin-=.84;render()}}
function goTo(n){i=Math.max(0,Math.min(slides.length-1,n));render()}
function full(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){})}
document.addEventListener('fullscreenchange',function(){document.getElementById('fullLbl').textContent=document.fullscreenElement?'Exit':'Fullscreen'});
function toggleNotes(){notes.hidden=!notes.hidden}
document.getElementById('bNext').onclick=function(e){e.stopPropagation();next()};
document.getElementById('bPrev').onclick=function(e){e.stopPropagation();prev()};
document.getElementById('bFull').onclick=function(e){e.stopPropagation();full()};
document.getElementById('bNotes').onclick=function(e){e.stopPropagation();toggleNotes()};
addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'||k==='ArrowDown'){e.preventDefault();next()}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'||k==='ArrowUp'){e.preventDefault();prev()}
  else if(k==='f'||k==='F')full();else if(k==='n'||k==='N')toggleNotes();
  else if(k==='Home')goTo(0);else if(k==='End')goTo(slides.length-1);
});
var wide=function(){return window.innerWidth>900&&window.innerWidth>window.innerHeight};
document.getElementById('deck').addEventListener('click',function(e){
  if(e.target.closest('a,button,.url'))return;if(String(window.getSelection())) return;
  if(!wide())return; if(e.clientX<window.innerWidth*.22)prev();else next();
});
var tx=0,ty=0,tt=0;
addEventListener('touchstart',function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now()},{passive:true});
addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-tt<700){if(dx<0)next();else prev()}},{passive:true});

/* background: a slow field of waypoints, coloured along the same route as the logo */
var cv=document.getElementById('field'),cx=cv.getContext('2d'),W=0,H=0,DPR=1,pts=[],spin=0,ang=0,mx=0,my=0;
function col(t){var s=[[255,106,61],[255,197,90],[68,102,255],[159,212,251]],p=Math.max(0,Math.min(.999,t))*3,a=Math.floor(p),f=p-a,A=s[a],B=s[a+1];
  return [Math.round(A[0]+(B[0]-A[0])*f),Math.round(A[1]+(B[1]-A[1])*f),Math.round(A[2]+(B[2]-A[2])*f)]}
function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR}
function seed(){pts=[];var n=innerWidth<700?70:150;for(var k=0;k<n;k++){var u=Math.random()*2-1;
  pts.push({x:u*1.9,y:(Math.random()*2-1)*1.05+Math.sin(u*2.2)*.25,z:(Math.random()*2-1)*1.5,c:col((u+1)/2),r:.6+Math.random()*1.5})}}
function frame(){
  ang+=(spin-ang)*.035;var a=ang*.5+performance.now()*(RM?0:.000018),ca=Math.cos(a),sa=Math.sin(a),P=[];
  cx.clearRect(0,0,W,H);
  for(var k=0;k<pts.length;k++){var p=pts[k],x=p.x*ca-p.z*sa,z=p.x*sa+p.z*ca+3.4,y=p.y+my*.05,s=1.9/z;
    P.push([W/2+(x+mx*.05)*s*W*.33,H/2+y*s*H*.52,s,p])}
  for(var m=0;m<P.length;m++){var A=P[m];
    for(var q=m+1;q<P.length;q++){var B=P[q],dx=A[0]-B[0],dy=A[1]-B[1],d=dx*dx+dy*dy,lim=(W*.085)*(W*.085);
      if(d<lim){var o=(1-d/lim)*.34*Math.min(A[2],B[2]);cx.strokeStyle='rgba('+A[3].c[0]+','+A[3].c[1]+','+A[3].c[2]+','+o.toFixed(3)+')';cx.lineWidth=DPR;cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke()}}
    cx.fillStyle='rgba('+A[3].c[0]+','+A[3].c[1]+','+A[3].c[2]+','+Math.min(.95,.35+A[2]*.5)+')';cx.beginPath();cx.arc(A[0],A[1],A[3].r*A[2]*DPR*2.1,0,6.283);cx.fill()}
  if(!RM||Math.abs(spin-ang)>.002)requestAnimationFrame(frame);
}
addEventListener('resize',function(){size();if(RM)frame()});
addEventListener('mousemove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
size();seed();
var h=parseInt(location.hash.slice(1),10);if(h>=1&&h<=slides.length)i=h-1;
slides.forEach(function(s,k){setFr(s,k<i?frs(s).length:0)});
render();spin=0;requestAnimationFrame(frame);
})();
</script>
</body>
</html>
